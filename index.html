t_max": 1291, "alt_min": 245, "rando": ["11,3 km", "+436 m"], "volant": "1h20", "chaud": {"texte": "<strong>Le matin vous êtes entre 1 000 et 1 300 m, et le soir vous ne bougez plus de la piscine.</strong> C'est le meilleur découpage possible sur un jour de pic. Emportez 3 L d'eau plus 2 L pour le chien sur la boucle d'Orgon, il n'y a aucun point d'eau potable. Si le thermomètre dépasse 36 °C, faites le sentier du mouflon seul le matin et gardez la version courte des cascades depuis Arphy : vous serez rentrés à midi.", "lieu": "Plateau du mouflon, 1 200 m", "alt": 1291}, "geo": {"lat": 44.059139, "lon": 3.604666, "lab": "Plateau du mouflon", "alt": 1200}, "base": {"lat": 43.9902, "lon": 3.6183, "lab": "Le Vigan"}, "bonus": [{"k": "rando", "titre": "Le sentier du col de la Caumette", "meta": "7,2 km · +216 m · 2h30 · départ du col de la Serreyrède", "txt": "La randonnée que le sentier du mouflon remplace. Elle part du col de la Serreyrède, sous les hêtres plantés par Georges Fabre, et c'est la version sportive de la matinée. Si le chien a retrouvé la forme, prenez-la : vous montez alors par la vallée comme prévu au départ, et la journée retombe à 2h27 de route.", "liens": [{"cls": "l-map", "txt": "Col de la Serreyrède", "href": "https://www.google.com/maps/dir/?api=1&destination=Col+de+la+Serreyr%C3%A8de%2C+30570"}]}, {"k": "visit", "titre": "L'observatoire à mouflons de la D986", "meta": "gratuit · dans un virage, entre Valleraugue et L'Espérou", "txt": "Un observatoire installé discrètement dans un virage de la route qui monte de Valleraugue à L'Espérou. Vous passez devant. Arrêtez-vous, sortez les jumelles et pointez le fond du ravin : mouflons et mouflonnes y traînent souvent. Sans chien à côté de vous, vos chances montent nettement.", "liens": [{"cls": "l-map", "txt": "D986, montée de Valleraugue", "href": "https://www.google.com/maps/dir/?api=1&destination=Valleraugue%2C+30570"}]}], "flex": {"ok": false, "why": "C'est l'anniversaire de Marion, et la fête est à la maison.", "frais": "Matinée entre 1 000 et 1 300 m, soirée à la piscine", "haut": 1291, "pas": {}}, "_lab": "Mer 12", "_iso": "2026-08-12"}, {"id": "j5", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Ab%C3%AEme_de_Bramabiau_panorama.JPG?width=1200", "alt": "Abîme de Bramabiau", "cap": "L'abîme de Bramabiau · <a href=\"https://commons.wikimedia.org/wiki/File:Ab%C3%AEme_de_Bramabiau_panorama.JPG\">Wikimedia Commons</a>"}, "dt": "Jeudi 13 août", "titre": "La rivière qui disparaît sous la montagne, puis 1 565 m au soleil couchant", "pitch": "Le matin, le sentier de la vallée du Bonheur et la baignade au lac de Camprieu, à 1 090 m. L'après-midi, l'abîme de Bramabiau, dix degrés constants sous la roche, là où la rivière ressort du plateau après trois kilomètres souterrains. Et au lieu de redescendre, <strong>on enchaîne sur la route de crête jusqu'au sommet du Mont Aigoual</strong> : la table d'orientation, le Climatographe si le cœur vous en dit, et une boucle d'une heure jusqu'au menhir de Trépaloup pendant que le soleil descend sur la lande. On rentre à 20h, dîner à la maison.", "tags": [{"cls": "t-rando", "txt": "Vallée du Bonheur 7,5 km"}, {"cls": "t-visit", "txt": "Abîme de Bramabiau"}, {"cls": "t-haut", "txt": "Sommet 1 565 m"}, {"cls": "t-tot", "txt": "2h33 de volant · max 1h05 d'affilée"}], "etapes": [{"type": "trajet", "heure": "9h30", "html": "Le Vigan → Saint-Sauveur-Camprieu · D999 puis D986 et D269 · 40 km · <strong>50 min</strong>", "fin": "Départ", "vers": "Sentier de la vallée du Bonheur", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115051,3.491544", "alt": 1090, "km": "40", "duree": "50min", "route": "D999 puis D986 et D269", "de_pt": "b_j4_9", "vers_pt": "p10", "de_lib": "Le Vigan", "vers_lib": "Saint-Sauveur-Camprieu", "de_alt": 245, "vers_alt": 1090}, {"type": "rando", "heure": "10h30", "icone": "i-hike", "titre": "Rando : Sentier de la vallée du Bonheur", "pt": "p10", "blocs": [{"t": "meta", "html": "7,5 km · +80 m · 3h · facile · balisage jaune · départ du parking du lac"}, {"t": "p", "html": "Le village est à plus de 1100 m, soit 6 à 7 °C de moins qu'au Vigan. On remonte la rivière du Bonheur — celle-là même qui s'engouffre sous le plateau et ressort en grondant à Bramabiau — en passant par les ruines de l'<strong>abbaye du Bonheur</strong> et la forêt reboisée du XIX<sup>e</sup>. Eau quasi permanente pour le chien."}, {"t": "access", "warn": true, "html": "<b>Deux points à connaître</b> — <strong>Il existe deux tracés officiels du même nom</strong> : celui de Gard Tourisme (7,5 km, +80 m, départ <em>parking au bord du lac</em>, GPS 44.115318, 3.490881) et celui du Parc national (9,3 km, +197 m, départ <em>parking du terrain de football</em>). Prenez le premier, et téléchargez son GPX avant de partir.<br><strong>Des patous sont présents de juin à octobre</strong> sur cet itinéraire, c'est écrit sur la fiche officielle : c'est le seul du séjour où le Parc le signale explicitement. Chien en laisse courte derrière vous, contournez large, ne courez pas, ne criez pas."}, {"t": "liens", "liens": [{"cls": "l-trk", "href": "https://static.apidae-tourisme.com/filestore/objets-touristiques/plans/17/192/19382289/la-vallee-du-bonheur.gpx", "txt": "Télécharger le GPX"}, {"cls": "l-web", "href": "https://www.tourismegard.com/fr/fiche/equipement/sentier-de-la-vallee-du-bonheur-saint-sauveur-camprieu_TFO6081885/", "txt": "Fiche officielle"}]}]}, {"type": "eau", "heure": "13h30", "icone": "i-swim", "titre": "Pique-nique et baignade au Lac du Bonheur", "pt": "p11", "blocs": [{"t": "meta", "html": "Non surveillé mais autorisé · gratuit · animaux acceptés · eau à 15-20 °C"}, {"t": "p", "html": "Vous êtes déjà sur place : le parking de la rando est celui du lac. Deux pontons de pêche PMR, des truites, et une eau franchement fraîche après trois heures de marche."}, {"t": "access", "warn": false, "html": "<b>Accès, stationnement, équipements</b> — D986 depuis Meyrueis ou Valleraugue jusqu'à Camprieu, le lac est à environ 2 km du centre. <strong>Parking gratuit au bord de l'eau</strong>, plage sur la rive sud, marche quasi nulle. <strong>Toilettes publiques confirmées</strong>, aires de pique-nique, deux pontons PMR. <strong>Camping sauvage et barbecues interdits.</strong><br>Le lieu porte trois noms selon les sources : <em>Lac du Bonheur</em>, <em>Lac de Camprieu</em> et <em>Lac du Devois</em> (nom officiel ARS). C'est le même plan d'eau."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Lac+du+Bonheur+Saint-Sauveur-Camprieu", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.115318%2C3.490881", "txt": "Itinéraire · 44.115318, 3.490881"}]}]}, {"type": "trajet", "heure": "", "html": "Lac de Camprieu → Abîme de Bramabiau · 5 km · <strong>8 min</strong>", "fin": "On se sèche", "vers": "Abîme de Bramabiau", "nav": "https://www.google.com/maps/dir/?api=1&amp;destination=44.120323%2C3.474413", "alt": 1029, "km": "5", "duree": "8min", "route": "", "de_pt": "p11", "vers_pt": "p12", "de_lib": "Lac de Camprieu", "vers_lib": "Abîme de Bramabiau", "de_alt": 1090, "vers_alt": 1029}, {"type": "visit", "heure": "15h00", "icone": "i-ticket", "titre": "Abîme de Bramabiau", "pt": "p12", "blocs": [{"t": "meta", "html": "10h-18h en août · adulte 14 € · visite guidée 1h · <strong>chien accepté en laisse</strong> · <a class=\"tel\" href=\"tel:+33466850328\">04 66 85 03 28</a>"}, {"t": "p", "html": "Le berceau de la spéléologie française. Vous descendez trente minutes dans une faille de 70 m, le long d'une rivière souterraine, avec des empreintes de dinosaures dans le tunnel de sortie. C'est le seul site souterrain du séjour où le chien entre avec vous."}, {"t": "access", "warn": true, "html": "<b>Deux choses impératives</b> — <strong>Espèces, chèques ou chèques-vacances uniquement</strong>, pas de carte bancaire. Et <strong>10 °C constants</strong> : polaire obligatoire, y compris pour vous. Parking gratuit, restaurant, bar, WC et aire de pique-nique sur place."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Ab%C3%AEme+de+Bramabiau", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.120323%2C3.474413", "txt": "Itinéraire · 44.120323, 3.474413"}, {"cls": "l-web", "href": "https://sites-touristiques-gard.fr/fiche-site/labime-de-bramabiau/", "txt": "Infos et tarifs"}]}]}, {"type": "trajet", "heure": "16h15", "fin": "Fin de la visite de Bramabiau", "vers": "le sommet du Mont Aigoual, 1 565 m", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.121212%2C3.579283", "html": "Bramabiau → sommet du Mont Aigoual · la D986 par le col de la Serreyrède, puis la route de crête · 18 km · <strong>30min</strong>, et vous passez de 1 029 à 1 565 m", "alt": 1565, "km": "18", "duree": "30min", "route": "la D986 par le col de la Serreyrède, puis la route de crête", "de_pt": "p12", "vers_pt": "p6", "de_lib": "Abîme de Bramabiau", "vers_lib": "sommet du Mont Aigoual", "de_alt": 1029, "vers_alt": 1565}, {"type": "visit", "heure": "16h50", "icone": "i-eye", "pt": "p6", "titre": "Le sommet du Mont Aigoual et le Climatographe", "blocs": [{"t": "meta", "html": "1 565 m · point culminant du Gard · <strong>parking gratuit au sommet</strong> · table d'orientation libre et gratuite · Climatographe 9 € (7 € réduit, gratuit &lt; 11 ans)"}, {"t": "p", "html": "Vous arrivez en fin d'après-midi, quand les cars sont repartis et que la lumière commence à raser la lande. <strong>La dernière station météo de montagne habitée de France</strong> : on observe le ciel ici depuis 1894, sans interruption. La table d'orientation est dehors, gratuite, et par temps clair elle tient ses promesses : le Ventoux, le Canigou, la Méditerranée, et les Alpes les jours de mistral. Il y fait facilement dix à quinze degrés de moins qu'au Vigan, et il y a toujours du vent : prenez une polaire, même en août."}, {"t": "note", "html": "<b>Le Climatographe, si vous en avez envie</b> — L'observatoire s'est refait une santé et abrite désormais le Climatographe, un parcours sur le climat, la météo et le reboisement de l'Aigoual, avec un ascenseur jusqu'à la terrasse panoramique. <strong>Ouvert tous les jours 10h – 19h jusqu'au 23 août</strong>, 9 € l'entrée, <strong>les chiens sont acceptés</strong>. Comptez 45 min à 1h. Si Bramabiau a débordé et que vous arrivez après 18h, laissez tomber le musée et gardez la boucle : c'est elle le morceau."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Sommet du Mont Aigoual, parking", "href": "https://www.google.com/maps/dir/?api=1&destination=44.121212%2C3.579283"}, {"cls": "l-web", "txt": "Climatographe · horaires et tarifs", "href": "https://climatographe.fr/"}, {"cls": "l-tel", "txt": "04 67 42 59 83", "href": "tel:+33467425983"}]}]}, {"type": "rando", "heure": "17h50", "icone": "i-hike", "pt": "p6tre", "titre": "Boucle du Menhir de Trépaloup, depuis le parking du sommet", "blocs": [{"t": "meta", "html": "2,3 km · <strong>+87 m</strong> · <strong>1h</strong> · boucle · balisage jaune · <strong>facile</strong> · départ et arrivée au parking du sommet, 1 565 m"}, {"t": "p", "html": "C'est exactement la balade que vous cherchez : <strong>une boucle d'une heure qui part du parking du sommet et y revient</strong>, sans jamais redescendre bien bas. On sort de l'observatoire par la lande, on suit la crête jusqu'au <strong>menhir de Trépaloup</strong>, une pierre dressée posée là bien avant la station météo, et on remonte les six cents derniers mètres vers le sommet en repassant devant le musée. Vue dégagée sur les deux versants pendant presque tout le parcours : les Causses d'un côté, les vallées cévenoles de l'autre."}, {"t": "note", "html": "<b>À faire à cette heure-là précisément</b> — À 17h50 le soleil est bas, la lande vire à l'orange et les rapaces tournent au-dessus du versant sud. C'est le meilleur créneau de la journée et c'est la raison pour laquelle on la place là plutôt qu'à midi. Le chien est parfaitement à l'aise : 87 m de dénivelé, du plat, de l'herbe rase, et vingt degrés de moins qu'en bas."}, {"t": "access", "html": "<b>Prévoir</b> — Un coupe-vent ou une polaire, il y a toujours du vent au sommet. De l'eau : aucun point d'eau sur la boucle. Le balisage est jaune, le sentier bien tracé, et vous ne pouvez pas vous perdre, l'observatoire est visible de partout."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Parking du sommet, départ", "href": "https://www.google.com/maps/dir/?api=1&destination=44.121212%2C3.579283"}, {"cls": "l-gpx", "txt": "Trace GPX du Parc national", "href": "https://geotrek-admin.cevennes-parcnational.net/api/fr/treks/41235/le-menhir-de-trepaloup.gpx"}, {"cls": "l-web", "txt": "Fiche du Parc national", "href": "https://destination.cevennes-parcnational.fr/trek/41235-Le-Menhir-de-Trepaloup"}]}]}, {"type": "trajet", "heure": "18h55", "html": "Sommet du Mont Aigoual → Le Vigan · par le col de la Serreyrède, Valleraugue et la D999 · 46 km · <strong>1h05</strong> &nbsp;·&nbsp; <strong>Total du jour : 2h33 de conduite, plus longue traite 1h05</strong>", "fin": "Fin de la boucle", "vers": "le gîte du Vigan · 357 route de Ganges", "nav": "https://www.google.com/maps/dir/?api=1&destination=357+Route+de+Ganges%2C+30120+Le+Vigan", "alt": 245, "km": "46", "duree": "1h05", "route": "par le col de la Serreyrède, Valleraugue et la D999", "de_pt": "p6tre", "vers_pt": "p24_j5", "de_lib": "sommet du Mont Aigoual", "vers_lib": "Le Vigan", "de_alt": 1565, "vers_alt": 245}, {"type": "eat", "heure": "20h20", "icone": "i-eat", "pt": null, "titre": "Apéro chez Feloni, puis dîner à la maison", "blocs": [{"t": "meta", "html": "Brasserie artisanale Feloni, Le Vigan · visite sur rendez-vous au <a class=\"tel\" href=\"tel:+33634573054\">06 34 57 30 54</a> · 245 m"}, {"t": "p", "html": "Vous avez marché le matin, vous êtes descendus sous terre l'après-midi et vous vous êtes baignés deux fois. Demain est la journée la plus tranquille de la semaine : le marché de Ganges le matin, puis l'eau tout l'après-midi. Une bière brassée à trois cents mètres du gîte, puis l'assiette du soir à la maison."}, {"t": "shop", "html": "<b>Au menu</b> — Assiette de pays : pélardons à différents affinages, charcuterie, tomates, melon, pain, et les confitures de châtaigne. <strong>Rien à préparer pour demain</strong> : vous achetez le déjeuner et le dîner au marché de Ganges en arrivant. Sortez juste la glacière et les pains de glace."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Brasserie Feloni", "href": "https://www.google.com/maps/search/?api=1&query=Brasserie+Feloni+Le+Vigan"}]}]}], "strip": [{"page": "https://commons.wikimedia.org/wiki/File:Entr%C3%A9e_de_l%27Ab%C3%AEme_de_Bramabiau.jpg", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Entr%C3%A9e_de_l%27Ab%C3%AEme_de_Bramabiau.jpg?width=800", "alt": "Sortie de la rivière souterraine", "cap": "Là où le Bonheur ressort du plateau"}, {"page": "https://commons.wikimedia.org/wiki/File:L'observatoire_du_Mont_Aigoual.jpg", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/L%27observatoire_du_Mont_Aigoual.jpg?width=800", "alt": "L'observatoire du Mont Aigoual", "cap": "L'observatoire, 1 565 m, au bout de la route de crête"}], "notes": [{"cls": "note plan", "html": "<b>Ce qui a changé, et ce que ça coûte</b> — La baignade surveillée du Mouretou saute, et le sommet de l'Aigoual entre dans la fin de journée. La journée passe de <strong>2h13 à 2h33 de conduite</strong>, soit trois minutes au-dessus de votre plafond, et la plus longue traite reste à 1h05. C'est le meilleur échange possible : vous récupérez le sommet sans le payer sur la journée de vendredi, et vous le voyez à la meilleure heure. Vous avez déjà fait la baignade au lac du Bonheur à midi."}, {"cls": "note warn", "html": "<b>Le seul point de tension : Bramabiau</b> — La visite est guidée et dure environ 1h15. Si vous entrez à 15h, vous ressortez vers 16h15 et tout s'enchaîne. <strong>Si vous ressortez après 17h</strong>, sautez le Climatographe qui ferme à 19h, montez directement et faites juste la boucle du menhir : une heure, et vous reprenez la route à 19h avec le coucher de soleil dans le dos. La descente sur Valleraugue se fait de jour dans les deux cas, le soleil se couche vers 21h."}, {"cls": "note prep", "html": "<b>Ce soir, on prépare le marché, sans se lever tôt</b> — Demain, <strong>départ 9h00 pour Ganges</strong>, les Halles sont ouvertes depuis 7h30 et le gros marché du vendredi tient jusqu'à 13h. Vous y achetez le déjeuner et le pique-nique du soir au bord de la Vis. Sortez la glacière et les pains de glace, prenez des sacs et des espèces. Maillots et serviettes dans un sac à part pour la fin de journée."}], "alt_max": 1565, "alt_min": 1029, "rando": ["9,8 km", "+167 m"], "volant": "2h33", "chaud": {"texte": "<strong>La meilleure journée du séjour par forte chaleur, et elle s'améliore encore.</strong> Rando du matin sous les hêtres au bord de l'eau à 1 090 m, abîme de Bramabiau à 10 °C constants sous la roche l'après-midi, et sommet de l'Aigoual à 1 565 m en fin de journée, quand il fait le plus chaud en bas. Vous ne redescendez sous les 1 000 m qu'à 19h passées.", "lieu": "Sommet de l'Aigoual, 1 565 m", "alt": 1565}, "geo": {"lat": 44.115051, "lon": 3.491544, "lab": "Camprieu", "alt": 1090}, "base": {"lat": 43.9902, "lon": 3.6183, "lab": "Le Vigan"}, "bonus": [{"k": "village", "titre": "Meyrueis", "meta": "706 m · 25 min de Camprieu", "txt": "Au confluent de trois rivières, au pied des gorges de la Jonte : arcades, vieux pont, tour de l'Horloge, et une vraie vie de village même en août. Le plus joli détour possible depuis Camprieu, et il ne coûte que 25 minutes.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Meyrueis%2C+48150"}]}, {"k": "rando", "titre": "De Meyrueis à la cascade de Salvinsac", "meta": "7,2 km · +299 m · 2h55 · ombragé", "txt": "Sentier ombragé du début à la fin, et une baignade à la cascade au bout. La meilleure combinaison marche-et-eau du secteur nord, et une des rares randos du coin balisées sur Decathlon Outdoor.", "liens": [{"cls": "l-do", "txt": "Decathlon Outdoor", "href": "https://www.decathlon-outdoor.com/fr-fr/explore/france/de-meyrueis-a-la-cascade-de-salvinsac-64b84642f1307"}]}, {"k": "rando", "titre": "Le château de Roquedols", "meta": "6,9 km · +158 m · 2h25 · départ parking de la piscine, Meyrueis", "txt": "« Immersion complète en forêt », un château Renaissance au milieu, et presque pas de dénivelé. La rando de repli quand les jambes disent non.", "liens": [{"cls": "l-vis", "txt": "Visorando", "href": "https://www.visorando.com/randonnee-boucle-du-chateau-de-roquedols-et-du-col/"}]}], "flex": {"ok": true, "why": "Aucune contrainte : ni marché, ni réservation.", "frais": "Bonheur sous les hêtres, Bramabiau à 10 °C, puis le sommet à 1 565 m en fin de journée", "haut": 1565, "pas": {}}, "_lab": "Jeu 13", "_iso": "2026-08-13"}, {"id": "j6", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Le_Coudoulou_%C3%A0_Av%C3%A8ze%2C_vieux_pont_et_bief-barrage.JPG?width=1200", "alt": "Le vieux pont d'Avèze et son bief-barrage", "cap": "Le vieux pont d'Avèze et son seuil, au bout de la boucle · <a href=\"https://commons.wikimedia.org/wiki/File:Le_Coudoulou_%C3%A0_Av%C3%A8ze,_vieux_pont_et_bief-barrage.JPG\">Wikimedia Commons</a>"}, "dt": "Vendredi 14 août", "titre": "Le grand marché de Ganges, l'après-midi à l'ombre, et l'Arre à pied jusqu'à la cascade", "pitch": "Journée à l'économie, et c'est volontaire : c'est le pic de chaleur. Le matin, le gros marché du vendredi à Ganges, 180 stands, de quoi faire deux repas. Le midi et l'après-midi, on ne bouge pas : déjeuner à l'ombre, sieste, piscine, et on prépare le sac pour Saint-Jean-du-Gard. Puis, quand le soleil baisse, <strong>on part à pied de la mairie du Vigan pour la boucle de l'Arre</strong> — deux heures de chemin ombragé au fil de la rivière, la châtaigneraie, le pont de Mousse et son arche de tuf, et l'arrivée à la cascade d'Avèze pour le bain et le pique-nique. La voiture ne ressort pas.", "tags": [{"cls": "t-marche", "txt": "Marché de Ganges, 180 stands"}, {"cls": "t-rando", "txt": "Autour de l'Arre 5,6 km · 2h"}, {"cls": "t-eau", "txt": "Baignade à la cascade d'Avèze"}, {"cls": "t-tot", "txt": "50 min de volant · max 25 min d'affilée"}], "etapes": [{"type": "trajet", "heure": "9h00", "html": "Le Vigan → Ganges · la D999 · 20 km · <strong>25min</strong>", "fin": "On y va", "vers": "les Halles et le marché de Ganges", "nav": "https://www.google.com/maps/dir/?api=1&destination=Les+Halles+de+Ganges%2C+1+rue+Fr%C3%A9d%C3%A9ric+Mistral%2C+34190+Ganges", "alt": 175, "km": "20", "duree": "25min", "route": "la D999", "de_pt": null, "vers_pt": "p19", "de_lib": "Le Vigan", "vers_lib": "Ganges", "de_alt": 245, "vers_alt": 175}, {"type": "marche", "heure": "9h30", "icone": "i-basket", "titre": "Marché de Ganges", "pt": "p19", "blocs": [{"t": "meta", "html": "175 m d'altitude · <strong>Les Halles ouvrent à 7h30</strong>, le gros marché du vendredi déborde sur la place · 1 rue Frédéric Mistral · marché couvert, donc à l'ombre"}, {"t": "p", "html": "Le grand marché du vendredi, plus large que celui du mardi : alimentaire, vêtements, quincaillerie. Ganges n'est pas un village mais une petite ville, avec des rues commerçantes vraiment vivantes et des <strong>halles couvertes</strong> au cœur."}, {"t": "access", "warn": true, "html": "<b>Pourquoi si tôt</b> — vous y êtes à 8h30 au lieu de 10h. C'est le meilleur moment du marché, les producteurs viennent d'installer, il n'y a personne, et surtout vous repartez à 9h45 pour avoir l'après-midi entière à 1 565 m. <strong>180 stands le vendredi</strong>, sous les Halles couvertes, ouvertes jusqu'à 14h30."}, {"t": "p", "html": "Les adresses : la <strong>Brûlerie des Cévennes</strong> (torréfacteur), la <strong>Savonnerie de la Buèges</strong>, la <strong>boulangerie Garonne</strong>, la <strong>boucherie Copleux</strong>, <strong>Genthon — La Maison des Délices</strong>, et l'émailleuse-bijoutière <strong>Emmeline Rigal</strong>."}, {"t": "shop", "html": "<b>Ce qu'on achète ici</b> — le pique-nique de ce soir, qui se mangera au bord de la cascade : pain de campagne, terrine ou charcuterie, pélardons, tomates, melon, fruits. Plus deux bières de la Blacstar de Ganges. Et le petit-déjeuner de demain, jour de marché au Vigan."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Les+Halles+de+Ganges+34190", "txt": "Les Halles · fiche et avis"}]}]}, {"type": "trajet", "heure": "11h20", "html": "Ganges → Le Vigan · la D999 · 20 km · <strong>25min</strong>", "fin": "Fin du marché", "vers": "le gîte du Vigan · 357 route de Ganges", "nav": "https://www.google.com/maps/dir/?api=1&destination=357+Route+de+Ganges%2C+30120+Le+Vigan", "alt": 245, "km": "20", "duree": "25min", "route": "la D999", "de_pt": "p19", "vers_pt": null, "de_lib": "Ganges", "vers_lib": "Le Vigan", "de_alt": 175, "vers_alt": 245}, {"type": "eat", "heure": "12h00", "icone": "i-eat", "pt": null, "titre": "Déjeuner du marché, à l'ombre au gîte", "blocs": [{"t": "p", "html": "Vous rentrez des Halles avec de quoi faire deux repas. Celui-ci se mange sur place, à l'ombre : melon et jambon cru, tomates de plein champ, un pélardon, du pain de campagne, et les pêches de vigne du marché. Rien à cuisiner."}]}, {"type": "home", "heure": "13h30", "icone": "i-home", "pt": null, "titre": "Après-midi au gîte : sieste, piscine, et on prépare le déménagement", "blocs": [{"t": "p", "html": "<strong>C'est le pic de chaleur de la semaine et le programme est de ne rien faire dehors entre 13h et 17h.</strong> Sieste, piscine, un livre à l'ombre. C'est aussi le bon moment pour <strong>préparer le sac</strong> : demain vous quittez Le Vigan pour le Mas de Cros Viel au-dessus de Saint-Jean-du-Gard, et samedi commence par le marché du Vigan à 9h30. Une valise faite ce soir vaut une heure gagnée demain matin."}, {"t": "note", "html": "<b>À faire pendant la sieste</b> — Vider et dégivrer la glacière, regrouper les affaires de piscine, vérifier qu'il ne reste rien dans le frigo qui ne fera pas le voyage, et recharger l'appareil photo et les téléphones. Vers 17h, on prépare le sac de la balade : le pique-nique du marché, les maillots, les serviettes, et de l'eau. <strong>On part à pied, la voiture reste au gîte.</strong>"}]}, {"type": "trajet", "heure": "17h20", "fin": "Fin de la sieste", "vers": "la mairie du Vigan, départ du sentier", "nav": "https://www.google.com/maps/dir/?api=1&destination=Mairie+du+Vigan%2C+place+du+Quai%2C+30120+Le+Vigan", "html": "Le gîte → mairie du Vigan · <strong>à pied ou 5 min de voiture</strong> · 1,5 km · 245 → 230 m", "alt": 230, "km": "1,5", "duree": "5min", "route": "la route de Ganges, puis le centre", "de_pt": "b_j6_9", "vers_pt": "p23mai", "de_lib": "le gîte", "vers_lib": "mairie du Vigan", "de_alt": 245, "vers_alt": 230}, {"type": "rando", "heure": "17h30", "icone": "i-hike", "pt": "p23mai", "titre": "Autour de l'Arre, au fil de la rivière", "blocs": [{"t": "meta", "html": "5,6 km · <strong>+127 m</strong> · <strong>2h</strong> · boucle · balisage peinture jaune · <strong>facile, familiale</strong> · départ et arrivée à la mairie du Vigan · <strong>zéro voiture</strong>"}, {"t": "p", "html": "C'est la réponse exacte à ce que vous cherchiez, et elle était sous vos pieds. Le Parc national la décrit comme une <strong>balade familiale sur un chemin ombragé au fil de la rivière</strong>. On part de la mairie, on longe l'Arre par le vieux pont et les Calquières, on traverse une <strong>châtaigneraie</strong>, et on arrive au <strong>pont de Mousse</strong> : une arche de tuf entièrement naturelle, couverte de végétation, d'où l'eau suinte en gouttes cristallines qui tombent sans arrêt dans le ruisseau en dessous. On continue par Le Cayla et on revient par le Haut du Pont."}, {"t": "note", "html": "<b>La fin de la boucle, c'est le bain</b> — Le retour passe par la <strong>cascade d'Avèze</strong>, où l'on pique-nique et où l'on se baigne. C'est là que vous sortez ce que vous avez acheté le matin aux Halles de Ganges. Vous y arrivez vers 19h, quand le vallon est complètement à l'ombre et que la journée est enfin respirable."}, {"t": "access", "html": "<b>Départ et stationnement</b> — Départ de la <strong>mairie du Vigan</strong>, où il y a du parking. Depuis le gîte, 1,5 km : à pied si vous voulez tout faire à pied, cinq minutes en voiture sinon. Balisage peinture jaune plus panneaux directionnels, on ne se perd pas. <strong>Chien en laisse</strong>, chaussures fermées, casquette, et de l'eau : il fait frais sur le chemin mais la boucle dure deux heures."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Mairie du Vigan, départ", "href": "https://www.google.com/maps/dir/?api=1&destination=Mairie+du+Vigan%2C+place+du+Quai%2C+30120+Le+Vigan"}, {"cls": "l-gpx", "txt": "Trace GPX officielle", "href": "https://geotrek-aggr.gard.fr/api/fr/treks/343292/autour-de-larre.gpx"}, {"cls": "l-web", "txt": "Fiche du Parc national des Cévennes", "href": "https://destination.cevennes-parcnational.fr/fr/trek/96959-Autour-de-l-Arre"}, {"cls": "l-web", "txt": "Fiche Rando Gard", "href": "https://rando.gard.fr/trek/343292-Autour-de-l-Arre"}]}]}, {"type": "eat", "heure": "19h00", "icone": "i-eat", "pt": "p23arr", "titre": "Pique-nique et baignade à la cascade d'Avèze", "blocs": [{"t": "p", "html": "Vous mangez au bord de l'Arre ce que vous avez acheté le matin : charcuterie de pays, deux pélardons, tomates, pain de campagne, un melon, et le rosé mis au frais dans la rivière en arrivant. <strong>Le vallon est à l'ombre à cette heure-là</strong> et la cascade fait le reste. Vous êtes à vingt minutes de marche de la maison."}, {"t": "note", "html": "<b>Si vous préférez ne rien porter</b> — La <strong>Guinguette d'Avèze</strong> est juste là, au bord de l'eau, et vous la connaissez déjà : vous y avez dîné lundi soir. Rien n'empêche de finir la boucle par un verre en terrasse plutôt que par un pique-nique, et de garder le marché pour le dîner à la maison."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Cascade et guinguette d'Avèze", "href": "https://www.google.com/maps/dir/?api=1&destination=Gu%C3%AEnguette+d%27Av%C3%A8ze%2C+30120+Av%C3%A8ze"}]}]}, {"type": "trajet", "heure": "20h15", "fin": "Fin de la boucle", "vers": "le gîte · 357 route de Ganges", "nav": "https://www.google.com/maps/dir/?api=1&destination=357+Route+de+Ganges%2C+30120+Le+Vigan", "html": "Mairie du Vigan → le gîte · <strong>à pied ou 5 min de voiture</strong> · 1,5 km &nbsp;·&nbsp; <strong>Total du jour : 50 min de conduite, plus longue traite 25 min</strong>", "alt": 245, "km": "1,5", "duree": "5min", "route": "le centre puis la route de Ganges", "de_pt": "p23mai", "vers_pt": "p24_j6", "de_lib": "mairie du Vigan", "vers_lib": "le gîte", "de_alt": 230, "vers_alt": 245}], "notes": [{"cls": "note plan", "html": "<b>Ce qui a changé, et pourquoi</b> — La cascade de la Vis sort du programme. Vous vouliez une balade fraîche de moins de deux heures qui arrive à l'eau sans passer par le parking payant : autour de Saint-Laurent-le-Minier, <strong>ça n'existe pas</strong>. Les trois sentiers balisés du secteur montent tous sur une corniche calcaire exposée plein sud — la fiche du tour du Pic d'Anjeau dit elle-même « à éviter en cas de forte chaleur » — et les <strong>deux rives de la Vis sont privées sur plus de 700 m au-delà du pont</strong>, donc il n'y a pas d'arrivée légale par la rivière. La bonne balade, elle, est au Vigan : <strong>50 min de voiture sur la journée au lieu de 2h00</strong>, et la seule sortie se fait à pied."}, {"cls": "note warn", "html": "<b>L'Arre en août, soyons honnêtes</b> — Ce n'est pas la Vis : l'Arre est une rivière cévenole, pas une résurgence, et <strong>son débit dépend de l'été</strong>. Après six semaines sans pluie, la cascade d'Avèze coule moins fort et les vasques sont plus basses. Le chemin et l'ombre, eux, sont là quoi qu'il arrive, et la guinguette est au bout. Si vous voulez être fixés, vous passez devant en allant au marché : jetez un œil au niveau depuis le pont."}, {"cls": "note prep", "html": "<b>Demain, on change de base</b> — Samedi, marché du Vigan à 9h30, puis route vers le Mas de Cros Viel, col de Lamira, au-dessus de Saint-Jean-du-Gard. Deux heures de trajet avec les courses : glacière obligatoire. Le sac se prépare ce vendredi après-midi, pas samedi matin."}], "alt_max": 300, "alt_min": 175, "rando": ["5,6 km", "+127 m"], "volant": "50 min", "chaud": {"texte": "<strong>Ce jour-là, la stratégie n'est ni l'altitude ni la voiture : c'est l'ombre et l'horaire.</strong> Le sommet de l'Aigoual est passé à jeudi soir. Vendredi, vous êtes au marché couvert avant 11h30, à l'ombre et dans la piscine de 12h à 17h pendant tout le pic, et la seule sortie de la journée part <strong>à pied</strong> à 17h30 sur un chemin ombragé au bord de l'eau. Aucun trajet en plein soleil, aucune voiture surchauffée, et vous finissez dans l'Arre.", "lieu": "Cascade d'Avèze, à l'ombre", "alt": 205}, "geo": {"lat": 44.121212, "lon": 3.579283, "lab": "Mont Aigoual", "alt": 1565}, "base": {"lat": 43.9902, "lon": 3.6183, "lab": "Le Vigan"}, "bonus": [{"k": "eau", "titre": "La cascade de la Vis, si vous y tenez quand même", "meta": "35 min du Vigan · parking payant 10 € · eau à 14 °C · 600 m de descente", "txt": "Elle reste le plus beau plan d'eau du secteur et l'eau y sort du causse à 14 °C toute l'année. Ce qu'il faut accepter : <strong>parking payant obligatoire à 10 € la journée</strong>, à 600 m du site, stationnement sauvage verbalisé, <strong>baignade non surveillée</strong>, interdiction de plonger et de s'approcher du rideau d'eau, rives privées au-delà du pont. Le meilleur créneau est <strong>après 18h</strong>, quand la foule remonte et que la gorge passe à l'ombre. Le site ferme de 22h à 6h. Comptez 1h10 de route aller-retour et la journée repasse à 2h00 de volant.", "liens": [{"cls": "l-map", "txt": "Parking de la cascade", "href": "https://www.google.com/maps/dir/?api=1&destination=Parking+de+la+Cascade%2C+30440+Saint-Laurent-le-Minier"}, {"cls": "l-web", "txt": "Règles du site · Sud Cévennes", "href": "https://www.sudcevennes.com/vacances-cevennes/cascade-vis/"}]}, {"k": "rando", "titre": "Le chemin fléché depuis le village, pour éviter le parking payant", "meta": "2 km aller-retour · 35 min · +16 m · départ rue Antoine Carles", "txt": "Si vous tenez à la Vis sans payer : il existe un <strong>chemin fléché « cascade » depuis l'entrée du village</strong>, rue Antoine Carles, 2 km aller-retour et 35 min de marche. <strong>Réserve honnête</strong> : en plein mois d'août, se garer dans le village est exactement ce que le parking à 10 € a été créé pour empêcher, et le stationnement hors zone y est verbalisé. Renseignez-vous à l'office de tourisme de Ganges vendredi matin, vous y êtes de toute façon.", "liens": [{"cls": "l-map", "txt": "Rue Antoine Carles, Saint-Laurent-le-Minier", "href": "https://www.google.com/maps/dir/?api=1&destination=Rue+Antoine+Carles%2C+30440+Saint-Laurent-le-Minier"}]}, {"k": "rando", "titre": "Sumène et le fil du Rieutord, l'autre boucle ombragée", "meta": "20 min du Vigan · 5,4 km · +213 m · 2h10 · facile", "txt": "Boucle forestière au départ du parking de l'avenue de la Gare, à Sumène : sentiers en sous-bois, vues sur le village et la vallée, et une petite cascade en contrebas du chemin au retour. <strong>Attention</strong> : le Rieutord est en partie souterrain et se voit surtout après les pluies, donc c'est une balade fraîche et verte, pas une balade de baignade.", "liens": [{"cls": "l-map", "txt": "Parking avenue de la Gare, Sumène", "href": "https://www.google.com/maps/dir/?api=1&destination=Avenue+de+la+Gare%2C+30440+Sum%C3%A8ne"}, {"cls": "l-web", "txt": "Décathlon Outdoor", "href": "https://www.decathlon-outdoor.com/fr-fr/explore/france/sumene-et-viree-de-reve-au-fil-du-rieutord-618160d207551"}]}], "flex": {"ok": false, "why": "Le grand marché de Ganges est le vendredi matin, et il ne se déplace pas.", "frais": "Marché couvert le matin, cinq heures à l'ombre au gîte, puis la boucle de l'Arre à pied", "haut": 300, "pas": {}}, "_lab": "Mar 11", "_iso": "2026-08-11", "strip": [{"page": "https://commons.wikimedia.org/wiki/File:Le_Coudoulou_%C3%A0_Av%C3%A8ze,_vieux_pont_et_bief-barrage.JPG", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Le_Coudoulou_%C3%A0_Av%C3%A8ze%2C_vieux_pont_et_bief-barrage.JPG?width=800", "alt": "Le vieux pont d'Avèze", "cap": "Le seuil du vieux pont d'Avèze, l'arrivée de la boucle"}, {"page": "https://commons.wikimedia.org/wiki/File:Le_Vigan_-_Mairie.JPG", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Le_Vigan_-_Mairie.JPG?width=800", "alt": "La mairie du Vigan", "cap": "La mairie du Vigan, départ de la boucle"}]}, {"id": "j7", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Saint-Jean-du-Gard_-_Vue_de_Saint-Roman.jpg?width=1200", "alt": "Saint-Jean-du-Gard", "cap": "Saint-Jean-du-Gard vu de Saint-Roman · <a href=\"https://commons.wikimedia.org/wiki/File:Saint-Jean-du-Gard_-_Vue_de_Saint-Roman.jpg\">Wikimedia Commons</a>"}, "dt": "Samedi 15 août · changement de base", "titre": "On change de vallée : le marché du Vigan, la cascade de Valescure, et le Pont Vieux au soir", "pitch": "Jour de déménagement, et il est construit pour ne pas en être un. Le matin, le grand marché du samedi au Vigan, quatre-vingts étals. À 11h on charge et on part, et <strong>on coupe la route à mi-chemin, à Peyrolles</strong> : pique-nique au bord du Gardon, puis le <strong>sentier de découverte de Valescure</strong>, une heure et quart sous couvert jusqu'à la cascade, entre tancats, béals et gorgas. On arrive au mas en début d'après-midi, on s'installe, on ne fait rien. Et à 18h on redescend au village pour la <strong>boucle du Pont Vieux</strong> : le Gardon, le pont de 1733, la tour de l'Horloge et le temple, pour faire connaissance avec Saint-Jean-du-Gard.", "tags": [{"cls": "t-marche", "txt": "Marché du Vigan"}, {"cls": "t-rando", "txt": "Valescure 1h15 · cascade"}, {"cls": "t-rando", "txt": "Pont Vieux 5,2 km · 1h40"}, {"cls": "t-tot", "txt": "1h49 de volant · max 50 min d'affilée"}], "etapes": [{"type": "marche", "heure": "9h30", "icone": "i-basket", "titre": "Marché du Vigan", "pt": "p24", "blocs": [{"t": "meta", "html": "8h-12h30 · Place du Marché, le Quai, les halles, le parvis de la mairie · plus de 80 étals · à pied depuis le gîte"}, {"t": "p", "html": "Le marché « complet » de la vallée. Maraîchers, <strong>pélardons AOP</strong>, <strong>oignons doux des Cévennes AOP</strong>, châtaignes transformées, miels de châtaignier et de bruyère, <strong>Reinette du Vigan</strong>, et la <strong>brasserie d'Avèze</strong> qui y tient un stand."}, {"t": "shop", "html": "<b>La grosse course de la semaine 2</b> — pélardons (frais et affinés), oignons doux, charcuterie de pays, miel de châtaignier, farine de châtaigne, confiture, fruits et légumes pour trois jours, pain, bières d'Avèze. Plus <strong>de quoi pique-niquer ce midi</strong> : pain, terrine, tomates, melon, fromage. <strong>Glacière obligatoire.</strong>"}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Place+du+March%C3%A9+30120+Le+Vigan", "txt": "Fiche et avis"}]}]}, {"type": "home", "heure": "11h00", "icone": "i-home", "titre": "Check-out et chargement", "blocs": []}, {"type": "trajet", "heure": "11h15", "fin": "Voiture chargée", "vers": "Peyrolles, le château de Valescure", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.095554%2C3.829866", "html": "Le Vigan → Peyrolles · la D999 jusqu'à Pont-d'Hérault, puis la D907 en remontant la vallée Borgne · 32 km · <strong>50 min</strong>, et vous montez de 245 à 320 m", "alt": 320, "km": "32", "duree": "50min", "route": "la D999 jusqu'à Pont-d'Hérault, puis la D907 en remontant la vallée Borgne", "de_pt": "p24", "vers_pt": "w2val", "de_lib": "Le Vigan", "vers_lib": "Peyrolles", "de_alt": 245, "vers_alt": 320}, {"type": "eat", "heure": "12h15", "icone": "i-eat", "pt": "w2val", "titre": "Pique-nique du marché du Vigan, au bord du Gardon", "blocs": [{"t": "p", "html": "Vous êtes arrivés au château de Valescure, le Gardon coule en contrebas, et vous avez la voiture pleine du marché du Vigan de ce matin. <strong>On mange d'abord, on marche ensuite</strong> : il fait chaud, et le sentier est sous couvert. Melon, pélardons, charcuterie, du pain et des pêches — le reste attendra le frigo du mas."}, {"t": "note", "html": "<b>Où se garer, exactement</b> — Le parking est <strong>à côté du château de Valescure</strong>. La fiche officielle le dit noir sur blanc : <strong>ne vous garez pas sur l'aire de retournement ni devant les barrières</strong>, arrêtez-vous avant. Accès depuis la D907 : vous tournez vers <strong>Arénas</strong> et vous franchissez le Gardon."}]}, {"type": "rando", "heure": "13h15", "icone": "i-hike", "pt": "w2cas", "titre": "Balade : le sentier de découverte de Valescure, et sa cascade", "blocs": [{"t": "meta", "html": "1,8 à 2,6 km · <strong>+135 à +150 m</strong> · <strong>1h15 de marche effective</strong> · boucle · balisage jaune et bornes numérotées · <strong>chien accepté en laisse</strong> · départ parking du château de Valescure, <strong>44.095554, 3.829866</strong>"}, {"t": "p", "html": "C'est exactement la halte que vous cherchiez, et elle est pile sur votre route. Un <strong>sentier d'interprétation à six stations</strong> qui remonte un vallon boisé : La Jasse, <strong>Le Gué</strong>, <strong>La Cascade</strong>, <strong>Les Tancats</strong>, Les Blocs granitiques, La Bastide. On y lit tout le patrimoine hydraulique cévenol — les <strong>tancats</strong>, ces barrages en pierre sèche qui cassent la pente du ruisseau, les <strong>béals</strong> qui conduisent l'eau à flanc, et les <strong>gorgas</strong>, les retenues où elle s'accumule."}, {"t": "note", "html": "<b>Pourquoi la fiche annonce 2h et pourquoi c'est 1h15</b> — Les deux heures affichées <strong>ne sont pas un temps de marche</strong> : c'est un sentier d'interprétation, la durée intègre les arrêts aux six bornes. Deux kilomètres et demi pour 140 m de dénivelé, c'est <strong>une heure à une heure quinze de marche réelle</strong>. Vous avez la marge pour vous asseoir à la cascade. <strong>La cascade arrive tôt</strong>, entre la station 2 et la station 4 : vous y êtes vingt minutes après le départ."}, {"t": "access", "warn": true, "html": "<b>Deux vérifications avant de partir</b> — <strong>Le risque incendie.</strong> De mi-juin à mi-septembre, l'accès aux massifs du Gard est réglementé par arrêté préfectoral et <strong>interdit en niveau rouge</strong>. La carte est publiée chaque jour à 18h pour le lendemain : regardez-la ce soir. Et <strong>ne faites pas ce sentier par temps de pluie</strong> — risque de crue, roches glissantes, la fiche est formelle. Sec, il n'y a aucun problème."}, {"t": "access", "html": "<b>Ne vous trompez pas de Valescure</b> — Il y a <strong>deux sentiers quasi homonymes à Peyrolles</strong>. Le vôtre est le <strong>sentier de découverte</strong>, départ au château de Valescure (44.095554, 3.829866). L'autre, le « sentier de Valescure » tout court, fait <strong>11,3 km et 4h</strong> et part du virage de La Planque. Vérifiez les coordonnées avant de vous garer."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Parking du château de Valescure · 44.095554, 3.829866", "href": "https://www.google.com/maps/dir/?api=1&destination=44.095554%2C3.829866"}, {"cls": "l-gpx", "txt": "Trace GPX du Parc national", "href": "https://geotrek-admin.cevennes-parcnational.net/api/fr/treks/38013/sentier-de-valescure.gpx"}, {"cls": "l-web", "txt": "Fiche du Parc national des Cévennes", "href": "https://destination.cevennes-parcnational.fr/fr/trek/38013-Sentier-de-Valescure"}, {"cls": "l-web", "txt": "Fiche Gard Tourisme", "href": "https://www.tourismegard.com/fr/fiche/equipement/sentier-de-decouverte-de-valescure-peyrolles_TFO6939444/"}, {"cls": "l-web", "txt": "Carte du risque incendie du Gard, mise à jour chaque jour à 18h", "href": "https://www.risque-prevention-incendie.fr/30"}]}]}, {"type": "trajet", "heure": "15h00", "fin": "Fin de la balade", "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=Col+de+Lamira%2C+30270+Saint-Jean-du-Gard", "html": "Peyrolles → col de Lamira · la D907 par Saumane et Saint-Jean-du-Gard, puis la petite route du col · 23 km · <strong>35 min</strong>", "alt": 280, "km": "23", "duree": "35min", "route": "la D907 par Saumane et Saint-Jean-du-Gard, puis la petite route du col", "de_pt": "w2val", "vers_pt": "w2col", "de_lib": "Peyrolles", "vers_lib": "col de Lamira", "de_alt": 320, "vers_alt": 280}, {"type": "home", "heure": "15h40", "icone": "i-home", "titre": "Installation au mas, et deux heures pour rien faire", "pt": "p29", "blocs": [{"t": "p", "html": "<strong>Mas de Cros Viel, col de Lamira, au-dessus de Saint-Jean-du-Gard.</strong> On décharge, on vide la glacière dans le frigo, on fait le tour du mas, et on ne fait plus rien jusqu'à 18h. Vous venez de conduire, de marcher et de déménager : la journée est encore longue, il reste une balade ce soir."}, {"t": "note", "html": "<b>À faire avant de repartir</b> — Repérez la petite route du col : vous allez la faire quatre fois par jour toute la semaine, et de nuit en fin de séjour. Et vérifiez le réseau au mas, il est capricieux dans ces vallées."}]}, {"type": "trajet", "heure": "18h00", "fin": "On ressort", "vers": "Saint-Jean-du-Gard, parking de la Poste", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.105800%2C3.884973", "html": "Col de Lamira → Saint-Jean-du-Gard · la petite route du col · 6 km · <strong>12 min</strong>", "alt": 195, "km": "6", "duree": "12min", "route": "la petite route du col", "de_pt": "w2col", "vers_pt": "w2sj", "de_lib": "col de Lamira", "vers_lib": "Saint-Jean-du-Gard", "de_alt": 280, "vers_alt": 195}, {"type": "rando", "heure": "18h15", "icone": "i-hike", "pt": "w2sj", "titre": "Balade du soir : la boucle du Pont Vieux, au fil du Gardon", "blocs": [{"t": "meta", "html": "5,2 km · <strong>1h40</strong> · boucle · <strong>facile</strong>, accessible dès 5 ou 6 ans · <strong>7 points de patrimoine</strong> · départ et arrivée parking de la Poste, place Rabaut Saint-Étienne, <strong>44.105800, 3.884973</strong>"}, {"t": "p", "html": "La balade qui vous fait faire connaissance avec le village où vous allez passer la semaine, et elle part à six kilomètres du mas. On longe le <strong>Gardon</strong> à travers bois et campagne, puis on revient par le centre. Sept arrêts sur le parcours : le <strong>château du XVII<sup>e</sup></strong>, le <strong>Pont Vieux de 1733 et ses six arches</strong> qui a remplacé l'ancien gué, la <strong>tour de l'Horloge du XII<sup>e</sup></strong>, dernier vestige de l'église bénédictine remaniée pendant les guerres de Religion, le <strong>temple néoclassique de 1827</strong>, l'ancienne filature de Maison Rouge, qu'on longe sans y entrer, et la gare du train à vapeur."}, {"t": "note", "html": "<b>Ce que vous verrez dans l'eau</b> — Les berges du Gardon sont classées <strong>Natura 2000</strong> : c'est une zone humide protégée, où vivent le <strong>blageon</strong> et le <strong>barbeau méridional</strong>, deux poissons de rivière méditerranéenne. À 18h15 la lumière est basse et l'eau est claire : regardez sous les berges."}, {"t": "access", "html": "<b>Départ et stationnement</b> — <strong>Parking de la Poste, place Rabaut Saint-Étienne</strong>, en plein centre. C'est aussi celui du point d'information touristique, <a class=\"tel\" href=\"tel:+33466853211\">04 66 85 32 11</a>, ouvert <strong>samedi 9h – 13h et 14h – 18h</strong> malgré le 15 août : passez-y avant de partir, ils donnent gratuitement les plans et les topos du secteur. La fiche officielle ne précise pas le balisage — prenez la trace GPX."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Parking de la Poste · 44.105800, 3.884973", "href": "https://www.google.com/maps/dir/?api=1&destination=44.105800%2C3.884973"}, {"cls": "l-gpx", "txt": "Trace GPX officielle", "href": "https://static.apidae-tourisme.com/filestore/objets-touristiques/plans/137/143/15372169/St+Jean+du+Gard+Pont+Vieux+1.gpx"}, {"cls": "l-web", "txt": "Fiche PDF du circuit", "href": "https://static.apidae-tourisme.com/filestore/objets-touristiques/documents/138/143/15372170/7+Pont+Vieux.pdf"}, {"cls": "l-web", "txt": "Fiche de l'office de tourisme", "href": "https://www.cevennes-tourisme.fr/je-prepare/a-voir-a-faire/loisirs-plein-air/randonnees-et-activites-nature/randonnee-le-pont-vieux-saint-jean-du-gard-fr-3925837/"}]}]}, {"type": "trajet", "heure": "20h15", "fin": "Fin de la boucle", "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=Col+de+Lamira%2C+30270+Saint-Jean-du-Gard", "html": "Saint-Jean-du-Gard → col de Lamira · la petite route du col · 6 km · <strong>12 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 1h49 de conduite, plus longue traite 50 min</strong>", "alt": 280, "km": "6", "duree": "12min", "route": "la petite route du col", "de_pt": "w2sj", "vers_pt": "w2col", "de_lib": "Saint-Jean-du-Gard", "vers_lib": "col de Lamira", "de_alt": 195, "vers_alt": 280}, {"type": "eat", "heure": "20h30", "icone": "i-eat", "titre": "Dîner à la maison", "blocs": [{"t": "shop", "html": "<b>Au menu</b> — Tartines de pélardon frais aux oignons doux crus et au miel de châtaignier, passées deux minutes sous le gril, avec une grande salade et le melon du marché. Tout vient du marché du Vigan de ce matin.<br><em>Si vous préférez sortir</em> : le <strong>marché nocturne « Les Dimanches Artisans »</strong> est demain soir, pas ce soir. Les tables de Saint-Jean-du-Gard sont prises un 15 août — restez à la maison, vous avez de quoi."}]}], "notes": [{"cls": "note warn", "html": "<b>À vérifier ce soir, avant de vous coucher</b> — <strong>Le risque incendie.</strong> De mi-juin à mi-septembre, l'accès aux massifs du Gard est fermé par arrêté préfectoral dès que le niveau passe au rouge, et une interdiction a déjà été prononcée dans le département le 6 août. <strong>La carte du lendemain est publiée chaque jour à 18h</strong> : regardez-la avant de valider Valescure. Si c'est rouge, la boucle du Pont Vieux le long du Gardon reste faisable, elle est en fond de vallée et en partie en village."}, {"cls": "note plan", "html": "<b>Si vous préférez ne marcher qu'une fois</b> — Gardez Valescure, qui est la vraie belle balade des deux, et remplacez le soir par une simple flânerie dans Saint-Jean-du-Gard : le Pont Vieux, la Grand Rue, la tour de l'Horloge et les berges se font en quarante minutes sans quitter le centre. <strong>Le point d'information touristique est ouvert jusqu'à 18h</strong> même un 15 août, place Rabaut Saint-Étienne, et il donne les plans."}, {"cls": "note prep", "html": "<b>Ce soir, on prépare demain.</b> Départ 9h30 pour la <strong>vallée Borgne</strong> : 47 minutes jusqu'à Saint-André-de-Valborgne, son <strong>marché de producteurs</strong> de 8h30 à 12h30, puis <strong>L'Escale</strong>, 3h30 jusqu'aux marmites de géant du vallon du Nogaret. Le déjeuner s'achète sur le marché : glacière, couverts, une serviette fine, et des espèces. Chaussures montantes, il y a des dalles de schiste."}], "alt_max": 420, "alt_min": 195, "rando": ["7,8 km", "+150 m"], "volant": "1h49", "chaud": {"texte": "<strong>La journée est construite autour de l'ombre.</strong> Le marché du Vigan se fait avant 11h, la route se fait en voiture, le pique-nique et la balade de Valescure se passent dans un vallon boisé au bord d'un ruisseau, et l'après-midi entier est au mas, à ne rien faire. La seule sortie de fin de journée part à 18h15 le long du Gardon, quand le fond de vallée est déjà à l'ombre.", "lieu": "Vallon de Valescure, sous couvert", "alt": 420}, "geo": {"lat": 44.16251, "lon": 3.671703, "lab": "St-André-de-Valborgne", "alt": 470}, "base": {"lat": 43.9902, "lon": 3.6183, "lab": "Le Vigan"}, "bonus": [{"k": "rando", "titre": "Le Pic d'Arbousse, si vous voulez monter au lieu de longer", "meta": "7,6 km · 2h45 · moyen · même parking de la Poste · variante courte 3,9 km, 1h40, +197 m", "txt": "L'autre sentier officiel au départ de Saint-Jean-du-Gard : il monte au-dessus du village sous les châtaigniers et les pins. <strong>Une variante courte existe, 3,9 km et 1h40, notée 4,2 sur 23 avis</strong> — mais son départ est différent, en haut de la route du Pic d'Arbousse, où le stationnement est très limité et parfois réservé aux riverains. La descente est glissante sur les aiguilles de pin : chaussures montantes.", "liens": [{"cls": "l-map", "txt": "Parking de la Poste", "href": "https://www.google.com/maps/dir/?api=1&destination=44.105800%2C3.884973"}, {"cls": "l-web", "txt": "Fiche de l'office de tourisme", "href": "https://www.cevennes-tourisme.fr/je-prepare/a-voir-a-faire/loisirs-plein-air/randonnees-et-activites-nature/randonnee-le-pic-darbousse-saint-jean-du-gard-fr-3925824/"}]}, {"k": "eau", "titre": "La baignade de Saumane, sur la route entre Peyrolles et Saint-Jean", "meta": "sur la D907 · Gardon de Saint-Jean · sanitaires sur place · non surveillé", "txt": "Si la balade de Valescure tombe à l'eau — massif fermé, chaleur excessive, fatigue du déménagement — la <strong>baignade de Saumane sur le Gardon de Saint-Jean</strong> est directement sur votre route, à mi-chemin. On s'y arrête vingt minutes, les pieds dans l'eau, et on repart. <strong>Réserve honnête</strong> : les coordonnées circulent sur les sites de baignade mais aucune source officielle ne publie ni le parking ni la règle sur les chiens.", "liens": [{"cls": "l-map", "txt": "Saumane, bord du Gardon", "href": "https://www.google.com/maps/search/?api=1&query=Saumane+30440+Gardon"}]}, {"k": "visit", "titre": "La gare du train à vapeur, à 17h15", "meta": "Saint-Jean-du-Gard · gratuit depuis le quai · vous prendrez le train vendredi 21", "txt": "En haute saison, le <strong>départ de 17h30 de Saint-Jean-du-Gard</strong> est le dernier de la journée. Si vous descendez au village un peu avant 18h, passez par la gare vers <strong>17h15</strong> : c'est le moment où la locomotive est sous pression sur le quai, et ça se regarde gratuitement. Vous ferez le trajet complet vendredi 21 depuis Anduze.", "liens": [{"cls": "l-map", "txt": "Gare de Saint-Jean-du-Gard", "href": "https://www.google.com/maps/search/?api=1&query=Gare+de+Saint-Jean-du-Gard"}, {"cls": "l-web", "txt": "Horaires de haute saison", "href": "https://www.trainavapeur.com/horaire/horaires-haute-saison/"}]}], "flex": {"ok": false, "why": "Jour de changement de base : check-out le matin, arrivée au mas l'après-midi.", "frais": "Vallon boisé de Valescure à midi, berges du Gardon à 18h", "haut": 420, "pas": {}}, "_lab": "Sam 15", "_iso": "2026-08-15"}, {"id": "j8", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Le_gardon_de_Mialet.jpg?width=1200", "alt": "Un gardon cévenol", "cap": "Un gardon cévenol, comme celui que vous remontez jusqu'à Saint-André-de-Valborgne · <a href=\"https://commons.wikimedia.org/wiki/File:Le_gardon_de_Mialet.jpg\">Wikimedia Commons</a>"}, "dt": "Dimanche 16 août", "titre": "La vallée Borgne : le marché de producteurs, les marmites de géant, et les artisans le soir", "pitch": "Première vraie journée de la semaine, et on prend la plus belle vallée. On remonte le Gardon jusqu'à <strong>Saint-André-de-Valborgne</strong> pour son marché de producteurs du dimanche, on achète le déjeuner sur la place du temple, et on part sur <strong>L'Escale</strong> : château du XVI<sup>e</sup>, calade pavée, châtaigneraies, la cascade du Nogaret et surtout les <strong>marmites de géant</strong>, ces cuvettes creusées dans la roche où l'on déjeune les pieds dans l'eau. Le soir, retour à Saint-Jean pour <strong>les Dimanches Artisans</strong>, le marché nocturne de créateurs.", "tags": [{"cls": "t-marche", "txt": "Marché de producteurs"}, {"cls": "t-rando", "txt": "L'Escale 9,5 km · 3h30"}, {"cls": "t-eau", "txt": "Marmites de géant"}, {"cls": "t-tot", "txt": "1h58 de volant · max 47 min d'affilée"}], "etapes": [{"type": "trajet", "heure": "9h30", "fin": "Départ", "vers": "Saint-André-de-Valborgne, au fond de la vallée Borgne", "nav": "https://www.google.com/maps/dir/?api=1&destination=Place+du+Temple%2C+30940+Saint-Andr%C3%A9-de-Valborgne", "html": "Col de Lamira → Saint-André-de-Valborgne · la D907 par L'Estréchure et Saumane, tout le long du Gardon · 31 km · <strong>47 min</strong>, et vous montez de 280 à 448 m", "alt": 448, "km": "31", "duree": "47min", "route": "la D907 par L'Estréchure et Saumane", "de_pt": "b_j8_9", "vers_pt": "w2sav", "de_lib": "col de Lamira", "vers_lib": "Saint-André-de-Valborgne", "de_alt": 280, "vers_alt": 448}, {"type": "marche", "heure": "10h20", "icone": "i-market", "pt": "w2sav", "titre": "Marché de producteurs de Saint-André-de-Valborgne", "blocs": [{"t": "meta", "html": "Place du Temple · <strong>8h30 – 12h30</strong>, tous les dimanches du 1<sup>er</sup> mai au 8 octobre · <strong>gratuit</strong> · marché de producteurs, pas de bazar"}, {"t": "p", "html": "Un vrai marché de producteurs au fond de la vallée Borgne, sur la place du temple. L'office de tourisme le résume bien : <strong>« légumes croquants, pélardons du terroir et gourmandises maison »</strong>. Ni textile, ni camelote : ce qui se vend là a poussé dans la vallée. C'est votre pique-nique de la journée, et c'est aussi le contraire exact d'un marché touristique."}, {"t": "note", "html": "<b>Prenez le pain sur place</b> — <strong>il n'y a pas de boulangerie au village</strong> : la plus proche est au Pompidou, à cinq kilomètres. Les producteurs du marché en vendent presque toujours, et l'épicerie <strong>Vida Locale</strong> travaille en circuit court avec les boulangers cévenols. Le <strong>Café du Nord</strong>, place de l'Église, est le seul café du bourg — je n'ai pas pu confirmer qu'il ouvre le dimanche matin. Mairie : <a class=\"tel\" href=\"tel:+33466603008\">04 66 60 30 08</a>."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Place du Temple, Saint-André", "href": "https://www.google.com/maps/dir/?api=1&destination=Place+du+Temple%2C+30940+Saint-Andr%C3%A9-de-Valborgne"}, {"cls": "l-web", "txt": "Fiche officielle du marché", "href": "https://www.tourismegard.com/fr/fiche/fete-et-manifestation/marche-de-producteurs-st-andre-de-valborgne-saint-andre-de-valborgne_TFO6625698/"}]}]}, {"type": "rando", "heure": "11h15", "icone": "i-hike", "pt": "w2esc", "titre": "Rando : L'Escale, le vallon du Nogaret et ses marmites de géant", "blocs": [{"t": "meta", "html": "9,5 km · <strong>+416 m</strong> · <strong>3h30</strong> · boucle · PR départemental · <strong>facile</strong> · départ 200 m après l'office de tourisme, sur la D907"}, {"t": "p", "html": "<strong>C'est la plus belle randonnée de la semaine, et de loin.</strong> Elle empile tout ce que les Cévennes savent faire : le <strong>château de Nogaret</strong> du XVI<sup>e</sup>, l'église romane, les anciennes filatures, une <strong>calade</strong> — une large piste pavée qui suit les courbes de niveau, un travail de pierre qui se voit à chaque pas — des terrasses de vigne, des châtaigneraies, et des vallons où l'on ne croise personne."}, {"t": "p", "html": "<strong>Et l'eau est au cœur du parcours, pas en bonus.</strong> Vous longez le vallon du Nogaret, vous passez sa <strong>cascade</strong>, vous franchissez le <strong>gué du ruisseau</strong>, et vous arrivez aux <strong>marmites de géant</strong> : des cuvettes creusées dans la roche par des galets tournant depuis des millénaires. C'est là qu'on pique-nique et qu'on met les pieds dans l'eau. Au village, la <strong>fontaine du Griffon</strong> pour remplir les gourdes au retour."}, {"t": "access", "warn": true, "html": "<b>Deux points de prudence</b> — La fiche officielle signale des <strong>passages délicats sur les dalles de schiste</strong>, glissantes dès qu'elles sont humides, et le <strong>gué du Nogaret</strong> qui devient traître après la pluie. En août, sec, ça ne pose pas de problème. <strong>Réserve honnête</strong> : après six semaines sans pluie, la cascade du Nogaret peut être très réduite. Les marmites, elles, gardent de l'eau."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Départ, D907 après l'office de tourisme", "href": "https://www.google.com/maps/dir/?api=1&destination=Office+de+tourisme%2C+30940+Saint-Andr%C3%A9-de-Valborgne"}, {"cls": "l-web", "txt": "Fiche officielle Rando Gard", "href": "https://rando.gard.fr/trek/343055-Randonnee-L-Escale"}, {"cls": "l-web", "txt": "Variante balisée jaune, 9,6 km", "href": "https://rando.gard.fr/trek/343537-L-Escale"}]}]}, {"type": "eat", "heure": "13h00", "icone": "i-eat", "pt": "w2esc", "titre": "Pique-nique du marché aux marmites de géant", "blocs": [{"t": "p", "html": "Vous sortez ce que vous avez acheté une heure plus tôt place du Temple : pélardons, légumes, gourmandises maison, du pain de producteur. Vous êtes au bord du ruisseau, à l'ombre du vallon, les pieds dans une marmite creusée par les galets. <strong>C'est le meilleur déjeuner de la semaine et il n'a coûté que la moitié d'une matinée.</strong>"}]}, {"type": "trajet", "heure": "15h30", "fin": "Fin de la randonnée", "vers": "le gîte, au col de Lamira", "nav": "https://www.google.com/maps/dir/?api=1&destination=Col+de+Lamira%2C+30270+Saint-Jean-du-Gard", "html": "Saint-André-de-Valborgne → col de Lamira · la D907 en redescendant le Gardon · 31 km · <strong>47 min</strong>", "alt": 280, "km": "31", "duree": "47min", "route": "la D907 en redescendant le Gardon", "de_pt": "w2sav", "vers_pt": "p43_j8", "de_lib": "Saint-André-de-Valborgne", "vers_lib": "col de Lamira", "de_alt": 448, "vers_alt": 280}, {"type": "trajet", "heure": "19h15", "fin": "Douche et repos", "vers": "Saint-Jean-du-Gard, pour les Dimanches Artisans", "nav": "https://www.google.com/maps/dir/?api=1&destination=Avenue+Ren%C3%A9+Boudon%2C+30270+Saint-Jean-du-Gard", "html": "Col de Lamira → Saint-Jean-du-Gard · la petite route du col · 6 km · <strong>12 min</strong>", "alt": 200, "km": "6", "duree": "12min", "route": "la petite route du col", "de_pt": "b_j8_21", "vers_pt": "w2sjg1", "de_lib": "col de Lamira", "vers_lib": "Saint-Jean-du-Gard", "de_alt": 280, "vers_alt": 200}, {"type": "marche", "heure": "19h30", "icone": "i-basket", "titre": "Dîner aux « Dimanches Artisans »", "blocs": [{"t": "meta", "html": "Avenue Boudon, Saint-Jean-du-Gard · 19h-23h30 · une vingtaine de stands d'artisans et créateurs, producteurs, arts de rue"}, {"t": "p", "html": "Vous dînez sur place. C'est aussi le bon moment pour repérer les artisans que vous irez voir mardi en Grand Rue."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Avenue+Ren%C3%A9+Boudon+Saint-Jean-du-Gard", "txt": "Avenue Boudon"}]}], "pt": "w2sjg1"}, {"type": "trajet", "heure": "22h45", "html": "Saint-Jean-du-Gard → col de Lamira · 6 km · <strong>12 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 1h58 de conduite, plus longue traite 47 min</strong>", "fin": "On plie les courses", "km": "6", "duree": "12min", "route": "&nbsp; Total du jour : 1h20 de conduite", "de_pt": "w2sjg1", "vers_pt": null, "de_lib": "Saint-Jean-du-Gard", "vers_lib": "col de Lamira", "de_alt": 197, "vers_alt": 400, "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115%2C3.895"}], "strip": [{"page": "https://commons.wikimedia.org/wiki/File:Le_gardon_de_Mialet.jpg", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Le_gardon_de_Mialet.jpg?width=800", "alt": "Un gardon cévenol", "cap": "Un gardon cévenol, comme celui du Nogaret"}, {"page": "https://commons.wikimedia.org/wiki/File:271_Corniche_des_C%C3%A9vennes_Panorama_entre_le_col_du_Rey_et_le_Pompidou.jpg", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/271_Corniche_des_C%C3%A9vennes_Panorama_entre_le_col_du_Rey_et_le_Pompidou.jpg?width=800", "alt": "La vallée Borgne", "cap": "Les crêtes au-dessus de la vallée Borgne"}], "notes": [{"cls": "note plan", "html": "<b>Pourquoi il n'y a aucun musée dans ce séjour</b> — Vous ne laissez le chien nulle part, et les musées du secteur ne le prennent pas ou ne publient aucune règle : le <strong>Musée du Désert</strong> au Mas Soubeyran, <strong>Maison Rouge</strong> à Saint-Jean, le <strong>Duché d'Uzès</strong>, le <strong>musée Haribo</strong> et la <strong>grotte de Trabuc</strong> sont donc tous sortis du programme. À la place, vous avez des sentiers, des villages, des marchés et des ateliers, qui racontent la même chose en plein air. La <strong>randonnée du Mas Soubeyran</strong> ci-dessous fait exactement ça pour la mémoire camisarde."}, {"cls": "note prep", "html": "<b>Ce soir, on prépare demain</b> — Lundi, départ 9h30 pour la vallée Française par la Corniche des Cévennes. <strong>Quatre heures de marche</strong> sur la Flandonenque, puis le village de Saint-Germain-de-Calberte. Chaussures montantes, 3 L d'eau, pique-nique acheté ce matin au marché : il n'y a rien à acheter là-haut."}], "alt_max": 700, "alt_min": 280, "rando": ["9,5 km", "+416 m"], "volant": "1h58", "chaud": {"texte": "<strong>La vallée Borgne est encaissée et boisée : c'est l'un des endroits les plus supportables du secteur.</strong> Le marché est à l'ombre du temple à 10h, la randonnée suit un vallon sous couvert sur les deux tiers de son tracé, et le déjeuner se prend au bord de l'eau. L'après-midi est libre au gîte, et la soirée se passe dehors à Saint-Jean quand la chaleur retombe.", "lieu": "Vallon du Nogaret, sous couvert", "alt": 600}, "geo": {"lat": 44.1567, "lon": 3.6339, "lab": "Saint-André-de-Valborgne", "alt": 448}, "base": {"lat": 44.115, "lon": 3.895, "lab": "Col de Lamira"}, "bonus": [{"k": "rando", "titre": "La randonnée du Mas Soubeyran, la mémoire camisarde en plein air", "meta": "10 km · +362 m · 2h30 · boucle balisée jaune · départ du hameau du Mas Soubeyran, Mialet", "txt": "Si l'histoire camisarde vous manque, c'est celle-là qu'il faut faire : elle part du hameau du Mas Soubeyran et traverse les <strong>hameaux camisards</strong>, un <strong>temple protestant octogonal du XVI<sup>e</sup></strong> et un moulin restauré. Le hameau lui-même, ses ruelles et la maison natale de Rolland se parcourent librement de l'extérieur, et le <strong>pont des Camisards</strong> sur le Gardon est à deux pas. Même mémoire, lue dans le paysage, et le chien y est chez lui.", "liens": [{"cls": "l-map", "txt": "Mas Soubeyran, Mialet", "href": "https://www.google.com/maps/search/?api=1&query=Mas+Soubeyran+Mialet"}, {"cls": "l-web", "txt": "Fiche officielle et GPX", "href": "https://www.tourismegard.com/fr/fiche/equipement/randonnee-le-mas-soubeyran-mialet_TFO6326948/"}]}, {"k": "rando", "titre": "Le pont des chèvres, si 3h30 vous paraît trop", "meta": "7,9 km · +390 m · 2h45 · facile · départ place de Saumane", "txt": "Sur la même route, vingt minutes plus près. Une boucle qui raconte le Gardon et ses crues historiques entre Saumane et L'Estréchure, en passant d'adret en ubac — on voit concrètement comment l'homme a terrassé ces versants. <strong>Traversée du Gardon</strong> et fontaine à L'Estréchure. Attention, le retour emprunte la D907 sur une portion : laisse courte.", "liens": [{"cls": "l-map", "txt": "Place de Saumane", "href": "https://www.google.com/maps/search/?api=1&query=Saumane+30440"}, {"cls": "l-web", "txt": "Fiche Rando Gard", "href": "https://rando.gard.fr/trek/343511-Le-pont-des-chevres"}]}, {"k": "village", "titre": "Le Pompidou et l'église Saint-Flour, à cinq kilomètres", "meta": "800 m d'altitude · sur la Corniche des Cévennes · gratuit", "txt": "Si vous poussez cinq kilomètres après Saint-André, vous êtes sur la <strong>Corniche des Cévennes</strong>, à 800 m, à mi-chemin exact entre Florac et Saint-Jean. L'<strong>église romane Saint-Flour</strong>, ses trois chapelles gothiques, ses murs de calcaire et son toit de lauzes de schiste, et le <strong>Champ de l'Aultre</strong>, un kilomètre de panorama à flanc de montagne. C'est aussi là qu'est la boulangerie la plus proche.", "liens": [{"cls": "l-map", "txt": "Le Pompidou", "href": "https://www.google.com/maps/search/?api=1&query=Le+Pompidou+48110"}]}], "flex": {"ok": false, "why": "Deux marchés qui n'existent que le dimanche : les producteurs de Saint-André le matin, les Dimanches Artisans de Saint-Jean le soir.", "frais": "Vallon boisé et marmites de géant à midi, soirée dehors à Saint-Jean", "haut": 700, "pas": {}}}, {"id": "j9", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/271_Corniche_des_C%C3%A9vennes_Panorama_entre_Saint-Jean-du-Gard_et_Florac.JPG?width=1200", "alt": "Corniche des Cévennes", "cap": "La Corniche des Cévennes entre Saint-Jean-du-Gard et Florac · <a href=\"https://commons.wikimedia.org/wiki/File:271_Corniche_des_C%C3%A9vennes_Panorama_entre_Saint-Jean-du-Gard_et_Florac.JPG\">Wikimedia Commons</a>"}, "dt": "Lundi 17 août", "titre": "La Corniche des Cévennes, les gours de la Flandonenque et les terrasses des Calquières", "pitch": "La grande journée cévenole. On monte par le col Saint-Pierre et on prend la <strong>Corniche des Cévennes</strong>, la route de crête qui sépare le bassin de l'Atlantique de celui de la Méditerranée, jusqu'à la vallée Française. Le matin, <strong>La Flandonenque</strong> : quatre heures entre hameaux de schiste, châtaigneraies et trincats, et un retour par les <strong>gours</strong> du Gardon, ces vasques creusées dans la roche où l'on déjeune les pieds dans l'eau. L'après-midi, <strong>Saint-Germain-de-Calberte</strong> et ses terrasses des Calquières, encore cultivées aujourd'hui, où Stevenson a dormi en 1878.", "tags": [{"cls": "t-rando", "txt": "La Flandonenque 9,2 km · 4h"}, {"cls": "t-eau", "txt": "Cascades et gours"}, {"cls": "t-village", "txt": "Saint-Germain-de-Calberte"}, {"cls": "t-tot", "txt": "2h29 de volant · max 1h05 d'affilée"}], "etapes": [{"type": "trajet", "heure": "9h30", "fin": "Départ", "vers": "le hameau du Cros, dans la vallée Française", "nav": "https://www.google.com/maps/dir/?api=1&destination=Le+Cros%2C+48370+Saint-Germain-de-Calberte", "html": "Col de Lamira → Le Cros · la D907, le col Saint-Pierre, la <strong>Corniche des Cévennes (D9)</strong>, puis la D983 vers Saint-Germain-de-Calberte · 50 km · <strong>1h05</strong>, et vous montez de 280 à 700 m", "alt": 700, "km": "50", "duree": "1h05", "route": "la D907, le col Saint-Pierre, la Corniche des Cévennes puis la D983", "de_pt": "b_j9_9", "vers_pt": "w2cros", "de_lib": "col de Lamira", "vers_lib": "Le Cros", "de_alt": 280, "vers_alt": 700}, {"type": "rando", "heure": "10h45", "icone": "i-hike", "pt": "w2cros", "titre": "Rando : La Flandonenque, les hameaux, les cascades et les gours", "blocs": [{"t": "meta", "html": "9,2 km · <strong>+457 m</strong> · <strong>4h00</strong> · boucle · balisage peinture jaune · <strong>moyen</strong> · départ du parking à la sortie du hameau du Cros"}, {"t": "p", "html": "La vallée Française est la plus discrète des Cévennes, et cette boucle en est le cœur. Une enfilade de <strong>hameaux cévenols</strong> — Flandres, Nozières, La Fare, Vernet — posés sur le versant, le vallon des Flandres, et un retour par un <strong>trincat</strong>, un de ces canaux de dérivation que les Cévenols ont creusés pour conduire l'eau d'un vallon à l'autre. On ne croise à peu près personne."}, {"t": "p", "html": "<strong>C'est la randonnée « pieds dans l'eau » par excellence.</strong> La fiche du Parc national mentionne explicitement des <strong>cascades et des gours</strong> alimentés par le Gardon de Saint-Germain-de-Calberte. Les gours — des vasques naturelles creusées dans le lit — sont sur la partie basse, donc <strong>au retour</strong> : vous finissez la boucle par eux, et c'est exactement ce que vous cherchiez."}, {"t": "access", "html": "<b>Accès et repères</b> — Depuis Saint-Germain-de-Calberte, prendre la route du <strong>Serre de la Can</strong>, puis à deux kilomètres à droite vers <strong>la Bernadelle</strong> et <strong>le Cros</strong>. Parking à la sortie du hameau. Vous êtes en <strong>zone cœur du Parc national</strong> : le chien y est autorisé tenu en laisse, c'est le seul parc national de métropole qui le permette, mais la divagation est interdite. Refermez les clédes derrière vous."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Parking du Cros", "href": "https://www.google.com/maps/dir/?api=1&destination=Le+Cros%2C+48370+Saint-Germain-de-Calberte"}, {"cls": "l-gpx", "txt": "Trace GPX du Parc national", "href": "https://geotrek-admin.cevennes-parcnational.net/api/fr/treks/39564/la-flandonenque.gpx"}, {"cls": "l-web", "txt": "Fiche du Parc national", "href": "https://destination.cevennes-parcnational.fr/fr/trek/39564-La-Flandonenque"}]}]}, {"type": "eat", "heure": "13h00", "icone": "i-eat", "pt": "w2flan", "titre": "Pique-nique aux gours du Gardon, sur la boucle", "blocs": [{"t": "p", "html": "À mi-parcours, là où le sentier redescend sur le Gardon de Saint-Germain, il y a des <strong>gours</strong> : des vasques creusées dans la roche, à l'ombre du vallon. On y sort le reste du marché de Saint-André de la veille et on y trempe les pieds. L'eau vient de haut, elle est froide même en août."}]}, {"type": "village", "heure": "15h15", "icone": "i-village", "pt": "w2sgc", "titre": "Saint-Germain-de-Calberte, le circuit patrimoine et les terrasses des Calquières", "blocs": [{"t": "meta", "html": "<strong>1h30 · 2,3 km · 12 points d'intérêt</strong> · balisé par le <strong>GR70, le chemin de Stevenson</strong>, et le GR Urbain V · plan gratuit à l'office de tourisme · accès entièrement libre"}, {"t": "p", "html": "Un village de schiste accroché au versant, avec un circuit patrimoine officiel calibré à l'heure et demie. On passe le <strong>quartier de l'église</strong> et sa fontaine publique, le bourg du XIX<sup>e</sup> bâti sur l'argent de la soie, le <strong>temple reconstruit en 1825</strong>, l'<strong>ancienne filature</strong> qui a tourné jusqu'en 1934 avec trente-huit fileuses, la <strong>rue Haute</strong> médiévale, et la vue sur la vallée du Gardon et la <strong>draille du Languedoc</strong>, l'antique voie de transhumance."}, {"t": "p", "html": "Le morceau, ce sont les <strong>terrasses des Calquières</strong>, sur le versant sud-est à 500 m : un système complet de pierre sèche <strong>encore cultivé aujourd'hui par vingt-neuf propriétaires sur quarante-deux parcelles</strong>, avec ses réseaux hydrauliques, ses niches murales, ses cabanons et ses terrasses à ruchers. Les murets retiennent la terre tout en laissant filtrer l'eau : c'est le geste qui a rendu ces versants habitables, et c'est ce qui a valu aux Causses et Cévennes leur inscription à l'UNESCO. <strong>Accès libre.</strong>"}, {"t": "note", "html": "<b>Deux histoires qui se croisent ici</b> — <strong>Robert Louis Stevenson</strong> a dormi au cœur des Calquières en 1878, pendant son voyage avec l'ânesse Modestine ; l'auberge est le point 10 du circuit. Et pendant l'Occupation, <strong>sept familles juives ont été cachées dans la commune</strong>, principalement à l'Hôtel Martin, sous l'impulsion du pasteur Gaston Martin et de son épouse Simone : <strong>quatre habitants du village sont Justes parmi les Nations</strong>. Le presbytère protestant, point 5 du circuit, est l'un des lieux d'accueil."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Saint-Germain-de-Calberte", "href": "https://www.google.com/maps/dir/?api=1&destination=Saint-Germain-de-Calberte%2C+48370"}, {"cls": "l-web", "txt": "Plan du circuit patrimoine (PDF officiel)", "href": "https://www.cevennes-montlozere.com/wp-content/uploads/2024/07/pdf-plan-de-village-saint-germain-de-calberte-50an1243-0.pdf"}, {"cls": "l-web", "txt": "Le village · office de tourisme", "href": "https://www.cevennes-montlozere.com/a-voir-a-faire/patrimoine-et-culture/villages-et-patrimoine/saint-germain-de-calberte/"}]}]}, {"type": "trajet", "heure": "16h50", "fin": "Fin de la visite", "vers": "le gîte, au col de Lamira", "nav": "https://www.google.com/maps/dir/?api=1&destination=Col+de+Lamira%2C+30270+Saint-Jean-du-Gard", "html": "Saint-Germain-de-Calberte → col de Lamira · la D983, la Corniche des Cévennes et le col Saint-Pierre · 46 km · <strong>1h00</strong>", "alt": 280, "km": "46", "duree": "1h00", "route": "la D983, la Corniche des Cévennes et le col Saint-Pierre", "de_pt": "w2sgc", "vers_pt": "p43_j9", "de_lib": "Saint-Germain-de-Calberte", "vers_lib": "col de Lamira", "de_alt": 500, "vers_alt": 280}, {"type": "trajet", "heure": "19h30", "fin": "Douche et repos", "vers": "Saint-Jean-du-Gard, pour le dîner", "nav": "https://www.google.com/maps/dir/?api=1&destination=Lettres+et+Mets%2C+Saint-Jean-du-Gard", "html": "Col de Lamira → Saint-Jean-du-Gard · la petite route du col · 6 km · <strong>12 min</strong>", "alt": 200, "km": "6", "duree": "12min", "route": "la petite route du col", "de_pt": "p43_j9", "vers_pt": "p40_j9", "de_lib": "col de Lamira", "vers_lib": "Saint-Jean-du-Gard", "de_alt": 280, "vers_alt": 200}, {"type": "eat", "heure": "19h45", "icone": "i-eat", "titre": "Dîner — Lettres et Mets, Saint-Jean-du-Gard", "blocs": [{"t": "meta", "html": "1071 avenue René Boudon, Saint-Jean-du-Gard · 197 m · <strong>4,8 sur TripAdvisor, mais 17 avis seulement</strong> · galettes 8 à 17 € · <a class=\"tel\" href=\"tel:+33788742297\">07 88 74 22 97</a> · <strong>ouvert tous les jours en août</strong>"}, {"t": "p", "html": "Galettes et crêpes faites sur place à partir d'<strong>une vingtaine de petits producteurs de Saint-Jean et de la vallée</strong>. Quinze couverts seulement, terrasse ombragée, salle climatisée, options végétariennes et sans gluten. C'est la crêperie de village typique, pas la crêperie de bord de route."}, {"t": "access", "warn": true, "html": "<b>Changement</b> — L'Auberge du Péras était prévue ici : <strong>4,4 sur 229 avis Google</strong>, sous votre seuil. Le lundi soir est le pire soir de la semaine dans ce village, presque tout ferme. Lettres et Mets est ouvert tous les jours en août, mais <strong>quinze couverts</strong> : appelez le matin même. Si c'est complet, Le Péras reste ouvert au <a class=\"tel\" href=\"tel:+33466853594\">04 66 85 35 94</a>."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Fiche et avis", "href": "https://www.google.com/maps/search/?api=1&query=Lettres+et+Mets+Saint-Jean-du-Gard"}]}]}, {"type": "trajet", "heure": "21h45", "html": "Saint-Jean-du-Gard → col de Lamira · la petite route du col, à faire de jour si possible · 6 km · <strong>12 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 2h29 de conduite, plus longue traite 1h05</strong>", "fin": "Fin du repas", "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115%2C3.895", "alt": null, "km": "6", "duree": "12min", "route": "la petite route du col", "de_pt": null, "vers_pt": null, "de_lib": "Saint-Jean-du-Gard", "vers_lib": "col de Lamira", "de_alt": 197, "vers_alt": 400}], "strip": [{"page": "https://commons.wikimedia.org/wiki/File:028_Le_Pompidou_(_48110_).JPG", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/028_Le_Pompidou_(_48110_).JPG?width=800", "alt": "Le Pompidou", "cap": "Le Pompidou, sur la Corniche"}, {"page": "https://commons.wikimedia.org/wiki/File:Le_Gardon_%C3%A0_Sainte_Croix-Vall%C3%A9e_fran%C3%A7aise.JPG", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Le_Gardon_%C3%A0_Sainte_Croix-Vall%C3%A9e_fran%C3%A7aise.JPG?width=800", "alt": "Gardon à Sainte-Croix", "cap": "Le Gardon à Sainte-Croix-Vallée-Française"}], "notes": [{"cls": "note plan", "html": "<b>Pourquoi cette journée a changé</b> — La crête de <strong>Castelviel</strong> sort du programme : c'est une belle randonnée, mais sa fiche officielle ne mentionne <strong>aucun point d'eau</strong>, elle est majoritairement à découvert, et elle comporte des passages de rocher schisteux vertigineux — ce qui, avec un chien en laisse, se gère mal. La Flandonenque coche tout : elle est boisée, elle finit aux gours, et elle vous emmène dans la même vallée Française. Elle est en bonus ci-dessous si le panorama vous manque."}, {"cls": "note warn", "html": "<b>Le seul jour déplaçable de la semaine</b> — Tous les autres jours sont verrouillés par un marché ou une nocturne. Si un jour est annoncé rouge, <strong>c'est celui-ci qu'il faut permuter</strong>. C'est aussi la journée la plus haute, donc la plus fraîche : à garder précieusement pour le pic de chaleur."}, {"cls": "note prep", "html": "<b>Ce soir, on prépare le marché</b> — Demain, <strong>le grand marché du mardi à Saint-Jean</strong>, 8h – 13h, le plus gros du séjour côté village, puis Uzès et sa nocturne. Glacière et sacs, des espèces, et la journée est longue : vous rentrez vers 22h30."}], "alt_max": 900, "alt_min": 200, "rando": ["9,2 km", "+457 m"], "volant": "2h29", "chaud": {"texte": "<strong>C'est la journée la plus haute de la semaine et la mieux protégée.</strong> Le vallon des Flandres est boisé sur environ 70 % du tracé, vous êtes entre 550 et 900 m, et le déjeuner se prend dans les gours, à l'eau froide. La visite du village se fait à 15h15, à l'ombre des ruelles de schiste, et l'on redescend par la Corniche en fin d'après-midi.", "lieu": "Vallon des Flandres, sous couvert", "alt": 900}, "geo": {"lat": 44.2183, "lon": 3.8025, "lab": "Saint-Germain-de-Calberte", "alt": 500}, "base": {"lat": 44.115, "lon": 3.895, "lab": "Col de Lamira"}, "bonus": [{"k": "rando", "titre": "Castelviel, la crê
