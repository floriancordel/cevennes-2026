var CATI={guinguette:'🍃',gastro:'✦',bistrot:'🍴',creperie:'🥞',picnic:'🧺',marche:'🛒',auberge:'🏠',maison:'🏡'};
var CATL={guinguette:'Guinguette',gastro:'Table gastronomique',bistrot:'Bistrot',creperie:'Crêperie',
          picnic:'Pique-nique',marche:'Marché nocturne',auberge:'Auberge de village',maison:'À la maison'};
function tblHTML(t){
  var h='<div class="tbl" data-cat="'+t.cat+'"><div class="hd"><span class="cat cat-'+t.cat+'">'+CATI[t.cat]+'</span>'+
    '<span class="hh"><span class="q">'+t.date+' · '+t.quand+' · '+CATL[t.cat]+'</span><h4>'+t.nom+'</h4>'+
    (t.lieu?'<div class="lu">'+t.lieu+'</div>':'')+'</span>';
  if(t.note)h+='<span class="nt"><b>'+t.note+'</b><span>sur 5</span></span>';
  h+='</div><div class="bd">';
  var inf=[];
  if(t.avis)inf.push('<span>'+t.avis+'</span>');
  if(t.horaires)inf.push('<span><b>'+t.horaires+'</b></span>');
  if(t.prix)inf.push('<span>'+t.prix+'</span>');
  if(t.chien)inf.push('<span>🐕 '+t.chien+'</span>');
  if(inf.length)h+='<div class="inf">'+inf.join('')+'</div>';
  h+='<p>'+t.desc+'</p>';
  if(t.alerte)h+='<div class="al">'+t.alerte+'</div>';
  var lk=[];
  if(t.maps)lk.push('<a class="l-map" href="'+t.maps+'" target="_blank" rel="noopener">Photos et avis</a>');
  if(t.tel)lk.push('<a class="l-web" href="tel:+33'+t.tel.replace(/[^0-9]/g,'').slice(1)+'">'+t.tel+'</a>');
  lk.push('<a class="l-nav" href="#'+t.jour+'">Voir la journée</a>');
  h+='<div class="links" style="margin-left:0">'+lk.join('')+'</div>';
  if(t.alt){h+='<div class="plus" style="margin-top:11px"><b class="t">Autre option</b><b>'+t.alt.nom+'</b>'+
    (t.alt.lieu?' · '+t.alt.lieu:'')+(t.alt.note?' · <b>'+t.alt.note+'/5</b>':'')+(t.alt.avis?' ('+t.alt.avis+')':'')+
    '<br>'+t.alt.desc+
    (t.alt.maps||t.alt.tel?'<div class="links" style="margin:8px 0 0">'+
      (t.alt.maps?'<a class="l-map" href="'+t.alt.maps+'" target="_blank" rel="noopener">Photos et avis</a>':'')+
      (t.alt.tel?'<a class="l-web" href="tel:+33'+t.alt.tel.replace(/[^0-9]/g,'').slice(1)+'">'+t.alt.tel+'</a>':'')+'</div>':'')+
    '</div>';}
  h+='</div>';
  if(t.resa)h+='<div class="resa niv-'+(t.niveau||'')+'"><span class="ckb">'+
    (NIVL[t.niveau]||'Réservation')+'</span><span>'+t.resa+'</span></div>';
  return h+'</div>';
}
var NIVL={indispensable:'Indispensable',conseillee:'Conseillée',presenter:'Se présenter'};
function checklist(){
  var a=D.tables.filter(function(t){return t.niveau&&t.niveau!=='aucune'});
  var h='<div class="ckl"><div class="ckh"><b>À caler avant de partir</b><span>'+a.length+
    ' tables sur '+D.tables.length+'. Les douze autres sont des pique-niques, des marchés ou des dîners à la maison : rien à réserver.</span></div>';
  a.forEach(function(t){
    h+='<div class="ckr niv-'+t.niveau+'"><span class="ckd">'+t.date+'<i>'+t.quand+'</i></span>'+
      '<span class="ckn"><b>'+t.nom+'</b><i>'+(t.lieu||'')+'</i></span>'+
      '<span class="ckb">'+NIVL[t.niveau]+'</span>'+
      (t.tel?'<a class="ckt" href="tel:+33'+t.tel.replace(/[^0-9]/g,'').slice(1)+'">'+t.tel+'</a>'
            :'<span class="ckt off">pas de téléphone</span>')+'</div>';
  });
  return h+'</div>';
}
function vueTables(){
  var cats=['tout','gastro','guinguette','bistrot','creperie','auberge','picnic','marche'];
  var h='<h2 class="sec">Tables et réservations</h2>'+
    '<p class="lede">Les vingt repas du séjour, dans l\'ordre chronologique. Sept sont des pique-niques, et c\'est délibéré : quand une rando finit vers midi, on mange mieux dehors qu\'à la première table venue.</p>'+
    checklist()+
    '<div class="filtres" id="flt">'+cats.map(function(c,i){
      return '<button data-c="'+c+'"'+(i?'':' class="on"')+'>'+(c==='tout'?'Tout':CATL[c])+'</button>'}).join('')+'</div>'+
    '<div id="lstT">'+D.tables.map(tblHTML).join('')+'</div>';
  return h;
}
function initTables(){
  var f=q('flt'); if(!f)return;
  f.onclick=function(e){var b=e.target.closest('button'); if(!b)return;
    [].forEach.call(f.children,function(x){x.classList.toggle('on',x===b)});
    var c=b.dataset.c;
    document.querySelectorAll('#lstT .tbl').forEach(function(t){
      t.style.display=(c==='tout'||t.dataset.cat===c)?'':'none'});};
}
function vueCourses(){
  var h='<h2 class="sec">Courses et pique-niques</h2>'+
    '<p class="lede">Sept moments d\'achat et neuf soirs de préparation, dans l\'ordre. Les listes en ambre sont ce qu\'on achète, celles en violet ce qu\'on prépare la veille au soir pour le lendemain.</p>';
  D.courses.forEach(function(c){
    h+='<div class="crs '+c.type+'"><div class="hd"><span class="q">'+c.date+' · '+c.quand+'</span>'+
      '<h4>'+c.titre+'</h4>'+(c.lieu?'<div class="lu">'+c.lieu+(c.horaires?' · '+c.horaires:'')+'</div>':
      (c.horaires?'<div class="lu">'+c.horaires+'</div>':''))+'</div><div class="bd"><ul>'+
      c.liste.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'+
      (c.pourquoi?'<p class="pq">'+c.pourquoi+'</p>':'')+
      '<div class="links" style="margin:10px 0 0">'+(c.maps?'<a class="l-map" href="'+c.maps+'" target="_blank" rel="noopener">Y aller</a>':'')+
      '<a class="l-nav" href="#'+c.jour+'">Voir la journée</a></div></div></div>';
  });
  return h;
}

function carte(){
  var s=window.__SEM||1, js=s===1?D.jours.slice(0,7):D.jours.slice(7);
  var h='<h2 class="sec">Où sommes-nous</h2>'+
    '<p class="lede">Chaque journée est numérotée à son point le plus marquant. Les petits points bleus sont les autres étapes de la journée, les points violets ce que j\'ai écarté du programme et qui reste à portée. Survolez ou touchez un point pour le détail.</p>'+
    '<div class="mapbar">'+
    '<button data-s="1" class="'+(s===1?'on':'')+'">Semaine 1 · Le Vigan</button>'+
    '<button data-s="2" class="'+(s===2?'on':'')+'">Semaine 2 · Saint-Jean-du-Gard</button></div>'+
    '<div id="carte"></div>'+
    '<div class="leg2"><i><u style="background:#4c6b40"></u> votre base</i><i><u style="background:#8c4a2f"></u> la journée</i>'+
    '<i><u style="background:#2c6b8a"></u> étapes du jour</i><i><u style="background:#7a4a86"></u> à portée, hors programme</i></div>'+
    '<div class="maplist">';
  js.forEach(function(j,i){
    var n=s===1?i+1:i+8, t=DTEMP[j.id];
    h+='<a href="#'+j.id+'"><span class="n">'+n+'</span><span class="t"><b>'+j.geo.lab+' · '+j.geo.alt+' m'+
       (t!=null?' · <span class="tt '+cls(t)+'">'+Math.round(t)+' °C</span>':'')+'</b>'+
       '<span>'+j.dt.split('·')[0].trim()+' — '+j.titre+'</span></span></a>';
  });
  h+='</div><div class="maplist" style="margin-top:18px"><h4 style="margin:0 0 9px;font-size:.95rem">À portée, hors programme</h4>';
  D.bonus.filter(function(b){return b.sem===s}).forEach(function(b){
    h+='<a href="https://www.google.com/maps/search/?api=1&query='+b.q+'" target="_blank" rel="noopener">'+
       '<span class="n" style="background:var(--plum)">+</span><span class="t"><b>'+b.lab+' · '+b.alt+' m</b>'+
       '<span>'+b.desc.replace(/<[^>]+>/g,'')+'</span></span></a>';
  });
  return h+'</div>';
}
function popHTML(titre,sous,txt,img,q2){
  return '<div class="pop">'+(img?'<img class="ph" src="'+img+'" alt="" onerror="this.style.display=\'none\'">':'')+
   '<b>'+titre+'</b><div class="m">'+sous+'</div>'+(txt?'<div style="margin-top:5px">'+txt+'</div>':'')+
   (q2?'<a class="lk" href="https://www.google.com/maps/search/?api=1&query='+q2+'" target="_blank" rel="noopener">Ouvrir dans Maps</a>':'')+'</div>';
}
function initCarte(){
  var s=window.__SEM||1, js=s===1?D.jours.slice(0,7):D.jours.slice(7), el=q('carte');
  if(!el)return;
  if(typeof L==='undefined'){el.innerHTML='<div style="padding:26px;font-size:.92rem;color:var(--ink2)">'+
    'La carte a besoin d\'une connexion pour charger le fond de plan. La liste ci-dessous reste utilisable hors ligne.</div>';
    document.querySelectorAll('.mapbar button').forEach(function(x){x.onclick=function(){window.__SEM=+x.dataset.s;rendre()}});return}
  var m=L.map(el,{scrollWheelZoom:false}).setView(s===1?[43.99,3.60]:[44.15,3.80],10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenStreetMap'}).addTo(m);
  var b=js[0].base, pts=[[b.lat,b.lon]];
  function mk(lat,lon,html,cls2,size,pop){
    var k=L.marker([lat,lon],{icon:L.divIcon({className:'',html:'<div class="mkr '+cls2+'">'+html+'</div>',
      iconSize:[size,size],iconAnchor:[size/2,size/2]})}).addTo(m).bindPopup(pop,{maxWidth:250});
    k.on('mouseover',function(){k.openPopup()});
    return k;
  }
  mk(b.lat,b.lon,'B','base',31,popHTML('Votre base',b.lab,'C\'est d\'ici que part chaque journée.',null,null));
  var PTm={}; D.points.forEach(function(p){PTm[p.id]=p});
  js.forEach(function(j,i){
    var n=s===1?i+1:i+8; pts.push([j.geo.lat,j.geo.lon]);
    var t=DTEMP[j.id];
    mk(j.geo.lat,j.geo.lon,n,'',27,popHTML('Jour '+n+' — '+j.geo.lab,
      j.dt.split('·')[0].trim()+' · '+j.geo.alt+' m'+(t!=null?' · '+Math.round(t)+' °C':'')+(j.volant?' · '+j.volant+' de route':''),
      j.titre, j.cover?j.cover.src.replace('width=1200','width=420'):null, encodeURIComponent(j.geo.lab)));
    L.polyline([[b.lat,b.lon],[j.geo.lat,j.geo.lon]],{color:'#8c4a2f',weight:1.3,opacity:.3,dashArray:'4,5'}).addTo(m);
    var vus={};
    j.etapes.forEach(function(e){
      if(!e.pt||!PTm[e.pt])return; var p=PTm[e.pt];
      var k=p.lat.toFixed(3)+p.lon.toFixed(3); if(vus[k])return; vus[k]=1;
      if(Math.abs(p.lat-j.geo.lat)<1e-4&&Math.abs(p.lon-j.geo.lon)<1e-4)return;
      pts.push([p.lat,p.lon]);
      mk(p.lat,p.lon,'','dot',13,popHTML(e.titre.replace(/<[^>]+>/g,''),
        p.lab+' · '+p.alt+' m'+(TEMP[e.pt]!=null?' · '+Math.round(TEMP[e.pt])+' °C':''),
        'Jour '+n+' — '+e.heure, null, encodeURIComponent(p.lab)));
    });
  });
  D.bonus.filter(function(x){return x.sem===s}).forEach(function(x){
    mk(x.lat,x.lon,'+','bonus',24,popHTML(x.lab,x.alt+' m · hors programme',x.desc,null,x.q));
  });
  m.fitBounds(L.latLngBounds(pts).pad(0.16));
  document.querySelectorAll('.mapbar button').forEach(function(x){
    x.onclick=function(){window.__SEM=+x.dataset.s;rendre()}});
}
function rendre(){
  var h=(location.hash||'').replace('#/','').replace('#','');
  var vue=VUES.indexOf(h)>-1?h:'jours';
  q('app').innerHTML = vue==='jours' ? accueil() : vue==='carte' ? carte() :
    vue==='tables' ? vueTables() : vue==='courses' ? vueCourses() : vue==='forts' ? vueForts() :
    '<h2 class="sec">'+TITRES[vue]+'</h2>'+D.sections[vue];
  if(vue==='jours'){remplirFil(); appliquerTemp(); initRail();
    if(/^j\d+$/.test(h)){var t=q(h); if(t)setTimeout(function(){t.scrollIntoView({behavior:'smooth',block:'start'})},60);}
    else window.scrollTo(0,0);}
  else {window.scrollTo(0,0);
    if(vue==='carte')setTimeout(initCarte,40);
    if(vue==='tables')initTables();}
  document.querySelectorAll('[data-nav]').forEach(function(a){a.classList.toggle('on',a.dataset.nav===vue)});
  if(window.__apresRendu)window.__apresRendu();
}
addEventListener('hashchange',function(){
  var h=(location.hash||'').replace('#','');
  if(/^j\d+$/.test(h)&&q(h)){q(h).scrollIntoView({behavior:'smooth',block:'start'});return}
  rendre();
});

/* ---------- METEO ---------- */
function appliquerTemp(){
  Object.keys(TEMP).forEach(function(id){
    var p=PT[id]; if(!p)return;
    var e=document.querySelector('[data-pt="'+id+'"]');
    if(e){var c=e.querySelector('.wx');
      if(!c){c=document.createElement('div');c.className='wx';var m=e.querySelector('.meta');
        m?m.parentNode.insertBefore(c,m.nextSibling):e.appendChild(c);}
      var t=TEMP[id];
      c.className='wx '+(t>=32?'hot':t>=26?'warm':t<=18?'cool':'');
      c.innerHTML='<span class="alt">▲ '+p.alt+' m</span><span class="sep">|</span><span class="t">'+
        (t==null?'—':Math.round(t)+' °C')+'</span><span class="cond">à '+p.h+'h</span>';}
  });
  document.querySelectorAll('.tt[data-t]').forEach(function(s){
    var t=TEMP[s.dataset.t]; s.textContent=tt(t); s.className='tt '+cls(t);});
  D.jours.forEach(function(j){
    var t=DTEMP[j.id]; var v=document.querySelector('.st.tp[data-d="'+j.id+'"]');
    if(v){v.querySelector('b').textContent=t==null?'—':Math.round(t)+' °C';v.className='st tp '+cls(t);}
    var c=q('ch-'+j.id);
    if(c&&t!=null&&t>=34){c.classList.add('on');c.querySelector('.deg').textContent=Math.round(t)+' °C';}
    else if(c)c.classList.remove('on');
  });
}
(function(){
  var ST=function(){return q('wxstatus')};
  var uniq=[],K={};
  D.points.forEach(function(p){var k=p.lat+','+p.lon+','+p.alt;if(!(k in K)){K[k]=uniq.length;uniq.push(p)}p.k=K[k]});
  var lat=uniq.map(function(p){return p.lat}).join(','),lon=uniq.map(function(p){return p.lon}).join(','),
      ele=uniq.map(function(p){return p.alt}).join(',');
  var t=new Date(),iso=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  var S='2026-08-09',E='2026-08-22',fS=iso(t)>S?iso(t):S,fE=iso(new Date(t.getTime()+15*864e5))<E?iso(new Date(t.getTime()+15*864e5)):E;
  var jobs=[];
  if(fS<=fE&&iso(t)<=E)jobs.push(fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&elevation='+ele+
    '&hourly=temperature_2m&daily=temperature_2m_max&timezone=Europe%2FParis&start_date='+fS+'&end_date='+fE)
    .then(function(r){return r.ok?r.json():null}).catch(function(){return null}));
  else jobs.push(Promise.resolve(null));
  jobs.push(fetch('https://climate-api.open-meteo.com/v1/climate?latitude='+lat+'&longitude='+lon+
    '&start_date='+S+'&end_date='+E+'&models=MRI_AGCM3_2_S&daily=temperature_2m_max&timezone=Europe%2FParis')
    .then(function(r){return r.ok?r.json():null}).catch(function(){return null}));
  Promise.all(jobs).then(function(r){
    var A=function(x){return x?(Array.isArray(x)?x:[x]):null}, F=A(r[0]), C=A(r[1]);
    var nf=0,nc=0;
    D.points.forEach(function(p){
      var v=null,src=null;
      if(F&&F[p.k]&&F[p.k].hourly){var H=F[p.k].hourly,i=H.time.indexOf(p.date+'T'+String(p.h).padStart(2,'0')+':00');
        if(i>-1&&H.temperature_2m[i]!=null){v=H.temperature_2m[i];src='f'}}
      if(v==null&&C&&C[p.k]&&C[p.k].daily){var Dd=C[p.k].daily,k=Dd.time.indexOf(p.date);
        if(k>-1&&Dd.temperature_2m_max[k]!=null){v=Dd.temperature_2m_max[k];src='c'}}
      TEMP[p.id]=v; if(src==='f')nf++; if(src==='c')nc++;
    });
    D.jours.forEach(function(j){
      var vs=j.etapes.filter(function(e){return e.pt&&TEMP[e.pt]!=null}).map(function(e){return TEMP[e.pt]});
      DTEMP[j.id]=vs.length?Math.max.apply(null,vs):null;
    });
    appliquerTemp();
    var s=ST(); if(s){var hh=String(t.getHours()).padStart(2,'0')+'h'+String(t.getMinutes()).padStart(2,'0');
      s.innerHTML=(nf?'<strong>'+nf+' étapes en prévision Météo-France</strong>':'')+
        (nf&&nc?' · ':'')+(nc?nc+' étapes en projection climatique':'')+
        (nf||nc?' · relevé à '+hh+'.':'Aucune donnée reçue.');}
  }).catch(function(){var s=ST();if(s)s.textContent='Météo indisponible. Les altitudes restent affichées.'});
})();

window.__PTS=D.points;
if(!location.hash)location.hash='#jours';
rendre();
var hh=(location.hash||'').replace('#','');
if(/^j\d+$/.test(hh)&&q(hh))setTimeout(function(){q(hh).scrollIntoView()},250);
</script>
