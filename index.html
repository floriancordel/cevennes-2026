Maison de l'Aigoual, col de la Serreyrède", "pt": "p3", "blocs": [{"t": "meta", "html": "1299 m · maison du Parc national, exposition, boutique de produits locaux · <a class=\"tel\" href=\"tel:+33467826467\">04 67 82 64 67</a>"}, {"t": "p", "html": "Vingt minutes, le temps de faire le plein d'eau et de demander l'état des sentiers et la présence des troupeaux. Emportez une <strong>polaire et un coupe-vent</strong>, même par 35 °C en bas : le sommet compte 240 jours de brouillard par an."}, {"t": "access", "warn": false, "html": "<b>Accès et stationnement</b> — RD986, croisement des GR7, GR60 et GR66. Grande route de col goudronnée, sans difficulté. Parking à côté du bâtiment, a priori gratuit (site du Parc national), mais <strong>très prisé</strong> car c'est le départ de nombreuses boucles. Horaires de la maison variables selon la saison : si vous voulez être sûrs, appelez la veille."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Maison+de+l%27Aigoual+Col+de+la+Serreyr%C3%A8de", "txt": "Fiche et avis"}]}]}, {"type": "eat", "heure": "12h00", "icone": "i-eat", "titre": "Pique-nique au col de la Serreyrède", "blocs": [{"t": "meta", "html": "1299 m · tables et fontaine au col, devant la Maison de l'Aigoual · vous sortez de 2h30 de forêt"}, {"t": "p", "html": "Vous mangez à 1299 m, avec une vingtaine de degrés pendant que la vallée est à 35. C'est tout l'intérêt de la journée, et aucune table du plateau ne vaut ça."}, {"t": "access", "warn": true, "html": "<b>Pourquoi pas de restaurant ici</b> — L'Aigoual est le point faible du séjour côté tables. La brasserie du carrefour des Hommes de la Route est une halte routière sans intérêt, et le restaurant de l'Observatoire se visite pour la vue, pas pour l'assiette. Vous mangerez infiniment mieux avec ce que vous aurez préparé."}, {"t": "shop", "html": "<b>Préparé la veille au soir</b> — Sandwichs au pélardon et à la charcuterie, tomates, fruits, une thermos de café. Et arrêtez-vous à <strong>Terres d'Aigoual</strong>, la boutique de producteurs de L'Espérou, pour compléter et pour acheter le dîner de ce soir."}]}, {"type": "trajet", "heure": "13h05", "html": "col de la Serreyrède → sommet du Mont Aigoual · D986, la route de crête · 6 km · <strong>12min</strong>", "fin": "Fin du pique-nique", "vers": "le sommet du Mont Aigoual, 1 565 m", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.121212%2C3.579283", "alt": 1565, "km": "6", "duree": "12min", "route": "D986, la route de crête", "de_pt": "p3", "vers_pt": "p6", "de_lib": "col de la Serreyrède", "vers_lib": "sommet du Mont Aigoual", "de_alt": 1299, "vers_alt": 1565}, {"type": "visit", "heure": "13h30", "icone": "i-village", "titre": "Le sommet du Mont Aigoual, tranquillement", "pt": "p6", "blocs": [{"t": "meta", "html": "Accès libre et gratuit · 1h sur place · 1565 m"}, {"t": "p", "html": "La <strong>table d'orientation du Touring Club de France</strong>, posée là en 1908, est en accès libre : par temps clair on voit les Alpes, les Pyrénées et la Méditerranée. Par temps couvert on ne voit rien du tout, et c'est presque plus impressionnant."}, {"t": "p", "html": "Vous avez déjà marché 2h30 ce matin : contentez-vous du panorama, de la station météo et du vent. Si l'envie d'un peu plus vous prend, la <strong>boucle de Trépaloup</strong> part du même parking — 2,7 km, 1h, facile, deux menhirs, la fontaine de Trépaloup et la source du Tarnon."}, {"t": "p", "html": "<em>Le <strong>Climatographe</strong>, dans l'ancien observatoire, propose 700 m² d'exposition sur le climat (10h-19h, 9 €). Je l'ai sorti du programme : sa politique chien n'est pas publiée et la journée respire mieux sans. Gardez-le en repli si le sommet est dans les nuages, ce qui arrive 240 jours par an.</em>"}, {"t": "access", "warn": false, "html": "<b>Accès et stationnement</b> — D986 depuis le col de la Serreyrède, 6 km. Route large et goudronnée, sans difficulté. <strong>Un seul et grand parking gratuit au sommet</strong>, dimensionné voitures et autocars, qui dessert l'observatoire ; quelques dizaines de mètres de marche. <strong>Aucune ombre</strong> à 1567 m. Snack-bar et gîte d'étape sur place. Ne confondez pas avec la station de <strong>Prat Peyrot</strong>, 4 km avant, qui a son propre parking."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Observatoire+du+Mont+Aigoual", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.121212%2C3.579283", "txt": "Itinéraire · 44.121212, 3.579283"}, {"cls": "l-web", "href": "https://climatographe.fr/", "txt": "climatographe.fr"}, {"cls": "l-trk", "href": "https://www.visorando.com/randonnee-boucle-de-trepaloup/", "txt": "Trépaloup · Visorando"}]}]}, {"type": "trajet", "heure": "15h20", "html": "sommet du Mont Aigoual → plateau du mouflon · par le col de la Serreyrède, L'Espérou et la D329 · 20 km · <strong>30min</strong>", "fin": "Fin de la visite du sommet", "vers": "le plateau du mouflon, au-dessus du col de la Lusette", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.059139%2C3.604666", "alt": 1200, "km": "20", "duree": "30min", "route": "par le col de la Serreyrède, L'Espérou et la D329", "de_pt": "p6", "vers_pt": "p12mou", "de_lib": "sommet du Mont Aigoual", "vers_lib": "plateau du mouflon", "de_alt": 1565, "vers_alt": 1200}, {"type": "rando", "heure": "16h00", "icone": "i-hike", "pt": "p12mou", "titre": "Sentier de découverte : Sur les traces du mouflon", "blocs": [{"t": "meta", "html": "2,4 km · <strong>+92 m</strong> · 1h30 à 2h · boucle · balisage jaune · <strong>très facile</strong> · 1 200 m d'altitude · 8 stations d'interprétation"}, {"t": "p", "html": "Un sentier d'interprétation du Parc national, sur le plateau au-dessus du col de la Lusette. <strong>Le mouflon a été introduit sur le massif de l'Aigoual en 1954</strong> et la population y est aujourd'hui installée : huit stations racontent l'animal, son histoire ici et la façon dont on le gère. Le parcours traverse la lande ouverte et des passages rocheux, avec des postes d'observation et une vue dégagée sur les massifs cévenols."}, {"t": "note", "html": "<b>Vous êtes à la bonne heure</b> — la fiche du Parc le dit : le mouflon se repère mieux au petit matin et <strong>en fin de journée</strong>. À 16h en août, la lande commence à rendre sa chaleur et les hardes redescendent. Sortez les jumelles et visez le fond du ravin, leur beige clair tranche sur le vert. <strong>Il y a aussi un observatoire à mouflons</strong> installé dans un virage de la D986 entre Valleraugue et L'Espérou, à faire depuis la voiture."}, {"t": "access", "warn": true, "html": "<b>Avec le chien, soyez lucides</b> — Le Parc national des Cévennes autorise le chien tenu en laisse, y compris en zone cœur, donc vous avez le droit. Mais <strong>avec un chien vous ne verrez pas de mouflon</strong>, ils décrochent bien avant que vous n'arriviez. Faites-le pour le sentier, la lande et la vue, et gardez l'observation pour l'observatoire de la D986, depuis la voiture. Un incendie de février 2020 a touché une partie du parcours : <strong>ne quittez pas le sentier balisé</strong>."}, {"t": "access", "html": "<b>Départ et stationnement</b> — Parking sous les pins, sur le plateau, à 2 km du col de la Lusette. Accès par la D329 depuis L'Espérou, ou par la D48 et le col du Minier depuis Le Vigan. Coordonnées <strong>44.059139, 3.604666</strong>. Ni VTT ni chevaux sur ce sentier. Renseignements : Maison de l'Aigoual, <a class=\"tel\" href=\"tel:+33467826467\">04 67 82 64 67</a>."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Itinéraire · 44.059139, 3.604666", "href": "https://www.google.com/maps/dir/?api=1&destination=44.059139%2C3.604666"}, {"cls": "l-gpx", "txt": "Trace GPX du Parc national", "href": "https://geotrek-admin.cevennes-parcnational.net/api/fr/treks/38006/sur-les-traces-du-mouflon.gpx"}, {"cls": "l-web", "txt": "Fiche du Parc national", "href": "https://destination.cevennes-parcnational.fr/fr/trek/38006-Sur-les-traces-du-mouflon"}]}]}, {"type": "trajet", "heure": "17h50", "html": "plateau du mouflon → lac des Pises · la D329, le col du Minier, puis la piste forestière goudronnée · 18 km · <strong>30min</strong>", "fin": "Fin du sentier", "vers": "le lac des Pises, pour le dîner d'anniversaire", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.041370%2C3.508042", "alt": 1250, "km": "18", "duree": "30min", "route": "la D329, le col du Minier, puis la piste forestière goudronnée", "de_pt": "p12mou", "vers_pt": "p12pis", "de_lib": "plateau du mouflon", "vers_lib": "lac des Pises", "de_alt": 1200, "vers_alt": 1250}, {"type": "eat", "heure": "18h30", "icone": "i-eat", "pt": "p12pis", "titre": "Dîner d'anniversaire au lac des Pises, coucher de soleil puis les étoiles", "blocs": [{"t": "meta", "html": "1 250 m d'altitude · massif du Lingas, commune de Dourbies · <strong>accès libre et gratuit toute l'année</strong> · aire de pique-nique sur place · animaux acceptés en laisse"}, {"t": "p", "html": "Treize hectares d'eau posés à 1 250 mètres au milieu du massif du Lingas, entourés de <strong>hêtres centenaires</strong> et de tourbières, avec des pelouses d'altitude qui virent au cuivre en fin d'été. Le lac a été créé en 1963, mais rien n'y ressemble à un plan d'eau aménagé : c'est un paysage de steppe, silencieux, où l'on entend les criquets et rien d'autre. Pic noir, chouette de Tengmalm, aigle botté, loutres au fil de l'eau."}, {"t": "p", "html": "<strong>Et c'est là que ça devient le bon endroit pour un anniversaire.</strong> Le site fait partie de la <strong>Réserve internationale de ciel étoilé des Cévennes, la plus grande d'Europe</strong>. Vous dînez pendant que la lumière tombe sur les crêtes, vous laissez la nuit s'installer, et vous rentrez avec la Voie lactée au-dessus de la tête. Il fera dix degrés de moins qu'au Vigan, ce qui, un 12 août annoncé caniculaire, n'est pas un détail."}, {"t": "shop", "html": "<b>Au menu</b> — Le pique-nique de fête, acheté le matin même à <strong>Terres d'Aigoual</strong>, la boutique des producteurs à la Maison de l'Aigoual : saucissons et fromages du pays, confiture d'oignon doux, pâtes artisanales, jus de pomme du Vigan. Ajoutez le pain et la charcuterie pris au Vigan la veille, une bouteille au frais dans la glacière, et le gâteau. <strong>Prévoyez une polaire chacun</strong> : à 1 250 m la nuit tombe froide même en août, et vous allez rester."}, {"t": "access", "warn": true, "html": "<b>Ce qu'il faut savoir avant d'y aller</b> — <strong>La baignade est interdite</strong>, ainsi que le passage sous le barrage. On accède uniquement à la partie haute du lac et on ne fait pas le tour. Vous êtes en <strong>zone cœur du Parc national</strong> : le chien est accepté mais doit rester en laisse, et il n'y a ni poubelle ni buvette, on repart avec tout. Pas de réseau. Prévenez quelqu'un de votre horaire de retour."}, {"t": "access", "html": "<b>Accès et stationnement</b> — Depuis le <strong>col du Minier</strong> sur la D48, prenez la <strong>piste forestière goudronnée</strong> sur cinq kilomètres jusqu'au <strong>parking des Pises</strong>, commune de Dourbies. Il y a une aire de pique-nique à l'arrivée. <strong>N'utilisez pas le parking du Pont du Lingas</strong>, déconseillé. Coordonnées <strong>44.041370, 3.508042</strong>. Faites la piste de jour à l'aller : au retour vous la referez de nuit, phares et prudence, il y a du gibier."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Itinéraire · 44.041370, 3.508042", "href": "https://www.google.com/maps/dir/?api=1&destination=44.041370%2C3.508042"}, {"cls": "l-web", "txt": "Fiche Gard Tourisme", "href": "https://www.tourismegard.com/fr/fiche/patrimoine-naturel/le-lac-des-pises-dourbies_TFO6081546/"}]}]}, {"type": "trajet", "heure": "20h45", "html": "lac des Pises → Le Vigan · la piste forestière puis le col du Minier, de nuit · 30 km · <strong>45min</strong> &nbsp;·&nbsp; <strong>Total du jour : 2h47 de conduite, plus longue traite 50 min</strong>", "fin": "Fin du dîner", "vers": "le gîte du Vigan · 357 route de Ganges", "nav": "https://www.google.com/maps/dir/?api=1&destination=357+Route+de+Ganges%2C+30120+Le+Vigan", "alt": 245, "km": "30", "duree": "45min", "route": "la piste forestière puis le col du Minier, de nuit", "de_pt": "p12pis", "vers_pt": null, "de_lib": "lac des Pises", "vers_lib": "Le Vigan", "de_alt": 1250, "vers_alt": 245}], "notes": [{"cls": "note warn", "html": "<b>La Borie s'est plantée, voilà le remplacement</b> — plutôt que de rabattre l'anniversaire sur une table de secours, on le sort dehors, et on gagne au change : le lac des Pises est le plus beau lieu d'eau du secteur et le seul où vous dînerez sous un ciel classé. <strong>Ce que ça coûte : 2h47 de route, dix-sept minutes au-dessus de votre plafond</strong>, à cause des cinq kilomètres de piste forestière à faire deux fois. Je préfère vous le dire. Si vous voulez rester sous les 2h30, supprimez le sentier du mouflon et descendez directement du sommet au lac : la journée retombe à 2h29.<br><strong>Si vous préférez quand même une table</strong> : Le XII à Ganges, 4,7 sur 236 avis, ouvert le mercredi, <a class=\"tel\" href=\"tel:+33467738538\">04 67 73 85 38</a> ; ou Le Jardin aux Sources à Brissac, 4,7 sur 831 avis, ancienne étoile. Les deux sont à 25 et 35 minutes du gîte."}, {"cls": "note plan", "html": "<b>Plan B si le temps se gâte</b> — au lac des Pises il n'y a aucun abri. Si l'orage menace, le pique-nique de fête se replie au <strong>col de la Serreyrède</strong>, à 1 299 m, où il y a des tables et la Maison de l'Aigoual à côté ; ou tout simplement à la maison, avec ce que vous aurez acheté chez Terres d'Aigoual."}], "alt_max": 1565, "alt_min": 245, "rando": ["2,4 km", "+92 m"], "volant": "2h47", "chaud": {"texte": "<strong>C'est la meilleure journée possible sur un pic de chaleur, et elle le reste.</strong> Vous êtes entre 1 200 et 1 565 m du matin au soir, et vous dînez à 1 250 m au bord de l'eau. Il y fera une dizaine de degrés de moins qu'au Vigan. Emportez simplement plus d'eau que d'habitude pour le sentier du mouflon : la lande est ouverte et sans ombre.", "lieu": "Lac des Pises, 1 250 m", "alt": 1250}, "geo": {"lat": 44.121212, "lon": 3.579283, "lab": "Mont Aigoual", "alt": 1565}, "base": {"lat": 43.9902, "lon": 3.6183, "lab": "Le Vigan"}, "bonus": [{"k": "rando", "titre": "Le sentier du col de la Caumette", "meta": "7,2 km · +216 m · 2h30 · départ du col de la Serreyrède", "txt": "La randonnée que le sentier du mouflon remplace. Elle part du col de la Serreyrède, sous les hêtres plantés par Georges Fabre, et c'est la version sportive de la matinée. Si le chien a retrouvé la forme, prenez-la : vous montez alors par la vallée comme prévu au départ, et la journée retombe à 2h27 de route.", "liens": [{"cls": "l-map", "txt": "Col de la Serreyrède", "href": "https://www.google.com/maps/dir/?api=1&destination=Col+de+la+Serreyr%C3%A8de%2C+30570"}]}, {"k": "rando", "titre": "Les cascades d'Orgon, tout près mais pas au même parking", "meta": "Deux accès différents · version courte 30 min · version longue 9 km, 2h30", "txt": "<strong>Précision, parce que je l'avais dit trop vite :</strong> le sentier du mouflon et les cascades d'Orgon ne partent pas du même parking, mais des deux sont à quelques minutes l'un de l'autre sur le même flanc de l'Aigoual.<br><br><b>Version courte, celle du guide</b> — depuis le <strong>parking des cascades d'Orgon à Arphy</strong>, accès par la D48 puis la D548, à environ 30 minutes du Vigan, donc <strong>une dizaine de minutes avant le parking du mouflon</strong> en montant. Une centaine de mètres suffit pour atteindre la passerelle et le plus beau point de vue sur les chutes qui dévalent la vallée du Coudoulous. Comptez trente minutes aller-retour. <strong>C'est la seule version faisable avec un chien fatigué.</strong><br><br><b>Version longue</b> — 9 km, +450 m, 2h30, la descente initiale est raide sur 1 km. Une variante par La Draille, 8,9 km et +344 m, part elle du <strong>parking « La Draille » sur la D329 après le col de la Lusette, à 1 291 m</strong> : celle-là, oui, est bien sur la route du mouflon, au premier parking à droite.<br><br>Si vous voulez enchaîner les deux mercredi, arrêtez-vous à Arphy en montant : cela ajoute environ trois quarts d'heure à la journée, arrêt compris.", "liens": [{"cls": "l-map", "txt": "Parking des cascades, Arphy", "href": "https://www.google.com/maps/dir/?api=1&destination=Parking+des+Cascades+d%27Orgon%2C+Arphy+30120"}, {"cls": "l-do", "txt": "Decathlon Outdoor, version 9 km", "href": "https://www.decathlon-outdoor.com/fr-fr/inspire/france/randonnee-cascades-d-orgon"}, {"cls": "l-vis", "txt": "Visorando, variante La Draille depuis la D329", "href": "https://www.visorando.com/randonnee-les-cascades-d-orgon-2/"}]}, {"k": "visit", "titre": "L'observatoire à mouflons de la D986", "meta": "gratuit · dans un virage, entre Valleraugue et L'Espérou", "txt": "Un observatoire installé discrètement dans un virage de la route qui monte de Valleraugue à L'Espérou. Vous passez devant. Arrêtez-vous, sortez les jumelles et pointez le fond du ravin : mouflons et mouflonnes y traînent souvent. Sans chien à côté de vous, vos chances montent nettement.", "liens": [{"cls": "l-map", "txt": "D986, montée de Valleraugue", "href": "https://www.google.com/maps/dir/?api=1&destination=Valleraugue%2C+30570"}]}], "flex": {"ok": false, "why": "Anniversaire réservé à La Borie, et La Borie est fermée lundi et mardi.", "frais": "Sommet du Mont Aigoual, 1 565 m, et forêt de hêtres toute la matinée", "haut": 1565, "pas": {}}, "_lab": "Mer 12", "_iso": "2026-08-12"}, {"id": "j5", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Ab%C3%AEme_de_Bramabiau_panorama.JPG?width=1200", "alt": "Abîme de Bramabiau", "cap": "L'abîme de Bramabiau · <a href=\"https://commons.wikimedia.org/wiki/File:Ab%C3%AEme_de_Bramabiau_panorama.JPG\">Wikimedia Commons</a>"}, "dt": "Jeudi 13 août", "titre": "La rivière qui disparaît sous le plateau", "pitch": "Le matin, vous remontez une petite rivière qui s'appelle le Bonheur, à 1100 mètres, sous les arbres, jusqu'aux ruines d'une abbaye. À midi vous vous baignez dans un lac où l'eau est franchement froide. L'après-midi, vous descendez soixante-dix mètres sous terre pour voir cette même rivière ressortir en grondant, là où Édouard-Alfred Martel a inventé la spéléologie française en 1889. Vous serez rentrés à 17h40, avec un apéro à la brasserie Feloni et l'assiette du soir à la maison.", "tags": [{"cls": "t-rando", "txt": "Rando 7,5 km · facile"}, {"cls": "t-eau", "txt": "Lac 1050 m"}, {"cls": "t-visite", "txt": "Abîme de Bramabiau"}, {"cls": "t-eau", "txt": "Baignade surveillée"}, {"cls": "t-tot", "txt": "2h13 de volant · max 50 min d'affilée"}], "etapes": [{"type": "trajet", "heure": "9h30", "html": "Le Vigan → Saint-Sauveur-Camprieu · D999 puis D986 et D269 · 40 km · <strong>50 min</strong>", "fin": "Départ", "vers": "Sentier de la vallée du Bonheur", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115051,3.491544", "alt": 1090, "km": "40", "duree": "50min", "route": "D999 puis D986 et D269", "de_pt": "b_j4_9", "vers_pt": "p10", "de_lib": "Le Vigan", "vers_lib": "Saint-Sauveur-Camprieu", "de_alt": 245, "vers_alt": 1090}, {"type": "rando", "heure": "10h30", "icone": "i-hike", "titre": "Rando : Sentier de la vallée du Bonheur", "pt": "p10", "blocs": [{"t": "meta", "html": "7,5 km · +80 m · 3h · facile · balisage jaune · départ du parking du lac"}, {"t": "p", "html": "Le village est à plus de 1100 m, soit 6 à 7 °C de moins qu'au Vigan. On remonte la rivière du Bonheur — celle-là même qui s'engouffre sous le plateau et ressort en grondant à Bramabiau — en passant par les ruines de l'<strong>abbaye du Bonheur</strong> et la forêt reboisée du XIX<sup>e</sup>. Eau quasi permanente pour le chien."}, {"t": "access", "warn": true, "html": "<b>Deux points à connaître</b> — <strong>Il existe deux tracés officiels du même nom</strong> : celui de Gard Tourisme (7,5 km, +80 m, départ <em>parking au bord du lac</em>, GPS 44.115318, 3.490881) et celui du Parc national (9,3 km, +197 m, départ <em>parking du terrain de football</em>). Prenez le premier, et téléchargez son GPX avant de partir.<br><strong>Des patous sont présents de juin à octobre</strong> sur cet itinéraire, c'est écrit sur la fiche officielle : c'est le seul du séjour où le Parc le signale explicitement. Chien en laisse courte derrière vous, contournez large, ne courez pas, ne criez pas."}, {"t": "liens", "liens": [{"cls": "l-trk", "href": "https://static.apidae-tourisme.com/filestore/objets-touristiques/plans/17/192/19382289/la-vallee-du-bonheur.gpx", "txt": "Télécharger le GPX"}, {"cls": "l-web", "href": "https://www.tourismegard.com/fr/fiche/equipement/sentier-de-la-vallee-du-bonheur-saint-sauveur-camprieu_TFO6081885/", "txt": "Fiche officielle"}]}]}, {"type": "eau", "heure": "13h30", "icone": "i-swim", "titre": "Pique-nique et baignade au Lac du Bonheur", "pt": "p11", "blocs": [{"t": "meta", "html": "Non surveillé mais autorisé · gratuit · animaux acceptés · eau à 15-20 °C"}, {"t": "p", "html": "Vous êtes déjà sur place : le parking de la rando est celui du lac. Deux pontons de pêche PMR, des truites, et une eau franchement fraîche après trois heures de marche."}, {"t": "access", "warn": false, "html": "<b>Accès, stationnement, équipements</b> — D986 depuis Meyrueis ou Valleraugue jusqu'à Camprieu, le lac est à environ 2 km du centre. <strong>Parking gratuit au bord de l'eau</strong>, plage sur la rive sud, marche quasi nulle. <strong>Toilettes publiques confirmées</strong>, aires de pique-nique, deux pontons PMR. <strong>Camping sauvage et barbecues interdits.</strong><br>Le lieu porte trois noms selon les sources : <em>Lac du Bonheur</em>, <em>Lac de Camprieu</em> et <em>Lac du Devois</em> (nom officiel ARS). C'est le même plan d'eau."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Lac+du+Bonheur+Saint-Sauveur-Camprieu", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.115318%2C3.490881", "txt": "Itinéraire · 44.115318, 3.490881"}]}]}, {"type": "trajet", "heure": "", "html": "Lac de Camprieu → Abîme de Bramabiau · 5 km · <strong>8 min</strong>", "fin": "On se sèche", "vers": "Abîme de Bramabiau", "nav": "https://www.google.com/maps/dir/?api=1&amp;destination=44.120323%2C3.474413", "alt": 1029, "km": "5", "duree": "8min", "route": "", "de_pt": "p11", "vers_pt": "p12", "de_lib": "Lac de Camprieu", "vers_lib": "Abîme de Bramabiau", "de_alt": 1090, "vers_alt": 1029}, {"type": "visit", "heure": "15h00", "icone": "i-ticket", "titre": "Abîme de Bramabiau", "pt": "p12", "blocs": [{"t": "meta", "html": "10h-18h en août · adulte 14 € · visite guidée 1h · <strong>chien accepté en laisse</strong> · <a class=\"tel\" href=\"tel:+33466850328\">04 66 85 03 28</a>"}, {"t": "p", "html": "Le berceau de la spéléologie française. Vous descendez trente minutes dans une faille de 70 m, le long d'une rivière souterraine, avec des empreintes de dinosaures dans le tunnel de sortie. C'est le seul site souterrain du séjour où le chien entre avec vous."}, {"t": "access", "warn": true, "html": "<b>Deux choses impératives</b> — <strong>Espèces, chèques ou chèques-vacances uniquement</strong>, pas de carte bancaire. Et <strong>10 °C constants</strong> : polaire obligatoire, y compris pour vous. Parking gratuit, restaurant, bar, WC et aire de pique-nique sur place."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Ab%C3%AEme+de+Bramabiau", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.120323%2C3.474413", "txt": "Itinéraire · 44.120323, 3.474413"}, {"cls": "l-web", "href": "https://sites-touristiques-gard.fr/fiche-site/labime-de-bramabiau/", "txt": "Infos et tarifs"}]}]}, {"type": "trajet", "heure": "16h30", "html": "Bramabiau → Plan d'eau du Mouretou · par le col de la Serreyrède puis la D986 · 26 km · <strong>35min</strong>", "fin": "Fin de la visite", "vers": "le plan d'eau du Mouretou, baignade surveillée", "nav": "https://www.google.com/maps/dir/?api=1&destination=Plan+d%27eau+du+Mouretou%2C+30570+Val-d%27Aigoual", "alt": 700, "km": "26", "duree": "35min", "route": "par le col de la Serreyrède puis la D986", "de_pt": "p12", "vers_pt": "p8", "de_lib": "Bramabiau", "vers_lib": "Plan d'eau du Mouretou", "de_alt": 1029, "vers_alt": 700}, {"type": "eau", "heure": "17h10", "icone": "i-swim", "titre": "Baignade surveillée — Plan d'eau du Mouretou", "pt": "p8", "blocs": [{"t": "note", "html": "<b>Récupéré de la journée d'Orgon</b> — c'est la <strong>seule baignade surveillée de la semaine 1</strong>, et elle est sur la route du retour. Fermée le lundi, ouverte le jeudi."}, {"t": "meta", "html": "Sur l'Hérault naissant · gratuit · animaux acceptés · <a class=\"tel\" href=\"tel:+33467817960\">04 67 81 79 60</a>"}, {"t": "p", "html": "Le seul plan d'eau <strong>surveillé</strong> du secteur amont, et le meilleur endroit du séjour pour ne rien faire pendant trois heures pendant que le chien se rafraîchit."}, {"t": "access", "warn": false, "html": "<b>Accès, stationnement, horaires de surveillance</b> — D986 depuis Valleraugue en direction de L'Espérou, environ 3 km en amont du village. <strong>Parking gratuit sur place</strong>, aire de jeux et aire de pique-nique confirmées, camping-restaurant attenant.<br><strong>Surveillance : mardi à samedi 13h-19h, dimanche 13h-18h, FERMÉ LE LUNDI</strong> (source mairie de Val-d'Aigoual, dates annoncées 7 juillet-30 août ; une autre source dit 9 juillet-31 août). <strong>Confirmez au <a class=\"tel\" href=\"tel:+33467817960\">04 67 81 79 60</a>.</strong> C'est précisément pour cette fermeture du lundi que cette journée a été placée un mardi.<br>La commune a fusionné : Google Maps peut afficher <em>Valleraugue</em> ou <em>Val-d'Aigoual</em>, c'est le même endroit."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Plan+d%27eau+du+Mouretou+Valleraugue", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.087193%2C3.606176", "txt": "Itinéraire · 44.087193, 3.606176"}]}]}, {"type": "trajet", "heure": "18h30", "html": "Plan d'eau du Mouretou → Le Vigan · par Valleraugue et la D986 · 26 km · <strong>40min</strong> &nbsp;·&nbsp; <strong>Total du jour : 2h13 de conduite, plus longue traite 50 min</strong>", "fin": "On se sèche", "vers": "le gîte du Vigan · 357 route de Ganges", "nav": "https://www.google.com/maps/dir/?api=1&destination=357+Route+de+Ganges%2C+30120+Le+Vigan", "alt": 245, "km": "26", "duree": "40min", "route": "par Valleraugue et la D986", "de_pt": "p8", "vers_pt": null, "de_lib": "Plan d'eau du Mouretou", "vers_lib": "Le Vigan", "de_alt": 700, "vers_alt": 245}, {"type": "eat", "heure": "19h30", "icone": "i-eat", "pt": null, "titre": "Apéro chez Feloni, puis dîner à la maison", "blocs": [{"t": "meta", "html": "Brasserie artisanale Feloni, Le Vigan · visite sur rendez-vous au <a class=\"tel\" href=\"tel:+33634573054\">06 34 57 30 54</a> · 245 m"}, {"t": "p", "html": "Vous avez marché le matin, vous êtes descendus sous terre l'après-midi et vous vous êtes baignés deux fois. Demain est la journée la plus tranquille de la semaine : le marché de Ganges le matin, puis l'eau tout l'après-midi. Une bière brassée à trois cents mètres du gîte, puis l'assiette du soir à la maison."}, {"t": "shop", "html": "<b>Au menu</b> — Assiette de pays : pélardons à différents affinages, charcuterie, tomates, melon, pain, et les confitures de châtaigne. <strong>Rien à préparer pour demain</strong> : vous achetez le déjeuner et le dîner au marché de Ganges en arrivant. Sortez juste la glacière et les pains de glace."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Brasserie Feloni", "href": "https://www.google.com/maps/search/?api=1&query=Brasserie+Feloni+Le+Vigan"}]}]}], "strip": [{"page": "https://commons.wikimedia.org/wiki/File:Panorama_du_Mont_Aigoual.JPG", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Panorama_du_Mont_Aigoual.JPG?width=800", "alt": "Massif de l'Aigoual", "cap": "Le massif de l'Aigoual, au-dessus de Camprieu"}, {"page": "https://commons.wikimedia.org/wiki/File:Entr%C3%A9e_de_l%27Ab%C3%AEme_de_Bramabiau.jpg", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Entr%C3%A9e_de_l%27Ab%C3%AEme_de_Bramabiau.jpg?width=800", "alt": "Sortie de la rivière souterraine", "cap": "Là où le Bonheur ressort du plateau"}], "notes": [{"cls": "note prep", "html": "<b>Ce soir, on prépare le marché.</b> Demain, départ à 9h30 pour Ganges : les Halles ouvrent à 7h30 et ferment à 14h30, et le vendredi c'est le gros marché, 180 stands. Vous y achetez <strong>deux repas d'un coup</strong> : le déjeuner du pont d'Issensac et le dîner de la cascade de la Vis. Sortez la glacière et les pains de glace ce soir, prenez des sacs, et des espèces — plusieurs producteurs ne prennent pas la carte. Maillots et serviettes accessibles : vous ne quitterez pas l'eau de la journée."}, {"cls": "note plan", "html": "<b>C'est la journée refuge.</b> Si un jour est classé rouge dans le Gard, permutez et faites celle-ci : Bramabiau est souterrain, le lac et les villages sont hors massif, et à 1100 m l'Aigoual ferme bien moins souvent que les garrigues basses."}], "alt_max": 1090, "alt_min": 1029, "rando": ["7,5 km", "+80 m"], "volant": "2h13", "chaud": {"texte": "<strong>Journée déjà en altitude, et l'abîme de Bramabiau est à 10 °C constants sous terre.</strong> C'est, avec l'Aigoual, la meilleure journée possible par canicule : la rando du Bonheur suit la rivière sous les hêtres, le lac de Camprieu est à 1 090 m, et la visite de l'après-midi se passe entièrement dans la roche. Ne changez rien.", "lieu": "Abîme de Bramabiau, 10 °C", "alt": 1090}, "geo": {"lat": 44.115051, "lon": 3.491544, "lab": "Camprieu", "alt": 1090}, "base": {"lat": 43.9902, "lon": 3.6183, "lab": "Le Vigan"}, "bonus": [{"k": "village", "titre": "Meyrueis", "meta": "706 m · 25 min de Camprieu", "txt": "Au confluent de trois rivières, au pied des gorges de la Jonte : arcades, vieux pont, tour de l'Horloge, et une vraie vie de village même en août. Le plus joli détour possible depuis Camprieu, et il ne coûte que 25 minutes.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Meyrueis%2C+48150"}]}, {"k": "rando", "titre": "De Meyrueis à la cascade de Salvinsac", "meta": "7,2 km · +299 m · 2h55 · ombragé", "txt": "Sentier ombragé du début à la fin, et une baignade à la cascade au bout. La meilleure combinaison marche-et-eau du secteur nord, et une des rares randos du coin balisées sur Decathlon Outdoor.", "liens": [{"cls": "l-do", "txt": "Decathlon Outdoor", "href": "https://www.decathlon-outdoor.com/fr-fr/explore/france/de-meyrueis-a-la-cascade-de-salvinsac-64b84642f1307"}]}, {"k": "rando", "titre": "Le château de Roquedols", "meta": "6,9 km · +158 m · 2h25 · départ parking de la piscine, Meyrueis", "txt": "« Immersion complète en forêt », un château Renaissance au milieu, et presque pas de dénivelé. La rando de repli quand les jambes disent non.", "liens": [{"cls": "l-vis", "txt": "Visorando", "href": "https://www.visorando.com/randonnee-boucle-du-chateau-de-roquedols-et-du-col/"}]}], "flex": {"ok": true, "why": "Aucune contrainte : ni marché, ni réservation.", "frais": "Rando le long du Bonheur sous les hêtres, lac à 1 090 m, puis l'abîme à 10 °C", "haut": 1090, "pas": {}}, "_lab": "Jeu 13", "_iso": "2026-08-13"}, {"id": "j6", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Pont_de_Saint-%C3%89tienne_d%27Issensac.JPG?width=1200", "alt": "Pont de Saint-Étienne d'Issensac", "cap": "Le pont roman de Saint-Étienne d'Issensac sur l'Hérault · <a href=\"https://commons.wikimedia.org/wiki/File:Pont_de_Saint-%C3%89tienne_d%27Issensac.JPG\">Wikimedia Commons</a>"}, "dt": "Vendredi 14 août", "titre": "Le marché de Ganges, un pont roman sur l'Hérault, et l'eau turquoise au crépuscule", "pitch": "Journée sans montre. Le matin, le grand marché du sud des Cévennes, celui où l'on achète pour la semaine suivante. L'après-midi, trois heures à ne rien faire au bord de l'Hérault, sous un pont de pierre du XI<sup>e</sup> siècle, avec une chapelle romane derrière les arbres. Et le soir, le coup de génie de la semaine : la cascade de la Vis à 18h30, quand les sept cents baigneurs du jour sont repartis et que la lumière dorée tombe sur une eau turquoise que vous croirez retouchée.", "tags": [{"cls": "t-marche", "txt": "Marché de Ganges"}, {"cls": "t-eau", "txt": "Deux baignades"}, {"cls": "t-tot", "txt": "1h40 de volant · max 35 min d'affilée"}], "etapes": [{"type": "trajet", "heure": "9h30", "html": "Le Vigan → Ganges · D999 · 20 km · <strong>25 min</strong>", "fin": "Départ", "vers": "Marché de Ganges", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Les+Halles+de+Ganges+34190", "alt": 175, "km": "20", "duree": "25min", "route": "D999", "de_pt": "b_j6_9", "vers_pt": "p19", "de_lib": "Le Vigan", "vers_lib": "Ganges", "de_alt": 245, "vers_alt": 175}, {"type": "marche", "heure": "10h00", "icone": "i-basket", "titre": "Marché de Ganges", "pt": "p19", "blocs": [{"t": "meta", "html": "170 m d'altitude · <strong>Les Halles de Ganges, du mardi au dimanche, 7h30 – 14h30</strong> · 1 rue Frédéric Mistral · marché couvert, donc à l'ombre"}, {"t": "p", "html": "Le grand marché du vendredi, plus large que celui du mardi : alimentaire, vêtements, quincaillerie. Ganges n'est pas un village mais une petite ville, avec des rues commerçantes vraiment vivantes et des <strong>halles couvertes</strong> au cœur."}, {"t": "access", "warn": true, "html": "<b>Ce que vous perdez, ce que vous gagnez</b> — Le très gros marché de Ganges, ses 180 stands et son ambiance de fête, c'est le <strong>vendredi</strong>. On l'a échangé contre le mardi parce que vendredi est annoncé caniculaire et que cette journée est la plus basse du séjour : il n'était pas raisonnable de la laisser tomber un jour à 38 °C. Vous gardez <strong>les Halles couvertes</strong>, ouvertes du mardi au dimanche avec leurs marchands permanents : primeurs bio, pélardons, miel, charcuterie, poissonnier, boucher, traiteur, boulanger. Et samedi 15, vous avez le marché du Vigan, qui est le plus beau du séjour."}, {"t": "p", "html": "Les adresses : la <strong>Brûlerie des Cévennes</strong> (torréfacteur), la <strong>Savonnerie de la Buèges</strong>, la <strong>boulangerie Garonne</strong>, la <strong>boucherie Copleux</strong>, <strong>Genthon — La Maison des Délices</strong>, et l'émailleuse-bijoutière <strong>Emmeline Rigal</strong>."}, {"t": "shop", "html": "<b>Ce qu'on achète ici</b> — le pique-nique de ce soir, qui se mangera au bord de la cascade : pain de campagne, terrine ou charcuterie, pélardons, tomates, melon, fruits. Plus deux bières de la Blacstar de Ganges. Et le petit-déjeuner de demain, jour de marché au Vigan."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Les+Halles+de+Ganges+34190", "txt": "Les Halles · fiche et avis"}]}]}, {"type": "trajet", "heure": "12h05", "html": "Ganges → Saint-Étienne d'Issensac, Brissac · D4 par Cazilhac · 11 km · <strong>15 min</strong>", "fin": "On plie les courses", "vers": "le pont d'Issensac, pour le pique-nique du marché", "nav": "https://www.google.com/maps/dir/?api=1&amp;destination=43.8441%2C3.70103", "alt": 90, "km": "11", "duree": "15min", "route": "D4 par Cazilhac", "de_pt": "p20", "vers_pt": "p21", "de_lib": "Ganges", "vers_lib": "Saint-Étienne d'Issensac, Brissac", "de_alt": 175, "vers_alt": 90}, {"type": "eat", "heure": "12h30", "icone": "i-eat", "titre": "Pique-nique du marché, au pont d'Issensac", "blocs": [{"t": "meta", "html": "Sur les berges de l'Hérault, sous le pont roman du XI<sup>e</sup> · à l'ombre · vous venez de faire le marché"}, {"t": "p", "html": "Vous sortez du plus beau marché du sud des Cévennes avec du pain, de la charcuterie, des pélardons et des tomates. Vous les mangez une demi-heure plus tard au bord de l'eau, sous un pont médiéval, avant trois heures de baignade. C'est mieux que n'importe quelle table du secteur."}, {"t": "access", "warn": true, "html": "<b>Ce que j'ai retiré</b> — Une version précédente vous envoyait manger un burger avenue du Mont Aigoual, dans la zone commerciale de Ganges. C'était une erreur de casting.<br><em>Si vous voulez vraiment vous asseoir :</em> <strong>La Cantine Bio Ensemble</strong> à Laroque, 945 avenue de l'Europe, cantine associative 100 % bio et végétarienne, menu qui change tous les jours à 15 €, chiens acceptés, ouverte le vendredi midi. 04 99 53 11 02. C'est militant, sincère, et à dix minutes."}, {"t": "shop", "html": "<b>À acheter au marché, une heure plus tôt</b> — Pain de campagne, terrine ou charcuterie de pays, deux pélardons, tomates, melon, fruits, et deux bières de la Blacstar de Ganges. Prenez le double : le dîner de ce soir se mange aussi dehors, au bord de la cascade."}]}, {"type": "eau", "heure": "14h15", "icone": "i-swim", "titre": "Aire de baignade de Saint-Étienne d'Issensac", "pt": "p21", "blocs": [{"t": "meta", "html": "Sur l'Hérault · gratuit · surveillée l'été · zones ombragées · 3h sur place"}, {"t": "p", "html": "Un vieux pont de pierre médiéval, une chapelle romane du XI<sup>e</sup>, des berges sauvages et des eaux calmes : le profil le plus rassurant du séjour, et l'endroit rêvé pour un long après-midi. Des <strong>éco-gardes</strong> sont présents tout l'été pour informer et accueillir."}, {"t": "access", "warn": true, "html": "<b>Stationnement : le point à ne pas rater</b> — Une <strong>aire de stationnement dédiée existe près du site, suivez les panneaux</strong>. Le <strong>stationnement en bord de route sur la D4 est interdit et verbalisé</strong>, c'est explicitement signalé par l'office de tourisme. Site Natura 2000. La surveillance est annoncée « en été » sans dates ni horaires publiés : ne comptez pas dessus, considérez la baignade comme non surveillée.<br>Ne confondez pas avec <em>Hérault-Anglas</em>, l'autre site de baignade de la commune de Brissac."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Pont+de+Saint-%C3%89tienne+d%27Issensac+Brissac", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=43.8441%2C3.70103", "txt": "Itinéraire · 43.8441, 3.70103"}]}]}, {"type": "trajet", "heure": "17h40", "html": "Saint-Étienne d'Issensac → Cascade de la Vis · par Ganges et Saint-Laurent-le-Minier · 26 km · <strong>35min</strong>", "fin": "On se sèche", "vers": "la cascade de la Vis, pour le dîner au coucher du soleil", "nav": "https://www.google.com/maps/dir/?api=1&destination=Cascade+de+la+Vis%2C+Saint-Laurent-le-Minier", "alt": 190, "km": "26", "duree": "35min", "route": "par Ganges et Saint-Laurent-le-Minier", "de_pt": "p21", "vers_pt": "p23", "de_lib": "Saint-Étienne d'Issensac", "vers_lib": "Cascade de la Vis", "de_alt": 90, "vers_alt": 190}, {"type": "eau", "heure": "18h45", "icone": "i-swim", "titre": "Cascade de la Vis, et pique-nique au coucher du soleil", "pt": "p23", "blocs": [{"t": "meta", "html": "Nom officiel : <em>cascade de la Meuse</em> · eau turquoise, vasques profondes, 16-20 °C · chien toléré en laisse"}, {"t": "p", "html": "<strong>C'est l'heure qui rend ce site fréquentable.</strong> Le lieu encaisse 42 000 personnes sur la saison, jusqu'à 700 le dimanche. À 14h un vendredi d'août c'est ingérable avec un chien ; à 18h45 les familles repartent, le parking se vide et la lumière devient dorée sur l'eau. Vous dînez du pique-nique de Ganges, les pieds dans la Vis."}, {"t": "access", "warn": true, "html": "<b>Tout ce qu'il faut savoir avant d'arriver</b><br>• <strong>Parking payant : 10 € la journée</strong>, 150 places, CB ou espèces, situé <strong>à 600 m du site</strong>. Le parking du glacier est réservé à ses clients.<br>• <strong>Le stationnement hors zone aménagée est strictement interdit et réellement verbalisé</strong> : 48 véhicules en infraction relevés sur 10 jours de comptage.<br>• <strong>Accès interdit de 22h à 6h</strong> — vous avez donc jusqu'à 22h.<br>• Baignade autorisée mais <strong>non surveillée</strong>. <strong>Interdiction d'approcher la cascade</strong>, en haut comme en bas. <strong>Sauts et plongeons interdits</strong>, depuis la cascade comme depuis le pont. Chutes de pierres près de l'aqueduc.<br>• Toilettes publiques sur le chemin d'accès, un glacier sur place.<br>• Saint-Laurent-le-Minier est un ancien site minier plombo-zincifère. L'eau est suivie par l'ARS, mais par précaution <strong>ne pique-niquez pas à même les sédiments et les terres</strong> : installez-vous sur les rochers ou une nappe.<br>• Ne confondez pas avec la « cascade de la Vis » de Navacelles, 25 km plus loin, que vous avez vue hier."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Cascade+de+la+Vis+Saint-Laurent-le-Minier", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=43.924925%2C3.662367", "txt": "Itinéraire · 43.924925, 3.662367"}, {"cls": "l-web", "href": "https://www.sudcevennes.com/vacances-cevennes/cascade-vis/", "txt": "Fiche office de tourisme"}]}]}, {"type": "trajet", "heure": "21h00", "html": "Saint-Laurent-le-Minier → Le Vigan · 20 km · <strong>25 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 1h40 de conduite, plus longue traite 35 min</strong>", "fin": "On se sèche", "km": "20", "duree": "25min", "route": "&nbsp; Total du jour : 2h de conduite", "de_pt": "p23", "vers_pt": null, "de_lib": "Saint-Laurent-le-Minier", "vers_lib": "Le Vigan", "de_alt": 190, "vers_alt": 245, "vers": "le gîte du Vigan · 357 route de Ganges", "nav": "https://www.google.com/maps/dir/?api=1&destination=357+Route+de+Ganges%2C+30120+Le+Vigan"}], "notes": [{"cls": "note prep", "html": "<b>Ce soir, on fait les valises.</b> Vous changez de base demain à 11h30, et vous attaquez le marché du Vigan à 9h30. Bouclez les sacs ce soir. Videz le frigo dans une glacière : la route vers Saint-Jean-du-Gard prend 2h avec les arrêts, et vous ne trouverez pas de supermarché ouvert en arrivant. <strong>Prévoyez aussi une glacière pour les achats du marché de demain</strong> : fromages et charcuterie ne supporteront pas quatre heures de voiture en août."}, {"cls": "note", "html": "<b>Feux d'artifice du 15 août :</b> aucun programme officiel n'est publié pour Le Vigan, Ganges ou Anduze, et la Lozère a déjà pris un arrêté suspendant les tirs pour risque incendie. Demandez à l'office de tourisme du Vigan en début de semaine."}, {"cls": "note plan", "html": "<b>Journée allégée</b> — La flânerie à Sumène est passée au lundi, dans la journée douce du chien. Vous gagnez vingt minutes de voiture et une heure de plus dans l'eau à Issensac, ce qui tombe bien : c'est la journée la plus basse du séjour et l'une des plus chaudes annoncées."}], "alt_max": 200, "alt_min": 90, "rando": null, "volant": "1h40", "chaud": {"texte": "<strong>C'est la journée la plus basse du séjour : Issensac est à 90 m.</strong> Elle reste au vendredi parce que c'est le jour du grand marché de Ganges, 180 stands, et que ça ne se déplace pas. Voici comment la rendre tenable au-delà de 34 °C. Le matin ne pose pas de problème : <strong>les Halles sont couvertes</strong>. Pour le reste, ne quittez pas l'eau. Arrivez à Issensac vers 12h30 et restez-y jusqu'à 17h : le pont roman fait de l'ombre sur la rive gauche toute l'après-midi. Sautez la flânerie à Sumène, qui est à découvert, et <strong>avancez la cascade de la Vis à 17h30</strong> au lieu de 18h45 : les vasques sont dans une gorge encaissée et il y fait plusieurs degrés de moins. Si c'est vraiment invivable, le repli d'altitude est le <strong>causse de Blandas à 615 m</strong>, à 40 minutes, avec l'Auberge ouverte le vendredi.", "lieu": "Gorge de la Vis, puis causse de Blandas", "alt": 615}, "geo": {"lat": 43.9787, "lon": 3.7169, "lab": "Sumène", "alt": 200}, "base": {"lat": 43.9902, "lon": 3.6183, "lab": "Le Vigan"}, "bonus": [{"k": "rando", "titre": "Le sentier de Valescure, Peyrolles", "meta": "11,3 km · +344 m · 4h · 25 min de Ganges", "txt": "Une petite vallée sauvage, des terrasses de pierre sèche, et les chiens en laisse explicitement mentionnés sur la fiche officielle. Départ au hameau de La Planque.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=44.106709%2C3.827795"}, {"cls": "l-gpx", "txt": "Trace GPX", "href": "https://www.tourismegard.com/fr/fiche/equipement/sentier-de-valescure-peyrolles_TFO6081707/"}]}, {"k": "eau", "titre": "Le pont du Hasard, Sumène", "meta": "10 min de Sumène · 200 m", "txt": "Vasque profonde sur le Rieutord, sous un vieux pont en dos d'âne. Beaucoup plus discret que Saint-Étienne d'Issensac, et à l'ombre l'après-midi. Ni surveillé ni aménagé : chaussures fermées et prudence sur les rochers.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Pont+du+Hasard%2C+Sum%C3%A8ne+30440"}]}], "flex": {"ok": false, "why": "Le grand marché de Ganges est le vendredi matin, sous les Halles, et c'est le plus gros du secteur.", "frais": "Issensac est à 90 m, le point le plus bas du séjour, mais les Halles sont couvertes et l'eau est partout", "haut": 200, "pas": {}}, "_lab": "Mar 11", "_iso": "2026-08-11"}, {"id": "j7", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Saint-Jean-du-Gard_-_Vue_de_Saint-Roman.jpg?width=1200", "alt": "Saint-Jean-du-Gard", "cap": "Saint-Jean-du-Gard vu de Saint-Roman · <a href=\"https://commons.wikimedia.org/wiki/File:Saint-Jean-du-Gard_-_Vue_de_Saint-Roman.jpg\">Wikimedia Commons</a>"}, "dt": "Samedi 15 août · changement de base", "titre": "Le plus beau marché du séjour, la vallée Borgne, et on s'installe avant le soir", "pitch": "Le marché du Vigan à 9h30, le plus beau des deux, et vous chargez tout. Ensuite on roule : la vallée Borgne, un pique-nique au bord du Gardon à L'Estréchure pour couper, et vous êtes installés au col de Lamira à 14h20. L'après-midi est libre, et elle se passe dans l'eau à Saumane, sur le seul site surveillé de la semaine 2. Vous dînez chez vous, dans une maison déjà rangée.", "tags": [{"cls": "t-marche", "txt": "Marché du Vigan"}, {"cls": "t-village", "txt": "L'Estréchure"}, {"cls": "t-eau", "txt": "Baignade surveillée"}, {"cls": "t-visite", "txt": "Changement de base"}, {"cls": "t-tot", "txt": "2h10 de volant · max 45 min d'affilée"}], "etapes": [{"type": "marche", "heure": "9h30", "icone": "i-basket", "titre": "Marché du Vigan", "pt": "p24", "blocs": [{"t": "meta", "html": "8h-12h30 · Place du Marché, le Quai, les halles, le parvis de la mairie · plus de 80 étals · à pied depuis le gîte"}, {"t": "p", "html": "Le marché « complet » de la vallée. Maraîchers, <strong>pélardons AOP</strong>, <strong>oignons doux des Cévennes AOP</strong>, châtaignes transformées, miels de châtaignier et de bruyère, <strong>Reinette du Vigan</strong>, et la <strong>brasserie d'Avèze</strong> qui y tient un stand."}, {"t": "shop", "html": "<b>La grosse course de la semaine 2</b> — pélardons (frais et affinés), oignons doux, charcuterie de pays, miel de châtaignier, farine de châtaigne, confiture, fruits et légumes pour trois jours, pain, bières d'Avèze. Plus <strong>de quoi pique-niquer ce midi</strong> : pain, terrine, tomates, melon, fromage. <strong>Glacière obligatoire.</strong>"}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Place+du+March%C3%A9+30120+Le+Vigan", "txt": "Fiche et avis"}]}]}, {"type": "home", "heure": "11h00", "icone": "i-home", "titre": "Check-out et chargement", "blocs": []}, {"type": "trajet", "heure": "11h30", "html": "Le Vigan → L'Estréchure · D999 jusqu'à Pont-d'Hérault, puis D907 dans la vallée Borgne · 35 km · <strong>45min</strong>", "fin": "Fin du marché", "vers": "L'Estréchure, pour couper la route et déjeuner", "nav": "https://www.google.com/maps/dir/?api=1&destination=L%27Estr%C3%A9chure%2C+30124", "alt": 260, "km": "35", "duree": "45min", "route": "D999 jusqu'à Pont-d'Hérault, puis D907 dans la vallée Borgne", "de_pt": null, "vers_pt": "p25", "de_lib": "Le Vigan", "vers_lib": "L'Estréchure", "de_alt": 245, "vers_alt": 260}, {"type": "village", "heure": "12h15", "icone": "i-village", "titre": "Pique-nique du marché à L'Estréchure, au bord du Gardon", "pt": "p25", "blocs": [{"t": "meta", "html": "260 m d'altitude · 1h · au bord du Gardon Saint-Jean, à l'entrée de la vallée Borgne"}, {"t": "p", "html": "Le premier village de la vallée Borgne, et surtout la bonne coupure : vous avez quarante-cinq minutes de route derrière vous et autant devant. Sortez la glacière, installez-vous au bord de l'eau à l'ombre des platanes, et laissez le chien se dégourdir. Le pain, la terrine, les tomates et le melon sortent du marché du Vigan, achetés il y a deux heures."}, {"t": "access", "html": "<b>Où se garer</b> — Place du village, gratuit, puis cent mètres à pied jusqu'aux berges. Fontaine sur la place pour remplir les gourdes et la gamelle."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=L%27Estr%C3%A9chure%2C+30124"}]}]}, {"type": "trajet", "heure": "13h30", "html": "L'Estréchure → col de Lamira · D907 par Peyrolles et Saint-Jean-du-Gard, puis la petite route du col · 30 km · <strong>45min</strong>", "fin": "Fin du pique-nique", "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115%2C3.895", "alt": 400, "km": "30", "duree": "45min", "route": "D907 par Peyrolles et Saint-Jean-du-Gard, puis la petite route du col", "de_pt": "p25", "vers_pt": "p29", "de_lib": "L'Estréchure", "vers_lib": "col de Lamira", "de_alt": 260, "vers_alt": 400}, {"type": "home", "heure": "14h20", "icone": "i-home", "titre": "Installation au col de Lamira", "pt": "p29", "blocs": [{"t": "meta", "html": "Mas de Cros Viel, au-dessus de Saint-Jean-du-Gard"}, {"t": "note", "html": "<b>Vous avez l'après-midi devant vous</b> — déchargez, videz la glacière dans le frigo, faites le tour du mas, et prenez une heure de rien. La baignade surveillée de Saumane est à vingt minutes et le poste de secours tient jusqu'à 18h30."}, {"t": "p", "html": "Route d'accès étroite et sinueuse : comptez systématiquement <strong>10 à 15 minutes</strong> pour redescendre en ville, et intégrez-les à tous les horaires de la semaine."}]}, {"type": "trajet", "heure": "16h30", "html": "Col de Lamira → Saumane, baignade « Le Village » · la D907 en redescendant · 14 km · <strong>20min</strong>", "fin": "Fin de l'installation", "vers": "Saumane, la seule baignade surveillée de la semaine", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.118462%2C3.763789", "alt": 300, "km": "14", "duree": "20min", "route": "la D907 en redescendant", "de_pt": null, "vers_pt": "p7s", "de_lib": "Col de Lamira", "vers_lib": "Saumane, baignade « Le Village »", "de_alt": 400, "vers_alt": 300}, {"type": "eau", "heure": "17h00", "icone": "i-swim", "pt": "p7s", "titre": "Baignade surveillée — « Le Village », Saumane", "blocs": [{"t": "meta", "html": "300 m d'altitude · <strong>surveillée tous les jours 13h30 – 18h30 du 20 juillet au 24 août</strong> · parking gratuit · aire de pique-nique · 1h30 sur place"}, {"t": "p", "html": "<strong>Le seul site de baignade surveillé de toute la semaine 2</strong>, et il est à vingt minutes de votre nouvelle base. Une plage de galets sur le Gardon de Saint-Jean, de l'eau claire, des arbres sur la rive. C'est la bonne façon de finir un jour de déménagement : vous avez déjà tout rangé, il ne reste qu'à se baigner."}, {"t": "access", "html": "<b>Accès</b> — Traversez le village, le parking est fléché « baignade », gratuit. Aire de pique-nique et toilettes sur place. Mairie de Saumane : <a class=\"tel\" href=\"tel:+33466839142\">04 66 83 91 42</a>."}, {"t": "note", "html": "<b>Le chien</b> — Berges accessibles et ombragées en amont du poste de secours. Comme partout, il n'entre pas dans la zone surveillée aux heures de pointe : installez-vous vingt mètres plus haut."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Itinéraire · 44.118462, 3.763789", "href": "https://www.google.com/maps/dir/?api=1&destination=44.118462%2C3.763789"}]}]}, {"type": "trajet", "heure": "18h45", "html": "Saumane → col de Lamira · la petite route du col · 14 km · <strong>20min</strong> &nbsp;·&nbsp; <strong>Total du jour : 2h10 de conduite, plus longue traite 45 min</strong>", "fin": "On se sèche", "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115%2C3.895", "alt": 400, "km": "14", "duree": "20min", "route": "la petite route du col", "de_pt": "p7s", "vers_pt": null, "de_lib": "Saumane", "vers_lib": "col de Lamira", "de_alt": 300, "vers_alt": 400}, {"type": "eat", "heure": "20h00", "icone": "i-eat", "titre": "Dîner à la maison", "blocs": [{"t": "shop", "html": "<b>Au menu</b> — Tartines de pélardon frais aux oignons doux crus et au miel de châtaignier, passées deux minutes sous le gril, avec une grande salade et le melon du marché. Tout vient du marché du Vigan de ce matin.<br><em>Si vous préférez sortir</em> : le <strong>marché nocturne « Les Dimanches Artisans »</strong> est demain soir, pas ce soir. Les tables de Saint-Jean-du-Gard sont prises un 15 août — restez à la maison, vous avez de quoi."}]}], "notes": [{"cls": "note plan", "html": "<b>Option soirée pour les courageux :</b> les <strong>Festa's de Florac</strong> (14, 15 et 16 août, parc Maury) sont la grande fête du 15 août dans votre rayon — orchestre, olympiades, taureaux-piscine, repas, manouls. Mais c'est <strong>1h10 de route à l'aller et autant au retour</strong>, un jour de déménagement. Gardez-la éventuellement pour dimanche."}, {"cls": "note prep", "html": "<b>Ce soir, on prépare demain.</b> Rien de lourd : départ 9h30, visite du Musée du Désert au Mas Soubeyran, puis le village de Mialet. <strong>Le déjeuner est un pique-nique au bord du Gardon, aux Plans</strong> — préparez-le ce soir avec ce qui reste du marché du Vigan, il n'y a aucune table à 4,5 ouverte le dimanche à Mialet. La rando du soir part à 17h15 : remplissez les gourdes, vous ne repasserez pas par la maison entre la baignade et la marche."}], "alt_max": 400, "alt_min": 197, "rando": null, "volant": "2h10", "chaud": {"texte": "<strong>Jour de déménagement, et c'est justement pour ça qu'on part tôt.</strong> Vous êtes au frais au marché couvert le matin, à l'ombre au bord du Gardon à midi, et installés à 400 m au début de l'après-midi. La baignade de Saumane est surveillée jusqu'à 18h30 : décalez-la à 17h30 si le thermomètre s'emballe, l'eau du Gardon reste fraîche. Et ne laissez jamais la glacière dans la voiture pendant l'arrêt de L'Estréchure.", "lieu": "Baignade surveillée de Saumane", "alt": 400}, "geo": {"lat": 44.16251, "lon": 3.671703, "lab": "St-André-de-Valborgne", "alt": 470}, "base": {"lat": 43.9902, "lon": 3.6183, "lab": "Le Vigan"}, "bonus": [{"k": "village", "titre": "Saint-André-de-Valborgne et les gorges de Capoue", "meta": "45 min du mas · 450 m · le plus authentique des villages du séjour", "txt": "C'était dans le programme avant que l'on décide d'arriver avant le soir, et ça reste entièrement faisable un autre après-midi de la semaine 2. Village de schiste au fond de la vallée Borgne, <strong>L'Auberge des Rigondettes</strong> à 4,5 sur 82 avis, et les gorges de Capoue à dix minutes avec leurs vasques et le Rocher des Fées. Comptez 1h30 de route aller-retour depuis le col.", "liens": [{"cls": "l-map", "txt": "Saint-André-de-Valborgne", "href": "https://www.google.com/maps/dir/?api=1&destination=Saint-Andr%C3%A9-de-Valborgne%2C+30940"}, {"cls": "l-map", "txt": "Gorges de Capoue", "href": "https://www.google.com/maps/dir/?api=1&destination=Gorges+de+Capoue%2C+Saint-Andr%C3%A9-de-Valborgne+30940"}]}, {"k": "rando", "titre": "Le sentier de l'Exil, Saumane", "meta": "12,9 km · +428 m · 4h30", "txt": "L'ancienne route royale vers la Lozère, avec les ornières de charrettes encore creusées dans la roche. Topo à 5 € à l'office de Saint-André-de-Valborgne. Elle part du village où vous vous baignez.", "liens": [{"cls": "l-gpx", "txt": "Trace GPX", "href": "https://www.tourismegard.com/fr/fiche/equipement/sentier-de-l-exil-saumane_TFO6082080/"}]}], "flex": {"ok": false, "why": "Changement de base, et le marché du Vigan est le samedi.", "frais": "Rocher des Fées à 470 m, berges ombragées", "haut": 470, "pas": {}}, "_lab": "Sam 15", "_iso": "2026-08-15"}, {"id": "j8", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Mialet-Pont_des_Camisards-20120901.jpg?width=1200", "alt": "Pont des Camisards, Mialet", "cap": "Le pont des Camisards sur le Gardon de Mialet · <a href=\"https://commons.wikimedia.org/wiki/File:Mialet-Pont_des_Camisards-20120901.jpg\">Wikimedia Commons</a>"}, "dt": "Dimanche 16 août", "titre": "Les Camisards le matin, le Gardon l'après-midi, une rando au soleil couchant", "pitch": "Le Mas Soubeyran est le hameau natal de Roland, chef camisard, et son musée raconte cent ans de résistance protestante clandestine dans ces vallées. Vous en ressortirez avec la clé de tout ce que vous verrez ensuite : les temples octogonaux, les chemins de traverse, les crêtes. L'après-midi appartient au Gardon de Mialet, une eau classée « excellente » entre des plages de galets. Et à 17h15, quand la chaleur retombe, six kilomètres qui longent la rivière presque en permanence, avec le pont des Camisards de 1714 au milieu.", "tags": [{"cls": "t-visite", "txt": "Musée du Désert 7 €"}, {"cls": "t-eau", "txt": "Baignade"}, {"cls": "t-rando", "txt": "Rando du soir 6,4 km"}, {"cls": "t-marche", "txt": "Nocturne artisans"}, {"cls": "t-tot", "txt": "1h20 de volant"}], "etapes": [{"type": "trajet", "heure": "9h30", "html": "Col de Lamira → Mas Soubeyran, Mialet · 15 km · <strong>25 min</strong>", "fin": "Départ", "vers": "Musée du Désert", "nav": "https://www.google.com/maps/dir/?api=1&amp;destination=44.095654%2C3.957169", "alt": 180, "km": "15", "duree": "25min", "route": "", "de_pt": "b_j8_9", "vers_pt": "p31", "de_lib": "Col de Lamira", "vers_lib": "Mas Soubeyran, Mialet", "de_alt": 400, "vers_alt": 180}, {"type": "visit", "heure": "9h55", "icone": "i-ticket", "titre": "Musée du Désert, Mas Soubeyran", "pt": "p31", "blocs": [{"t": "meta", "html": "Tous les jours 9h30-18h30 jusqu'au 15 septembre · adulte 7 €, senior 6 € · visite guidée sans supplément · <a class=\"tel\" href=\"tel:+33466850272\">04 66 85 02 72</a>"}, {"t": "p", "html": "Une vingtaine de salles et 3 000 objets sur les Huguenots, les Camisards et la période du Désert (1685-1787), dans une maison cévenole authentique. C'est l'un des lieux de mémoire les plus forts de la région."}, {"t": "access", "warn": true, "html": "<b>Le créneau est contraint</b> — <strong>Aucune visite guidée ne part entre 11h et 14h30 en période estivale.</strong> D'où l'arrivée à 9h55 : vous attrapez le dernier départ du matin, et la visite dure 1h15. <strong>La politique chien n'est publiée nulle part : appelez avant de partir.</strong> Si c'est non, le hameau et ses ruelles se visitent librement et vous vous relayez."}, {"t": "access", "warn": false, "html": "<b>Stationnement</b> — C'est le point le plus fiable de tout le séjour : <strong>parking gratuit, dimensionné pour voitures, autocars et camping-cars</strong>, aires de pique-nique confirmées, salle climatisée. Aucune marche."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Mus%C3%A9e+du+D%C3%A9sert+Mas+Soubeyran+Mialet", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.095654%2C3.957169", "txt": "Itinéraire · 44.095654, 3.957169"}, {"cls": "l-web", "href": "https://www.museedudesert.com/", "txt": "museedudesert.com"}]}]}, {"type": "trajet", "heure": "11h10", "html": "Mas Soubeyran → Village de Mialet · 3 km · <strong>6min</strong> · route du Mas Soubeyran", "fin": "Fin de la visite", "vers": "Village de Mialet", "nav": "https://www.google.com/maps/search/?api=1&query=Pont+des+Camisards+Mialet", "alt": 150, "km": "3", "duree": "6min", "route": "route du Mas Soubeyran", "de_pt": null, "vers_pt": null, "de_lib": "Mas Soubeyran", "vers_lib": "Village de Mialet", "de_alt": 180, "vers_alt": 150}, {"type": "village", "heure": "11h15", "icone": "i-village", "titre": "Le hameau, puis le village de Mialet", "pt": "p32", "blocs": [{"t": "meta", "html": "1h"}, {"t": "p", "html": "Le <strong>pont des Camisards</strong>, classé Monument Historique, enjambe le Gardon d'un seul jet : c'est l'image du village. L'<strong>église Saint-André</strong> du XVII<sup>e</sup> et le <strong>temple</strong> reconstruit au XIX<sup>e</sup> avec son intérieur octogonal se font face — toute l'histoire protestante des Cévennes tient en deux cents mètres. Vallée classée Natura 2000, avec castors et loutres."}, {"t": "p", "html": "<em>Aucun commerce de village référencé à Mialet : ne prévoyez pas de courses ici.</em>"}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Pont+des+Camisards+Mialet+30140", "txt": "Fiche et avis"}]}]}, {"type": "trajet", "heure": "", "html": "Mialet → Le Pradinas · 3 km · <strong>6 min</strong>", "fin": "Fin de la flânerie", "vers": "les berges des Plans, pour le pique-nique", "nav": "https://www.google.com/maps/dir/?api=1&destination=Les+Plans%2C+30140+Mialet", "alt": 180, "km": "3", "duree": "6min", "route": "", "de_pt": "p32", "vers_pt": "p33", "de_lib": "Mialet", "vers_lib": "Les Plans, Mialet", "de_alt": 150, "vers_alt": 180}, {"type": "eat", "heure": "12h30", "icone": "i-eat", "titre": "Pique-nique au bord du Gardon, aux Plans", "pt": "p33", "blocs": [{"t": "meta", "html": "180 m d'altitude · sur les berges, juste avant la baignade"}, {"t": "p", "html": "Vous sortez du Mas Soubeyran et du village de Mialet. Installez-vous sur les dalles des Plans, à l'ombre des platanes, et baignez-vous juste après. Les courses sont faites d'hier soir."}, {"t": "access", "warn": true, "html": "<b>Changement</b> — Le Pradinas était prévu ici : <strong>4,2 sur TripAdvisor</strong>, sous votre seuil. Le restaurant des Plans juste à côté fait karaoké en juillet-août, ce n'est pas ce que vous cherchez. Les deux tables du secteur qui tiennent 4,5 sont à Anduze et ferment le dimanche. On mange donc au bord de l'eau, et honnêtement c'est mieux."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Les+Plans%2C+30140+Mialet"}]}]}, {"type": "eau", "heure": "14h15", "icone": "i-swim", "titre": "Baignade — Les Plans, Gardon de Mialet", "pt": "p34", "blocs": [{"t": "meta", "html": "Eau classée « excellente » · non surveillé · 2h30 sur place"}, {"t": "access", "warn": false, "html": "<b>Accès et stationnement, précisément</b> — Sur la <strong>D50</strong>, traversez le village de Mialet et continuez <strong>environ 100 m après le restaurant Les Plans</strong> : un <strong>petit chemin sur la gauche descend vers la berge</strong>, et le stationnement se fait <strong>sur la gauche, juste avant ce chemin</strong>. Gratuit, quelques dizaines de mètres de descente.<br><strong>Le vrai conseil</strong> : le site s'étale sur plusieurs centaines de mètres, et <strong>les berges d'entrée sont bondées</strong>. Marchez cinq minutes vers l'amont ou l'aval et vous aurez un coin à vous. Le restaurant Les Plans est sur place ; pas de toilettes publiques documentées."}, {"t": "access", "warn": true, "html": "<b>Si c'est plein</b> — Repli à 3 km : le <strong>Pont des Abarines</strong> (44.125952, 3.90343), une arche de 30 m de 1900, avec des vasques et des plages de sable. Mais <strong>une douzaine de places de stationnement seulement</strong> de part et d'autre du pont, un sentier de moins de 10 min décrit comme « un peu raide et chaotique », et une proximité de propriété privée : restez sur le chemin. Un dimanche d'août à 14h, ce sera plein aussi. Dernier repli : la plage de <strong>Falguière</strong>, à 10 min de votre base."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Baignade+Les+Plans+Mialet", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.120764%2C3.918979", "txt": "Itinéraire · 44.120764, 3.918979"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Le+Pont+des+Abarines+Mialet", "txt": "Abarines · fiche et avis"}]}]}, {"type": "trajet", "heure": "", "html": "Les Plans → cimetière de Mialet · 3 km · <strong>6 min</strong>", "fin": "On se sèche", "vers": "du soir : Les berges du Gardon", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Cimeti%C3%A8re+de+Mialet+30140", "alt": 150, "km": "3", "duree": "6min", "route": "", "de_pt": "p34", "vers_pt": "p35", "de_lib": "Les Plans", "vers_lib": "cimetière de Mialet", "de_alt": 160, "vers_alt": 150}, {"type": "rando", "heure": "17h15", "icone": "i-hike", "titre": "Rando du soir : Les berges du Gardon", "pt": "p35", "blocs": [{"t": "meta", "html": "6,4 km · +151 m · 2h · facile · balisage jaune · départ du parking près du cimetière de Mialet"}, {"t": "p", "html": "La sortie parfaite en fin de journée : elle <strong>longe le Gardon presque en permanence</strong>, donc accès à l'eau constant pour le chien, avec la lumière rasante sur les galets. Elle repasse par le pont des Camisards, où « il y a des coins de baignade agréables de part et d'autre ». Traces de castors et de loutres."}, {"t": "access", "warn": false, "html": "<b>Stationnement</b> — Le parking près du cimetière de Mialet est confirmé mot pour mot par la fiche du Parc national. Départ immédiat, balisage jaune plus poteaux directionnels. Gratuit selon toute vraisemblance, capacité non documentée."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Cimeti%C3%A8re+de+Mialet+30140", "txt": "Fiche et avis"}, {"cls": "l-trk", "href": "https://geotrek-admin.cevennes-parcnational.net/api/fr/treks/98912/les-berges-du-gardon.gpx", "txt": "Télécharger le GPX"}, {"cls": "l-web", "href": "https://destination.cevennes-parcnational.fr/trek/98912-Les-berges-du-Gardon", "txt": "Fiche officielle"}]}]}, {"type": "trajet", "heure": "", "html": "Mialet → avenue Boudon, Saint-Jean-du-Gard · 14 km · <strong>25 min</strong>", "fin": "Fin de la rando", "vers": "aux « Dimanches Artisans »", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Avenue+Ren%C3%A9+Boudon+Saint-Jean-du-Gard", "alt": null, "km": "14", "duree": "25min", "route": "", "de_pt": "p35", "vers_pt": null, "de_lib": "Mialet", "vers_lib": "avenue Boudon, Saint-Jean-du-Gard", "de_alt": 150, "vers_alt": 197}, {"type": "marche", "heure": "19h45", "icone": "i-basket", "titre": "Dîner aux « Dimanches Artisans »", "blocs": [{"t": "meta", "html": "Avenue Boudon, Saint-Jean-du-Gard · 19h-23h30 · une vingtaine de stands d'artisans et créateurs, producteurs, arts de rue"}, {"t": "p", "html": "Vous dînez sur place. C'est aussi le bon moment pour repérer les artisans que vous irez voir mardi en Grand Rue."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Avenue+Ren%C3%A9+Boudon+Saint-Jean-du-Gard", "txt": "Avenue Boudon"}]}]}, {"type": "trajet", "heure": "21h30", "html": "Saint-Jean-du-Gard → col de Lamira · 6 km · <strong>12 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 1h20 de conduite</strong>", "fin": "On plie les courses", "km": "6", "duree": "12min", "route": "&nbsp; Total du jour : 1h20 de conduite", "de_pt": "b_j8_21", "vers_pt": null, "de_lib": "Saint-Jean-du-Gard", "vers_lib": "col de Lamira", "de_alt": 197, "vers_alt": 400, "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115%2C3.895"}], "strip": [{"page": "https://commons.wikimedia.org/wiki/File:Le_gardon_de_Mialet.jpg", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Le_gardon_de_Mialet.jpg?width=800", "alt": "Gardon de Mialet", "cap": "Le Gardon de Mialet et ses vasques"}, {"page": "https://commons.wikimedia.org/wiki/File:Les_100_000_soldats_-_Grotte_de_Trabuc_-_Gard_-_France.jpg", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Les_100_000_soldats_-_Grotte_de_Trabuc_-_Gard_-_France.jpg?width=800", "alt": "Grotte de Trabuc", "cap": "Les 100 000 soldats, grotte de Trabuc"}], "notes": [{"cls": "note", "html": "<b>La grotte de Trabuc</b>, à 5 min du Mas Soubeyran, a des concrétions spectaculaires appelées « les 100 000 soldats ». Mais <strong>seuls les animaux portés dans les bras sont admis</strong> ; les grands chiens attendent dehors, attachés, avec une gamelle fournie sur demande — sauf que <strong>le parking n'est ombragé que jusqu'à 13h</strong>. Si vous y tenez, ce sera à l'ouverture (9h45) et en visite alternée. Sinon, sautez."}, {"cls": "note prep", "html": "<b>Ce soir, on prépare demain.</b> Grosse journée sur la Corniche : 3h30 de marche sur une crête, sans aucun point d'eau, et un déjeuner à 14h15. Préparez <strong>un en-cas costaud</strong> (fruits secs, barres, un sandwich à partager), <strong>3 L d'eau plus 2 L pour le chien</strong>, et les <strong>chaussures montantes</strong> : la fiche officielle parle de passages vertigineux sur crête schisteuse. Et préparez <strong>un vrai pique-nique</strong> : vous mangerez sur la crête, il n'y a rien au col et rien de fiable en redescendant."}], "alt_max": 180, "alt_min": 150, "rando": ["6,4 km", "+151 m"], "volant": "1h20", "chaud": {"texte": "<strong>Mialet est à 150 m et le Mas Soubeyran n'a pas un arbre.</strong> Inversez : musée du Désert à l'ouverture à 9h30, village de Mialet dans la foulée, puis <strong>le Gardon de 12h à 18h</strong> sans en sortir. Si c'est encore trop, <strong>la grotte de Trabuc est à 10 minutes et il y fait 14 °C</strong> : l'un de vous visite pendant que l'autre reste au frais avec le chien, puis vous permutez. La rando du soir sur les berges se fait très bien à 19h.", "lieu": "Grotte de Trabuc, 14 °C", "alt": 200}, "geo": {"lat": 44.095654, "lon": 3.957169, "lab": "Mas Soubeyran", "alt": 180}, "base": {"lat": 44.115, "lon": 3.895, "lab": "Col de Lamira"}, "bonus": [{"k": "visit", "titre": "La grotte de Trabuc", "meta": "14 °C constants · 1h de visite · 10 min de Mialet", "txt": "Les « 100 000 soldats », une armée de concrétions minuscules dont personne n'explique vraiment la formation, et le lac de Minuit. <strong>C'est le refuge frais du secteur.</strong> Grand parking gratuit devant l'accueil.", "warn": "Pour le chien : seuls les petits animaux portés en sac sont admis. Un chien de taille moyenne attend dehors, en laisse, avec de l'eau fournie sur demande. À ne faire que si l'un de vous reste avec lui.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Grotte+de+Trabuc%2C+30140+Mialet"}, {"cls": "l-web", "txt": "Site officiel", "href": "https://grotte-de-trabuc.com/"}]}, {"k": "rando", "titre": "Le sentier de Roquefeuille, Mialet", "meta": "13 km · +632 m · 5h · la plus exigeante", "txt": "Anciens chemins camisards, audioguide disponible, et un vrai dénivelé. <strong>Uniquement un jour frais et en partant tôt</strong>, ce n'est pas une rando d'après-midi d'août avec un chien.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=44.111382%2C3.942653"}, {"cls": "l-gpx", "txt": "Trace GPX", "href": "https://www.tourismegard.com/fr/fiche/equipement/randonnee-sentier-de-roquefeuille-mialet_TFO7012331/"}]}], "flex": {"ok": false, "why": "Les Dimanches Artisans de Saint-Jean n'ont lieu que le dimanche soir.", "frais": "Mialet à 150 m, mais le Gardon est là toute l'après-midi", "haut": 180, "pas": {}}}, {"id": "j9", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/271_Corniche_des_C%C3%A9vennes_Panorama_entre_Saint-Jean-du-Gard_et_Florac.JPG?width=1200", "alt": "Corniche des Cévennes", "cap": "La Corniche des Cévennes entre Saint-Jean-du-Gard et Florac · <a href=\"https://commons.wikimedia.org/wiki/File:271_Corniche_des_C%C3%A9vennes_Panorama_entre_Saint-Jean-du-Gard_et_Florac.JPG\">Wikimedia Commons</a>"}, "dt": "Lundi 17 août", "titre": "La Corniche au matin, Castelviel, et la Vallée Française", "pitch": "La plus belle route des Cévennes part de votre porte. Elle suit la ligne de crête entre deux vallées, sur une frontière géologique où les murs deviennent calcaires et les toits restent en lauze de schiste. Vous la prenez au matin, arrêt au Pompidou quand l'air est encore frais. Au milieu, une boucle de trois heures et demie sur une arête d'où l'on voit d'un seul regard la vallée de Trabassac, la Corniche et le Mont Aigoual. Puis le Gardon cristallin de la Vallée Française pour se remettre, un village qui raconte ses commerces d'autrefois sur un sentier balisé, et un retour par le bas de la vallée, avec une heure à flâner dans Saint-Jean-du-Gard avant la table.", "tags": [{"cls": "t-rando", "txt": "Rando 8,4 km · +390 m"}, {"cls": "t-route", "txt": "Route de crête"}, {"cls": "t-eau", "txt": "Gardon de Sainte-Croix"}, {"cls": "t-village", "txt": "Le Pompidou · Sainte-Croix · Saint-Jean"}, {"cls": "t-tot", "txt": "2h30 de volant · max 52 min d'affilée"}], "etapes": [{"type": "trajet", "heure": "9h30", "html": "Col de Lamira → Le Pompidou · Saint-Jean-du-Gard, col Saint-Pierre, puis la Corniche des Cévennes · 34 km · <strong>52 min</strong>, et la route est déjà le spectacle", "fin": "Départ", "vers": "Le Pompidou, par la Corniche des Cévennes", "nav": "https://www.google.com/maps/dir/?api=1&destination=Le+Pompidou%2C+48110", "alt": 800, "km": "34", "duree": "52min", "route": "Saint-Jean-du-Gard, col Saint-Pierre, puis la Corniche des Cévennes", "de_pt": "b_j9_9", "vers_pt": "p39", "de_lib": "Col de Lamira", "vers_lib": "Le Pompidou", "de_alt": 400, "vers_alt": 800}, {"type": "village", "heure": "10h25", "icone": "i-village", "titre": "Le Pompidou, au point haut de la Corniche", "pt": "p39", "blocs": [{"t": "meta", "html": "800 m d'altitude · 30 min"}, {"t": "p", "html": "Posé sur un col, exactement à la <strong>frontière géologique</strong> entre les vallées schisteuses et le plateau calcaire — et ça se lit dans le bâti : <strong>murs de calcaire, toits de lauze de schiste</strong>. À 1 km, l'église romane Saint-Flour, classée, réputée pour son acoustique. Le <strong>Champ de l'Aultre</strong> offre l'un des plus remarquables panoramas de toute la Corniche."}, {"t": "p", "html": "Épicerie et dépôt de pain <strong>Au Comptoir de la Corniche</strong>, restaurant Le Cuisinier, point d'information du Parc national."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Le+Pompidou+48110", "txt": "Fiche et avis"}]}]}, {"type": "trajet", "heure": "10h50", "html": "Le Pompidou → col de Castelviel · D983 en descente, Sainte-Croix, puis la petite D28 · 16 km · <strong>28 min</strong>", "fin": "Fin de la pause au Pompidou", "vers": "le col de Castelviel, départ de la rando", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Saint-Martin-de-Lansuscle+48110", "alt": 800, "km": "16", "duree": "28min", "route": "D983 en descente, Sainte-Croix, puis la petite D28", "de_pt": "p39", "vers_pt": "p36", "de_lib": "Le Pompidou", "vers_lib": "col de Castelviel", "de_alt": 800, "vers_alt": 800}, {"type": "rando", "heure": "11h20", "icone": "i-hike", "titre": "Rando : Castelviel", "pt": "p36", "blocs": [{"t": "meta", "html": "8,4 km · +387 m · 3h30 · boucle · balisage jaune · difficulté moyenne · 800 m d'altitude"}, {"t": "p", "html": "Une ligne de crête avec des panoramas sur la vallée de Trabassac, la Corniche et le Mont Aigoual. Versant nord en forêt de feuillus et de conifères, versant sud-ouest en chênes verts plus exposé : <strong>faites la boucle dans le sens qui vous met le versant nord au retour</strong>, quand il fera chaud. Vestiges d'un poste de guet du réseau Anduze-Florac."}, {"t": "p", "html": "<strong>Pique-nique en route</strong>, préparé hier soir : il n'y a rien au col, et la seule table de la vallée n'ouvre pas à l'heure où vous redescendrez."}, {"t": "access", "warn": true, "html": "<b>Trois avertissements réels</b><br>• <strong>Passages vertigineux sur crête schisteuse</strong> et sections raides : chaussures montantes obligatoires, déconseillé si l'un de vous a le vertige. Le chien passera, mais tenez-le court.<br>• <strong>Aucun équipement au col</strong> : ni toilettes, ni eau, ni commerce. Emportez 3 L plus 2 L pour le chien.<br>• <strong>Le départ n'a pas de point Google Maps fiable.</strong> C'est un col sans nom sur la D28, à environ 5 km de Sainte-Croix-Vallée-Française en direction de Saint-Martin-de-Lansuscle, avec un <strong>parking sur la droite au col</strong>, quelques places. <strong>Téléchargez le GPX</strong>, ne comptez pas sur une adresse. Attention aussi à l'homonymie : « Castelviel » est aussi un site de baignade sur la commune de Rousses, dans une autre vallée."}, {"t": "p", "html": "<em>Alternative sans vertige, à 25 min de la base : le <strong>Sentier de Valescure</strong> à Peyrolles, 11,3 km, +344 m, 4h, « petite vallée sauvage où l'on apprécie le calme », terrasses de pierre, chiens en laisse mentionnés sur la fiche. Parking à La Planque, 44.106709, 3.827795.</em>"}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Saint-Martin-de-Lansuscle+48110", "txt": "Secteur du départ"}, {"cls": "l-trk", "href": "https://geotrek-admin.cevennes-parcnational.net/api/fr/treks/43205/castelviel.gpx", "txt": "Télécharger le GPX"}, {"cls": "l-web", "href": "https://destination.cevennes-parcnational.fr/trek/43205-Castelviel", "txt": "Fiche officielle"}]}]}, {"type": "trajet", "heure": "15h00", "html": "Col de Castelviel → Sainte-Croix-Vallée-Française · D28 · 5 km · <strong>12 min</strong>", "fin": "Fin de la rando", "vers": "Sainte-Croix-Vallée-Française et son chemin des mémoires", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Sainte-Croix-Vall%C3%A9e-Fran%C3%A7aise+48110", "alt": 300, "km": "5", "duree": "12min", "route": "D28", "de_pt": "p36", "vers_pt": "p37", "de_lib": "Col de Castelviel", "vers_lib": "Sainte-Croix-Vallée-Française", "de_alt": 800, "vers_alt": 300}, {"type": "village", "heure": "15h20", "icone": "i-village", "titre": "Sainte-Croix-Vallée-Française et son chemin des mémoires", "pt": "p37", "blocs": [{"t": "meta", "html": "300 m d'altitude · parcours d'interprétation au départ de l'office de tourisme · 1h"}, {"t": "p", "html": "Un sentier balisé traverse le vieux village en racontant l'histoire locale et <strong>les commerces d'autrefois</strong> : c'est un dispositif fait exprès pour la flânerie, et il tombe bien après trois heures et demie de crête. L'église abrite une <em>Sainte Famille</em> de Paul Chevandier de Valdrôme, restaurée."}, {"t": "p", "html": "Une pause fraîche au passage : <strong>La Baraka</strong>, au village, fait bar et restaurant, chiens acceptés, <a class=\"tel\" href=\"tel:+33749605068\">07 49 60 50 68</a>. Ses horaires ne sont pas publiés, donc ne comptez pas sur un service à 15h, mais une boisson en terrasse ne se refuse pas."}, {"t": "liens", "liens": [{"cls": "l-map",
