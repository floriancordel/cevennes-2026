, "alt": 320, "lab": "Peyrolles, château de Valescure", "date": "2026-08-15", "h": 13}, {"id": "w2cas", "lat": 44.095554, "lon": 3.829866, "alt": 420, "lab": "Valescure, la cascade", "date": "2026-08-15", "h": 14}, {"id": "w2col", "lat": 44.118, "lon": 3.92, "alt": 280, "lab": "Col de Lamira", "date": "2026-08-15", "h": 16}, {"id": "w2sj", "lat": 44.1058, "lon": 3.884973, "alt": 195, "lab": "Saint-Jean-du-Gard, Pont Vieux", "date": "2026-08-15", "h": 19}], "sections": {"courses": "<div class=\"box\">\n  <h4>Le rythme des courses</h4>\n  <table class=\"ref\">\n    <tr><th>Quand</th><th>Où</th><th>Pour quoi</th></tr>\n    <tr><td>Dim 9, en route</td><td data-l=\"Où\">Dernier supermarché sur votre trajet, ou Ganges</td><td data-l=\"Pour quoi\">Base de dépannage : pain, œufs, tomates, melon, jambon, huile d'olive, café, eau. Plus la gamelle pliable du chien.</td></tr>\n    <tr><td>Lun 10, 13h30</td><td data-l=\"Où\"><strong>Terres d'Aigoual</strong>, L'Espérou</td><td data-l=\"Pour quoi\">Oignons doux AOP, pélardons, charcuterie de pays, miel de châtaignier. C'est le dîner du soir et une partie du pique-nique de mardi.</td></tr>\n    <tr><td>Lun 10, 16h30</td><td data-l=\"Où\"><strong>Coopérative Origine Cévennes</strong>, Saint-André-de-Majencoules<br><span style=\"color:var(--mute)\">9h-13h / 14h-19h tous les jours</span></td><td data-l=\"Pour quoi\">L'adresse « tout en un » du terroir viganais si vous voulez compléter : pommes, châtaignes, vins, fromages.</td></tr>\n    <tr><td><strong>Ven 14, 9h30</strong></td><td data-l=\"Où\"><strong>Marché de Ganges</strong><br><span style=\"color:var(--mute)\">180 stands, Halles ouvertes depuis 7h30</span></td><td data-l=\"Pour quoi\"><strong>Deux repas d'un coup</strong> : le déjeuner à l'ombre au gîte, et le pique-nique du soir à la cascade d'Avèze. Glacière obligatoire, plus des glaçons et un rosé à mettre au frais dans l'Arre. La boucle du soir part à pied.</td></tr>\n    <tr><td><strong>Sam 15, 9h30</strong></td><td data-l=\"Où\"><strong>Marché du Vigan</strong><br><span style=\"color:var(--mute)\">80 étals, le plus complet du séjour</span></td><td data-l=\"Pour quoi\"><strong>La grosse course de la semaine 2</strong>, plus le pique-nique du midi. Pélardons frais et affinés, oignons doux, charcuterie, miel, farine de châtaigne, fruits et légumes pour trois jours, bières d'Avèze. <strong>Glacière obligatoire</strong>, la route dure 2h.</td></tr>\n    <tr><td>Mar 18, 9h45</td><td data-l=\"Où\"><strong>Marché de Saint-Jean-du-Gard</strong> + <strong>Piccolo Sole</strong> et <strong>Au Petit Bonheur</strong></td><td data-l=\"Pour quoi\">Réassort de la semaine, épicerie fine et pâtisserie. L'assiette du soir sort de là.</td></tr>\n    <tr><td>Jeu 20, 9h50</td><td data-l=\"Où\"><strong>Marché de Florac</strong><br><span style=\"color:var(--mute)\">8h-13h, se démonte vers 12h30</span></td><td data-l=\"Pour quoi\"><strong>Le déjeuner du jour</strong>, mangé deux heures plus tard au bord du Tarn : pain, charcuterie de pays, pélardon, tomates, fruits, boissons. Plus des œufs pour le dîner.</td></tr>\n    <tr><td>Sam 22, 10h</td><td data-l=\"Où\"><strong>Marché de producteurs</strong>, Saint-Jean-du-Gard</td><td data-l=\"Pour quoi\">Ce que vous rapportez : pélardons affinés, miel, farine de châtaigne, oignons doux.</td></tr>\n  </table>\n  <p style=\"font-size:.9rem;color:var(--ink2);margin-top:14px\"><strong>Les cinq soirs de préparation.</strong> Lundi 10 (sandwichs pour les cascades d'Orgon), mardi 11 (pique-nique du lac, et espèces pour Bramabiau qui refuse la carte bancaire), mercredi 12 (lever 6h15 pour Navacelles), dimanche 16 (vrai pique-nique pour la crête de la Flandonenque), mercredi 19 (glacière et maillots pour Florac). Ils sont rappelés en bas de chaque journée dans les encadrés violets.</p>\n</div>\n\n<!-- ══════════════ PRATIQUE ══════════════ -->", "pratique": "<div class=\"grid2\">\n  <div class=\"box\">\n    <h4>À vérifier chaque soir pour le lendemain</h4>\n    <ul class=\"tight\">\n      <li><strong>Accès aux massifs du Gard</strong> — <a href=\"https://www.risque-prevention-incendie.fr/gard/\">risque-prevention-incendie.fr/gard</a>. Publiée entre 17h et 18h pour le lendemain. Le département compte 8 zones : regardez la vôtre, pas la couleur globale.</li>\n      <li><strong>Météo des forêts</strong> — <a href=\"https://meteofrance.com/meteo-des-forets\">meteofrance.com/meteo-des-forets</a>, à 17h pour J+1 et J+2. Pour anticiper, mais ce n'est <em>pas</em> une carte d'interdiction.</li>\n      <li><strong>Qualité des eaux de baignade</strong> — <a href=\"https://baignades.sante.gouv.fr/\">baignades.sante.gouv.fr</a></li>\n    </ul>\n    <p style=\"font-size:.88rem;color:var(--ink2);margin-top:12px\"><strong>Les niveaux du Gard :</strong> gris et jaune, accès libre. Orange, accès déconseillé et bivouac interdit. <span class=\"big\">Rouge, accès totalement interdit</span> aux massifs de plus de 4 ha, jusqu'à 200 m au-delà des lisières.</p>\n    <p style=\"font-size:.88rem;color:var(--ink2)\">Du 15 juin au 15 septembre, <strong>tout feu nu est interdit</strong> à moins de 200 m des bois, garrigues et landes : barbecue, réchaud et cigarette compris. Jusqu'à 3 ans d'emprisonnement et 45 000 € d'amende pour un départ de feu, même involontaire.</p>\n    <p style=\"font-size:.88rem;color:var(--ink2)\"><strong>La Lozère n'a pas de carte équivalente</strong> — les arrêtés passent par <a href=\"https://www.lozere.gouv.fr/\">lozere.gouv.fr</a> ou la sous-préfecture de Florac, <a class=\"tel\" href=\"tel:+33466656280\">04 66 65 62 80</a>. Un arrêté 2026 y suspend déjà les feux d'artifice.</p>\n  </div>\n\n  <div class=\"box\">\n    <h4>Urgences vétérinaires</h4>\n    <table class=\"ref\">\n      <tr><th>Structure</th><th>Téléphone</th></tr>\n      <tr><td><strong>Nuit, week-end, jours fériés — tout le Gard</strong><br><span style=\"color:var(--mute)\">Vétérinaires 2 Toute Urgence, Nîmes. C'est le numéro que les cliniques du secteur renvoient.</span></td><td data-l=\"Téléphone\"><strong><a class=\"tel\" href=\"tel:+33427040272\">04 27 04 02 72</a></strong></td></tr>\n      <tr><td><strong>AlèsVet</strong> — urgences 24h/24, 7j/7<br><span style=\"color:var(--mute)\">1019 ancien chemin de Mons, Alès · appeler avant de se présenter · la seule structure du secteur avec une urgence en propre</span></td><td data-l=\"Téléphone\"><strong><a class=\"tel\" href=\"tel:+33412059555\">04 12 05 95 55</a></strong></td></tr>\n      <tr><td>Clinique du Vigan<br><span style=\"color:var(--mute)\">120 Côte d'Aulas · uniquement sur RDV · radio, échographie, labo sur place</span></td><td data-l=\"Téléphone\"><a class=\"tel\" href=\"tel:+33467810046\">04 67 81 00 46</a></td></tr>\n      <tr><td>Le Héron, Ganges<br><span style=\"color:var(--mute)\">19 avenue du Vigan</span></td><td data-l=\"Téléphone\"><a class=\"tel\" href=\"tel:+33467738690\">04 67 73 86 90</a></td></tr>\n      <tr><td>La Porte d'Anduze, Boisset-et-Gaujac<br><span style=\"color:var(--mute)\">La plus proche de Saint-Jean, 20 min par la D907</span></td><td data-l=\"Téléphone\"><a class=\"tel\" href=\"tel:+33466617034\">04 66 61 70 34</a></td></tr>\n    </table>\n    <p style=\"font-size:.87rem;color:var(--ink2);margin-top:12px\">Il n'y a <strong>aucun cabinet vétérinaire dans Saint-Jean-du-Gard même</strong>. Notez les deux premiers numéros dans vos téléphones dès l'arrivée.</p>\n  </div>\n</div>\n\n<div class=\"box\">\n  <h4>Le chien par forte chaleur — les cinq règles</h4>\n  <ul class=\"tight\">\n    <li><strong>Le test des 5 secondes.</strong> Main à plat sur le bitume ou la roche. Si vous ne tenez pas 5 secondes, ses coussinets brûlent. Les dalles calcaires des causses et les pistes forestières sont des fours l'après-midi.</li>\n    <li><strong>1,5 à 2 L d'eau dédiés au chien</strong>, en plus de la vôtre, plus une gamelle pliable. Faites boire par petites quantités toutes les 20 à 30 min. L'Aigoual n'a presque aucun point d'eau balisé : les seuls fiables sont le col de la Serreyrède et le refuge de Cap de Côte.</li>\n    <li><strong>Coup de chaleur.</strong> Halètement violent, salive épaisse, gencives rouge vif puis bleutées, démarche titubante, refus d'avancer. Urgence vitale : ombre immédiate, mouillage <em>progressif</em> à l'eau fraîche et non glacée en commençant par les pattes, le ventre et l'aine, puis vétérinaire <strong>même s'il semble récupérer</strong> — les complications rénales arrivent plusieurs heures après.</li>\n    <li><strong>Cyanobactéries.</strong> En fin d'été, les eaux stagnantes, tièdes, verdâtres ou à écume des Gardons, de l'Hérault et du Tarn peuvent être toxiques et mortelles pour un chien qui boit ou se lèche après le bain. Préférez systématiquement l'eau courante.</li>\n    <li><strong>Patous.</strong> Troupeaux en estive de juin à octobre sur le Lingas, l'Aigoual et la vallée du Bonheur. Contournez large, ne courez pas, ne criez pas, chien en laisse courte derrière vous, et continuez à parler normalement.</li>\n  </ul>\n</div>\n\n<div class=\"box\">\n  <h4>Températures : pourquoi l'altitude change tout</h4>\n  <table class=\"ref\">\n    <tr><th>Station</th><th>Altitude</th><th>Max. moyenne août</th><th>Record</th></tr>\n    <tr><td>Le Vigan</td><td data-l=\"Altitude\">245 m</td><td data-l=\"Max. moyenne août\"><strong>30,0 °C</strong></td><td data-l=\"Record\">42,3 °C</td></tr>\n    <tr><td>Mont Aigoual <span style=\"color:var(--mute)\">(station Météo-France)</span></td><td data-l=\"Altitude\">1567 m</td><td data-l=\"Max. moyenne août\"><strong>17,6 °C</strong></td><td data-l=\"Record\">30,4 °C</td></tr>\n  </table>\n  <p style=\"font-size:.9rem;color:var(--ink2);margin-top:12px\">Plus de 12 °C d'écart. Une journée à 35 °C au Vigan, c'est 23 °C au sommet. Les nuits restent chaudes en vallée : le record de minimale la plus élevée au Vigan est de 27 °C.</p>\n  <p style=\"font-size:.9rem;color:var(--ink2)\"><strong>L'épisode cévenol n'est pas votre saison</strong> — il survient surtout en septembre, octobre et novembre. En revanche, les <strong>orages de soirée sur le relief sont fréquents à partir de la mi-août</strong> : 67,6 mm sont tombés en 24h au Vigan le 23 août 2015. Ne vous engagez jamais dans une gorge ou un lit de rivière si un orage est annoncé, même à des kilomètres en amont. C'est le seul motif qui doit vous faire annuler une rando du soir.</p>\n</div>\n\n<div class=\"box\">\n  <h4>Tous les marchés du séjour</h4>\n  <table class=\"ref\">\n    <tr><th>Date</th><th>Marché</th><th>Horaires</th></tr>\n    <tr><td>Ven 14</td><td data-l=\"Marché\"><strong>Ganges — le grand marché du sud des Cévennes, 180 stands</strong>, Les Halles, 1 rue Frédéric Mistral</td><td data-l=\"Horaires\">7h30-14h30</td></tr>\n    <tr><td>Sam 15</td><td data-l=\"Marché\"><strong>Le Vigan</strong> — le plus beau du séjour, 80+ étals</td><td data-l=\"Horaires\">8h-12h30</td></tr>\n    <tr><td>Dim 16</td><td data-l=\"Marché\"><strong>Les Dimanches Artisans</strong>, Saint-Jean-du-Gard, av. Boudon</td><td data-l=\"Horaires\">19h-23h30</td></tr>\n    <tr><td>Mar 18</td><td data-l=\"Marché\"><strong>Saint-Jean-du-Gard</strong>, halle et Grand Rue</td><td data-l=\"Horaires\">8h-13h</td></tr>\n    <tr><td>Mar 18</td><td data-l=\"Marché\">Nocturne d'Anduze, Plan de Brie</td><td data-l=\"Horaires\">19h-23h</td></tr>\n    <tr><td>Mer 19</td><td data-l=\"Marché\">Nocturnes de Lasalle — <strong>dernière de la saison</strong></td><td data-l=\"Horaires\">marché 18h, concerts 20h30</td></tr>\n    <tr><td>Jeu 20</td><td data-l=\"Marché\"><strong>Florac</strong>, esplanade et château du Parc</td><td data-l=\"Horaires\">8h-13h</td></tr>\n    <tr><td>Sam 22</td><td data-l=\"Marché\">Producteurs, Saint-Jean-du-Gard</td><td data-l=\"Horaires\">matin</td></tr>\n  </table>\n  <p style=\"font-size:.88rem;color:var(--ink2);margin-top:12px\">Si vous voulez en ajouter : Anduze le jeudi (200 exposants, le plus gros en volume), Valleraugue mercredi et samedi matin, Quissac le mercredi 8h-12h30, Saint-Hippolyte-du-Fort mardi et vendredi 6h-13h, Saint-André-de-Valborgne le dimanche 8h30-12h30, Le Pont-de-Montvert le mercredi 9h-12h, Meyrueis <strong>marché d'artisanat d'art le jeudi 20 août</strong>. Les halles de l'Abbaye à Alès sont ouvertes tous les matins de 8h à 12h, filet de sécurité si vous ratez tout.</p>\n</div>\n\n<!-- ══════════════ RÉSERVE ══════════════ -->", "reserve": "<p class=\"lede\">Randos, villages et repli, à glisser à la place d'une journée annulée pour massif fermé, canicule ou fatigue.</p>\n\n<div class=\"grid2\">\n  <div class=\"box\">\n    <h4>Randos de remplacement</h4>\n    <ul class=\"tight\">\n      <li><strong>Cascades d'Orgon</strong> — 9 km, +450 m, 2h30 depuis le parking des cascades à Arphy, ou variante La Draille 8,9 km, +344 m, 3h30 depuis le parking de la D329 après le col de la Lusette. <strong>Version courte</strong> : une centaine de mètres depuis le parking d'Arphy suffit pour atteindre la passerelle et les chutes, trente minutes aller-retour. Boucle très forestière, nombreux ruisseaux et un gué. Départ D329, Valleraugue. <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=44.059139%2C3.604682\">Itinéraire</a> · <a href=\"https://www.visorando.com/randonnee-les-cascades-d-orgon-2/\">Visorando</a></li>\n      <li><strong>Arboretum de l'Hort de Dieu</strong> — 4,7 km, +285 m, 3h30, depuis l'observatoire de l'Aigoual. Planté en 1903 par Georges Fabre et Charles Flahault : 75 espèces survivantes sur 140 testées, neuf stations d'interprétation. Terrain raide et rocheux. <a href=\"https://www.tourismegard.com/fr/fiche/equipement/sentier-de-decouverte-l-arboretum-de-l-hort-de-dieu-l-esperou_TFO6082109/\">Trace et GPX</a></li>\n      <li><strong>Montagne de la Fage, Cézas</strong> — 10 km, +425 m, 4h. Panorama jusqu'à l'étang de Thau. Montée initiale raide, <strong>parking de 6 places</strong> : arrivez tôt. <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=43.975111%2C3.778964\">Itinéraire</a> · <a href=\"https://www.visorando.com/randonnee-la-montagne-de-la-fage/\">Visorando</a></li>\n      <li><strong>Sentier de Valescure, Peyrolles</strong> — 11,3 km, +344 m, 4h. Petite vallée sauvage, terrasses de pierre, chiens en laisse mentionnés sur la fiche. Départ La Planque. <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=44.106709%2C3.827795\">Itinéraire</a> · <a href=\"https://www.tourismegard.com/fr/fiche/equipement/sentier-de-valescure-peyrolles_TFO6081707/\">GPX</a></li>\n      <li><strong>Sentier de l'Amous, Saint-Sébastien-d'Aigrefeuille</strong> — 3,4 km, 2h. Très ombragé, au fil de l'eau. Parfait en fin de journée. <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=44.106354%2C3.995293\">Itinéraire</a> · <a href=\"https://www.tourismegard.com/fr/fiche/equipement/sentier-du-patrimoine-autour-de-l-amous-saint-sebastien-d-aigrefeuille_TFO6789776/\">GPX</a></li>\n      <li><strong>Sentier de Roquefeuille, Mialet</strong> — 13 km, +632 m, 5h. La plus exigeante : anciens chemins camisards, audioguide. Uniquement un jour frais. <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=44.111382%2C3.942653\">Itinéraire</a> · <a href=\"https://www.tourismegard.com/fr/fiche/equipement/randonnee-sentier-de-roquefeuille-mialet_TFO7012331/\">GPX</a></li>\n      <li><strong>Sentier de l'Exil, Saumane</strong> — 12,9 km, +428 m, 4h30. Ancienne route royale vers la Lozère, ornières de charrettes creusées dans la roche. Topo 5 € à l'office de Saint-André-de-Valborgne. <a href=\"https://www.tourismegard.com/fr/fiche/equipement/sentier-de-l-exil-saumane_TFO6082080/\">GPX</a></li>\n      <li><strong>Château de Roquedols, Meyrueis</strong> — 6,9 km, +158 m, 2h25, « immersion complète en forêt ». Départ parking de la piscine. <a href=\"https://www.visorando.com/randonnee-boucle-du-chateau-de-roquedols-et-du-col/\">Visorando</a></li>\n      <li><strong>Cascade de Salvinsac depuis Meyrueis</strong> — 7,2 km, +299 m, 2h55, sentier ombragé et baignade à la cascade. <a href=\"https://www.decathlon-outdoor.com/fr-fr/explore/france/de-meyrueis-a-la-cascade-de-salvinsac-64b84642f1307\">Decathlon Outdoor</a></li>\n    </ul>\n    <p style=\"font-size:.87rem;color:var(--ink2);margin-top:12px\">Portails à garder sous la main : <a href=\"https://rando.gard.fr/\">rando.gard.fr</a> · <a href=\"https://destination.cevennes-parcnational.fr/\">destination.cevennes-parcnational.fr</a> · <a href=\"https://www.decathlon-outdoor.com/fr-fr/inspire/france/city-randonnee-le-vigan\">Decathlon Outdoor — Le Vigan, 120 sorties</a> · <a href=\"https://www.decathlon-outdoor.com/fr-fr/inspire/france/randonnee-cevennes-massif-central\">Decathlon Outdoor — Cévennes</a></p>\n  </div>\n\n  <div class=\"box\">\n    <h4>Baignades de secours et villages en réserve</h4>\n    <ul class=\"tight\">\n      <li><strong>Baignade « Le Village », Saumane</strong> — le meilleur repli de la semaine 2, et le seul <strong>surveillé</strong> du secteur : <strong>du 20 juillet au 24 août, tous les jours 13h30-18h30</strong>, parking gratuit et aire de pique-nique. À 20 min de la base. Mairie <a class=\"tel\" href=\"tel:+33466839142\">04 66 83 91 42</a>. <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=44.118462%2C3.763789\">Itinéraire · 44.118462, 3.763789</a></li>\n      <li><strong>Aire de Molières-Cavaillac</strong>, l'Arre, 7 min du Vigan — berges sous les peupliers, animaux acceptés. <strong>Ce n'est pas un site de baignade contrôlé</strong>, plutôt une aire de pique-nique au bord de l'eau, et l'accès est un cul-de-sac étroit. <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=43.969666%2C3.584494\">Itinéraire</a></li>\n      <li><strong>Piscine Jean Genieyz</strong> au Vigan, ou <strong>Aquatix</strong> à Brissac — le repli honnête les jours à 40 °C.</li>\n    </ul>\n    <h4 style=\"margin-top:22px\">Ce que j'ai sorti du programme pour tenir les 2h30</h4>\n    <ul class=\"tight\">\n      <li><strong>Meyrueis</strong> (48150) — le plus joli bourg du nord du secteur : quais de la Jonte, dédale médiéval, remparts, tour de l'Horloge, Rocher du Château. Accessible depuis Camprieu, mais le retour sur Le Vigan fait 1h15 et porterait le mercredi à 2h50. Si vous y tenez, c'est cette journée-là qu'il faut allonger. Animaux acceptés, office de tourisme <a class=\"tel\" href=\"tel:+33466450114\">04 66 45 01 14</a>.</li>\n      <li><strong>Lac des Pises</strong> (1260 m, Dourbies) — paysage nordique, hêtres centenaires, tourbières. Baignade interdite, mais la lumière de fin de journée y est exceptionnelle. Détour de 30 min depuis le col du Minier au retour de l'Aigoual, ce qui porterait le <strong>mercredi</strong> à 3h — et ce soir-là vous êtes attendus à La Borie, donc ce n'est pas le bon jour. Gardez-le pour un après-midi où vous voulez du frais sans marcher. <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=44.04137%2C3.508042\">Itinéraire</a></li>\n      <li><strong>Le Climatographe</strong> au sommet de l'Aigoual (9 €) et <strong>Maison Rouge</strong> à Saint-Jean-du-Gard (9 €) — deux belles visites, sorties parce que vous préfériez sacrifier le payant. Toutes deux sont d'excellents replis un jour de pluie.</li>\n      <li><strong>Sentier de Soult</strong>, L'Estréchure — 9,7 km, +436 m, 4h, la plus belle marche « Cévennes profondes » du secteur. Écartée pour éviter une deuxième sortie de 4h dans la même semaine.</li>\n      <li><strong>Les gorges du Tarn</strong> — Sainte-Enimie et Castelbouc sont à 1h50 d'une seule traite, soit 3h40 aller-retour. Hors cadre, définitivement.</li>\n    </ul>\n    <h4 style=\"margin-top:22px\">Villages en réserve</h4>\n    <ul class=\"tight\">\n      <li><strong>Aumessas</strong> (30770), 20 min du Vigan — <em>Village de caractère</em> confirmé. Ruelles pavées de galets de rivière, château de la Rode du XIV<sup>e</sup>. Surtout : l'<strong>atelier de céramique de Carole Thelemaque</strong>, 7 rue de la Viale, <strong>ouvert toute l'année 10h-18h</strong>, visite d'atelier, stages de tournage et boutique. C'est la plus belle adresse d'artisan de la semaine 1.</li>\n      <li><strong>Dourbies</strong> (30750) — <em>Village de caractère</em> depuis 2018, entre 700 et 1410 m. L'église Notre-Dame-de-l'Assomption, bâtie par les habitants entre 1883 et 1887, est si disproportionnée qu'on l'appelle « la cathédrale des Cévennes ». Une épicerie, rien de plus.</li>\n      <li><strong>Saint-Guilhem-le-Désert</strong> — Plus Beaux Villages, UNESCO, 1h05 du Vigan. Parking Pré des Pères, 300 places ombragées, navettes gratuites depuis le Pont du Diable. <strong>Uniquement à 8h ou après 18h</strong> : les pavés sont brûlants entre midi et 17h, et véhicules de plus de 2 m interdits sur les parkings municipaux.</li>\n      <li><strong>Festival Là-bas vu d'ici</strong>, Le Vigan, 20 au 23 août — films, expos, concerts, clôture par Au P'tit Bonheur. 1h de route depuis Saint-Jean. Réservations <a class=\"tel\" href=\"tel:+33499542700\">04 99 54 27 00</a>.</li>\n    </ul>\n  </div>\n</div>\n\n<div class=\"box\" style=\"border-left:4px solid var(--red)\">\n  <h4>Les lieux que j'ai volontairement écartés, et pourquoi</h4>\n  <ul class=\"tight\">\n    <li><strong>Le Mas de la Cam et Le Castel Rose / L'Arche</strong> (Saint-Jean-du-Gard et Anduze) — ce sont d'abord des <strong>noms de campings</strong>. Les points de prélèvement de l'eau portent leur nom parce que l'analyse s'y fait, mais votre GPS vous conduira à un accueil de camping dont le parking est privé.</li>\n    <li><strong>Gorniès et Madières</strong> (gorges de la Vis) — un site officiel existe à Gorniès, mais <strong>aucune information sur le parking, l'accès ou les équipements</strong>. Madières n'est même pas un site recensé, et la route de fond de gorge n'offre presque aucun stationnement.</li>\n    <li><strong>La cascade du Martinet</strong> (Saint-Étienne-Vallée-Française) — spot à sauts de plusieurs mètres, non surveillé, non balisé. Pas dans un carnet de vacances.</li>\n    <li><strong>La grotte des Demoiselles</strong> — chien interdit sauf dans un sac, ce qui est impossible pour un chien de 10 à 25 kg.</li>\n    <li><strong>Les 4000 marches de Valleraugue</strong> — 1200 m de dénivelé sur une pente exposée. Superbe, et totalement déraisonnable en août avec un chien.</li>\n  </ul>\n</div>\n\n<div class=\"box\">\n  <h4>Ce que je n'ai pas pu vérifier</h4>\n  <p style=\"margin-top:0;font-size:.9rem;color:var(--ink2)\">Par honnêteté plutôt que de combler les trous. <strong>Le stationnement n'est documenté nulle part</strong> pour Falguière, La Corniche et le plan d'eau de Sainte-Croix : les sites existent et l'eau y est suivie, mais garez-vous prudemment et respectez la signalétique. Le <strong>« parking de la Poste »</strong> à Saint-Jean est un nom d'usage, aucun parking ne le porte officiellement. Les <strong>horaires de la navette gratuite de Navacelles</strong> pour 2026 ne sont pas publiés. Tous les <strong>temps de trajet</strong> sont des estimations sur routes de montagne : majorez de 20 % un jour de grosse affluence. Les <strong>notes Google</strong> proviennent d'un miroir tiers, pas d'une lecture directe. Les <strong>feux d'artifice du 15 août</strong> et le <strong>calendrier des fêtes votives</strong> ne sont pas encore publiés : suivez objectifgard.com, rubrique fêtes votives, début août. Enfin, la mention « dog friendly » des offices de tourisme signifie que l'établissement s'est déclaré comme tel : un coup de fil la veille reste la seule certitude en plein mois d'août.</p>\n</div>", "footer": "<strong>Photos</strong> — Wikimedia Commons, sous licences libres (CC BY-SA, CC BY ou domaine public selon les fichiers). Chaque image renvoie vers sa page source, où figurent l'auteur et la licence exacte. Si une image ne s'affiche pas, c'est que le fichier a été renommé sur Commons ; le reste du document est intact.<br><br>\n  <strong>Sources</strong> — Parc national des Cévennes · Gard Tourisme · Destination Sud Cévennes · Hérault Tourisme · Lozère Tourisme · offices de tourisme Cévennes Gorges du Tarn et Des Cévennes au Mont Lozère · Cirque de Navacelles Grand Site de France · préfectures du Gard et de la Lozère · Météo-France et Infoclimat · fichier national des eaux de baignade (baignades.sante.gouv.fr) · mairies du Vigan, de Saint-Jean-du-Gard, de Val-d'Aigoual, de Florac et de Ganges · Rando Gard · Visorando · Decathlon Outdoor · Climatographe · Abîme de Bramabiau · Bambouseraie en Cévennes · Train à Vapeur des Cévennes · Musée du Désert · Maison Rouge · Route du Vase d'Anduze · Objectif Gard.<br><br>\n  <strong>Cartographie</strong> — IGN TOP25 2641ET « Mont Aigoual – Le Vigan ». <strong>Chargez toutes vos traces GPX avant de partir</strong> : il n'y a pas de réseau mobile sur une grande partie du massif.", "intro": "<div class=\"box\" style=\"border-left:4px solid var(--moss)\">\n  <h4>Comment lire ce document</h4>\n  <p style=\"margin:0 0 10px;font-size:.94rem;color:var(--ink2)\"><strong>Deux plafonds sur les quatorze jours : 2h30 de route cumulée, et jamais plus de 1h15 d'une seule traite. Ils sont tenus partout sauf <strong>jeudi 13, à 2h33</strong>, trois minutes au-dessus, parce que le sommet de l'Aigoual a été ajouté en fin de journée : c'est écrit sur la journée plutôt qu'arrondi.</strong> Chaque journée affiche son total et sa plus longue étape. C'est ce qui a écarté les gorges du Tarn, à 1h50 d'affilée, et le Mont Lozère à 1h25. Deux exceptions assumées, chacune expliquée sur sa journée : <strong>jeudi 13 à 2h33</strong> pour le sommet de l'Aigoual, et <strong>mardi 18 à 2h34, avec 1h17 d'une traite</strong>, parce que vous avez préféré Uzès à Alès et accepté d'avance le surcoût.<br><strong>Une seule vraie randonnée par jour</strong>, et les jours de sortie longue le reste est volontairement creux. <strong>Départs à 9h30</strong>, sauf trois matins. <strong>Mardi 11, départ 7h</strong> pour Navacelles, parce que le causse est invivable après 10h et qu'à 7h40 vous avez les belvédères pour vous. <strong>Jeudi 20, départ 8h30</strong> pour attraper le marché de Florac avant qu'il ne remballe. <strong>Samedi 22, départ 9h</strong>, jour du retour. Chacun est expliqué sur sa journée, avec l'alternative si vous préférez tenir le 9h30.</p>\n  <p style=\"margin:0 0 10px;font-size:.94rem;color:var(--ink2)\"><strong>Chaque trajet est chiffré</strong>, dans les bandes grises, retour compris, avec le total de conduite en bas de journée. <strong>Chaque lieu a deux liens</strong> : « Fiche et avis » ouvre la page Google du lieu (photos, avis, horaires), « Itinéraire » lance la navigation sur les coordonnées exactes du parking.</p>\n  <p style=\"margin:0 0 10px;font-size:.94rem;color:var(--ink2)\"><strong>Les repas sont écrits.</strong> Au restaurant : la note, le téléphone, et s'il faut réserver. À la maison : le plat proposé et ce qu'il faut avoir acheté. Les encadrés violets en bas de journée disent <strong>ce qu'il faut préparer le soir même</strong> pour le lendemain.</p>\n  <p style=\"margin:0;font-size:.94rem;color:var(--ink2)\"><strong>Le chien passe presque partout.</strong> Le Parc national des Cévennes est le seul parc national de métropole qui autorise le chien en zone cœur, tenu en laisse. Vous ne le laissez nulle part, donc tout ce qui l'exclut est sorti du programme : <strong>la grotte de Trabuc</strong> et <strong>la grotte des Demoiselles</strong> (petits chiens portés seulement), le <strong>Jardin Médiéval d'Uzès</strong> et le <strong>musée Haribo</strong> (interdits, c'est écrit), et par précaution le <strong>Musée du Désert</strong> et le <strong>Duché d'Uzès</strong>, qui ne publient aucune règle. <strong>Résultat : il n'y a aucun musée dans ce séjour</strong>, et c'est assumé — tout se passe dehors, sur les sentiers, dans les villages et sur les marchés. La Bambouseraie l'accueille gratuitement et fait de l'ombre sur tout le parc.</p>\n</div>", "hero": {"kicker": "Feuille de route · 14 jours · 2 bases · 1 chien", "h1": "Deux semaines dans les Cévennes,<br>de l'Aigoual à la Corniche", "pitchs": ["Vous allez dormir au pied d'une montagne à 1565 m et vous baigner dans une eau turquoise le même jour. Marcher sous des hêtres centenaires pendant que la vallée cuit à 35 °C. Descendre 300 mètres en lacets pour atterrir au fond d'un cirque calcaire où vivent quarante personnes. Prendre un train à vapeur, boire une bière brassée devant vous, acheter du pélardon à celle qui l'a fait. Et le soir, quand le soleil passe derrière les crêtes vers <em>20h45</em>, partir marcher le long d'un Gardon dont l'eau reste claire jusqu'à la nuit.", "Ce document est fait pour être suivi sans réfléchir. Chaque étape indique <em>où se garer</em>, <em>combien de temps de route</em>, <em>ce qu'on mange</em> et <em>ce qu'il faut avoir acheté la veille</em>. Les pièges connus sont signalés. Vous n'avez qu'à conduire."], "bases": ["<b>9 → 15 août · base 1</b><span>357 Route de Ganges, Le Vigan (30120)<br>Vallée de l'Arre, au pied de l'Aigoual</span>", "<b>15 → 22 août · base 2</b><span>Mas de Cros Viel, col de Lamira<br>Au-dessus de Saint-Jean-du-Gard (30270)</span>"], "lead": "Quatorze jours entre 90 et 1 565 mètres, deux maisons, un chien. Des matins à douze degrés sur les crêtes pendant que la vallée cuit, des rivières vertes où l'on se jette à midi, des marchés où l'on achète le dîner à celui qui l'a fait, et des soirs qui traînent jusqu'à 21h. Tout est écrit à l'heure près : vous n'avez plus qu'à conduire."}, "forts": {"titre": "Les huit moments qu'on raconte en rentrant", "lede": "Le reste du carnet est écrit à la minute, avec les parkings, les horaires et les listes de courses. Ces huit-là, c'est autre chose : ce sont ceux dont vous parlerez cet hiver.", "items": [{"j": "j3", "n": "Jour 3", "quand": "Mardi 11, 7h40", "titre": "Le cirque de Navacelles avant tout le monde", "txt": "On part à 7h, et c'est la seule fois du séjour. À 7h40 vous êtes seuls sur les belvédères du causse de Blandas, le méandre abandonné encore dans l'ombre trois cents mètres plus bas, le hameau et ses quarante habitants au fond. À 10h il y aura un car. À 7h40, il y a vous.", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Vue_a%C3%A9rienne_du_Cirque_de_Navacelles.jpg?width=1200"}, {"j": "j4", "n": "Jour 4", "quand": "Mercredi 12, 9h45", "titre": "Les mouflons au petit matin, et l'anniversaire au bord de la piscine", "txt": "Le sentier d'interprétation du plateau, à 1 200 m, là où le mouflon a été réintroduit en 1954, puis la grande boucle des cascades d'Orgon par La Draille. On redescend se doucher, et le soir l'anniversaire de Marion se fête en apéro dînatoire au bord de la piscine, sans avoir à reprendre la voiture.", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Panorama_du_Mont_Aigoual.JPG?width=1200"}, {"j": "j5", "n": "Jour 5", "quand": "Jeudi 13, 15h", "titre": "La rivière qui disparaît, puis 1 565 m au soleil couchant", "txt": "Le Bonheur s'enfonce sous le plateau et ressort trois kilomètres plus loin en rugissant : c'est l'abîme de Bramabiau, 10 °C constants sous la roche. En sortant, au lieu de redescendre, on prend la route de crête jusqu'au sommet de l'Aigoual et on fait la boucle du menhir de Trépaloup pendant que le soleil tombe sur la lande. Personne, du vent, et vingt degrés de moins qu'en bas.", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/L%27observatoire_du_Mont_Aigoual.jpg?width=1200"}, {"j": "j9", "n": "Jour 9", "quand": "Lundi 17, 15h15", "titre": "Les terrasses des Calquières, encore cultivées aujourd'hui", "txt": "Sur le versant sud-est de Saint-Germain-de-Calberte, un système complet de terrasses en pierre sèche que <strong>vingt-neuf propriétaires cultivent encore</strong>, sur quarante-deux parcelles, avec ses réseaux hydrauliques, ses niches murales et ses terrasses à ruchers. C'est le geste qui a rendu ces versants habitables, et c'est pour ça que les Causses et Cévennes sont à l'UNESCO. Stevenson y a dormi en 1878. L'accès est libre.", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/271_Corniche_des_C%C3%A9vennes_Panorama_entre_Saint-Jean-du-Gard_et_Florac.JPG?width=1200"}, {"j": "j8", "n": "Jour 8", "quand": "Dimanche 16, 13h", "titre": "Le déjeuner aux marmites de géant, dans le vallon du Nogaret", "txt": "Vous avez acheté le repas à 10h sur la place du temple de Saint-André-de-Valborgne, au fond de la vallée Borgne, à un marché où tout a poussé dans la vallée. Trois heures plus tard vous êtes au bord du ruisseau du Nogaret, à l'ombre, assis au bord d'une cuvette creusée dans la roche par des galets qui tournent depuis des millénaires. C'est le meilleur déjeuner du séjour et il n'a coûté qu'une matinée.", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Mialet-Pont_des_Camisards-20120901.jpg?width=1200"}, {"j": "j6", "n": "Jour 6", "quand": "Vendredi 14, 19h", "titre": "La boucle de l'Arre, à pied, et le bain à la cascade d'Avèze", "txt": "Le jour le plus chaud de l'été, la voiture reste au gîte. Vous partez à pied de la mairie du Vigan à 17h30 : deux heures de chemin ombragé au fil de l'Arre, une châtaigneraie, et le pont de Mousse, une arche de tuf entièrement naturelle d'où l'eau suinte en gouttes cristallines. Au retour, la cascade d'Avèze : le bain, et le pique-nique du marché de Ganges au bord de l'eau, à vingt minutes de marche de la maison.", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Le_Coudoulou_%C3%A0_Av%C3%A8ze%2C_vieux_pont_et_bief-barrage.JPG?width=1200"}, {"j": "j13", "n": "Jour 13", "quand": "Vendredi 21, 14h30", "titre": "Le train à vapeur, entre la Bambouseraie et Anduze", "txt": "Le matin, quarante hectares de bambous géants plantés en 1856, où le chien entre gratuitement et où tout est à l'ombre. L'après-midi, une locomotive à vapeur qui longe le Gardon jusqu'à Saint-Jean. Le soir, la meilleure table du séjour.", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Bambouseraie_de_Prafrance_20100904_031.jpg?width=1200"}, {"j": "j10", "n": "Jour 10", "quand": "Mardi 18, 17h30", "titre": "La nocturne d'Uzès sur la place du Duché", "txt": "Uzès n'a pas de marché le mardi matin, mais tous les mardis d'été la place du Duché se remplit à 17h30 : soixante-dix exposants, des artisans, des producteurs, des concerts, et du tango dans la cour de la mairie. Vous y arrivez à l'ouverture, après un après-midi passé dans les caves du premier duché de France et sous les arcades de la place aux Herbes, et vous dînez sur place. C'est la seule soirée du séjour où la ville fait le spectacle.", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Place_aux_Herbes_in_Uzes.jpg?width=1200"}]}}, "tables": [{"jour": "j1", "date": "Dim 9", "quand": "20h00", "cat": "maison", "nom": "Premier dîner à l'appartement", "lieu": "357 route de Ganges, Le Vigan", "note": null, "avis": "sans objet", "tel": null, "horaires": "Chez vous", "prix": "Vos courses de la route", "chien": "Chez vous", "desc": "Vous êtes arrivés à 16h, vous avez traversé le vieux pont et trempé dans l'Arre. Le premier soir, on ne repart pas en voiture. Melon et jambon cru, salade de tomates, omelette aux oignons doux des Cévennes, pélardon et pain de campagne.", "alerte": "Tout est dans la liste de courses de l'après-midi, faite avant d'arriver : le dimanche après-midi, Le Vigan est fermé.", "maps": "https://www.google.com/maps/search/?api=1&query=357+Route+de+Ganges%2C+30120+Le+Vigan", "niveau": "aucune", "photos": [], "alts": [{"nom": "Le Qu'es Aquo", "lieu": "27 bd du Plan d'Auvergne, Le Vigan", "note": "4,5", "src": "TripAdvisor, 92 avis", "tel": null, "horaires": "Tous les jours, midi et soir", "desc": "Salle claire, grande véranda et terrasse, cuisine traditionnelle sans esbroufe. Le seul du Vigan ouvert tous les jours, ce qui en fait le filet de sécurité de la semaine 1.", "maps": "https://www.google.com/maps/search/?api=1&query=Restaurant+le+qu%27Es+Aquo+Le+Vigan"}, {"nom": "Les Terrasses de La Borie", "lieu": "326 chemin de La Borie, Mandagout", "note": "4,7", "src": "215 avis Google", "tel": "04 65 09 03 32", "horaires": "Du mercredi au dimanche, fermé lundi et mardi", "desc": "Menus surprise en 4, 5 ou 7 services, 52 à 89 €. Chef formé en étoilés, terrasse ombragée sur les crêtes, chien accepté en terrasse.", "maps": "https://www.google.com/maps/search/?api=1&query=Les+Terrasses+de+La+Borie+Mandagout"}]}, {"jour": "j2", "date": "Lun 10", "quand": "11h50", "cat": "picnic", "nom": "Pique-nique au bord de l'Arre, à Molières-Cavaillac", "lieu": "Aire de pique-nique, route de Laparot, 230 m, 8 min du gîte", "note": null, "avis": "sans objet", "tel": null, "horaires": "Quand vous voulez", "prix": "Vos sandwichs préparés hier soir", "chien": "Il peut se coucher dans l'eau", "desc": "Aire de pique-nique officielle sur les berges de l'Arre, sous les peupliers, accès libre toute l'année et animaux acceptés. Ombre dense, herbe, rivière peu profonde à trois mètres. C'est le meilleur endroit du secteur pour un chien qui ne va pas bien.", "alerte": "<strong>Ce n'est pas un site de baignade</strong> : la fiche officielle parle d'une aire de pique-nique au bord de l'eau, et la profondeur est faible. Accès depuis le rond-point de La Tourette, direction Voie Verte, puis à gauche au parc de BMX.", "maps": "https://www.google.com/maps/dir/?api=1&destination=43.969666%2C3.584494", "niveau": "aucune", "photos": [], "alts": [{"nom": "Le Qu'es Aquo", "lieu": "27 bd du Plan d'Auvergne, Le Vigan", "note": "4,5", "src": "TripAdvisor, 92 avis", "tel": null, "horaires": "Tous les jours, midi et soir", "desc": "À cinq minutes, avec véranda et terrasse, si vous préférez une vraie table à midi.", "maps": "https://www.google.com/maps/search/?api=1&query=Restaurant+le+qu%27Es+Aquo+Le+Vigan"}]}, {"jour": "j2", "date": "Lun 10", "quand": "20h00", "cat": "guinguette", "nom": "La Guinguette d'Avèze", "lieu": "Le Pont Vieux, Avèze", "note": "4,6", "avis": "288 avis Google", "tel": null, "horaires": "Du 1er mai au 30 septembre, tous les jours 10h – 1h du matin", "prix": null, "chien": "Plein air intégral", "desc": "Sixième saison pour cette guinguette posée au bord de l'Arre, au pied du vieux pont. Terrasse au fil de l'eau, produits locaux et de saison, service tard le soir. Vous arrivez de Navacelles, debout depuis 6h30 : l'aire de baignade est à trente mètres de la terrasse, vous vous trempez avant de vous asseoir.", "alerte": null, "maps": "https://www.google.com/maps/search/?api=1&query=La+Guinguette+d%27Av%C3%A8ze+Pont+Vieux", "niveau": "reserve", "resa": "Réservé à 20h. Plusieurs avis récents pointent une gestion approximative des réservations : confirmez la veille si vous le pouvez, et gardez un repli en tête.", "photos": ["https://static.apidae-tourisme.com/filestore/objets-touristiques/images/1/126/41778689.jpg"], "alts": [{"nom": "Le Qu'es Aquo", "lieu": "27 bd du Plan d'Auvergne, Le Vigan", "note": "4,5", "src": "TripAdvisor, 92 avis", "tel": null, "horaires": "Tous les jours, midi et soir", "desc": "Salle claire, grande véranda et terrasse, cuisine traditionnelle sans esbroufe. Le seul du Vigan ouvert tous les jours, ce qui en fait le filet de sécurité de la semaine 1.", "maps": "https://www.google.com/maps/search/?api=1&query=Restaurant+le+qu%27Es+Aquo+Le+Vigan"}, {"nom": "Les Terrasses de La Borie", "lieu": "326 chemin de La Borie, Mandagout", "note": "4,7", "src": "215 avis Google", "tel": "04 65 09 03 32", "horaires": "Du mercredi au dimanche, fermé lundi et mardi", "desc": "Menus surprise en 4, 5 ou 7 services, 52 à 89 €. Chef formé en étoilés, terrasse ombragée sur les crêtes, chien accepté en terrasse.", "maps": "https://www.google.com/maps/search/?api=1&query=Les+Terrasses+de+La+Borie+Mandagout"}]}, {"jour": "j3", "date": "Mar 11", "quand": "12h45", "cat": "picnic", "nom": "Pique-nique au bord de la Vis, sous la cascade", "lieu": "Au pied de la cascade de Navacelles, 300 m", "note": null, "avis": "sans objet", "tel": null, "horaires": "Quand vous voulez", "prix": "Vos sandwichs de la veille", "chien": "Évidemment", "desc": "Vous sortez de 3h30 de marche le long de la Vis et d'une trempette sous la cascade. Vous mangez les pieds dans l'eau, à l'ombre du rocher, dans le seul endroit frais du cirque à cette heure-là.", "alerte": "<strong>L'Auberge de Blandas, 4,7 sur 410 avis, est fermée le lundi</strong> — mais vous y êtes un mardi maintenant, donc elle est ouverte si vous préférez une table : <a class=\"tel\" href=\"tel:+33467815155\">04 67 81 51 55</a>, 15 min de remontée depuis le hameau. Le pique-nique reste plus simple après 3h30 de marche.", "maps": "https://www.google.com/maps/search/?api=1&query=Cascade+de+Navacelles", "niveau": "aucune", "photos": [], "alts": [{"nom": "Crêperie du Mas Guilhou", "lieu": "Hameau de Navacelles, au fond du cirque", "note": "4,4", "src": "198 avis TripAdvisor — sous votre seuil de 4,5", "tel": "04 67 81 50 69", "horaires": "Tous les jours 12h – 17h", "desc": "Galettes, crêpes et cidres fermiers en terrasse, à trois cents mètres sous le rebord du causse. Zéro remontée après la rando. Je la laisse parce qu'elle est n° 1 du secteur, mais elle ne tient pas votre critère.", "maps": "https://www.google.com/maps/search/?api=1&query=Cr%C3%AAperie+du+Mas+Guilhou+Navacelles"}, {"nom": "La Guinguette de la Vis", "lieu": "Rogues, au bord de la Vis", "note": null, "src": "trop récente pour avoir un volume d'avis fiable", "tel": null, "horaires": "L'été uniquement", "desc": "Guinguette au bord de l'eau sur la route du causse. Non vérifiable côté notes, à ne prendre qu'en dépannage.", "maps": "https://www.google.com/maps/search/?api=1&query=La+Guinguette+de+la+Vis+Rogues"}]}, {"jour": "j3", "date": "Mar 11", "quand": "19h30", "cat": "bistrot", "nom": "Le Qu'es Aquo", "lieu": "27 boulevard du Plan d'Auvergne, Le Vigan", "note": "4,5", "avis": "92 avis TripAdvisor", "tel": null, "horaires": "Ouvert tous les jours, midi et soir", "prix": "Menus du jour à prix doux", "chien": "Terrasse", "desc": "Salle function initRail(){
  var r=q('rail'); if(!r||r.__i)return; r.__i=1;
  var L=q('arwL'),R=q('arwR'),fL=q('fdL'),fR=q('fdR'),dots=q('dots');
  function maj(){
    var max=r.scrollWidth-r.clientWidth;
    L.hidden=r.scrollLeft<8; R.hidden=r.scrollLeft>max-8;
    fL.style.opacity=r.scrollLeft<8?0:1; fR.style.opacity=r.scrollLeft>max-8?0:1;
    var k=Math.round(r.scrollLeft/(r.scrollWidth/D.jours.length));
    [].forEach.call(dots.children,function(c,i){c.classList.toggle('on',i===k)});
  }
  var pas=function(){return (r.querySelector('.vig')||{offsetWidth:200}).offsetWidth+10};
  L.onclick=function(){r.scrollBy({left:-pas()*2,behavior:'smooth'})};
  R.onclick=function(){r.scrollBy({left: pas()*2,behavior:'smooth'})};
  r.addEventListener('scroll',maj,{passive:true});
  if(AUJ>=0){
    // on ouvre le carrousel sur la journee du jour, sans animation
    var c=r.children[AUJ];
    if(c){var x=c.offsetLeft-(r.clientWidth-c.offsetWidth)/2;
          r.scrollLeft=Math.max(0,Math.min(x,r.scrollWidth-r.clientWidth));}
    maj();
  } else {
    maj();
    // hors sejour : petit mouvement au chargement pour signaler que ca defile
    setTimeout(function(){if(r.scrollLeft===0){r.scrollTo({left:34,behavior:'smooth'});
      setTimeout(function(){r.scrollTo({left:0,behavior:'smooth'})},430)}},700);
  }
}

  var m=L.map(el,{scrollWheelZoom:false}).setView(s===1?[43.99,3.60]:[44.15,3.80],10);

  mk(b.lat,b.lon,'B','base',31,popHTML('Votre base',b.lab,'C\'est d\'ici que part chaque journée.',null,null));
  var PTm={}; D.points.forEach(function(p){PTm[p.id]=p});
  js.forEach(function(j,i){
    var n=s===1?i+1:i+8; pts.push([j.geo.lat,j.geo.lon]);
    var t=DTEMP[j.id];
    mk(j.geo.lat,j.geo.lon,n,'',27,popHTML('Jour '+n+' — '+j.geo.lab,
      j.dt.split('·')[0].trim()+' · '+j.geo.alt+' m'+(t!=null?' · '+Math.round(t)+' °C':'')+(j.volant?' · '+j.volant+' de route':''),
      j.titre, j.cover?j.cover.src.replace('width=1200','width=420'):null, encodeURIComponent(j.geo.lab)));
    L.polyline([[b.lat,b.lon],[j.geo.lat,j.geo.lon]],{color:'#8c4a2f',weight:1.3,opacity:.3,dashArray:'4,5'}).addTo(m);
    var vus={};
    j.etapes.forEach(function(e){
      if(!e.pt||!PTm[e.pt])return; var p=PTm[e.pt];
      var k=p.lat.toFixed(3)+p.lon.toFixed(3); if(vus[k])return; vus[k]=1;
      if(Math.abs(p.lat-j.geo.lat)<1e-4&&Math.abs(p.lon-j.geo.lon)<1e-4)return;
      pts.push([p.lat,p.lon]);
      mk(p.lat,p.lon,'','dot',13,popHTML(e.titre.replace(/<[^>]+>/g,''),
        p.lab+' · '+p.alt+' m'+(TEMP[e.pt]!=null?' · '+Math.round(TEMP[e.pt])+' °C':''),

    });
  });
  D.bonus.filter(function(x){return x.sem===s}).forEach(function(x){
    mk(x.lat,x.lon,'+','bonus',24,popHTML(x.lab,x.alt+' m · hors programme',x.desc,null,x.q));

  m.fitBounds(L.latLngBounds(pts).pad(0.16));

/* ---------- METEO ---------- */
function appliquerTemp(){
  Object.keys(TEMP).forEach(function(id){
    var p=PT[id]; if(!p)return;
    var e=document.querySelector('[data-pt="'+id+'"]');
    if(e){var c=e.querySelector('.wx');
      if(!c){c=document.createElement('div');c.className='wx';var m=e.querySelector('.meta');
        m?m.parentNode.insertBefore(c,m.nextSibling):e.appendChild(c);}
      var t=TEMP[id];
      c.className='wx '+(t>=32?'hot':t>=26?'warm':t<=18?'cool':'');
      c.innerHTML='<span class="alt">▲ '+p.alt+' m</span><span class="sep">|</span><span class="t">'+
        (t==null?'—':Math.round(t)+' °C')+'</span><span class="cond">à '+p.h+'h</span>';}
  });
  document.querySelectorAll('.tt[data-t]').forEach(function(s){
    var t=TEMP[s.dataset.t]; s.textContent=tt(t); s.className='tt '+cls(t);});
  D.jours.forEach(function(j){
    var t=DTEMP[j.id]; var v=document.querySelector('.st.tp[data-d="'+j.id+'"]');
    if(v){v.querySelector('b').textContent=t==null?'—':Math.round(t)+' °C';v.className='st tp '+cls(t);}
    var c=q('ch-'+j.id);
    if(c&&t!=null&&t>=34){c.classList.add('on');c.querySelector('.deg').textContent=Math.round(t)+' °C';}
    else if(c)c.classList.remove('on');
  });
  majEchanges();
}

/* ---- Quelle journee faire quand il fait 38 : on echange le contenu, pas la date ----
   Une journee « bloquee » l'est par un marche ou une reservation qui ne se deplacent pas.
   On ne propose un echange que vers une journee libre dont le point haut est nettement
   superieur, et on affiche le gain reel en metres et en degres.                        */
function echanges(){
  var out={}, pris={};
  [0,7].forEach(function(dep){
    var js=D.jours.slice(dep,dep+7);
    var chauds=js.filter(function(j){return DTEMP[j.id]!=null&&DTEMP[j.id]>=34&&j.flex})
                 .sort(function(a,b){return (a.flex.haut-b.flex.haut)||(DTEMP[b.id]-DTEMP[a.id])});
    chauds.forEach(function(h){
      if(!h.flex.ok)return;                               // marche ou reservation : le contenu ne bouge pas
      if(h.flex.haut>=800)return;                         // deja en altitude, rien a faire
      var best=null;
      js.forEach(function(f){
        if(f===h||!f.flex.ok||pris[f.id])return;
        if(DTEMP[f.id]==null)return;
        if(f.flex.haut<h.flex.haut+250)return;            // pas assez de gain d'altitude
        if(DTEMP[f.id]>=DTEMP[h.id])return;               // sa date n'est pas plus fraiche
        if(!best||f.flex.haut>best.flex.haut)best=f;
      });
      if(best){pris[best.id]=1;out[h.id]={vers:best,gain:best.flex.haut-h.flex.haut,
        dt:Math.round(DTEMP[h.id]-DTEMP[best.id])};}
    });
  });
  return out;
}
function panneauSemaine(dep){
  var js=D.jours.slice(dep,dep+7);
  var ts=js.map(function(j){return DTEMP[j.id]}).filter(function(x){return x!=null});
  if(!ts.length||Math.max.apply(null,ts)<34)return '';
  var tri=js.slice().sort(function(a,b){return (DTEMP[b.id]||0)-(DTEMP[a.id]||0)});
  var h='<div class="mto"><div class="mth"><b>Cette semaine passe au-dessus de 34 °C</b>'+
    '<span>Les journées sont classées de la plus chaude à la plus fraîche, avec leur point haut en face. '+
    'Une journée basse un jour brûlant, c\'est ce qu\'il faut éviter.</span></div><div class="mtl">';
  tri.forEach(function(j){
    var t=DTEMP[j.id], n=numJour(j.id), bas=j.flex.haut<500, ch=t!=null&&t>=34;
    h+='<a class="mtr'+(ch&&bas?' bad':ch?' warn':'')+'" href="#'+j.id+'">'+
      '<span class="mtd">J'+n+'<i>'+j.dt.split('·')[0].trim().replace(/^\w+ /,'')+'</i></span>'+
      '<span class="mtt">'+(t==null?'—':Math.round(t)+' °C')+'</span>'+
      '<span class="mta">'+j.flex.haut+' m</span>'+
      '<span class="mtn">'+j.flex.frais+'</span>'+
      '<span class="mtf">'+(j.flex.ok?'déplaçable':'bloquée')+'</span></a>';
  });
  return h+'</div></div>';
}
function majPanneaux(){
  [[0,'sem1'],[7,'sem2']].forEach(function(x){
    var el=q('mto-'+x[1]); if(!el)return;
    var html=panneauSemaine(x[0]);
    el.innerHTML=html; el.style.display=html?'':'none';
  });
}
function numJour(id){for(var i=0;i<D.jours.length;i++)if(D.jours[i].id===id)return i+1;return 0}
function majEchanges(){
  var E=echanges();
  D.jours.forEach(function(j){
    var box=q('sw-'+j.id); if(!box)return;
    var e=E[j.id];
    if(!e){box.style.display='none';box.innerHTML='';return;}
    var f=e.vers, nf=numJour(f.id), nh=numJour(j.id);
    box.style.display='';
    box.innerHTML='<b>Échangez cette journée avec le jour '+nf+'</b>'+
      '<p>Vous êtes annoncés à <strong>'+Math.round(DTEMP[j.id])+' °C</strong> et le point haut de cette '+
      'journée est à <strong>'+j.flex.haut+' m</strong>. Le jour '+nf+' ('+f.dt.split('·')[0].trim()+') '+
      'monte à <strong>'+f.flex.haut+' m</strong> et n\'est annoncé qu\'à <strong>'+Math.round(DTEMP[f.id])+' °C</strong>. '+
      'En permutant les deux, vous gagnez <strong>'+e.gain+' m</strong> de fraîcheur le jour où vous en avez besoin, '+
      'et la journée basse tombe '+e.dt+' °C plus bas.</p>'+
      '<p class="okw"><span>✓</span> Les deux journées sont déplaçables. Celle-ci : '+j.flex.why+
      ' Jour '+nf+' : '+f.flex.why+'</p>'+
      (function(){var jf=(f.dt.split(' ')[0]||'').toLowerCase(), jh=(j.dt.split(' ')[0]||'').toLowerCase();
        var a=(j.flex.pas||{})[jf], b=(f.flex.pas||{})[jh];
        return (a?'<p class="adj"><span>!</span> '+a+'</p>':'')+(b?'<p class="adj"><span>!</span> '+b+'</p>':'');})()+
      '<a href="#'+f.id+'">Voir le jour '+nf+' ›</a>';
  });
  majBloque(); majPanneaux();
}
/* Quand une journee chaude ne PEUT pas etre echangee, on le dit, avec la raison. */
function majBloque(){
  D.jours.forEach(function(j){
    var box=q('bl-'+j.id); if(!box||!j.flex)return;
    var t=DTEMP[j.id];
    var show=(t!=null&&t>=34&&!j.flex.ok&&!q('sw-'+j.id).innerHTML);
    box.style.display=show?'':'none';
    if(show)box.innerHTML='<b>Cette journée ne peut pas être déplacée</b> — '+j.flex.why+
      ' Suivez le repli ci-dessus plutôt que d\'essayer de la décaler.';
  });
}
(function(){
  var ST=function(){return q('wxstatus')};
  var uniq=[],K={};
  D.points.forEach(function(p){var k=p.lat+','+p.lon+','+p.alt;if(!(k in K)){K[k]=uniq.length;uniq.push(p)}p.k=K[k]});
  var lat=uniq.map(function(p){return p.lat}).join(','),lon=uniq.map(function(p){return p.lon}).join(','),
      ele=uniq.map(function(p){return p.alt}).join(',');
  var t=new Date(),iso=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  var S='2026-08-09',E='2026-08-22',fS=iso(t)>S?iso(t):S,fE=iso(new Date(t.getTime()+15*864e5))<E?iso(new Date(t.getTime()+15*864e5)):E;
  var jobs=[];
  if(fS<=fE&&iso(t)<=E)jobs.push(fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&elevation='+ele+
    '&hourly=temperature_2m&daily=temperature_2m_max&timezone=Europe%2FParis&start_date='+fS+'&end_date='+fE)
    .then(function(r){return r.ok?r.json():null}).catch(function(){return null}));
  else jobs.push(Promise.resolve(null));
  jobs.push(fetch('https://climate-api.open-meteo.com/v1/climate?latitude='+lat+'&longitude='+lon+
    '&start_date='+S+'&end_date='+E+'&models=MRI_AGCM3_2_S&daily=temperature_2m_max&timezone=Europe%2FParis')
    .then(function(r){return r.ok?r.json():null}).catch(function(){return null}));
  Promise.all(jobs).then(function(r){
    var A=function(x){return x?(Array.isArray(x)?x:[x]):null}, F=A(r[0]), C=A(r[1]);
    var nf=0,nc=0;
    D.points.forEach(function(p){
      var v=null,src=null;
      if(F&&F[p.k]&&F[p.k].hourly){var H=F[p.k].hourly,i=H.time.indexOf(p.date+'T'+String(p.h).padStart(2,'0')+':00');
        if(i>-1&&H.temperature_2m[i]!=null){v=H.temperature_2m[i];src='f'}}
      if(v==null&&C&&C[p.k]&&C[p.k].daily){var Dd=C[p.k].daily,k=Dd.time.indexOf(p.date);
        if(k>-1&&Dd.temperature_2m_max[k]!=null){v=Dd.temperature_2m_max[k];src='c'}}
      TEMP[p.id]=v; if(src==='f')nf++; if(src==='c')nc++;
    });
    D.jours.forEach(function(j){
      var vs=j.etapes.filter(function(e){return e.pt&&TEMP[e.pt]!=null}).map(function(e){return TEMP[e.pt]});
      DTEMP[j.id]=vs.length?Math.max.apply(null,vs):null;
    });
    appliquerTemp();
    var s=ST(); if(s){var hh=String(t.getHours()).padStart(2,'0')+'h'+String(t.getMinutes()).padStart(2,'0');
      s.innerHTML=(nf?'<strong>'+nf+' étapes en prévision Météo-France</strong>':'')+
        (nf&&nc?' · ':'')+(nc?nc+' étapes en projection climatique':'')+
        (nf||nc?' · relevé à '+hh+'.':'Aucune donnée reçue.');}
  }).catch(function(){var s=ST();if(s)s.textContent='Météo indisponible. Les altitudes restent affichées.'});
})();

window.__PTS=D.points;
