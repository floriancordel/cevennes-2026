ml": "<b>Si vous voulez de la vraie montagne ce jour-là :</b> le <strong>Sentier de Soult</strong> au départ de L'Estréchure, 9,7 km, +436 m, 4h, est la plus belle marche « Cévennes profondes » du secteur — châtaigniers, chênes, pins et sapins jusqu'à 750 m, château de l'Hom, hameau de la Bécédelle. Mais il est à 35 min dans l'autre direction, ce qui porterait la journée à 2h40 de route avec Lasalle. À faire à la place d'une autre journée si le cœur vous en dit. <a href=\"https://www.tourismegard.com/fr/fiche/equipement/sentier-de-soult-l-estrechure_TFO6082090/\">Trace et GPX</a>"}, {"cls": "note prep", "html": "<b>Ce soir, on prépare demain.</b> Départ 8h30 pour Florac, et vous <strong>déjeunerez du marché</strong> : prévoyez juste la glacière, les couverts et une nappe. Emportez les maillots, le pique-nique se fait les pieds dans le Tarn."}], "alt_max": 400, "alt_min": 280, "rando": ["9,7 km", "+200 m"], "volant": "1h35", "chaud": {"texte": "Soudorgues est à 400 m et le parcours comporte un gué. Au-delà de 35 °C, partez à 8h ou remplacez par la <strong>Voie Verte de la Mimente</strong>, plate, ombragée et le long de l'eau.", "lieu": "Voie Verte de la Mimente", "alt": 545}, "geo": {"lat": 44.0169, "lon": 3.8299, "lab": "Soudorgues", "alt": 400}, "base": {"lat": 44.115, "lon": 3.895, "lab": "Col de Lamira"}, "bonus": [{"k": "rando", "titre": "Le sentier de l'Amous, Saint-Sébastien-d'Aigrefeuille", "meta": "3,4 km · 2h · <strong>très ombragé, au fil de l'eau</strong> · 30 min de Lasalle", "txt": "La rando la plus courte et la plus fraîche de la réserve : elle suit le ruisseau presque tout du long. Parfaite en fin de journée, ou pour un jour où on ne veut rien forcer.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=44.106354%2C3.995293"}, {"cls": "l-gpx", "txt": "Trace GPX", "href": "https://www.tourismegard.com/fr/fiche/equipement/sentier-du-patrimoine-autour-de-l-amous-saint-sebastien-d-aig"}]}, {"k": "village", "titre": "Le col du Rédarès et Saint-Roman-de-Codières", "meta": "15 min de Lasalle · 600 m", "txt": "La petite route de crête entre Lasalle et le Vigan, avec la vue sur les deux vallées. Un col, deux hameaux, personne. À prendre au retour si vous voulez rentrer par le haut plutôt que par la vallée.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Col+du+R%C3%A9dar%C3%A8s%2C+30440"}]}]}, {"id": "j12", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Florac-panorama.jpg?width=1200", "alt": "Florac", "cap": "Florac, au confluent du Tarn, du Tarnon et de la Mimente · <a href=\"https://commons.wikimedia.org/wiki/File:Florac-panorama.jpg\">Wikimedia Commons</a>"}, "dt": "Jeudi 20 août", "titre": "Florac, la capitale du Parc national, par la plus belle route des Cévennes", "pitch": "Une heure dix de Corniche des Cévennes, cette route de crête qui était une voie gauloise avant de devenir route royale en 1690, avec un point haut à 1018 mètres au col des Faïsses. Au bout, Florac : une sous-préfecture de deux mille habitants coincée au confluent de trois rivières, où une source jaillit d'un éboulis en plein centre-ville et où le château abrite le siège du Parc national. C'est jour de marché. Vous achetez le déjeuner, vous le mangez sous les peupliers au bord du Tarn, et vous passez l'après-midi sur une ancienne voie ferrée qui longe la Mimente, plate et fraîche, avec la rivière à portée de museau.", "tags": [{"cls": "t-marche", "txt": "Marché du jeudi"}, {"cls": "t-village", "txt": "Florac · 549 m"}, {"cls": "t-rando", "txt": "Voie verte 2h15 · plat"}, {"cls": "t-eau", "txt": "Baignade dans le Tarn"}, {"cls": "t-tot", "txt": "2h30 de volant · max 1h10 d'affilée"}], "etapes": [{"type": "trajet", "heure": "8h30", "html": "Col de Lamira → Florac · D907 puis Corniche des Cévennes · 50 km · <strong>1h10</strong> · cols Saint-Pierre 597 m, de l'Exil 704 m, de la Solpérière 1010 m, <strong>des Faïsses 1018 m</strong>, du Rey 987 m", "fin": "Départ", "vers": "Arrivée et stationnement à Florac", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Maison+du+Tourisme+et+du+Parc+national+des+C%C3%A9vennes+Florac", "alt": 549, "km": "50", "duree": "1h10", "route": "D907 puis Corniche des Cévennes", "de_pt": "b_j12_8", "vers_pt": "p51", "de_lib": "Col de Lamira", "vers_lib": "Florac", "de_alt": 400, "vers_alt": 549}, {"type": "village", "heure": "9h45", "icone": "i-village", "titre": "Arrivée et stationnement à Florac", "pt": "p51", "blocs": [{"t": "meta", "html": "549 m · <strong>parking du Rond-Point de la Gare, 120 places, gratuit</strong>"}, {"t": "access", "warn": true, "html": "<b>Deux pièges de stationnement, ce jeudi précisément</b> — Un arrêté municipal ferme <strong>le côté impair de l'Esplanade et la place du Souvenir à la circulation et au stationnement tous les jeudis de 6h à 14h</strong> jusqu'au 27 août : ne visez surtout pas ces places. Allez directement au <strong>parking du Rond-Point de la Gare</strong>, 120 places et gratuit, qui est aussi la Maison du Tourisme et du Parc national, donc votre point de départ de l'après-midi. Florac compte plus de 700 places dont seulement 10 % payantes."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Maison+du+Tourisme+et+du+Parc+national+des+C%C3%A9vennes+Florac", "txt": "Fiche et avis"}, {"cls": "l-web", "href": "https://www.floractroisrivieres.fr/stationnement/", "txt": "Parkings de Florac"}]}]}, {"type": "marche", "heure": "9h50", "icone": "i-basket", "titre": "Marché du jeudi", "pt": "p52", "blocs": [{"t": "meta", "html": "8h-13h selon la mairie, 8h-12h selon l'office de tourisme : comptez que ça se démonte vers 12h30 · place de l'Esplanade, place de la Mairie jusqu'à l'entrée du château, et place Maury"}, {"t": "p", "html": "Producteurs et artisans du secteur, avec des animations musicales et théâtrales l'été. La mairie prévient que l'affluence estivale rend la circulation piétonne difficile : <strong>chien en laisse courte, et arrivez avant 10h30</strong>."}, {"t": "shop", "html": "<b>C'est ici que vous achetez le déjeuner</b> — pain, charcuterie de pays, pélardon, tomates, fruits, et de quoi grignoter sur la route du retour. Vous mangerez au bord du Tarn dans deux heures, donc prenez aussi de quoi boire."}, {"t": "liens", "liens": [{"cls": "l-web", "href": "https://www.floractroisrivieres.fr/marche-hebdomadaire/", "txt": "Fiche mairie"}]}]}, {"type": "village", "heure": "11h20", "icone": "i-village", "titre": "Flânerie : « Florac, une source dans la ville »", "pt": "p53", "blocs": [{"t": "meta", "html": "Circuit balisé officiel du Parc national · 2,4 km · +72 m · 1h · très facile · 13 points patrimoniaux"}, {"t": "p", "html": "Le <strong>château du Parc national</strong> : bâti sur un château féodal, racheté et restauré par l'État, il abrite le siège de l'établissement public. <strong>Il ne se visite pas</strong>, mais la cour est en accès libre toute l'année, animaux acceptés. C'est aussi là qu'on demande l'état des sentiers."}, {"t": "p", "html": "Puis la <strong>source du Pêcher</strong>, dans le parc Paul Arnal : une résurgence qui jaillit d'un éboulis rocheux après avoir traversé toute l'épaisseur du causse Méjean. La retenue du Vibron alimentait autrefois moulins et vivier, des cygnes y vivent aujourd'hui. Accès libre, gratuit, <strong>chiens admis</strong>, et c'est décrit officiellement comme « calme et ombragé »."}, {"t": "p", "html": "Sur le chemin, l'ancienne gare, l'église, le temple, les ruelles et les placettes. Et si l'artisanat vous tente, l'<strong>Atelier Tuffery</strong>, la plus ancienne manufacture de jeans de France, est ouvert <strong>9h-19h en continu du lundi au samedi</strong> jusqu'au 29 août, ZA Saint-Julien-du-Gourg, <a class=\"tel\" href=\"tel:+33466450094\">04 66 45 00 94</a>."}, {"t": "liens", "liens": [{"cls": "l-trk", "href": "https://destination.cevennes-parcnational.fr/trek/37884-Florac%2C-une-source-dans-la-ville", "txt": "Circuit et GPX"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Source+du+P%C3%AAcher+Florac", "txt": "Source du Pêcher"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Atelier+Tuffery+Florac", "txt": "Atelier Tuffery"}]}]}, {"type": "trajet", "heure": "", "html": "Florac centre → Pont du Tarn · chemin Azinières · 2,5 km · <strong>5 min</strong>", "fin": "Fin de la flânerie", "vers": "Pique-nique et baignade au Pont du Tarn", "nav": "https://www.google.com/maps/dir/?api=1&amp;destination=44.3366674%2C3.58773736", "alt": 530, "km": "2,5", "duree": "5min", "route": "", "de_pt": "p53", "vers_pt": "p54", "de_lib": "Florac centre", "vers_lib": "Pont du Tarn", "de_alt": 549, "vers_alt": 530}, {"type": "eau", "heure": "12h30", "icone": "i-swim", "titre": "Pique-nique et baignade au Pont du Tarn", "pt": "p54", "blocs": [{"t": "meta", "html": "Chemin Azinières, Florac Trois Rivières · site officiellement contrôlé, qualité de l'eau « bonne » au 21 juillet 2026 · non surveillé · 2h sur place"}, {"t": "p", "html": "Juste à la sortie de Florac vers Ispagnac, un peu en amont du confluent du Tarn et du Tarnon. Lozère Tourisme le décrit sous « l'ombre des peupliers » : <strong>c'est le seul spot du secteur dont l'ombre est explicitement documentée</strong>, ce qui en fait le bon choix pour un chien un 20 août."}, {"t": "access", "warn": false, "html": "<b>Stationnement</b> — Le long du chemin Azinières. Le <strong>camping Le Pont du Tarn est mitoyen : son parking est privé</strong>, réservé à sa clientèle. Aucun équipement public documenté sur le site.<br><em>Plan B s'il pleut : <strong>Au Pêcher Mignon</strong>, 13 place Louis Dides, crêperie participative où l'on compose sa galette et où les boissons sont en self-service. TripAdvisor 4,5 / 5 sur 194 avis, ouvert le jeudi de 9h à 22h, produits locaux, tout maison, options végétariennes et vegan. 04 66 45 14 28. Original et généreux.</em>"}, {"t": "access", "warn": true, "html": "<b>Cyanobactéries — le point le plus important de la journée</b><br>La mairie de Florac maintient un suivi actif : au <strong>28 juillet 2026</strong>, phase 1 « Surveillance » sur <strong>la Mimente, le Tarnon et le Tarn</strong>. Le risque n'est pas la baignade mais <strong>l'ingestion des amas verdâtres par le chien</strong>, qui peut être mortelle en quelques heures.<br><strong>Vérifiez la carte la veille au soir sur <a href=\"https://www.tarn-amont.fr/cyanobacteries/\">tarn-amont.fr/cyanobacteries</a></strong>, lisez les panneaux affichés sur place, tenez le chien en laisse au bord de l'eau, et ne le laissez ni boire la rivière, ni lécher les galets, ni mâchouiller ce qui flotte."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Le+Pont+du+Tarn+Florac", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.3366674%2C3.58773736", "txt": "Itinéraire · 44.3366674, 3.58773736"}]}]}, {"type": "trajet", "heure": "", "html": "Pont du Tarn → parking de la Gare, Florac · 2,5 km · <strong>5 min</strong>", "fin": "On se sèche", "vers": "la Voie Verte de la Mimente", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.327,3.596", "alt": 545, "km": "2,5", "duree": "5min", "route": "", "de_pt": "p54", "vers_pt": "p55", "de_lib": "Pont du Tarn", "vers_lib": "parking de la Gare, Florac", "de_alt": 530, "vers_alt": 545}, {"type": "rando", "heure": "14h50", "icone": "i-hike", "titre": "Rando : la Voie Verte de la Mimente", "pt": "p55", "blocs": [{"t": "meta", "html": "Aller-retour libre, comptez 2h15 · <strong>quasi plat, 541 à 634 m</strong> · départ Maison du Tourisme et du Parc, même parking · poteaux directionnels"}, {"t": "p", "html": "L'ancienne plateforme du chemin de fer départemental, large et régulière, qui <strong>longe la Mimente en permanence</strong>. C'est de très loin le meilleur terrain de la semaine pour un chien : aucun dénivelé, aucune pâture, aucune clôture, sol régulier qui préserve les coussinets, et de l'eau accessible en continu. Panneaux d'interprétation tout du long, passerelle sur la rivière au lieu-dit « Pont Manqué ». La section Florac – La Salle Prunet est revêtue et accessible aux poussettes."}, {"t": "p", "html": "Demi-tour quand vous voulez : le tracé intégral jusqu'à Saint-Julien-d'Arpaon fait 16 km aller-retour, vous n'en ferez que la moitié. Vous marchez au passage sur le <strong>GR70, le chemin de Stevenson</strong>, qui emprunte le même tracé."}, {"t": "p", "html": "<em>Alternative sportive au même départ : <strong>Gralhon</strong>, 8,3 km, +457 m, 2h30, hameaux de schiste et de calcaire, panoramas sur Florac et la vallée du Tarnon, source ferrugineuse de Salce, loutres et castors. Plus beau, mais plus raide et partiellement exposé sur le causse.</em>"}, {"t": "liens", "liens": [{"cls": "l-trk", "href": "https://geotrek-admin.cevennes-parcnational.net/api/fr/treks/95019/voie-verte-florac-a-saint-julien-darpaon.gpx", "txt": "Télécharger le GPX"}, {"cls": "l-web", "href": "https://destination.cevennes-parcnational.fr/trek/95019-Voie-verte---Florac-a-Saint-Julien-d-Arpaon", "txt": "Fiche officielle"}, {"cls": "l-trk", "href": "https://www.decathlon-outdoor.com/fr-fr/explore/france/balade-a-la-butte-de-gralhon-et-fil-du-tarn-6231d97060a00", "txt": "Decathlon Outdoor"}]}]}, {"type": "trajet", "heure": "17h10", "html": "Florac → col de Lamira · Corniche des Cévennes · 50 km · <strong>1h10</strong> &nbsp;·&nbsp; <strong>Total du jour : 2h30 de conduite, plus longue traite 1h10</strong>", "fin": "Fin de la rando", "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115%2C3.895", "alt": null, "km": "50", "duree": "1h10", "route": "Corniche des Cévennes", "de_pt": "p55", "vers_pt": null, "de_lib": "Florac", "vers_lib": "col de Lamira", "de_alt": 545, "vers_alt": 400}, {"type": "eat", "heure": "19h00", "icone": "i-eat", "titre": "Dîner à la maison", "blocs": [{"t": "shop", "html": "<b>Au menu</b> — Ce qui reste du marché de Florac : charcuterie, fromages de Lozère, tomates, pain. Et une omelette si vous avez pris des œufs.<br><em>Vous rentrez à 18h20, donc rien ne presse. C'est la dernière soirée avant le dernier jour complet.</em>"}]}], "notes": [{"cls": "note plan", "html": "<b>Départ à 8h30, l'une des trois exceptions du séjour</b> — le marché du jeudi de Florac se termine vers 13h, et la route en fait 1h15. Si vous préférez tenir le 9h30 : partez à 9h30, vous serez sur le marché à 10h45, vous aurez une heure pleine avant qu'il ne remballe, et tout le reste de la journée glisse d'une heure. La rando de la Voie Verte est plate et ombragée, elle passe très bien à 16h."}, {"cls": "note warn", "html": "<b>Pourquoi pas les gorges du Tarn.</b> Sainte-Enimie et Castelbouc sont à <strong>1h50 d'une seule traite</strong> depuis votre base, soit 3h40 aller-retour minimum : c'est au-delà de vos deux limites, et de loin. Le Mont Lozère et Le Pont-de-Montvert sont à 1h25, donc également hors budget. Florac à 1h10 est le point le plus lointain qui rentre dans le cadre, et c'est aussi le plus riche : marché, capitale du Parc, trois rivières et une source en ville."}, {"cls": "note plan", "html": "<b>Variante canicule</b> si le thermomètre dépasse 32 °C : la Voie Verte reste le bon choix, mais partez plutôt vers 16h et allongez la baignade du Pont du Tarn. Second spot officiel à 3 min du centre si le premier est pris : le <strong>Pont de Barre</strong> sur le Tarnon, plage de sable en rive droite et petite cascade sur un seuil, à 700 m du rond-point sur la route de Meyrueis. <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=44.3126975%2C3.59853059\">Itinéraire · 44.3126975, 3.59853059</a>"}], "alt_max": 549, "alt_min": 530, "rando": ["2h15", "plat"], "volant": "2h30", "chaud": {"texte": "La Voie Verte longe la rivière en permanence et Florac est à 549 m. Par forte chaleur, décalez la marche à 16h et allongez la baignade au Pont du Tarn.", "lieu": "Voie Verte de la Mimente", "alt": 545}, "geo": {"lat": 44.3263, "lon": 3.5958, "lab": "Florac", "alt": 549}, "base": {"lat": 44.115, "lon": 3.895, "lab": "Col de Lamira"}, "bonus": [{"k": "village", "titre": "Ispagnac et le pont de Quézac", "meta": "15 min de Florac · 520 m · l'entrée des gorges du Tarn", "txt": "<strong>C'est le seul moyen de voir les gorges du Tarn sans casser vos plafonds de route.</strong> Ispagnac, « le jardin de la Lozère », est le dernier village avant que le Tarn n'entre dans les gorges, et le pont de Quézac, bâti au XIV<sup>e</sup> pour les pèlerins, l'enjambe juste à côté. Sainte-Enimie est encore à 30 minutes de plus : à vous de voir, mais la journée y passerait.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Ispagnac%2C+48320"}, {"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Pont+de+Qu%C3%A9zac%2C+48320+Ispagnac"}]}, {"k": "eau", "titre": "Les Pierres Plates de Cocurès", "meta": "8 min de Florac · sur le Tarn", "txt": "Le spot de baignade des gens du coin, en amont de Florac : dalles plates au bord du Tarn, eau claire, peu de monde en semaine. Le repli si le Pont du Tarn est pris.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Cocur%C3%A8s%2C+48400"}]}]}, {"id": "j13", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Bambouseraie_de_Prafrance_20100904_031.jpg?width=1200", "alt": "Bambouseraie de Prafrance", "cap": "La Bambouseraie de Prafrance, Générargues · <a href=\"https://commons.wikimedia.org/wiki/File:Bambouseraie_de_Prafrance_20100904_031.jpg\">Wikimedia Commons</a>"}, "dt": "Vendredi 21 août", "titre": "Une cathédrale de bambous, un train à vapeur, et les poteries d'Anduze", "pitch": "La journée la plus douce du séjour, et celle où le chien est le mieux traité. Douze hectares de bambous géants font de l'ombre sur la totalité du parc : on y marche dans une lumière verte qui tombe en rais, et il l'accompagne gratuitement, en laisse, partout. L'après-midi, quarante minutes de vraie locomotive à vapeur le long du Gardon, viaducs et tunnels compris, avec lui à bord pour 4,50 €. Et pour finir, Anduze en fin de journée : une fontaine coiffée de tuiles vernissées orientales de 1649, des halles qui tiennent marché depuis 1457, et neuf poteries qui fabriquent toujours le vase d'Anduze avec la forme qu'il a depuis le XVII<sup>e</sup> siècle.", "tags": [{"cls": "t-visite", "txt": "Bambouseraie 15,50 €"}, {"cls": "t-route", "txt": "Train à vapeur"}, {"cls": "t-village", "txt": "Anduze"}, {"cls": "t-eau", "txt": "Baignade"}, {"cls": "t-tot", "txt": "1h30 de volant · max 30 min d'affilée"}], "etapes": [{"type": "trajet", "heure": "9h30", "html": "Col de Lamira → Bambouseraie, Générargues · 20 km · <strong>30 min</strong>", "fin": "Départ", "vers": "Bambouseraie en Cévennes", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Bambouseraie+en+C%C3%A9vennes+G%C3%A9n%C3%A9rargues", "alt": 140, "km": "20", "duree": "30min", "route": "", "de_pt": "b_j13_9", "vers_pt": "p56", "de_lib": "Col de Lamira", "vers_lib": "Bambouseraie, Générargues", "de_alt": 400, "vers_alt": 140}, {"type": "visit", "heure": "10h00", "icone": "i-ticket", "titre": "Bambouseraie en Cévennes", "pt": "p56", "blocs": [{"t": "meta", "html": "552 rue de Montsauve, 30140 Générargues · <strong>9h-19h non-stop, 7j/7</strong> · adulte 15,50 € · <strong>parking gratuit</strong> · <a class=\"tel\" href=\"tel:+33466617047\">04 66 61 70 47</a>"}, {"t": "p", "html": "<strong>Chien accepté en laisse dans tout le jardin, sans supplément.</strong> C'est le meilleur site du séjour pour un chien sensible à la chaleur : les bambous géants ombragent la totalité du parc. Vallon du dragon, village laotien, serre Viala. 170<sup>e</sup> anniversaire en 2026. Comptez 2h30."}, {"t": "access", "warn": false, "html": "<b>Deux détails</b> — Les chiens sont <strong>interdits pendant les nocturnes « Arborescences »</strong>, mais vous y allez en journée. Et il y a <strong>peu de poubelles dans le parc</strong> : prenez vos sacs."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Bambouseraie+en+C%C3%A9vennes+G%C3%A9n%C3%A9rargues", "txt": "Fiche et avis"}, {"cls": "l-web", "href": "https://bambouseraie.fr/", "txt": "bambouseraie.fr"}]}]}, {"type": "trajet", "heure": "", "html": "Générargues → Anduze, gare du train à vapeur · 5 km · <strong>10 min</strong>", "fin": "Fin de la visite", "vers": "Tife Tafe", "nav": "https://www.google.com/maps/search/?api=1&query=Tife+Tafe+Anduze", "alt": null, "km": "5", "duree": "10min", "route": "", "de_pt": "p56", "vers_pt": null, "de_lib": "Générargues", "vers_lib": "Anduze, gare du train à vapeur", "de_alt": 140, "vers_alt": 130}, {"type": "eat", "heure": "12h45", "icone": "i-eat", "titre": "Déjeuner — Tife Tafe, Anduze", "blocs": [{"t": "meta", "html": "5 place Notre-Dame · <strong>vendredi 12h-13h30, créneau très court</strong> · 04 66 61 93 70 · <strong>chiens acceptés en salle ET en terrasse</strong>"}, {"t": "note", "html": "Google 4,8 / 5 · 461 avis &nbsp;|&nbsp; TripAdvisor 4,7 / 5 · 289 avis"}, {"t": "p", "html": "Un caviste doublé d'un restaurant et d'un bar à bières, sur la place Notre-Dame. Cuisine de produits frais de saison, savoureuse et un peu audacieuse, avec une vraie offre végétarienne, ce qui est rare dans le coin. C'est la meilleure adresse d'Anduze et elle accepte le chien à l'intérieur, ce qui n'arrive presque jamais."}, {"t": "access", "html": "<b>Réservez, et soyez à l'heure</b> — Le service ne dure qu'une heure et demie. Garez-vous près de la gare du train à vapeur, votre voiture y restera l'après-midi.<br><em>Alternative de même niveau :</em> <strong>L'Atelier de Pierre</strong>, 3 rue du Plan de Brie, 4,8 / 5 sur 690 avis Google, carte qui suit les marchés, belle cave. Réservation obligatoire."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&query=Tife+Tafe+Anduze", "txt": "Fiche et avis"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&query=L%27Atelier+de+Pierre+Anduze", "txt": "Fiche et avis"}]}]}, {"type": "train", "heure": "14h30", "icone": "i-train", "titre": "Train à Vapeur des Cévennes, aller-retour depuis Anduze", "blocs": [{"t": "meta", "html": "Départ Anduze <strong>14h30</strong> → Saint-Jean 15h10 · retour Saint-Jean <strong>15h30</strong> → Anduze 16h10 · arrivez 30 min avant"}, {"t": "p", "html": "Aller-retour adulte <strong>17,50 €</strong>, <strong>chien accepté en laisse pour 4,50 €</strong> — le même supplément couvre l'aller simple comme l'aller-retour. Quarante minutes le long du Gardon, viaducs et tunnels, tractées par une vraie locomotive à vapeur. <strong>Prenez un wagon ouvert</strong> : bien plus supportable pour le chien qu'un compartiment fermé, et bien plus beau."}, {"t": "p", "html": "<em>Autres départs si vous décalez : d'Anduze à 9h30, 11h30, 14h30 et 16h30 ; de Saint-Jean-du-Gard à 10h30, 13h30, 15h30 et 17h30.</em>"}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Gare+du+Train+%C3%A0+Vapeur+des+C%C3%A9vennes+Anduze", "txt": "Gare d'Anduze"}, {"cls": "l-web", "href": "https://www.trainavapeur.com/preparer-mon-voyage/", "txt": "Horaires et tarifs"}]}]}, {"type": "village", "heure": "16h30", "icone": "i-village", "titre": "Anduze, à la bonne heure", "pt": "p58", "blocs": [{"t": "meta", "html": "1h30 · <strong>jamais entre 11h et 17h en août</strong>, c'est saturé"}, {"t": "p", "html": "La <strong>Fontaine Pagode</strong> de 1649, coiffée de tuiles vernissées orientales, plantée au milieu du bourg : c'est la carte postale. Autour, les ruelles médiévales, la rue Droite, le Plan de Brie, la tour de l'Horloge, et la <strong>place couverte</strong> dont les halles accueillent un marché <strong>depuis 1457</strong>. Le <strong>parc des Cordeliers</strong> offre de l'ombre et un chêne des Canaries de 230 ans rapporté d'Amérique par La Fayette."}, {"t": "p", "html": "Et surtout les <strong>poteries</strong>. La Route du Vase d'Anduze fédère neuf ateliers ; le plus visitable est <strong>Poterie d'Anduze — Les Enfants de Boisset</strong>, qui ouvre son atelier. Le vase d'Anduze, avec ses guirlandes et ses macarons, est né ici au XVII<sup>e</sup> et n'a jamais changé de forme. Attention, plusieurs poteries sont sur les communes voisines de Tornac et Générargues, pas dans le bourg."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Fontaine+Pagode+Anduze", "txt": "Fontaine Pagode"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Poterie+d%27Anduze+Les+Enfants+de+Boisset", "txt": "Les Enfants de Boisset"}, {"cls": "l-web", "href": "https://www.vase-anduze.fr/", "txt": "Route du Vase d'Anduze"}]}]}, {"type": "trajet", "heure": "18h00", "html": "Anduze → Falguière · D907 par Générargues et Corbès · 14 km · <strong>25 min</strong>", "fin": "Fin de la flânerie", "vers": "la Falguière, dernière baignade dans le Gardon", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Falgui%C3%A8re+Saint-Jean-du-Gard+baignade", "alt": null, "km": "14", "duree": "25min", "route": "D907 par Générargues et Corbès", "de_pt": "p58", "vers_pt": null, "de_lib": "Anduze", "vers_lib": "Falguière, Saint-Jean-du-Gard", "de_alt": 130, "vers_alt": 210}, {"type": "eau", "heure": "18h15", "icone": "i-swim", "titre": "Dernière baignade", "blocs": [{"t": "access", "warn": true, "html": "<b>Évitez les « plages » d'Anduze</b> — Le Castel Rose et L'Arche sont d'abord les <strong>noms de deux campings</strong> : les points de prélèvement portent leur nom parce que l'analyse se fait à leur hauteur, mais votre GPS vous conduira à un accueil de camping dont le parking est privé. Le seul spot public de référence est <strong>Le Pont d'Anduze</strong>, décrit comme le lieu familial du secteur, eau peu profonde et plage de sable — mais son stationnement n'est pas mieux documenté, et Anduze est bondée en été.<br><strong>Le choix sûr</strong> : remontez vers Saint-Jean et finissez la semaine où vous l'avez commencée, à <strong>Falguière</strong> (10 min de la base), ou aux <strong>Gorges de Capoue</strong> si vous voulez du calme garanti et un parking confirmé."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Falgui%C3%A8re+Saint-Jean-du-Gard+baignade", "txt": "Falguière"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Baignade+les+Gorges+de+Capoue+Saint-Andr%C3%A9-de-Valborgne", "txt": "Gorges de Capoue"}]}]}, {"type": "trajet", "heure": "19h40", "html": "Falguière → Saint-Jean-du-Gard · la petite route de la rive gauche · 5 km · <strong>10 min</strong>", "fin": "On se sèche une dernière fois", "vers": "L'Oronge, place du marché à Saint-Jean-du-Gard", "nav": "https://www.google.com/maps/dir/?api=1&destination=L%27Oronge%2C+Saint-Jean-du-Gard", "alt": null, "km": "5", "duree": "10min", "route": "la petite route de la rive gauche", "de_pt": null, "vers_pt": null, "de_lib": "Falguière", "vers_lib": "Saint-Jean-du-Gard", "de_alt": 210, "vers_alt": 197}, {"type": "eat", "heure": "20h00", "icone": "i-eat", "titre": "Dernier dîner — L'Oronge, Saint-Jean-du-Gard", "blocs": [{"t": "meta", "html": "Place de la Révolution · ouvert du mercredi au dimanche · menu 3 services 38 €, menu Le Curieux 47 € · 04 66 85 30 34"}, {"t": "note", "html": "Google 4,9 / 5 · 98 avis &nbsp;|&nbsp; TripAdvisor 4,7 / 5 · 91 avis — la meilleure note de tout le séjour"}, {"t": "p", "html": "Un ancien relais de diligence du XVII<sup>e</sup> en plein cœur du village, avec des terrasses ouvertes sur la vallée du Gardon. Tenu par un jeune couple : <strong>Camille Delorme-Krempp</strong>, cheffe pâtissière formée à Ferrandi et passée par des étoilés, et <strong>Théodore Delorme</strong>, formé à Lyon chez Christian Têtedoie. Cuisine construite strictement sur le terroir et la saison. Les avis saluent unanimement les desserts, la carte des vins et l'accueil."}, {"t": "access", "warn": true, "html": "<b>Réservez maintenant, pas la semaine prochaine</b> — Un vendredi soir d'août, c'est complet. Appelez dès aujourd'hui et <strong>demandez pour le chien</strong> : la politique animaux n'est pas publiée, mais il y a plusieurs terrasses, ce qui joue en votre faveur.<br><em>Si c'est complet :</em> <strong>Lettres et Mets</strong>, crêperie, 1071 avenue René Boudon, TripAdvisor 4,8 / 5, terrasse végétalisée avec brumisateurs, chiens acceptés, 07 88 74 22 97."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&query=L%27Oronge+Saint-Jean-du-Gard", "txt": "Fiche et avis"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&query=Lettres+et+Mets+Saint-Jean-du-Gard", "txt": "Fiche et avis"}]}]}, {"type": "trajet", "heure": "22h15", "html": "Saint-Jean-du-Gard → col de Lamira · la petite route du col, phares et prudence · 6 km · <strong>12 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 1h30 de conduite</strong>", "fin": "Fin du dernier dîner", "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115%2C3.895", "alt": null, "km": "6", "duree": "12min", "route": "la petite route du col, phares et prudence", "de_pt": null, "vers_pt": null, "de_lib": "Saint-Jean-du-Gard", "vers_lib": "col de Lamira", "de_alt": 197, "vers_alt": 400}], "strip": [{"page": "https://commons.wikimedia.org/wiki/File:Chemin_de_fer_%C3%A0_vapeur_des_C%C3%A9vennes.jpg", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Chemin_de_fer_%C3%A0_vapeur_des_C%C3%A9vennes.jpg?width=800", "alt": "Train à vapeur des Cévennes", "cap": "Le train à vapeur Anduze — Saint-Jean"}, {"page": "https://commons.wikimedia.org/wiki/File:Anduze-Vase_Boisset-20130414.jpg", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Anduze-Vase_Boisset-20130414.jpg?width=800", "alt": "Vase d'Anduze", "cap": "Le vase d'Anduze, poterie Boisset"}], "notes": [{"cls": "note prep", "html": "<b>Ce soir, on boucle.</b> Valises faites, glacière prête pour les achats de demain matin au marché de producteurs. Et si vous voulez rapporter une poterie, achetez-la <strong>aujourd'hui</strong> : demain matin il n'y aura que des producteurs."}], "alt_max": 140, "alt_min": 130, "rando": null, "volant": "1h30", "chaud": {"texte": "<strong>Anduze est à 130 m, mais la Bambouseraie est intégralement à l'ombre des bambous géants.</strong> C'est précisément la visite à faire un jour de canicule. Gardez Anduze pour 16h30, jamais avant.", "lieu": "Bambouseraie de Prafrance", "alt": 140}, "geo": {"lat": 44.0596, "lon": 3.9683, "lab": "Générargues", "alt": 140}, "base": {"lat": 44.115, "lon": 3.895, "lab": "Col de Lamira"}, "bonus": [{"k": "village", "titre": "Anduze, la poterie et le parc des Cordeliers", "meta": "sur place · gratuit", "txt": "Le vase d'Anduze naît ici au XVII<sup>e</sup> siècle, et deux ateliers historiques se visitent encore librement. Juste à côté, le parc des Cordeliers et sa fontaine-pagode couverte de tuiles vernissées : cinq minutes à pied depuis la place Notre-Dame.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Parc+des+Cordeliers%2C+Anduze"}, {"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Poterie+d%27Anduze"}]}, {"k": "visit", "titre": "La grotte de Trabuc, si vous l'avez ratée dimanche", "meta": "14 °C · 1h · 20 min d'Anduze", "txt": "Deuxième et dernière occasion du séjour : elle est à vingt minutes d'Anduze, sur la route du retour. Mêmes réserves qu'au jour 8 pour le chien.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Grotte+de+Trabuc%2C+30140+Mialet"}]}]}, {"id": "j14", "dt": "Samedi 22 août · départ", "titre": "Un dernier café, un dernier marché, une dernière trempette", "pitch": "Le marché de producteurs du samedi est petit, mais c'est celui où vous croiserez les gens qui ont fait ce que vous mangez depuis deux semaines. Prenez le petit-déjeuner au Café Rando, boutique officielle du Chemin de Stevenson : c'est le bon endroit pour finir un séjour cévenol.", "tags": [{"cls": "t-marche", "txt": "Marché de producteurs"}, {"cls": "t-eau", "txt": "Dernière baignade"}, {"cls": "t-tot", "txt": "45 min de volant"}], "etapes": [{"type": "trajet", "heure": "9h00", "html": "Col de Lamira → centre de Saint-Jean-du-Gard · 6 km · <strong>12 min</strong>", "fin": "Départ", "vers": "Le Café Rando", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Le+Caf%C3%A9+Rando+Saint-Jean-du-Gard", "alt": 197, "km": "6", "duree": "12min", "route": "", "de_pt": "b_j14_9", "vers_pt": "p59", "de_lib": "Col de Lamira", "vers_lib": "centre de Saint-Jean-du-Gard", "de_alt": 400, "vers_alt": 197}, {"type": "eat", "heure": "9h15", "icone": "i-eat", "titre": "Petit-déjeuner — Le Café Rando", "pt": "p59", "blocs": [{"t": "meta", "html": "96 Grand Rue · ouvert 7h30-22h, fermé le jeudi · petit-déjeuner 8 € · <strong>chiens acceptés</strong> · <a class=\"tel\" href=\"tel:+33688494555\">06 88 49 45 55</a>"}, {"t": "p", "html": "Café de Pays et boutique officielle du Chemin de Stevenson, trois salles et une terrasse ombragée. Ils font aussi des <strong>paniers pique-nique à partir de 8 €</strong> : parfait pour la route du retour."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Le+Caf%C3%A9+Rando+Saint-Jean-du-Gard", "txt": "Fiche et avis"}]}]}, {"type": "marche", "heure": "10h00", "icone": "i-basket", "titre": "Marché de producteurs", " t", "date": "2026-08-18", "h": 16}], "sections": {"courses": "<div class=\"box\">\n  <h4>Le rythme des courses</h4>\n  <table class=\"ref\">\n    <tr><th>Quand</th><th>Où</th><th>Pour quoi</th></tr>\n    <tr><td>Dim 9, en route</td><td data-l=\"Où\">Dernier supermarché sur votre trajet, ou Ganges</td><td data-l=\"Pour quoi\">Base de dépannage : pain, œufs, tomates, melon, jambon, huile d'olive, café, eau. Plus la gamelle pliable du chien.</td></tr>\n    <tr><td>Lun 10, 13h30</td><td data-l=\"Où\"><strong>Terres d'Aigoual</strong>, L'Espérou</td><td data-l=\"Pour quoi\">Oignons doux AOP, pélardons, charcuterie de pays, miel de châtaignier. C'est le dîner du soir et une partie du pique-nique de mardi.</td></tr>\n    <tr><td>Lun 10, 16h30</td><td data-l=\"Où\"><strong>Coopérative Origine Cévennes</strong>, Saint-André-de-Majencoules<br><span style=\"color:var(--mute)\">9h-13h / 14h-19h tous les jours</span></td><td data-l=\"Pour quoi\">L'adresse « tout en un » du terroir viganais si vous voulez compléter : pommes, châtaignes, vins, fromages.</td></tr>\n    <tr><td>Ven 14, 10h</td><td data-l=\"Où\"><strong>Marché de Ganges</strong></td><td data-l=\"Pour quoi\">Le pique-nique du soir à la cascade de la Vis, et le petit-déjeuner du lendemain.</td></tr>\n    <tr><td><strong>Sam 15, 9h30</strong></td><td data-l=\"Où\"><strong>Marché du Vigan</strong><br><span style=\"color:var(--mute)\">80 étals, le plus complet du séjour</span></td><td data-l=\"Pour quoi\"><strong>La grosse course de la semaine 2</strong>, plus le pique-nique du midi. Pélardons frais et affinés, oignons doux, charcuterie, miel, farine de châtaigne, fruits et légumes pour trois jours, bières d'Avèze. <strong>Glacière obligatoire</strong>, la route dure 2h.</td></tr>\n    <tr><td>Mar 18, 9h45</td><td data-l=\"Où\"><strong>Marché de Saint-Jean-du-Gard</strong> + <strong>Piccolo Sole</strong> et <strong>Au Petit Bonheur</strong></td><td data-l=\"Pour quoi\">Réassort de la semaine, épicerie fine et pâtisserie. L'assiette du soir sort de là.</td></tr>\n    <tr><td>Jeu 20, 9h50</td><td data-l=\"Où\"><strong>Marché de Florac</strong><br><span style=\"color:var(--mute)\">8h-13h, se démonte vers 12h30</span></td><td data-l=\"Pour quoi\"><strong>Le déjeuner du jour</strong>, mangé deux heures plus tard au bord du Tarn : pain, charcuterie de pays, pélardon, tomates, fruits, boissons. Plus des œufs pour le dîner.</td></tr>\n    <tr><td>Sam 22, 10h</td><td data-l=\"Où\"><strong>Marché de producteurs</strong>, Saint-Jean-du-Gard</td><td data-l=\"Pour quoi\">Ce que vous rapportez : pélardons affinés, miel, farine de châtaigne, oignons doux.</td></tr>\n  </table>\n  <p style=\"font-size:.9rem;color:var(--ink2);margin-top:14px\"><strong>Les cinq soirs de préparation.</strong> Lundi 10 (sandwichs pour les cascades d'Orgon), mardi 11 (pique-nique du lac, et espèces pour Bramabiau qui refuse la carte bancaire), mercredi 12 (lever 6h15 pour Navacelles), dimanche 16 (vrai pique-nique pour la crête de Castelviel), mercredi 19 (glacière et maillots pour Florac). Ils sont rappelés en bas de chaque journée dans les encadrés violets.</p>\n</div>\n\n<!-- ══════════════ PRATIQUE ══════════════ -->", "pratique": "<div class=\"grid2\">\n  <div class=\"box\">\n    <h4>À vérifier chaque soir pour le lendemain</h4>\n    <ul class=\"tight\">\n      <li><strong>Accès aux massifs du Gard</strong> — <a href=\"https://www.risque-prevention-incendie.fr/gard/\">risque-prevention-incendie.fr/gard</a>. Publiée entre 17h et 18h pour le lendemain. Le département compte 8 zones : regardez la vôtre, pas la couleur globale.</li>\n      <li><strong>Météo des forêts</strong> — <a href=\"https://meteofrance.com/meteo-des-forets\">meteofrance.com/meteo-des-forets</a>, à 17h pour J+1 et J+2. Pour anticiper, mais ce n'est <em>pas</em> une carte d'interdiction.</li>\n      <li><strong>Qualité des eaux de baignade</strong> — <a href=\"https://baignades.sante.gouv.fr/\">baignades.sante.gouv.fr</a></li>\n    </ul>\n    <p style=\"font-size:.88rem;color:var(--ink2);margin-top:12px\"><strong>Les niveaux du Gard :</strong> gris et jaune, accès libre. Orange, accès déconseillé et bivouac interdit. <span class=\"big\">Rouge, accès totalement interdit</span> aux massifs de plus de 4 ha, jusqu'à 200 m au-delà des lisières.</p>\n    <p style=\"font-size:.88rem;color:var(--ink2)\">Du 15 juin au 15 septembre, <strong>tout feu nu est interdit</strong> à moins de 200 m des bois, garrigues et landes : barbecue, réchaud et cigarette compris. Jusqu'à 3 ans d'emprisonnement et 45 000 € d'amende pour un départ de feu, même involontaire.</p>\n    <p style=\"font-size:.88rem;color:var(--ink2)\"><strong>La Lozère n'a pas de carte équivalente</strong> — les arrêtés passent par <a href=\"https://www.lozere.gouv.fr/\">lozere.gouv.fr</a> ou la sous-préfecture de Florac, <a class=\"tel\" href=\"tel:+33466656280\">04 66 65 62 80</a>. Un arrêté 2026 y suspend déjà les feux d'artifice.</p>\n  </div>\n\n  <div class=\"box\">\n    <h4>Urgences vétérinaires</h4>\n    <table class=\"ref\">\n      <tr><th>Structure</th><th>Téléphone</th></tr>\n      <tr><td><strong>Nuit, week-end, jours fériés — tout le Gard</strong><br><span style=\"color:var(--mute)\">Vétérinaires 2 Toute Urgence, Nîmes. C'est le numéro que les cliniques du secteur renvoient.</span></td><td data-l=\"Téléphone\"><strong><a class=\"tel\" href=\"tel:+33427040272\">04 27 04 02 72</a></strong></td></tr>\n      <tr><td><strong>AlèsVet</strong> — urgences 24h/24, 7j/7<br><span style=\"color:var(--mute)\">1019 ancien chemin de Mons, Alès · appeler avant de se présenter · la seule structure du secteur avec une urgence en propre</span></td><td data-l=\"Téléphone\"><strong><a class=\"tel\" href=\"tel:+33412059555\">04 12 05 95 55</a></strong></td></tr>\n      <tr><td>Clinique du Vigan<br><span style=\"color:var(--mute)\">120 Côte d'Aulas · uniquement sur RDV · radio, échographie, labo sur place</span></td><td data-l=\"Téléphone\"><a class=\"tel\" href=\"tel:+33467810046\">04 67 81 00 46</a></td></tr>\n      <tr><td>Le Héron, Ganges<br><span style=\"color:var(--mute)\">19 avenue du Vigan</span></td><td data-l=\"Téléphone\"><a class=\"tel\" href=\"tel:+33467738690\">04 67 73 86 90</a></td></tr>\n      <tr><td>La Porte d'Anduze, Boisset-et-Gaujac<br><span style=\"color:var(--mute)\">La plus proche de Saint-Jean, 20 min par la D907</span></td><td data-l=\"Téléphone\"><a class=\"tel\" href=\"tel:+33466617034\">04 66 61 70 34</a></td></tr>\n    </table>\n    <p style=\"font-size:.87rem;color:var(--ink2);margin-top:12px\">Il n'y a <strong>aucun cabinet vétérinaire dans Saint-Jean-du-Gard même</strong>. Notez les deux premiers numéros dans vos téléphones dès l'arrivée.</p>\n  </div>\n</div>\n\n<div class=\"box\">\n  <h4>Le chien par forte chaleur — les cinq règles</h4>\n  <ul class=\"tight\">\n    <li><strong>Le test des 5 secondes.</strong> Main à plat sur le bitume ou la roche. Si vous ne tenez pas 5 secondes, ses coussinets brûlent. Les dalles calcaires des causses et les pistes forestières sont des fours l'après-midi.</li>\n    <li><strong>1,5 à 2 L d'eau dédiés au chien</strong>, en plus de la vôtre, plus une gamelle pliable. Faites boire par petites quantités toutes les 20 à 30 min. L'Aigoual n'a presque aucun point d'eau balisé : les seuls fiables sont le col de la Serreyrède et le refuge de Cap de Côte.</li>\n    <li><strong>Coup de chaleur.</strong> Halètement violent, salive épaisse, gencives rouge vif puis bleutées, démarche titubante, refus d'avancer. Urgence vitale : ombre immédiate, mouillage <em>progressif</em> à l'eau fraîche et non glacée en commençant par les pattes, le ventre et l'aine, puis vétérinaire <strong>même s'il semble récupérer</strong> — les complications rénales arrivent plusieurs heures après.</li>\n    <li><strong>Cyanobactéries.</strong> En fin d'été, les eaux stagnantes, tièdes, verdâtres ou à écume des Gardons, de l'Hérault et du Tarn peuvent être toxiques et mortelles pour un chien qui boit ou se lèche après le bain. Préférez systématiquement l'eau courante.</li>\n    <li><strong>Patous.</strong> Troupeaux en estive de juin à octobre sur le Lingas, l'Aigoual et la vallée du Bonheur. Contournez large, ne courez pas, ne criez pas, chien en laisse courte derrière vous, et continuez à parler normalement.</li>\n  </ul>\n</div>\n\n<div class=\"box\">\n  <h4>Températures : pourquoi l'altitude change tout</h4>\n  <table class=\"ref\">\n    <tr><th>Station</th><th>Altitude</th><th>Max. moyenne août</th><th>Record</th></tr>\n    <tr><td>Le Vigan</td><td data-l=\"Altitude\">245 m</td><td data-l=\"Max. moyenne août\"><strong>30,0 °C</strong></td><td data-l=\"Record\">42,3 °C</td></tr>\n    <tr><td>Mont Aigoual <span style=\"color:var(--mute)\">(station Météo-France)</span></td><td data-l=\"Altitude\">1567 m</td><td data-l=\"Max. moyenne août\"><strong>17,6 °C</strong></td><td data-l=\"Record\">30,4 °C</td></tr>\n  </table>\n  <p style=\"font-size:.9rem;color:var(--ink2);margin-top:12px\">Plus de 12 °C d'écart. Une journée à 35 °C au Vigan, c'est 23 °C au sommet. Les nuits restent chaudes en vallée : le record de minimale la plus élevée au Vigan est de 27 °C.</p>\n  <p style=\"font-size:.9rem;color:var(--ink2)\"><strong>L'épisode cévenol n'est pas votre saison</strong> — il survient surtout en septembre, octobre et novembre. En revanche, les <strong>orages de soirée sur le relief sont fréquents à partir de la mi-août</strong> : 67,6 mm sont tombés en 24h au Vigan le 23 août 2015. Ne vous engagez jamais dans une gorge ou un lit de rivière si un orage est annoncé, même à des kilomètres en amont. C'est le seul motif qui doit vous faire annuler une rando du soir.</p>\n</div>\n\n<div class=\"box\">\n  <h4>Tous les marchés du séjour</h4>\n  <table class=\"ref\">\n    <tr><th>Date</th><th>Marché</th><th>Horaires</th></tr>\n    <tr><td>Mer 12</td><td data-l=\"Marché\"><strong>Nocturne du Vigan</strong>, Place du Quai</td><td data-l=\"Horaires\">18h-23h</td></tr>\n    <tr><td>Ven 14</td><td data-l=\"Marché\"><strong>Ganges</strong>, le grand marché du sud Cévennes</td><td data-l=\"Horaires\">matin, jusqu'à 13h</td></tr>\n    <tr><td>Sam 15</td><td data-l=\"Marché\"><strong>Le Vigan</strong> — le plus beau du séjour, 80+ étals</td><td data-l=\"Horaires\">8h-12h30</td></tr>\n    <tr><td>Dim 16</td><td data-l=\"Marché\"><strong>Les Dimanches Artisans</strong>, Saint-Jean-du-Gard, av. Boudon</td><td data-l=\"Horaires\">19h-23h30</td></tr>\n    <tr><td>Mar 18</td><td data-l=\"Marché\"><strong>Saint-Jean-du-Gard</strong>, halle et Grand Rue</td><td data-l=\"Horaires\">8h-13h</td></tr>\n    <tr><td>Mar 18</td><td data-l=\"Marché\">Nocturne d'Anduze, Plan de Brie</td><td data-l=\"Horaires\">19h-23h</td></tr>\n    <tr><td>Mer 19</td><td data-l=\"Marché\">Nocturnes de Lasalle — <strong>dernière de la saison</strong></td><td data-l=\"Horaires\">marché 18h, concerts 20h30</td></tr>\n    <tr><td>Jeu 20</td><td data-l=\"Marché\"><strong>Florac</strong>, esplanade et château du Parc</td><td data-l=\"Horaires\">8h-13h</td></tr>\n    <tr><td>Sam 22</td><td data-l=\"Marché\">Producteurs, Saint-Jean-du-Gard</td><td data-l=\"Horaires\">matin</td></tr>\n  </table>\n  <p style=\"font-size:.88rem;color:var(--ink2);margin-top:12px\">Si vous voulez en ajouter : Anduze le jeudi (200 exposants, le plus gros en volume), Valleraugue mercredi et samedi matin, Quissac le mercredi 8h-12h30, Saint-Hippolyte-du-Fort mardi et vendredi 6h-13h, Saint-André-de-Valborgne le dimanche 8h30-12h30, Le Pont-de-Montvert le mercredi 9h-12h, Meyrueis <strong>marché d'artisanat d'art le jeudi 20 août</strong>. Les halles de l'Abbaye à Alès sont ouvertes tous les matins de 8h à 12h, filet de sécurité si vous ratez tout.</p>\n</div>\n\n<!-- ══════════════ RÉSERVE ══════════════ -->", "reserve": "<p class=\"lede\">Randos, villages et repli, à glisser à la place d'une journée annulée pour massif fermé, canicule ou fatigue.</p>\n\n<div class=\"grid2\">\n  <div class=\"box\">\n    <h4>Randos de remplacement</h4>\n    <ul class=\"tight\">\n      <li><strong>Cascades d'Orgon, variante La Draille</strong> — 8,9 km, +344 m, 3h30. Boucle très forestière, nombreux ruisseaux et un gué. Départ D329, Valleraugue. <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=44.059139%2C3.604682\">Itinéraire</a> · <a href=\"https://www.visorando.com/randonnee-les-cascades-d-orgon-2/\">Visorando</a></li>\n      <li><strong>Arboretum de l'Hort de Dieu</strong> — 4,7 km, +285 m, 3h30, depuis l'observatoire de l'Aigoual. Planté en 1903 par Georges Fabre et Charles Flahault : 75 espèces survivantes sur 140 testées, neuf stations d'interprétation. Terrain raide et rocheux. <a href=\"https://www.tourismegard.com/fr/fiche/equipement/sentier-de-decouverte-l-arboretum-de-l-hort-de-dieu-l-esperou_TFO6082109/\">Trace et GPX</a></li>\n      <li><strong>Montagne de la Fage, Cézas</strong> — 10 km, +425 m, 4h. Panorama jusqu'à l'étang de Thau. Montée initiale raide, <strong>parking de 6 places</strong> : arrivez tôt. <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=43.975111%2C3.778964\">Itinéraire</a> · <a href=\"https://www.visorando.com/randonnee-la-montagne-de-la-fage/\">Visorando</a></li>\n      <li><strong>Sentier de Valescure, Peyrolles</strong> — 11,3 km, +344 m, 4h. Petite vallée sauvage, terrasses de pierre, chiens en laisse mentionnés sur la fiche. Départ La Planque. <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=44.106709%2C3.827795\">Itinéraire</a> · <a href=\"https://www.tourismegard.com/fr/fiche/equipement/sentier-de-valescure-peyrolles_TFO6081707/\">GPX</a></li>\n      <li><strong>Sentier de l'Amous, Saint-Sébastien-d'Aigrefeuille</strong> — 3,4 km, 2h. Très ombragé, au fil de l'eau. Parfait en fin de journée. <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=44.106354%2C3.995293\">Itinéraire</a> · <a href=\"https://www.tourismegard.com/fr/fiche/equipement/sentier-du-patrimoine-autour-de-l-amous-saint-sebastien-d-aigrefeuille_TFO6789776/\">GPX</a></li>\n      <li><strong>Sentier de Roquefeuille, Mialet</strong> — 13 km, +632 m, 5h. La plus exigeante : anciens chemins camisards, audioguide. Uniquement un jour frais. <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=44.111382%2C3.942653\">Itinéraire</a> · <a href=\"https://www.tourismegard.com/fr/fiche/equipement/randonnee-sentier-de-roquefeuille-mialet_TFO7012331/\">GPX</a></li>\n      <li><strong>Sentier de l'Exil, Saumane</strong> — 12,9 km, +428 m, 4h30. Ancienne route royale vers la Lozère, ornières de charrettes creusées dans la roche. Topo 5 € à l'office de Saint-André-de-Valborgne. <a href=\"https://www.tourismegard.com/fr/fiche/equipement/sentier-de-l-exil-saumane_TFO6082080/\">GPX</a></li>\n      <li><strong>Château de Roquedols, Meyrueis</strong> — 6,9 km, +158 m, 2h25, « immersion complète en forêt ». Départ parking de la piscine. <a href=\"https://www.visorando.com/randonnee-boucle-du-chateau-de-roquedols-et-du-col/\">Visorando</a></li>\n      <li><strong>Cascade de Salvinsac depuis Meyrueis</strong> — 7,2 km, +299 m, 2h55, sentier ombragé et baignade à la cascade. <a href=\"https://www.decathlon-outdoor.com/fr-fr/explore/france/de-meyrueis-a-la-cascade-de-salvinsac-64b84642f1307\">Decathlon Outdoor</a></li>\n    </ul>\n    <p style=\"font-size:.87rem;color:var(--ink2);margin-top:12px\">Portails à garder sous la main : <a href=\"https://rando.gard.fr/\">rando.gard.fr</a> · <a href=\"https://destination.cevennes-parcnational.fr/\">destination.cevennes-parcnational.fr</a> · <a href=\"https://www.decathlon-outdoor.com/fr-fr/inspire/france/city-randonnee-le-vigan\">Decathlon Outdoor — Le Vigan, 120 sorties</a> · <a href=\"https://www.decathlon-outdoor.com/fr-fr/inspire/france/randonnee-cevennes-massif-central\">Decathlon Outdoor — Cévennes</a></p>\n  </div>\n\n  <div class=\"box\">\n    <h4>Baignades de secours et villages en réserve</h4>\n    <ul class=\"tight\">\n      <li><strong>Baignade « Le Village », Saumane</strong> — le meilleur repli de la semaine 2, et le seul <strong>surveillé</strong> du secteur : <strong>du 20 juillet au 24 août, tous les jours 13h30-18h30</strong>, parking gratuit et aire de pique-nique. À 20 min de la base. Mairie <a class=\"tel\" href=\"tel:+33466839142\">04 66 83 91 42</a>. <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=44.118462%2C3.763789\">Itinéraire · 44.118462, 3.763789</a></li>\n      <li><strong>Aire de Molières-Cavaillac</strong>, l'Arre, 7 min du Vigan — berges sous les peupliers, animaux acceptés. <strong>Ce n'est pas un site de baignade contrôlé</strong>, plutôt une aire de pique-nique au bord de l'eau, et l'accès est un cul-de-sac étroit. <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=43.969666%2C3.584494\">Itinéraire</a></li>\n      <li><strong>Piscine Jean Genieyz</strong> au Vigan, ou <strong>Aquatix</strong> à Brissac — le repli honnête les jours à 40 °C.</li>\n    </ul>\n    <h4 style=\"margin-top:22px\">Ce que j'ai sorti du programme pour tenir les 2h30</h4>\n    <ul class=\"tight\">\n      <li><strong>Meyrueis</strong> (48150) — le plus joli bourg du nord du secteur : quais de la Jonte, dédale médiéval, remparts, tour de l'Horloge, Rocher du Château. Accessible depuis Camprieu, mais le retour sur Le Vigan fait 1h15 et porterait le mercredi à 2h50. Si vous y tenez, c'est cette journée-là qu'il faut allonger. Animaux acceptés, office de tourisme <a class=\"tel\" href=\"tel:+33466450114\">04 66 45 01 14</a>.</li>\n      <li><strong>Lac des Pises</strong> (1260 m, Dourbies) — paysage nordique, hêtres centenaires, tourbières. Baignade interdite, mais la lumière de fin de journée y est exceptionnelle. Détour de 30 min depuis le col du Minier au retour de l'Aigoual, ce qui porterait le lundi à 3h. <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=44.04137%2C3.508042\">Itinéraire</a></li>\n      <li><strong>Le Climatographe</strong> au sommet de l'Aigoual (9 €) et <strong>Maison Rouge</strong> à Saint-Jean-du-Gard (9 €) — deux belles visites, sorties parce que vous préfériez sacrifier le payant. Toutes deux sont d'excellents replis un jour de pluie.</li>\n      <li><strong>Sentier de Soult</strong>, L'Estréchure — 9,7 km, +436 m, 4h, la plus belle marche « Cévennes profondes » du secteur. Écartée pour éviter une deuxième sortie de 4h dans la même semaine.</li>\n      <li><strong>Les gorges du Tarn</strong> — Sainte-Enimie et Castelbouc sont à 1h50 d'une seule traite, soit 3h40 aller-retour. Hors cadre, définitivement.</li>\n    </ul>\n    <h4 style=\"margin-top:22px\">Villages en réserve</h4>\n    <ul class=\"tight\">\n      <li><strong>Aumessas</strong> (30770), 20 min du Vigan — <em>Village de caractère</em> confirmé. Ruelles pavées de galets de rivière, château de la Rode du XIV<sup>e</sup>. Surtout : l'<strong>atelier de céramique de Carole Thelemaque</strong>, 7 rue de la Viale, <strong>ouvert toute l'année 10h-18h</strong>, visite d'atelier, stages de tournage et boutique. C'est la plus belle adresse d'artisan de la semaine 1.</li>\n      <li><strong>Dourbies</strong> (30750) — <em>Village de caractère</em> depuis 2018, entre 700 et 1410 m. L'église Notre-Dame-de-l'Assomption, bâtie par les habitants entre 1883 et 1887, est si disproportionnée qu'on l'appelle « la cathédrale des Cévennes ». Une épicerie, rien de plus.</li>\n      <li><strong>Saint-Guilhem-le-Désert</strong> — Plus Beaux Villages, UNESCO, 1h05 du Vigan. Parking Pré des Pères, 300 places ombragées, navettes gratuites depuis le Pont du Diable. <strong>Uniquement à 8h ou après 18h</strong> : les pavés sont brûlants entre midi et 17h, et véhicules de plus de 2 m interdits sur les parkings municipaux.</li>\n      <li><strong>Festival Là-bas vu d'ici</strong>, Le Vigan, 20 au 23 août — films, expos, concerts, clôture par Au P'tit Bonheur. 1h de route depuis Saint-Jean. Réservations <a class=\"tel\" href=\"tel:+33499542700\">04 99 54 27 00</a>.</li>\n    </ul>\n  </div>\n</div>\n\n<div class=\"box\" style=\"border-left:4px solid var(--red)\">\n  <h4>Les lieux que j'ai volontairement écartés, et pourquoi</h4>\n  <ul class=\"tight\">\n    <li><strong>Le Mas de la Cam et Le Castel Rose / L'Arche</strong> (Saint-Jean-du-Gard et Anduze) — ce sont d'abord des <strong>noms de campings</strong>. Les points de prélèvement de l'eau portent leur nom parce que l'analyse s'y fait, mais votre GPS vous conduira à un accueil de camping dont le parking est privé.</li>\n    <li><strong>Gorniès et Madières</strong> (gorges de la Vis) — un site officiel existe à Gorniès, mais <strong>aucune information sur le parking, l'accès ou les équipements</strong>. Madières n'est même pas un site recensé, et la route de fond de gorge n'offre presque aucun stationnement.</li>\n    <li><strong>La cascade du Martinet</strong> (Saint-Étienne-Vallée-Française) — spot à sauts de plusieurs mètres, non surveillé, non balisé. Pas dans un carnet de vacances.</li>\n    <li><strong>La grotte des Demoiselles</strong> — chien interdit sauf dans un sac, ce qui est impossible pour un chien de 10 à 25 kg.</li>\n    <li><strong>Les 4000 marches de Valleraugue</strong> — 1200 m de dénivelé sur une pente exposée. Superbe, et totalement déraisonnable en août avec un chien.</li>\n  </ul>\n</div>\n\n<div class=\"box\">\n  <h4>Ce que je n'ai pas pu vérifier</h4>\n  <p style=\"margin-top:0;font-size:.9rem;color:var(--ink2)\">Par honnêteté plutôt que de combler les trous. <strong>Le stationnement n'est documenté nulle part</strong> pour Falguière, La Corniche et le plan d'eau de Sainte-Croix : les sites existent et l'eau y est suivie, mais garez-vous prudemment et respectez la signalétique. Le <strong>« parking de la Poste »</strong> à Saint-Jean est un nom d'usage, aucun parking ne le porte officiellement. Les <strong>horaires de la navette gratuite de Navacelles</strong> pour 2026 ne sont pas publiés. Tous les <strong>temps de trajet</strong> sont des estimations sur routes de montagne : majorez de 20 % un jour de grosse affluence. Les <strong>notes Google</strong> proviennent d'un miroir tiers, pas d'une lecture directe. Les <strong>feux d'artifice du 15 août</strong> et le <strong>calendrier des fêtes votives</strong> ne sont pas encore publiés : suivez objectifgard.com, rubrique fêtes votives, début août. Enfin, la mention « dog friendly » des offices de tourisme signifie que l'établissement s'est déclaré comme tel : un coup de fil la veille reste la seule certitude en plein mois d'août.</p>\n</div>", "footer": "<strong>Photos</strong> — Wikimedia Commons, sous licences libres (CC BY-SA, CC BY ou domaine public selon les fichiers). Chaque image renvoie vers sa page source, où figurent l'auteur et la licence exacte. Si une image ne s'affiche pas, c'est que le fichier a été renommé sur Commons ; le reste du document est intact.<br><br>\n  <strong>Sources</strong> — Parc national des Cévennes · Gard Tourisme · Destination Sud Cévennes · Hérault Tourisme · Lozère Tourisme · offices de tourisme Cévennes Gorges du Tarn et Des Cévennes au Mont Lozère · Cirque de Navacelles Grand Site de France · préfectures du Gard et de la Lozère · Météo-France et Infoclimat · fichier national des eaux de baignade (baignades.sante.gouv.fr) · mairies du Vigan, de Saint-Jean-du-Gard, de Val-d'Aigoual, de Florac et de Ganges · Rando Gard · Visorando · Decathlon Outdoor · Climatographe · Abîme de Bramabiau · Bambouseraie en Cévennes · Train à Vapeur des Cévennes · Musée du Désert · Maison Rouge · Route du Vase d'Anduze · Objectif Gard.<br><br>\n  <strong>Cartographie</strong> — IGN TOP25 2641ET « Mont Aigoual – Le Vigan ». <strong>Chargez toutes vos traces GPX avant de partir</strong> : il n'y a pas de réseau mobile sur une grande partie du massif.", "intro": "<div class=\"box\" style=\"border-left:4px solid var(--moss)\">\n  <h4>Comment lire ce document</h4>\n  <p style=\"margin:0 0 10px;font-size:.94rem;color:var(--ink2)\"><strong>Deux plafonds tenus sur les quatorze jours : 2h30 de route cumulée, et jamais plus de 1h15 d'une seule traite.</strong> Chaque journée affiche son total et sa plus longue étape. C'est ce qui a écarté les gorges du Tarn, à 1h50 d'affilée, et le Mont Lozère à 1h25 : Florac, à 1h10, est le point le plus lointain qui rentre dans le cadre.<br><strong>Une seule vraie randonnée par jour</strong>, et les jours de sortie longue le reste est volontairement creux. <strong>Départs à 9h30</strong>, sauf un matin : jeudi 13, départ 7h pour Navacelles, parce que le causse est invivable après 10h.</p>\n  <p style=\"margin:0 0 10px;font-size:.94rem;color:var(--ink2)\"><strong>Chaque trajet est chiffré</strong>, dans les bandes grises, retour compris, avec le total de conduite en bas de journée. <strong>Chaque lieu a deux liens</strong> : « Fiche et avis » ouvre la page Google du lieu (photos, avis, horaires), « Itinéraire » lance la navigation sur les coordonnées exactes du parking.</p>\n  <p style=\"margin:0 0 10px;font-size:.94rem;color:var(--ink2)\"><strong>Les repas sont écrits.</strong> Au restaurant : la note, le téléphone, et s'il faut réserver. À la maison : le plat proposé et ce qu'il faut avoir acheté. Les encadrés violets en bas de journée disent <strong>ce qu'il faut préparer le soir même</strong> pour le lendemain.</p>\n  <p style=\"margin:0;font-size:.94rem;color:var(--ink2)\"><strong>Le chien passe presque partout.</strong> Le Parc national des Cévennes est le seul parc national de métropole qui autorise le chien en zone cœur, tenu en laisse. Deux exclusions seulement : la grotte de Trabuc et la grotte des Demoiselles. La Bambouseraie l'accueille gratuitement et fait de l'ombre sur tout le parc.</p>\n</div>", "hero": {"kicker": "Feuille de route · 14 jours · 2 bases · 1 chien", "h1": "Deux semaines dans les Cévennes,<br>de l'Aigoual à la Corniche", "pitchs": ["Vous allez dormir au pied d'une montagne à 1565 m et vous baigner dans une eau turquoise le même jour. Marcher sous des hêtres centenaires pendant que la vallée cuit à 35 °C. Descendre 300 mètres en lacets pour atterrir au fond d'un cirque calcaire où vivent quarante personnes. Prendre un train à vapeur, boire une bière brassée devant vous, acheter du pélardon à celle qui l'a fait. Et le soir, quand le soleil passe derrière les crêtes vers <em>20h45</em>, partir marcher le long d'un Gardon dont l'eau reste claire jusqu'à la nuit.", "Ce document est fait pour être suivi sans réfléchir. Chaque étape indique <em>où se garer</em>, <em>combien de temps de route</em>, <em>ce qu'on mange</em> et <em>ce qu'il faut avoir acheté la veille</em>. Les pièges connus sont signalés. Vous n'avez qu'à conduire."], "bases": ["<b>9 → 15 août · base 1</b><span>357 Route de Ganges, Le Vigan (30120)<br>Vallée de l'Arre, au pied de l'Aigoual</span>", "<b>15 → 22 août · base 2</b><span>Mas de Cros Viel, col de Lamira<br>Au-dessus de Saint-Jean-du-Gard (30270)</span>"], "lead": "Quatorze jours entre 90 et 1 565 mètres, deux maisons, un chien. Des matins à douze degrés sur les crêtes pendant que la vallée cuit, des rivières vertes où l'on se jette à midi, des marchés où l'on achète le dîner à celui qui l'a fait, et des soirs qui traînent jusqu'à 21h. Tout est écrit à l'heure près : vous n'avez plus qu'à conduire."}, "forts": {"titre": "Les huit moments qu'on raconte en rentrant", "lede": "Le reste du carnet est écrit à la minute, avec les parkings, les horaires et les listes de courses. Ces huit-là, c'est autre chose : ce sont ceux dont vous parlerez cet hiver.", "items": [{"j": "j5", "n": "Jour 5", "quand": "Jeudi 13, 7h40", "titre": "Le cirque de Navacelles avant tout le monde", "txt": "On part à 7h, et c'est la seule fois du séjour. À 7h40 vous êtes seuls sur les belvédères du causse de Blandas, le méandre abandonné encore dans l'ombre trois cents mètres plus bas, le hameau et ses quarante habitants au fond. À 10h il y aura un car. À 7h40, il y a vous.", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Vue_a%C3%A9rienne_du_Cirque_de_Navacelles.jpg?width=1200"}, {"j": "j2", "n": "Jour 2", "quand": "Lundi 10, 15h", "titre": "1 565 mètres, et douze degrés de moins qu'en bas", "txt": "Le sommet du mont Aigoual, la dernière station météo de montagne habitée de France, et la table d'orientation qui va du Mont Blanc à la Méditerranée les jours de mistral. Vous y arrivez par la route de crête, après un pique-nique au col de la Serreyrède.", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Observatoire_du_mont_aigoual.JPG?width=1200"}, {"j": "j4", "n": "Jour 4", "quand": "Mercredi 12, 15h", "titre": "La rivière qui disparaît sous la montagne", "txt": "Le Bonheur — c'est son nom — se jette dans le calcaire à Camprieu et ressort un kilomètre plus loin par une faille de cent mètres de haut. Vous marchez le long du lit à sec le matin, vous entrez dans l'abîme l'après-midi.", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Ab%C3%AEme_de_Bramabiau_panorama.JPG?width=1200"}, {"j": "j9", "n": "Jour 9", "quand": "Lundi 17, 9h30", "titre": "La Corniche des Cévennes, au premier soleil", "txt": "La plus belle route du massif part de votre porte. Elle suit la ligne de crête entre deux vallées, sur la frontière géologique où les murs passent du schiste au calcaire. On la prend le matin, quand l'air est encore frais et que la brume tient au fond des vallées.", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/271_Corniche_des_C%C3%A9vennes_Panorama_entre_Saint-Jean-du-Gard_et_Florac.JPG?width=1200"}, {"j": "j8", "n": "Jour 8", "quand": "Dimanche 16, 9h55", "titre": "Le Mas Soubeyran, et la mémoire camisarde", "txt": "La maison de Rolland, chef camisard, laissée dans son état de 1704, devenue le musée du Désert. C'est le début d'un fil qui court sur toute la semaine : Sainte-Croix et son chemin des mémoires lundi, le fort Vauban d'Alès mardi, bâti pour surveiller ces mêmes protestants.", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Mialet-Pont_des_Camisards-20120901.jpg?width=1200"}, {"j": "j6", "n": "Jour 6", "quand": "Vendredi 14, 18h45", "titre": "Le pique-nique au pied de la cascade de la Vis", "txt": "Une cascade artificielle de 1890, large de cinquante mètres, dans un ancien site minier devenu un des plus beaux endroits du Gard. Vous y arrivez en fin de journée avec ce que vous avez acheté le matin au marché de Ganges, et vous regardez le soleil descendre.", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Pont_de_Saint-%C3%89tienne_d%27Issensac.JPG?width=1200"}, {"j": "j13", "n": "Jour 13", "quand": "Vendredi 21, 14h30", "titre": "Le train à vapeur, entre la Bambouseraie et Anduze", "txt": "Le matin, quarante hectares de bambous géants plantés en 1856, où le chien entre gratuitement et où tout est à l'ombre. L'après-midi, une locomotive à vapeur qui longe le Gardon jusqu'à Saint-Jean. Le soir, la meilleure table du séjour.", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Bambouseraie_de_Prafrance_20100904_031.jpg?width=1200"}, {"j": "j10", "n": "Jour 10", "quand": "Mardi 18, 9h45", "titre": "Le marché du mardi, puis Alès", "txt": "Le grand marché de Saint-Jean déborde de la halle jusqu'à la Grand Rue, où travaillent une céramiste, un forgeron-coutelier et une tapissière. L'après-midi, les Halles de l'Abbaye d'Alès à l'heure où les producteurs bradent, et une terrasse sur la place.", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Pont_St_Jean_du_Gard_2007.jpg?width=1200"}]}}, "tables": [{"jour": "j1", "date": "Dim 9", "quand": "20h00", "cat": "guinguette", "nom": "La Guinguette d'Avèze", "lieu": "Le Pont Vieux, Avèze", "note": "4,6", "avis": "288 avis Google", "tel": null, "horaires": "Tous les jours 10h – 1h du matin, jusqu'au 30 septembre", "prix": null, "chien": "Plein air intégral", "desc": "Sixième saison pour cette guinguette posée au bord de l'Arre, au pied du vieux pont. Terrasse au fil de l'eau, produits locaux et de saison, service tard le soir. <strong>C'est exactement le spot de baignade du jour</strong> : vous vous baignez, vous séchez, vous dînez sans reprendre la voiture.", "alerte": "Plusieurs avis récents pointent une gestion approximative des réservations. Venez décontractés. Aucun téléphone publié, contact par mail à guinguetteaveze@gmail.com ou sur Instagram.", "maps": "https://www.google.com/maps/search/?api=1&query=La+Guinguette+d%27Av%C3%A8ze+Pont+Vieux", "resa": "Aucun téléphone publié et une gestion des réservations que les avis décrivent comme approximative. On se présente, et on a le pique-nique en secours.", "niveau": "presenter"}, {"jour": "j2", "date": "Lun 10", "quand": "13h10", "cat": "picnic", "nom": "Pique-nique au col de la Serreyrède", "lieu": "1299 m, devant la Maison de l'Aigoual", "note": null, "avis": null, "tel": null, "horaires": null, "prix": null, "chien": "Évidemment", "desc": "Tables et fontaine au col. Vous mangez à 1299 m avec une vingtaine de degrés pendant que la vallée cuit. <strong>Aucune table du plateau ne vaut ça</strong> : la brasserie du carrefour est une halte routière, et le restaurant de l'Observatoire se visite pour la vue, pas pour l'assiette.", "alerte": null, "maps": "https://www.google.com/maps/search/?api=1&query=Col+de+la+Serreyr%C3%A8de", "niveau": "aucune"}, {"jour": "j3", "date": "Mar 11", "quand": "19h15", "cat": "guinguette", "nom": "Le Jardin Hors du Temps", "lieu": "2 rue des Horts, Valleraugue", "note": null, "avis": "pas de note publiée", "tel": "04 99 75 23 28", "horaires": "Tous les jours 10h – 22h en août", "prix": null, "chien": "Acceptés", "desc": "Une guinguette installée dans un parc à la française de 1700 m² planté d'arbres centenaires. Jeux de société, concerts, terrasse ombragée, un ruisseau qui traverse. Vous finissez de flâner dans le village et vous y êtes déjà : <strong>zéro kilomètre de plus après quatre heures de marche</strong>.", "alerte": null, "maps": "https://www.google.com/maps/search/?api=1&query=Le+Jardin+Hors+du+Temps+Valleraugue", "alt": {"nom": "Les Terrasses de La Borie", "lieu": "Mandagout, 30 min", "note": "4,7", "avis": "215 avis Google", "tel": "04 65 09 03 32", "desc": "La vraie table du secteur. Le chef Florian Chekroun cuisine son potager, 30 couverts, menus surprise de 52 à 89 €, chiens en terrasse. Réservation indispensable.", "maps": "https://www.google.com/maps/search/?api=1&query=Les+Terrasses+de+La+Borie+Mandagout"}, "resa": "Un appel la veille suffit. Terrasse dans le parc, demandez une table près du ruisseau.", "niveau": "conseillee"}, {"jour": "j4", "date": "Mer 12", "quand": "19h45", "cat": "marche", "nom": "Marché nocturne du Vigan", "lieu": "Place du Quai", "note": null, "avis": null, "tel": null, "horaires": "18h – 23h, tous les mercredis jusqu'au 26 août", "prix": null, "chien": "Plein air", "desc": "Artisans, créateurs, animations de rue. Vous dînez sur place sans cuisiner et sans réserver. <strong>C'est la soirée la plus simple des quatorze.</strong>", "alerte": null, "maps": "https://www.google.com/maps/search/?api=1&query=Place+du+Quai+Le+Vigan", "niveau": "aucune"}, {"jour": "j5", "date": "Jeu 13", "quand": "13h00", "cat": "creperie", "nom": "Crêperie du Mas Guilhou", "lieu": "Hameau de Navacelles, au fond du cirque", "note": "4,4", "avis": "198 avis TripAdvisor, n° 1 du secteur", "tel": "04 67 81 50 69", "horaires": "Tous les jours 12h – 17h", "prix": "Prix très doux", "chien": "Terrasse", "desc": "Galettes, crêpes et cidres fermiers, en terrasse, à trois cents mètres sous le rebord du causse. Vous sortez de 3h30 de marche le long de la Vis et d'une trempette sous la cascade.", "alerte": null, "maps": "https://www.google.com/maps/search/?api=1&query=Cr%C3%AAperie+du+Mas+Guilhou+Navacelles", "alt": {"nom": "L'Auberge de Blandas", "lieu": "Sur le causse, 15 min plus haut", "note": "4,7", "avis": "410 avis Google", "tel": "04 67 81 51 55", "desc": "Osman et Sophie tiennent une vraie auberge de causse. Pélardon, oignon doux, côte de bœuf locale et frites maison. <script>

            courses:'Courses et pique-niques',pratique:'Infos pratiques',reserve:'La réserve'};
function esc(s){return String(s==null?'':s)}
function q(i){return document.getElementById(i)}
function cls(t){return t==null?'c0':t>=34?'c3':t>=27?'c2':t<=20?'c1':''}
function tt(t){return t==null?'—':Math.round(t)+'°'}

function blocs(l){var h='';(l||[]).forEach(function(b){
 if(b.t==='meta')h+='<div class="meta">'+b.html+'</div>';
 else if(b.t==='p')h+='<p>'+b.html+'</p>';
 else if(b.t==='access')h+='<div class="access'+(b.warn?' warn':'')+'">'+b.html+'</div>';
 else if(b.t==='shop')h+='<div class="shop">'+b.html+'</div>';
 else if(b.t==='note')h+='<div class="note-google"><svg><use href="#i-star"/></svg> '+b.html+'</div>';
 else if(b.t==='liens')h+='<div class="links">'+(b.liens||[]).map(function(x){
   return '<a class="'+x.cls+'" href="'+x.href+'" target="_blank" rel="noopener">'+x.txt+'</a>'}).join('')+'</div>';
});return h}

function leg(e){
  var t1=TEMP[e.de_pt], t2=TEMP[e.vers_pt];
  function chip(pt,t){return pt?' <span class="tt '+cls(t)+'" data-t="'+esc(pt)+'">'+tt(t)+'</span>':''}
  var h='<div class="tr"><svg class="ic ico"><use href="#i-car"/></svg><div class="tx">';
  // phrase de transition : ce qui se termine, puis ou l'on va
  var dst='<strong>'+esc(e.vers||e.vers_lib)+'</strong>';
  var ph = e.fin==='On y va' ? '<em>On y va</em> : direction '+dst+'.'
         : e.fin==='Fin du trajet en train' ? '<em>'+e.fin+'.</em> On récupère la voiture, direction '+dst+'.'
         : (e.fin?'<em>'+e.fin+'.</em> ':'')+'On reprend la voiture, direction '+dst+'.';
  h+='<div class="l0">'+ph+'</div>';
  h+='<div class="l1">'+
     esc(e.de_lib)+(e.de_alt?' <span class="al">'+e.de_alt+' m</span>':'')+chip(e.de_pt,t1)+
     '<span class="ar">→</span>'+
     '<strong>'+esc(e.vers_lib)+'</strong>'+(e.vers_alt?' <span class="al">'+e.vers_alt+' m</span>':'')+chip(e.vers_pt,t2)+
     '</div>';
  var d=[]; if(e.km)d.push(e.km+' km'); if(e.duree)d.push('<strong>'+e.duree+'</strong>'); if(e.route)d.push(e.route);
  h+='<div class="l2">'+d.join(' · ')+'</div></div>';
  if(e.nav)h+='<a class="go" href="'+e.nav+'" target="_blank" rel="noopener">Y aller ›</a>';
  return '<tr class="leg"><td class="h">'+esc(e.heure)+'</td><td class="b">'+h+'</div></td></tr>';
}
function etape(e){
  if(e.type==='trajet')return leg(e);
  return '<tr class="r-'+e.type+'"><td class="h">'+esc(e.heure)+'</td><td class="b"'+(e.pt?' data-pt="'+e.pt+'"':'')+'>'+
    '<strong class="t"><svg class="ic"><use href="#'+(e.icone||'i-home')+'"/></svg>'+e.titre+'</strong>'+blocs(e.blocs)+'</td></tr>';
}
var BK={rando:{i:'i-hike',l:'Rando en plus'},eau:{i:'i-swim',l:'Baignade'},
        village:{i:'i-village',l:'Village'},visit:{i:'i-ticket',l:'Visite'}};
function bonusHTML(j){
  if(!j.bonus||!j.bonus.length)return '';
  var h='<div class="bns"><div class="bnh"><svg class="ic"><use href="#i-star"/></svg>'+
    '<b>Si vous avez le temps, ou l\'envie</b>'+
    '<span>'+j.bonus.length+' idée'+(j.bonus.length>1?'s':'')+' à portée de cette journée, hors programme. '+
    'Rien d\'obligatoire, tout est calé sur la route que vous faites déjà.</span></div>';
  j.bonus.forEach(function(b){
    var k=BK[b.k]||BK.village;
    h+='<div class="bni b-'+b.k+'"><div class="bt"><svg class="ic"><use href="#'+k.i+'"/></svg>'+
      '<span><i>'+k.l+'</i><b>'+b.titre+'</b><em>'+b.meta+'</em></span></div>'+
      '<p>'+b.txt+'</p>'+
      (b.warn?'<div class="bw">'+b.warn+'</div>':'')+
      '<div class="links">'+(b.liens||[]).map(function(x){
        return '<a class="'+x.cls+'" href="'+x.href+'" target="_blank" rel="noopener">'+x.txt+'</a>'}).join('')+
      '</div></div>';
  });
  return h+'</div>';
}
function jourHTML(j,n){
  var h='<article class="day" id="'+j.id+'">';
  if(j.cover)h+='<div class="cover"><img src="'+j.cover.src+'" alt="'+esc(j.cover.alt)+'" loading="lazy" onerror="this.parentElement.classList.add(\'nope\')"><div class="cap">'+j.cover.cap+'</div></div>';
  h+='<div class="head"><div class="dt">Jour '+n+' · '+j.dt+'</div><h3>'+j.titre+'</h3>';
  if(j.pitch)h+='<p class="pitch">'+j.pitch+'</p>';
  h+='<div class="tags">'+(j.tags||[]).filter(function(t){return t.cls!=='t-tot'}).map(function(t){
    return '<span class="tag '+t.cls+'">'+t.txt+'</span>'}).join('')+'</div></div>';
  if(j.chaud&&j.chaud.texte)h+='<div class="chaud" id="ch-'+j.id+'"><span class="t">⚠ Journée annoncée à <span class="deg"></span></span><br>'+j.chaud.texte+'</div>';
  h+='<table class="tl">'+(j.etapes||[]).map(etape).join('')+'</table>';
  if(j.strip&&j.strip.length)h+='<div class="strip">'+j.strip.map(function(f){
    return '<figure><a href="'+f.page+'" target="_blank" rel="noopener"><img src="'+f.src+'" alt="'+esc(f.alt)+'" loading="lazy" onerror="this.closest(\'figure\').classList.add(\'nope\')"><figcaption>'+f.cap+'</figcaption></a></figure>'}).join('')+'</div>';
  (j.notes||[]).forEach(function(x){h+='<p class="'+(x.cls||'note')+'">'+x.html+'</p>'});
  h+=bonusHTML(j);
  var f=[];
  if(j.volant)f.push('<span class="p">🚗 <b>'+j.volant+'</b> de route</span>');
  if(j.rando)f.push('<span class="p">🥾 <b>'+j.rando[0]+'</b> '+j.rando[1]+'</span>');
  if(j.alt_max)f.push('<span class="p">▲ point haut <b>'+j.alt_max+' m</b></span>');
  h+='<div class="dayfoot">'+f.join('')+'</div>';
  return h+'</article>';
}
function vig(j,n){
  var im=j.cover?'<img src="'+j.cover.src+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">':'';
  return '<a class="vig" href="#'+j.id+'" data-v="'+j.id+'"><div class="im">'+im+'<div class="g"></div>'+
   '<span class="n">'+n+'</span><span class="d">'+j.dt.split('·')[0].trim()+'</span></div><div class="co">'+
   '<h5>'+j.titre+'</h5><div class="stats">'+
   '<span class="st rd"><b>'+(j.rando?j.rando[0]:'—')+'</b><span>rando</span></span>'+
   '<span class="st alt"><b>'+(j.alt_max?j.alt_max+' m':'—')+'</b><span>altitude</span></span>'+
   '<span class="st tp" data-d="'+j.id+'"><b>—</b><span>temp.</span></span>'+
   '</div></div></a>';
}

function initRail(){
  var r=q('rail'); if(!r||r.__i)return; r.__i=1;
  var L=q('arwL'),R=q('arwR'),fL=q('fdL'),fR=q('fdR'),dots=q('dots');
  function maj(){
    var max=r.scrollWidth-r.clientWidth;
    L.hidden=r.scrollLeft<8; R.hidden=r.scrollLeft>max-8;
    fL.style.opacity=r.scrollLeft<8?0:1; fR.style.opacity=r.scrollLeft>max-8?0:1;
    var k=Math.round(r.scrollLeft/(r.scrollWidth/D.jours.length));
    [].forEach.call(dots.children,function(c,i){c.classList.toggle('on',i===k)});
  }
  var pas=function(){return (r.querySelector('.vig')||{offsetWidth:200}).offsetWidth+10};
  L.onclick=function(){r.scrollBy({left:-pas()*2,behavior:'smooth'})};
  R.onclick=function(){r.scrollBy({left: pas()*2,behavior:'smooth'})};
  r.addEventListener('scroll',maj,{passive:true}); maj();
  // petit mouvement au chargement pour signaler que ca defile
  setTimeout(function(){if(r.scrollLeft===0){r.scrollTo({left:34,behavior:'smooth'});
    setTimeout(function(){r.scrollTo({left:0,behavior:'smooth'})},430)}},700);
}

      '<span class="fn">'+(i+1)+'</span></div>'+

      '<span class="fgo">Voir la journée ›</span></div></a>';
  }).join('');
}

     '<div class="dots" id="dots">'+D.jours.map(function(_,i){return '<i'+(i?'':' class="on"')+'></i>'}).join('')+'</div></div>';
  h+='<div id="fil"></div>';

    '<span id="wxstatus" style="font-size:.83rem;color:var(--mute)">Chargement…</span></div>');
