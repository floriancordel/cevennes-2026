<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cévennes — 9 au 22 août 2026</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#faf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --ink:#211f1c; --ink2:#4c453e; --mute:#7e746a;
  --paper:#faf7f2; --card:#fffdfa; --line:#e6dfd4;
  --chestnut:#8c4a2f; --moss:#4c6b40; --river:#2c6b8a; --stone:#6a6156;
  --amber:#a5711a; --red:#a33328; --plum:#7a4a86;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 80px}
svg.ic{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  vertical-align:-3px;margin-right:7px;flex:0 0 auto}

/* ---------- HERO ---------- */
header.hero{position:relative;color:#fff;overflow:hidden;background:#3d4a38}
header.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.52}
header.hero .veil{position:absolute;inset:0;background:linear-gradient(165deg,rgba(28,40,26,.84),rgba(58,42,28,.72) 52%,rgba(122,58,34,.8))}
header.hero .inner{position:relative;max-width:960px;margin:0 auto;padding:58px 20px 46px}
header.hero .kicker{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-bottom:10px}
header.hero h1{margin:0 0 14px;font-size:2.3rem;letter-spacing:-.025em;font-weight:700;line-height:1.12;text-shadow:0 2px 16px rgba(0,0,0,.4)}
header.hero .pitch{font-size:1.06rem;line-height:1.6;max-width:660px;margin:0 0 24px;text-shadow:0 1px 10px rgba(0,0,0,.35)}
header.hero .pitch em{font-style:normal;background:rgba(255,255,255,.16);padding:1px 6px;border-radius:4px}
.bases{display:flex;gap:14px;flex-wrap:wrap}
.base{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);border-radius:11px;padding:13px 17px;flex:1 1 270px;backdrop-filter:blur(4px)}
.base b{display:block;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;opacity:.8;margin-bottom:4px}
.base span{font-size:.94rem;line-height:1.45;display:block}

/* ---------- NAV ---------- */
nav.days{position:sticky;top:0;z-index:30;background:rgba(250,247,242,.97);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:32px}
nav.days .inner{max-width:960px;margin:0 auto;padding:0 20px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
nav.days a{flex:0 0 auto;text-decoration:none;color:var(--ink2);font-size:.79rem;font-weight:600;
  padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;white-space:nowrap}
nav.days a:hover{background:var(--chestnut);color:#fff;border-color:var(--chestnut)}
nav.days a.hot{border-color:#e0bfae;color:var(--chestnut)}

h2.sec{font-size:1.5rem;margin:48px 0 6px;letter-spacing:-.01em;padding-bottom:8px;border-bottom:2px solid var(--chestnut)}
h2.sec .wk{display:block;font-size:.73rem;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);font-weight:600;margin-bottom:4px}
p.lede{color:var(--ink2);margin:12px 0 26px}

/* ---------- DAY ---------- */
.day{background:var(--card);border:1px solid var(--line);border-radius:15px;margin:0 0 24px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 28px -20px rgba(0,0,0,.3)}
.cover{position:relative;height:215px;background:#ded6c8;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.nope{display:none}
.cover .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 22px 10px;color:#fff;font-size:.75rem;
  background:linear-gradient(transparent,rgba(0,0,0,.62));text-shadow:0 1px 4px rgba(0,0,0,.5)}
.cover .cap a{color:#fff;opacity:.72;text-decoration:none;border-bottom:1px dotted rgba(255,255,255,.5)}
.day > .head{padding:19px 22px 16px;border-bottom:1px solid var(--line);background:#fff}
.day > .head .dt{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--chestnut);font-weight:700}
.day > .head h3{margin:3px 0 10px;font-size:1.28rem;letter-spacing:-.015em;line-height:1.28}
.day > .head .pitch{margin:0 0 12px;font-size:.97rem;line-height:1.6;color:var(--ink2);
  border-left:3px solid #e6d5c6;padding-left:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.71rem;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid}
.t-rando{color:var(--moss);border-color:#c4d4bc;background:#f2f7ef}
.t-eau{color:var(--river);border-color:#b8d1de;background:#eff6fa}
.t-visite{color:var(--chestnut);border-color:#e4c7b9;background:#fbf2ee}
.t-marche{color:var(--amber);border-color:#e9d6ac;background:#fcf7ea}
.t-route{color:var(--stone);border-color:#d9d2c7;background:#f5f2ec}
.t-village{color:var(--plum);border-color:#dbc8e0;background:#f8f2fa}
.t-tot{color:#fff;border-color:var(--red);background:var(--red)}

/* ---------- TIMELINE ---------- */
table.tl{width:100%;border-collapse:collapse}
table.tl td{padding:14px 22px;vertical-align:top;border-bottom:1px solid #f1ece3}
table.tl tr:last-child td{border-bottom:0}
td.h{width:72px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--chestnut);font-size:.92rem;white-space:nowrap}
td.b strong.t{display:flex;align-items:flex-start;font-size:1.02rem;margin-bottom:3px;line-height:1.35}
td.b .meta{font-size:.855rem;color:var(--mute);margin-left:24px}
td.b p{margin:8px 0 0 24px;font-size:.94rem;color:var(--ink2)}
tr.r-rando strong.t svg{color:var(--moss)} tr.r-eau strong.t svg{color:var(--river)}
tr.r-eat strong.t svg{color:var(--chestnut)} tr.r-visit strong.t svg{color:var(--chestnut)}
tr.r-village strong.t svg{color:var(--plum)} tr.r-marche strong.t svg{color:var(--amber)}
tr.r-home strong.t svg{color:var(--stone)} tr.r-train strong.t svg{color:var(--stone)}
tr.leg td{background:#f8f5f0;padding-top:9px;padding-bottom:9px;font-size:.85rem;color:var(--stone);font-weight:600}
tr.leg svg{color:var(--stone);width:15px;height:15px}
.links{margin:10px 0 0 24px;display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:.755rem;font-weight:600;text-decoration:none;padding:4px 10px;border-radius:7px;border:1px solid;white-space:nowrap}
a.l-map{color:var(--river);border-color:#bcd4e0;background:#f0f7fa}
a.l-map:hover{background:var(--river);color:#fff}
a.l-nav{color:var(--stone);border-color:#d9d2c7;background:#f6f3ed}
a.l-nav:hover{background:var(--stone);color:#fff}
a.l-trk{color:var(--moss);border-color:#c6d6be;background:#f2f7ef}
a.l-trk:hover{background:var(--moss);color:#fff}
a.l-web{color:var(--chestnut);border-color:#e4c7b9;background:#fbf2ee}
a.l-web:hover{background:var(--chestnut);color:#fff}
.note-google{display:inline-flex;align-items:center;gap:4px;font-size:.79rem;font-weight:700;color:#8a6a1c;
  background:#fcf7ea;border:1px solid #e9d6ac;border-radius:6px;padding:2px 8px;margin-left:24px;margin-top:8px}
.note-google svg{width:13px;height:13px;color:#c99a24;fill:#c99a24;stroke:none;margin:0}
.access{margin:10px 0 0 24px;font-size:.865rem;background:#f4f7f9;border:1px solid #d9e6ed;border-left:3px solid var(--river);
  border-radius:8px;padding:10px 13px;color:#2f4d5c}
.access b{color:var(--river)}
.access.warn{background:#fdf4f2;border-color:#f0dbd6;border-left-color:var(--red);color:#7c3227}
.access.warn b{color:var(--red)}
.shop{margin:10px 0 0 24px;font-size:.875rem;background:#f7f5ef;border:1px dashed #ddd3c2;border-radius:8px;padding:10px 13px;color:#5d5445}
.shop b{color:var(--chestnut)}

/* ---------- STRIP ---------- */
.strip{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line)}
.strip figure{margin:0;position:relative;height:168px;overflow:hidden;background:#e2dacc}
.strip figure.nope{display:none}
.strip img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.strip figure:hover img{transform:scale(1.05)}
.strip figcaption{position:absolute;left:0;right:0;bottom:0;padding:20px 12px 8px;color:#fff;font-size:.74rem;
  background:linear-gradient(transparent,rgba(0,0,0,.62));text-shadow:0 1px 4px rgba(0,0,0,.5)}
.strip a{text-decoration:none}
@media(max-width:520px){.strip{grid-template-columns:1fr}}

/* ---------- NOTES ---------- */
.note{margin:0;padding:13px 22px;font-size:.88rem;background:#fbf7ee;border-top:1px solid #f1e7d3;color:#6a5930}
.note b{color:#8a6a1c}
.note.warn{background:#fdf2f0;border-top-color:#f3dcd7;color:#7c3227}
.note.warn b{color:var(--red)}
.note.plan{background:#f2f7ef;border-top-color:#dcead6;color:#3e5836}
.note.plan b{color:var(--moss)}
.note.prep{background:#f4f2fa;border-top-color:#ded6ec;color:#4e3f63}
.note.prep b{color:var(--plum)}

/* ---------- BOXES ---------- */
.box{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:22px 24px;margin:0 0 20px}
.box h4{margin:0 0 12px;font-size:1.06rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:18px}
ul.tight{margin:8px 0 0;padding-left:20px}
ul.tight li{margin:6px 0;font-size:.93rem}
table.ref{width:100%;border-collapse:collapse;font-size:.885rem;margin-top:8px}
table.ref th{text-align:left;font-size:.71rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);
  padding:6px 10px 6px 0;border-bottom:2px solid var(--line)}
table.ref td{padding:9px 10px 9px 0;border-bottom:1px solid #f1ece3;vertical-align:top}
table.ref tr:last-child td{border-bottom:0}
.big{font-size:1.02rem;font-weight:700;color:var(--red)}
a{color:var(--river)}
footer{margin-top:52px;padding-top:22px;border-top:1px solid var(--line);font-size:.83rem;color:var(--mute)}

/* ---------- ALTITUDE ET METEO ---------- */
.wx{display:inline-flex;align-items:center;flex-wrap:wrap;gap:8px;margin:8px 0 0 24px;padding:5px 11px;
  border-radius:8px;background:#f3f6f4;border:1px solid #d8e2da;font-size:.83rem;color:#3f5449;line-height:1.3}
.wx .alt{font-weight:700;color:var(--moss);white-space:nowrap}
.wx .sep{color:#b9c7bd}
.wx .t{font-weight:700;color:var(--chestnut);white-space:nowrap}
.wx .cond{color:#5c6a60;white-space:nowrap}
.wx .load{color:var(--mute);font-style:italic}
.wx.warm{background:#fdf5ee;border-color:#eeddc9}
.wx.warm .t{color:#b4531f}
.wx.hot{background:#fdf0ed;border-color:#f0d5cd}
.wx.hot .t{color:var(--red)}
.wx.cool{background:#eff5fa;border-color:#cfe0ec}
.wx.cool .t{color:var(--river)}
#wxbar{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--river);border-radius:13px;
  padding:15px 18px;margin:0 0 20px;font-size:.9rem;color:var(--ink2)}
#wxbar b{color:var(--river)}
#wxbar .st{font-size:.83rem;color:var(--mute);margin-top:7px;display:block}
@media(max-width:700px){.wx{margin-left:0;font-size:.8rem;padding:5px 9px;gap:6px}}

/* ---------- CARTES DE RÉSERVATION ---------- */
.resa{border:1px solid var(--line);border-left:3px solid #cfc6b7;border-radius:11px;padding:13px 15px;margin-bottom:11px;background:#fffdfa}
.resa.hot{border-left-color:var(--red);background:#fefaf9}
.rh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:5px}
.rd{font-size:.73rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--chestnut)}
.rb{font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid}
.rb-ok{color:var(--stone);border-color:#d9d2c7;background:#f6f3ed}
.rb-must{color:#fff;border-color:var(--red);background:var(--red)}
.rn{font-size:1.02rem;font-weight:700;line-height:1.32;margin-bottom:3px}
.rm{font-size:.855rem;color:var(--mute);line-height:1.45;margin-bottom:9px}
a.rt{display:inline-flex;align-items:center;gap:6px;font-size:.94rem;font-weight:700;font-variant-numeric:tabular-nums;
  text-decoration:none;color:var(--river);background:#f0f7fa;border:1px solid #bcd4e0;border-radius:8px;padding:7px 13px}
a.rt::before{content:"\260E";font-size:.95em;opacity:.75}
a.rt:hover{background:var(--river);color:#fff}
a.tel{color:var(--river);text-decoration:none;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;
  border-bottom:1px solid #bcd4e0}

/* ---------- BACK TO TOP ---------- */
#top{position:fixed;right:16px;bottom:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;
  width:46px;height:46px;border-radius:50%;background:var(--chestnut);color:#fff;border:0;
  box-shadow:0 4px 14px rgba(0,0,0,.28);display:none;align-items:center;justify-content:center;cursor:pointer;
  font-size:19px;line-height:1;padding:0}
#top.on{display:flex}
#top:active{transform:scale(.94)}

/* ══════════ MOBILE ══════════ */
@media(max-width:700px){
  body{font-size:15.5px}
  .wrap{padding:0 14px 90px}

  header.hero .inner{padding:38px 16px 34px}
  header.hero h1{font-size:1.62rem;line-height:1.18}
  header.hero .kicker{font-size:.68rem;letter-spacing:.14em}
  header.hero .pitch{font-size:.97rem;line-height:1.55}
  .base{flex:1 1 100%;padding:11px 14px}

  nav.days{padding:8px 0}
  nav.days .inner{padding:0 14px;gap:5px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  nav.days .inner::-webkit-scrollbar{display:none}
  nav.days a{scroll-snap-align:start;padding:8px 12px;font-size:.78rem}

  h2.sec{font-size:1.28rem;margin:36px 0 6px}
  p.lede{font-size:.95rem}

  .cover{height:168px}
  .cover .cap{padding:22px 14px 9px;font-size:.71rem}
  .day{border-radius:13px;margin-bottom:18px}
  .day > .head{padding:15px 15px 13px}
  .day > .head h3{font-size:1.14rem}
  .day > .head .pitch{font-size:.93rem;padding-left:11px}
  .tag{font-size:.685rem;padding:3px 8px}

  /* la timeline passe en blocs empilés */
  table.tl, table.tl tbody, table.tl tr, table.tl td{display:block;width:100%}
  table.tl tr{border-bottom:1px solid #f1ece3;padding:14px 15px}
  table.tl tr:last-child{border-bottom:0}
  table.tl td{border:0;padding:0}
  table.tl td.h{width:auto;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;margin:0 0 8px;
    color:#fff;background:var(--chestnut);border-radius:99px;padding:4px 11px;display:inline-block;
    box-shadow:0 1px 3px rgba(140,74,47,.25)}
  table.tl td.h:empty{display:none;margin:0}
  table.tl tr.leg{background:#f8f5f0;padding:11px 15px}
  table.tl tr.leg td.h{background:transparent;color:var(--stone);padding:0;margin-bottom:4px;
    display:block;box-shadow:none;font-size:.68rem}
  table.tl tr.leg td.b{font-size:.82rem;line-height:1.45}
  td.b strong.t{font-size:1rem}
  td.b .meta,td.b p,.links,.access,.shop,.note-google{margin-left:0}
  td.b .meta{font-size:.83rem}
  td.b p{font-size:.92rem}
  .links{gap:7px}
  .links a{padding:7px 11px;font-size:.75rem}
  .access,.shop{padding:11px 12px;font-size:.85rem}
  .note{padding:13px 15px;font-size:.86rem}

  .strip figure{height:150px}
  .box{padding:18px 16px;border-radius:13px}
  .grid2{gap:14px}


  /* tableaux récapitulatifs : empilés en blocs */
  .box table.ref{display:block;overflow:visible;white-space:normal}
  .box table.ref thead,.box table.ref tbody,.box table.ref tr,.box table.ref td{display:block;width:100%}
  .box table.ref th{display:none}
  .box table.ref tr{border-bottom:1px solid var(--line);padding:13px 0}
  .box table.ref tr:first-child:has(th){display:none;padding:0;border:0}
  .box table.ref tr:last-child{border-bottom:0;padding-bottom:0}
  .box table.ref td{border:0;padding:3px 0;min-width:0}
  .box table.ref td:first-child{font-weight:700;font-size:1rem;line-height:1.35;margin-bottom:4px}
  .box table.ref td[data-l]::before{content:attr(data-l);display:block;font-size:.68rem;letter-spacing:.09em;
    text-transform:uppercase;color:var(--mute);font-weight:700;margin-top:5px;margin-bottom:1px}
}
@media(min-width:701px){.scrollhint{display:none}}
@media(max-width:380px){
  header.hero h1{font-size:1.44rem}
  .day > .head h3{font-size:1.06rem}
  .links a{font-size:.72rem;padding:6px 9px}
}
@media print{nav.days,#top{display:none}.day{break-inside:avoid;box-shadow:none}.cover{height:150px}}

/* ══════════ APPLICATION ══════════ */
html,body{overflow-x:hidden;max-width:100%}
.wrap{max-width:1120px;padding-bottom:40px}
.topbar{position:sticky;top:0;z-index:50;background:rgba(250,247,242,.96);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:11px 18px}
.topbar .marque{font-weight:800;letter-spacing:-.03em;font-size:1.02rem;color:var(--chestnut);white-space:nowrap;text-decoration:none}
.topbar .marque i{font-style:normal;color:var(--ink);font-weight:600}
.topbar .spacer{flex:1}
.tabs{display:flex;gap:3px}
.tabs a{padding:8px 11px;border-radius:99px;font-size:.85rem;font-weight:650;color:var(--ink2);text-decoration:none}
.tabs a:hover{background:#f0eae1}
.tabs a.on{background:var(--ink);color:#fff}
.tabbar{display:none}
@media(max-width:860px){
  .tabs{display:none}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:rgba(255,253,250,.985);
    backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 7px;
    text-decoration:none;color:var(--mute);font-size:.6rem;font-weight:700;white-space:nowrap}
  .tabbar a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tabbar a.on{color:var(--chestnut)}
  body{padding-bottom:66px} #top,#maj{bottom:calc(76px + env(safe-area-inset-bottom))}
}

/* --- hero --- */
.hero2{position:relative;border-radius:20px;overflow:hidden;margin:18px 0 8px;min-height:400px;display:flex;align-items:flex-end;background:#3d4a38}
.hero2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero2 .v{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,26,18,.88) 0%,rgba(20,26,18,.35) 45%,rgba(20,26,18,.12) 100%)}
.hero2 .c{position:relative;padding:26px;color:#fff;width:100%}
.hero2 .k{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;opacity:.82;margin-bottom:9px}
.hero2 h1{margin:0 0 10px;font-size:2.5rem;letter-spacing:-.038em;line-height:1.06;max-width:22ch}
.hero2 p{margin:0;font-size:1rem;opacity:.93;max-width:56ch;line-height:1.6}
.hero2 .hgo{display:inline-flex;align-items:center;gap:6px;margin-top:15px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px);color:#fff;text-decoration:none;
  border-radius:99px;padding:9px 16px;font-size:.86rem;font-weight:700;transition:background .16s}
.hero2 .hgo:hover{background:rgba(255,255,255,.24)}
@media(max-width:700px){.hero2{min-height:370px;border-radius:16px}.hero2 h1{font-size:1.78rem;max-width:16ch}.hero2 .c{padding:20px}
  .rail{margin:0 -14px;padding:2px 14px 12px}
  .vig{flex-basis:186px}}

/* --- les temps forts --- */
.forts{margin:4px 0 4px}
.fh{margin-bottom:16px}
.fh b{display:block;font-size:1.42rem;letter-spacing:-.03em;line-height:1.15}
.fh p{margin:7px 0 0;font-size:.93rem;color:var(--ink2);line-height:1.6;max-width:62ch}
.fi{display:grid;grid-template-columns:230px 1fr;gap:0;text-decoration:none;color:inherit;

<script>window.__DATA={"version": 1, "jours": [{"id": "j1", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/159_Le_Vigan_L%27h%C3%B4tel_de_ville.JPG?width=1200", "alt": "Le Vigan", "cap": "Le Vigan · <a href=\"https://commons.wikimedia.org/wiki/File:159_Le_Vigan_L%27h%C3%B4tel_de_ville.JPG\">Wikimedia Commons</a>"}, "dt": "Dimanche 9 août · arrivée", "titre": "Poser les valises, traverser le vieux pont, et se tremper dans l'Arre", "pitch": "Première soirée : rien d'ambitieux. Le Vigan se traverse en une heure et demie, du vieux pont en dos d'âne au quartier des tanneurs, avec ce moment où la ruelle s'ouvre d'un coup sur une place à platanes. Puis l'Arre, quinze minutes plus loin, pour laver la route de vos jambes et de celles du chien.", "tags": [{"cls": "t-village", "txt": "Flânerie"}, {"cls": "t-eau", "txt": "Baignade"}, {"cls": "t-route", "txt": "Installation"}, {"cls": "t-tot", "txt": "15 min de volant"}], "etapes": [{"type": "home", "heure": "Avant", "icone": "i-basket", "titre": "Faites vos courses AVANT d'arriver", "blocs": [{"t": "meta", "html": "Le dimanche après-midi, Le Vigan est mort : commerces fermés, supermarchés ouverts le matin seulement pour certains"}, {"t": "shop", "html": "<b>À prendre en route</b> (dernier gros supermarché sur votre trajet, ou à Ganges) : pain, tomates, melon, jambon cru, huile d'olive, œufs, café, eau. Et deux indispensables pour la semaine : une <strong>gamelle pliable</strong> et deux bouteilles d'eau qui resteront dans le sac du chien."}]}, {"type": "home", "heure": "16h00", "icone": "i-home", "titre": "Installation", "pt": "p0", "blocs": [{"t": "meta", "html": "357 Route de Ganges, 30120 Le Vigan"}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=357+Route+de+Ganges%2C+30120+Le+Vigan", "txt": "Fiche et avis"}]}]}, {"type": "trajet", "heure": "17h20", "html": "Le gîte, route de Ganges → Centre du Vigan · 2 km · <strong>5min</strong> · ou 20 min à pied par la route de Ganges", "fin": "Installé", "vers": "Centre du Vigan", "nav": "https://www.google.com/maps/search/?api=1&query=Place+du+Quai+Le+Vigan", "alt": 231, "km": "2", "duree": "5min", "route": "ou 20 min à pied par la route de Ganges", "de_pt": "p0", "vers_pt": "p1", "de_lib": "Le gîte, route de Ganges", "vers_lib": "Centre du Vigan", "de_alt": 245, "vers_alt": 231}, {"type": "village", "heure": "17h30", "icone": "i-village", "titre": "Le Vigan à pied", "pt": "p1", "blocs": [{"t": "meta", "html": "1h30 · à pied depuis le gîte ou stationnement place du Quai · le seul bourg de la semaine avec une vraie densité de commerces"}, {"t": "p", "html": "Le <strong>vieux pont médiéval en dos d'âne</strong> sur l'Arre, dont le tablier de galets mène droit au <strong>quartier du Buscailhou</strong>, l'ancien faubourg des tanneurs et des fileurs : ruelles étroites, maisons hautes serrées. Le <strong>Musée cévenol</strong> occupe une ancienne filature, le <strong>château d'Assas</strong> (XVIII<sup>e</sup>, classé) ferme la promenade au nord."}, {"t": "p", "html": "Ce qui est ouvert et vaut le détour : <strong>Librairie Le Pouzadou</strong> (la vraie librairie indépendante du secteur), <strong>Monkawa</strong> (torréfacteur artisanal), <strong>Aura des Champs</strong> (boutique paysanne), <strong>Ô Gourmandises</strong> (salon de thé, thés en vrac), <strong>Tatatatin</strong> (tarterie, pain d'épeautre)."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Vieux+Pont+Le+Vigan+30120", "txt": "Vieux pont"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Librairie+Le+Pouzadou+Le+Vigan", "txt": "Le Pouzadou"}, {"cls": "l-web", "href": "https://www.levigan.fr/vivre-au-vigan/economie/annuaire-commercants-artisans-entreprises/", "txt": "Annuaire des commerçants"}]}]}, {"type": "trajet", "heure": "", "html": "Le Vigan → Avèze, Pont Vieux · 4 km · <strong>6 min</strong>", "fin": "Fin de la flânerie", "vers": "le Pont Vieux d'Avèze, baignade puis dîner à la guinguette", "nav": "https://www.google.com/maps/dir/?api=1&amp;destination=43.975307%2C3.599236", "alt": 250, "km": "4", "duree": "6min", "route": "", "de_pt": "p1", "vers_pt": "p2", "de_lib": "Le Vigan", "vers_lib": "Avèze, Pont Vieux", "de_alt": 231, "vers_alt": 250}, {"type": "eau", "heure": "19h00", "icone": "i-swim", "titre": "Baignade — Aire du Pont Vieux, Avèze", "pt": "p2", "blocs": [{"t": "meta", "html": "L'Arre · gratuit · site officiellement suivi par l'ARS · non surveillé"}, {"t": "p", "html": "Le site de baignade contrôlé le plus proche du gîte. Berges à l'ombre, eau peu profonde, parfait pour une première trempette sans enjeu."}, {"t": "access", "warn": false, "html": "<b>Accès et stationnement</b> — Depuis Le Vigan, D999 puis direction Avèze ; le Pont Vieux est en contrebas du village, route goudronnée sans difficulté. <strong>Le stationnement n'est pas balisé</strong> : garez-vous le long de l'accès, et surtout <strong>pas sur les emplacements du camping « Le Pont Vieux »</strong> qui est mitoyen. La fiche officielle prévient que c'est « un endroit très prisé en période estivale ». Un dimanche à 19h, ce sera calme."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Aire+de+pique-nique+du+Pont+Vieux+Av%C3%A8ze", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=43.975307%2C3.599236", "txt": "Itinéraire · 43.975307, 3.599236"}]}]}, {"type": "eat", "heure": "20h00", "icone": "i-eat", "titre": "Dîner — La Guinguette d'Avèze", "blocs": [{"t": "meta", "html": "Le Pont Vieux, 30120 Avèze · <strong>vous y êtes déjà</strong>, c'est le spot de baignade · tous les jours 10h-1h du matin jusqu'au 30 septembre"}, {"t": "note", "html": "Google 4,6 / 5 · 288 avis"}, {"t": "p", "html": "Sixième saison pour cette guinguette posée au bord de l'Arre, au pied du vieux pont. Terrasse au fil de l'eau, produits locaux et de saison, service jusqu'à une heure du matin. Vous vous baignez, vous séchez, vous dînez sur place : c'est la meilleure première soirée possible, et vous ne reprenez pas la voiture."}, {"t": "access", "warn": true, "html": "<b>Le bémol, dit franchement</b> — Plusieurs avis récents pointent une gestion approximative des réservations, un client raconte avoir été refoulé malgré une table confirmée. Venez en mode décontracté, sans en faire l'enjeu de la soirée. Contact par mail à guinguetteaveze@gmail.com ou sur Instagram, <strong>aucun téléphone n'est publié</strong>."}, {"t": "shop", "html": "<b>Du coup, pas de cuisine ce soir</b> — Gardez les courses pour demain. Il vous faut juste, pour le petit-déjeuner : pain, café, fruits."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&query=La+Guinguette+d%27Av%C3%A8ze+Pont+Vieux", "txt": "Fiche et avis"}]}]}, {"type": "trajet", "heure": "22h30", "html": "Avèze → Le Vigan · 4 km · <strong>6 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 15 min de conduite</strong>", "fin": "Fin du repas", "vers": "le gîte du Vigan · 357 route de Ganges", "nav": "https://www.google.com/maps/dir/?api=1&destination=357+Route+de+Ganges%2C+30120+Le+Vigan", "alt": null, "km": "4", "duree": "6min", "route": "la D999, deux virages et vous y êtes", "de_pt": "p2", "vers_pt": null, "de_lib": "Avèze", "vers_lib": "Le Vigan", "de_alt": 250, "vers_alt": 245}], "notes": [{"cls": "note", "html": "<b>Ce soir, prenez le réflexe qui structure toute la semaine :</b> ouvrez <a href=\"https://www.risque-prevention-incendie.fr/gard/\">risque-prevention-incendie.fr/gard</a>. La carte du lendemain est publiée entre 17h et 18h. Regardez <strong>votre zone</strong>, pas la couleur globale du département. En rouge, les massifs sont totalement interdits et il faut basculer sur le plan B de la journée."}], "alt_max": 250, "alt_min": 231, "rando": null, "volant": "15 min", "chaud": {"texte": "Rien à changer : vous arrivez en fin de journée et vous vous baignez dans l'Arre.", "lieu": null, "alt": null}, "geo": {"lat": 43.975307, "lon": 3.599236, "lab": "Avèze", "alt": 250}, "base": {"lat": 43.9902, "lon": 3.6183, "lab": "Le Vigan"}, "bonus": [{"k": "eau", "titre": "L'Arre à Molières-Cavaillac", "meta": "7 min du Vigan · 220 m · gratuit", "txt": "Si le Pont Vieux d'Avèze est bondé un dimanche d'août, voilà le repli immédiat : des berges sous les peupliers, animaux acceptés. Ce n'est pas un site de baignade contrôlé, plutôt une aire de pique-nique au bord de l'eau, et l'accès est un cul-de-sac étroit.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=43.969666%2C3.584494"}]}, {"k": "village", "titre": "Le vieux Vigan et son pont du XII<sup>e</sup>", "meta": "à pied depuis le gîte · 20 min", "txt": "Si vous arrivez tôt et que la chaleur retombe, le pont vieux sur l'Arre et la place du Quai valent le détour à pied, sans reprendre la voiture. C'est aussi le meilleur moyen de repérer les commerces avant les courses de demain.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Pont+Vieux+Le+Vigan+30120"}]}]}, {"id": "j2", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Observatoire_du_mont_aigoual.JPG?width=1200", "alt": "Observatoire du Mont Aigoual", "cap": "L'observatoire du Mont Aigoual, 1565 m · <a href=\"https://commons.wikimedia.org/wiki/File:Observatoire_du_mont_aigoual.JPG\">Wikimedia Commons</a>"}, "dt": "Lundi 10 août", "titre": "Monter à l'Aigoual, là où il fait 12 °C de moins qu'en bas", "pitch": "C'est la journée qui donne le ton. En cinquante minutes de route vous passez de 245 à 1565 mètres, et la température s'effondre de douze degrés. Vous marchez deux heures et demie sous un couvert de hêtres si dense qu'on n'y voit jamais le ciel, vous déjeunez à 1230 m avec le chien sous la table, puis vous montez sur la dernière station météo de montagne habitée de France. Retour par un lac d'altitude qui ressemble à la Laponie.", "tags": [{"cls": "t-rando", "txt": "Rando 7,2 km · forêt"}, {"cls": "t-route", "txt": "Sommet 1565 m"}, {"cls": "t-village", "txt": "L'Espérou"}, {"cls": "t-tot", "txt": "2h05 de volant · max 1h05 d'affilée"}], "etapes": [{"type": "trajet", "heure": "9h30", "html": "Le Vigan → Col de la Serreyrède · D999 puis D986 · 34 km · <strong>50 min</strong>", "fin": "Départ", "vers": "Maison de l'Aigoual", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Maison+de+l%27Aigoual+Col+de+la+Serreyr%C3%A8de", "alt": 1299, "km": "34", "duree": "50min", "route": "D999 puis D986", "de_pt": "b_j2_9", "vers_pt": "p3", "de_lib": "Le Vigan", "vers_lib": "Col de la Serreyrède", "de_alt": 245, "vers_alt": 1299}, {"type": "visit", "heure": "10h20", "icone": "i-ticket", "titre": "Maison de l'Aigoual, col de la Serreyrède", "pt": "p3", "blocs": [{"t": "meta", "html": "1299 m · maison du Parc national, exposition, boutique de produits locaux · <a class=\"tel\" href=\"tel:+33467826467\">04 67 82 64 67</a>"}, {"t": "p", "html": "Vingt minutes, le temps de faire le plein d'eau et de demander l'état des sentiers et la présence des troupeaux. Emportez une <strong>polaire et un coupe-vent</strong>, même par 35 °C en bas : le sommet compte 240 jours de brouillard par an."}, {"t": "access", "warn": false, "html": "<b>Accès et stationnement</b> — RD986, croisement des GR7, GR60 et GR66. Grande route de col goudronnée, sans difficulté. Parking à côté du bâtiment, a priori gratuit (site du Parc national), mais <strong>très prisé</strong> car c'est le départ de nombreuses boucles. Horaires de la maison variables selon la saison : si vous voulez être sûrs, appelez la veille."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Maison+de+l%27Aigoual+Col+de+la+Serreyr%C3%A8de", "txt": "Fiche et avis"}]}]}, {"type": "rando", "heure": "10h25", "icone": "i-hike", "titre": "Rando : Sentier du Col de la Caumette", "pt": "p4", "blocs": [{"t": "meta", "html": "7,2 km · +216 m · 2h30 · départ au col · balisage jaune · quasi 100 % sous couvert forestier"}, {"t": "p", "html": "Les avis sont unanimes : on ne quitte pas la forêt. Peu de points de vue en échange, mais c'est exactement ce qu'on cherche un jour d'août. Fontaine au col au départ et à l'arrivée. La navigation se perd par endroits entre les points 3 et 4 : <strong>chargez la trace avant de partir, il n'y a aucun réseau sur le massif</strong>."}, {"t": "p", "html": "<em>Version longue si vous êtes en forme : 14 km, +264 m, 4h45, même départ. Elle vous prendra l'après-midi et vous ferez l'impasse sur le sommet.</em>"}, {"t": "liens", "liens": [{"cls": "l-web", "href": "https://destination.cevennes-parcnational.fr/trek/41237-Col-de-la-Caumette", "txt": "Fiche officielle"}, {"cls": "l-trk", "href": "https://geotrek-admin.cevennes-parcnational.net/api/fr/treks/41237/col-de-la-caumette.gpx", "txt": "Télécharger le GPX"}, {"cls": "l-trk", "href": "https://www.visorando.com/randonnee-le-col-de-la-caumette/", "txt": "Trace Visorando"}]}]}, {"type": "eat", "heure": "13h10", "icone": "i-eat", "titre": "Pique-nique au col de la Serreyrède", "blocs": [{"t": "meta", "html": "1299 m · tables et fontaine au col, devant la Maison de l'Aigoual · vous sortez de 2h30 de forêt"}, {"t": "p", "html": "Vous mangez à 1299 m, avec une vingtaine de degrés pendant que la vallée est à 35. C'est tout l'intérêt de la journée, et aucune table du plateau ne vaut ça."}, {"t": "access", "warn": true, "html": "<b>Pourquoi pas de restaurant ici</b> — L'Aigoual est le point faible du séjour côté tables. La brasserie du carrefour des Hommes de la Route est une halte routière sans intérêt, et le restaurant de l'Observatoire se visite pour la vue, pas pour l'assiette. Vous mangerez infiniment mieux avec ce que vous aurez préparé."}, {"t": "shop", "html": "<b>Préparé la veille au soir</b> — Sandwichs au pélardon et à la charcuterie, tomates, fruits, une thermos de café. Et arrêtez-vous à <strong>Terres d'Aigoual</strong>, la boutique de producteurs de L'Espérou, pour compléter et pour acheter le dîner de ce soir."}]}, {"type": "trajet", "heure": "", "html": "Col de la Serreyrède → sommet du Mont Aigoual · D986, la route de crête · 6 km · <strong>12 min</strong>", "fin": "Fin du pique-nique", "vers": "Le sommet du Mont Aigoual", "nav": "https://www.google.com/maps/dir/?api=1&amp;destination=44.121212%2C3.579283", "alt": 1565, "km": "6", "duree": "12min", "route": "D986, la route de crête", "de_pt": "p4", "vers_pt": "p6", "de_lib": "Col de la Serreyrède", "vers_lib": "sommet du Mont Aigoual", "de_alt": 1299, "vers_alt": 1565}, {"type": "visit", "heure": "15h00", "icone": "i-village", "titre": "Le sommet du Mont Aigoual, tranquillement", "pt": "p6", "blocs": [{"t": "meta", "html": "Accès libre et gratuit · 1h sur place · 1565 m"}, {"t": "p", "html": "La <strong>table d'orientation du Touring Club de France</strong>, posée là en 1908, est en accès libre : par temps clair on voit les Alpes, les Pyrénées et la Méditerranée. Par temps couvert on ne voit rien du tout, et c'est presque plus impressionnant."}, {"t": "p", "html": "Vous avez déjà marché 2h30 ce matin : contentez-vous du panorama, de la station météo et du vent. Si l'envie d'un peu plus vous prend, la <strong>boucle de Trépaloup</strong> part du même parking — 2,7 km, 1h, facile, deux menhirs, la fontaine de Trépaloup et la source du Tarnon."}, {"t": "p", "html": "<em>Le <strong>Climatographe</strong>, dans l'ancien observatoire, propose 700 m² d'exposition sur le climat (10h-19h, 9 €). Je l'ai sorti du programme : sa politique chien n'est pas publiée et la journée respire mieux sans. Gardez-le en repli si le sommet est dans les nuages, ce qui arrive 240 jours par an.</em>"}, {"t": "access", "warn": false, "html": "<b>Accès et stationnement</b> — D986 depuis le col de la Serreyrède, 6 km. Route large et goudronnée, sans difficulté. <strong>Un seul et grand parking gratuit au sommet</strong>, dimensionné voitures et autocars, qui dessert l'observatoire ; quelques dizaines de mètres de marche. <strong>Aucune ombre</strong> à 1567 m. Snack-bar et gîte d'étape sur place. Ne confondez pas avec la station de <strong>Prat Peyrot</strong>, 4 km avant, qui a son propre parking."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Observatoire+du+Mont+Aigoual", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.121212%2C3.579283", "txt": "Itinéraire · 44.121212, 3.579283"}, {"cls": "l-web", "href": "https://climatographe.fr/", "txt": "climatographe.fr"}, {"cls": "l-trk", "href": "https://www.visorando.com/randonnee-boucle-de-trepaloup/", "txt": "Trépaloup · Visorando"}]}]}, {"type": "trajet", "heure": "16h30", "html": "Mont Aigoual → Le Vigan · par le col de la Serreyrède puis le col du Minier · 40 km · <strong>1h05</strong> &nbsp;·&nbsp; <strong>Total du jour : 2h05 de conduite, plus longue traite 1h05</strong>", "fin": "Fin de la visite", "vers": "le gîte du Vigan · 357 route de Ganges", "nav": "https://www.google.com/maps/dir/?api=1&destination=357+Route+de+Ganges%2C+30120+Le+Vigan", "alt": null, "km": "40", "duree": "1h05", "route": "par le col de la Serreyrède puis le col du Minier", "de_pt": "p6", "vers_pt": null, "de_lib": "Mont Aigoual", "vers_lib": "Le Vigan", "de_alt": 1565, "vers_alt": 245}, {"type": "eat", "heure": "20h15", "icone": "i-eat", "titre": "Dîner à la maison", "blocs": [{"t": "shop", "html": "<b>Au menu</b> — Oignons doux des Cévennes fondus à la poêle avec la charcuterie de Terres d'Aigoual, pélardon poêlé, salade. L'oignon doux se mange presque cru : ne le cuisez pas plus de dix minutes, il doit rester translucide.<br><b>Vous avez déjà tout acheté</b> à L'Espérou. Il vous manque juste du pain et une salade verte."}]}], "notes": [{"cls": "note prep", "html": "<b>Ce soir, on prépare la journée de demain.</b> Quatre heures de marche aux cascades d'Orgon, sans commerce ni point d'eau potable sur le parcours. Préparez : <strong>4 sandwichs</strong> (pain, pélardon, jambon cru, tomate, un filet d'huile d'olive), des fruits, deux barres, <strong>3 L d'eau pour vous deux</strong> et <strong>2 L dédiés au chien</strong> avec la gamelle pliable. Sortez les chaussures montantes : le sentier est raide et glissant avant les cascades."}, {"cls": "note plan", "html": "<b>Plan B si les massifs sont fermés :</b> l'Aigoual reste souvent accessible quand les garrigues basses ferment, mais si c'est rouge partout, rabattez-vous sur le village d'<strong>Aulas</strong> (5 min du Vigan, la Poterne, les passages voûtés, les moulins), la brasserie <strong>Feloni</strong> au Vigan, et la baignade du Pont Vieux d'Avèze."}], "alt_max": 1565, "alt_min": 1230, "rando": ["7,2 km", "+216 m"], "volant": "2h05", "chaud": {"texte": "Vous êtes déjà au bon endroit. À 1565 m il fera une vingtaine de degrés quand la vallée cuit.", "lieu": "Mont Aigoual", "alt": 1565}, "geo": {"lat": 44.121212, "lon": 3.579283, "lab": "Mont Aigoual", "alt": 1565}, "base": {"lat": 43.9902, "lon": 3.6183, "lab": "Le Vigan"}, "bonus": [{"k": "rando", "titre": "L'arboretum de l'Hort de Dieu", "meta": "4,7 km · +285 m · 3h30 · départ de l'observatoire", "txt": "Planté en 1903 par Georges Fabre et Charles Flahault pour reboiser un Aigoual entièrement pelé : 75 espèces survivantes sur 140 testées, neuf stations d'interprétation. Terrain raide et rocheux. <strong>À faire à la place de la Caumette si vous voulez la version botanique de la journée.</strong>", "liens": [{"cls": "l-gpx", "txt": "Trace GPX", "href": "https://www.tourismegard.com/fr/fiche/equipement/sentier-de-decouverte-l-arboretum-de-l-hort-de-dieu-l-esperou"}]}, {"k": "eau", "titre": "Le lac des Pises", "meta": "1 150 m · 25 min du col de la Serreyrède", "txt": "Un lac de montagne posé sur le plateau, entouré de pins et de pelouses d'altitude. Il fait systématiquement cinq à huit degrés de moins qu'en bas, et c'est le meilleur endroit du massif pour laisser le chien courir sans croiser personne.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Lac+des+Pises%2C+30120+Dourbies"}]}]}, {"id": "j3", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Arphy_depuis_D48.jpg?width=1200", "alt": "Vallée d'Arphy", "cap": "La vallée d'Arphy depuis la D48 · <a href=\"https://commons.wikimedia.org/wiki/File:Arphy_depuis_D48.jpg\">Wikimedia Commons</a>"}, "dt": "Mardi 11 août", "titre": "Quatre heures dans la forêt d'Orgon, puis la seule baignade surveillée du secteur", "pitch": "La vraie randonnée de la semaine. On démarre déjà à 1045 mètres, sous les hêtres, les chênes et les épicéas, avec des ruisseaux tous les quarts d'heure pour le chien. L'après-midi, on redescend sur l'Hérault naissant et on s'installe pour trois heures au bord du seul plan d'eau surveillé de la vallée. Le soir, Valleraugue : une boulangerie, une boucherie ouverte depuis 1924, et des céramistes.", "tags": [{"cls": "t-rando", "txt": "Rando 9,9 km · +400 m"}, {"cls": "t-eau", "txt": "Baignade surveillée"}, {"cls": "t-village", "txt": "Valleraugue"}, {"cls": "t-tot", "txt": "1h55 de volant"}], "etapes": [{"type": "trajet", "heure": "9h30", "html": "Le Vigan → parking des Cascades d'Orgon · D48 vers Arphy, puis D548 au col de la Broue · 17 km · <strong>30 min</strong> de route étroite et sinueuse", "fin": "Départ", "vers": "Cascades d'Orgon et monument André Chamson", "nav": "https://www.google.com/maps/dir/?api=1&amp;destination=44.053985%2C3.579673", "alt": 1045, "km": "17", "duree": "30min", "route": "D48 vers Arphy, puis D548 au col de la Broue", "de_pt": "b_j3_9", "vers_pt": "p7", "de_lib": "Le Vigan", "vers_lib": "parking des Cascades d'Orgon", "de_alt": 245, "vers_alt": 1045}, {"type": "rando", "heure": "10h00", "icone": "i-hike", "titre": "Rando : Cascades d'Orgon et monument André Chamson", "pt": "p7", "blocs": [{"t": "meta", "html": "9,9 km · +401 m · 4h · boucle · 1045 → 1329 m · <strong>cotée difficile par Rando Gard</strong>"}, {"t": "p", "html": "Le parcours reste sous le couvert forestier sur la quasi-totalité de son tracé, avec plusieurs cascades et ruisseaux en chemin et un point d'eau au refuge de Cap de Côte. Abrité du vent, frais même en pleine journée."}, {"t": "p", "html": "<em>Deux réserves honnêtes. En août, le débit des cascades diminue fortement : la forêt reste, le spectacle aquatique s'atténue. Et le circuit atteint le haut des cascades sans en offrir une vue spectaculaire — venez pour la marche, pas pour la carte postale.</em>"}, {"t": "access", "warn": true, "html": "<b>Attention au départ</b> — Depuis Le Vigan, D48 vers Arphy, puis au <strong>col de la Broue</strong> prendre la <strong>D548</strong> direction col de Giralenque. Le parking est un simple <strong>élargissement sur le côté droit de la route</strong>, avant le sommet, et il est <strong>petit</strong>. Deux coordonnées circulent, toutes deux sur la D548 et distantes de 450 m : 44.053985, 3.579673 et 44.050437, 3.582312. <strong>Le départ du sentier n'est pas évident</strong> : chargez le GPX, ne comptez pas sur le balisage seul. Aucun équipement sur place : ni toilettes, ni eau, ni commerce.<br>Et tapez bien « Cascades d'Orgon <strong>Arphy</strong> » : il existe une commune d'Orgon dans les Bouches-du-Rhône qui sature les recherches."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Cascades+d%27Orgon+Arphy+Gard", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.053985%2C3.579673", "txt": "Itinéraire · 44.053985, 3.579673"}, {"cls": "l-trk", "href": "https://www.visorando.com/randonnee-les-cascades-d-orgon-et-le-monument-andr/", "txt": "Trace Visorando"}, {"cls": "l-trk", "href": "https://www.decathlon-outdoor.com/fr-fr/explore/france/viree-aux-cascades-d-orgon-par-la-pierre-plantee-649ad25c186c3", "txt": "Decathlon Outdoor"}]}]}, {"type": "eat", "heure": "14h00", "icone": "i-eat", "titre": "Pique-nique préparé hier soir", "blocs": [{"t": "meta", "html": "Sur place aux cascades, ou en redescendant sur Arphy"}]}, {"type": "trajet", "heure": "", "html": "Arphy → Plan d'eau du Mouretou, Val-d'Aigoual · par Le Vigan et la D986 · 30 km · <strong>45 min</strong>", "fin": "Fin du repas", "vers": "surveillée", "nav": "https://www.google.com/maps/dir/?api=1&amp;destination=44.087193%2C3.606176", "alt": 450, "km": "30", "duree": "45min", "route": "par Le Vigan et la D986", "de_pt": "b_j3_9", "vers_pt": "p8", "de_lib": "Arphy", "vers_lib": "Plan d'eau du Mouretou, Val-d'Aigoual", "de_alt": 245, "vers_alt": 450}, {"type": "eau", "heure": "15h30", "icone": "i-swim", "titre": "Baignade surveillée — Plan d'eau du Mouretou", "pt": "p8", "blocs": [{"t": "meta", "html": "Sur l'Hérault naissant · gratuit · animaux acceptés · <a class=\"tel\" href=\"tel:+33467817960\">04 67 81 79 60</a>"}, {"t": "p", "html": "Le seul plan d'eau <strong>surveillé</strong> du secteur amont, et le meilleur endroit du séjour pour ne rien faire pendant trois heures pendant que le chien se rafraîchit."}, {"t": "access", "warn": false, "html": "<b>Accès, stationnement, horaires de surveillance</b> — D986 depuis Valleraugue en direction de L'Espérou, environ 3 km en amont du village. <strong>Parking gratuit sur place</strong>, aire de jeux et aire de pique-nique confirmées, camping-restaurant attenant.<br><strong>Surveillance : mardi à samedi 13h-19h, dimanche 13h-18h, FERMÉ LE LUNDI</strong> (source mairie de Val-d'Aigoual, dates annoncées 7 juillet-30 août ; une autre source dit 9 juillet-31 août). <strong>Confirmez au <a class=\"tel\" href=\"tel:+33467817960\">04 67 81 79 60</a>.</strong> C'est précisément pour cette fermeture du lundi que cette journée a été placée un mardi.<br>La commune a fusionné : Google Maps peut afficher <em>Valleraugue</em> ou <em>Val-d'Aigoual</em>, c'est le même endroit."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Plan+d%27eau+du+Mouretou+Valleraugue", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.087193%2C3.606176", "txt": "Itinéraire · 44.087193, 3.606176"}]}]}, {"type": "trajet", "heure": "", "html": "Mouretou → centre de Valleraugue · 3 km · <strong>6 min</strong>", "fin": "On se sèche", "vers": "Valleraugue", "nav": "https://www.google.com/maps/search/?api=1&amp;query=La+Placette+Valleraugue+30570", "alt": 350, "km": "3", "duree": "6min", "route": "", "de_pt": "p8", "vers_pt": "p9", "de_lib": "Mouretou", "vers_lib": "centre de Valleraugue", "de_alt": 450, "vers_alt": 350}, {"type": "village", "heure": "18h15", "icone": "i-village", "titre": "Flânerie à Valleraugue", "pt": "p9", "blocs": [{"t": "meta", "html": "45 min à 1h · village-carrefour au pied de l'Aigoual"}, {"t": "p", "html": "Maisons de schiste posées sur l'Hérault naissant, passerelles, et <strong>la Placette</strong> ombragée où se tient le marché. C'est le départ du fameux sentier des 4 000 marches. Vie de village réelle, pas décorative : les commerces sont ouverts et les gens se parlent."}, {"t": "p", "html": "À voir : <strong>Le Fournil Cévenol</strong> et <strong>Tiekula</strong> (boulangerie, pâtisserie, chocolaterie, glacerie), la <strong>boucherie Lafoux et Fils</strong> ouverte depuis 1924, <strong>Les Jardins de Gaïa</strong> pour le bio local, et les céramistes de <strong>500 degrés</strong>."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=La+Placette+Valleraugue+30570", "txt": "Fiche et avis"}]}]}, {"type": "eat", "heure": "19h15", "icone": "i-eat", "titre": "Dîner — Le Jardin Hors du Temps, Valleraugue", "blocs": [{"t": "meta", "html": "2 rue des Horts, Val-d'Aigoual · <strong>tous les jours 10h-22h en août</strong> · 04 99 75 23 28 · <strong>chiens acceptés</strong>"}, {"t": "p", "html": "Une guinguette installée dans un parc à la française de 1700 m² planté d'arbres centenaires. Jeux de société, concerts, terrasse ombragée, un ruisseau qui traverse. Vous finissez de flâner dans le village et vous êtes déjà sur place : zéro kilomètre supplémentaire après quatre heures de marche."}, {"t": "p", "html": "<em>Si vous préférez une vraie table : <strong>Les Terrasses de La Borie</strong> à Mandagout, 4,7 / 5 sur 215 avis Google, menus surprise de 52 à 89 €, chiens acceptés en terrasse, 04 65 09 03 32. Mais c'est 30 min de route et il faut réserver.</em>"}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&query=Le+Jardin+Hors+du+Temps+Valleraugue", "txt": "Fiche et avis"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&query=Les+Terrasses+de+La+Borie+Mandagout", "txt": "Fiche et avis"}]}]}, {"type": "trajet", "heure": "21h15", "html": "Valleraugue → Le Vigan · D986, de nuit mais large · 23 km · <strong>30 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 1h55 de conduite</strong>", "fin": "Fin du repas", "vers": "le gîte du Vigan · 357 route de Ganges", "nav": "https://www.google.com/maps/dir/?api=1&destination=357+Route+de+Ganges%2C+30120+Le+Vigan", "alt": null, "km": "23", "duree": "30min", "route": "D986", "de_pt": "p9", "vers_pt": null, "de_lib": "Valleraugue", "vers_lib": "Le Vigan", "de_alt": 350, "vers_alt": 245}], "notes": [{"cls": "note prep", "html": "<b>Ce soir, on prépare demain.</b> Trois heures de marche facile le long d'une rivière, puis pique-nique au bord d'un lac à 1050 m. Préparez de quoi déjeuner dehors et, surtout, <strong>passez au distributeur</strong> : l'abîme de Bramabiau n'accepte <strong>ni carte bancaire ni sans contact</strong>, uniquement espèces, chèques et chèques-vacances. Comptez 28 € pour deux. Sortez aussi les <strong>polaires</strong> : il fait 10 °C constants sous terre."}], "alt_max": 1045, "alt_min": 350, "rando": ["9,9 km", "+401 m"], "volant": "1h55", "chaud": {"texte": "La rando part de 1045 m et reste sous les hêtres. Si la vallée dépasse 35 °C, renoncez au Mouretou l'après-midi et remontez au <strong>lac du Bonheur</strong> à Camprieu, 1090 m, eau froide.", "lieu": "Lac du Bonheur, Camprieu", "alt": 1090}, "geo": {"lat": 44.053985, "lon": 3.579673, "lab": "Arphy", "alt": 1045}, "base": {"lat": 43.9902, "lon": 3.6183, "lab": "Le Vigan"}, "bonus": [{"k": "rando", "titre": "Cascades d'Orgon, variante La Draille", "meta": "8,9 km · +344 m · 3h30 · boucle", "txt": "La version longue de la rando du jour : très forestière, de nombreux ruisseaux et un gué. Même départ, D329 à Valleraugue. À prendre si vous vous sentez en forme et que la matinée est fraîche.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=44.059139%2C3.604682"}, {"cls": "l-vis", "txt": "Visorando", "href": "https://www.visorando.com/randonnee-les-cascades-d-orgon-2/"}]}, {"k": "village", "titre": "Mandagout et les Terrasses de La Borie", "meta": "30 min de Valleraugue · 600 m", "txt": "Un hameau perché avec une table remarquable, 4,7 sur 215 avis Google. Si Le Jardin Hors du Temps ne vous inspire pas ce soir-là, c'est le plan B, et la route pour y monter fait partie du plaisir.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Les+Terrasses+de+La+Borie%2C+Mandagout"}]}]}, {"id": "j4", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Ab%C3%AEme_de_Bramabiau_panorama.JPG?width=1200", "alt": "Abîme de Bramabiau", "cap": "L'abîme de Bramabiau · <a href=\"https://commons.wikimedia.org/wiki/File:Ab%C3%AEme_de_Bramabiau_panorama.JPG\">Wikimedia Commons</a>"}, "dt": "Mercredi 12 août", "titre": "La rivière qui disparaît sous le plateau", "pitch": "Le matin, vous remontez une petite rivière qui s'appelle le Bonheur, à 1100 mètres, sous les arbres, jusqu'aux ruines d'une abbaye. À midi vous vous baignez dans un lac où l'eau est franchement froide. L'après-midi, vous descendez soixante-dix mètres sous terre pour voir cette même rivière ressortir en grondant, là où Édouard-Alfred Martel a inventé la spéléologie française en 1889. Vous serez rentrés à 17h30, avec le marché nocturne du Vigan pour dîner sans cuisiner.", "tags": [{"cls": "t-rando", "txt": "Rando 7,5 km · facile"}, {"cls": "t-eau", "txt": "Lac 1050 m"}, {"cls": "t-visite", "txt": "Bramabiau 14 €"}, {"cls": "t-marche", "txt": "Nocturne du Vigan"}, {"cls": "t-tot", "txt": "2h de volant · max 55 min d'affilée"}], "etapes": [{"type": "trajet", "heure": "9h30", "html": "Le Vigan → Saint-Sauveur-Camprieu · D999 puis D986 et D269 · 40 km · <strong>50 min</strong>", "fin": "Départ", "vers": "Sentier de la vallée du Bonheur", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115051,3.491544", "alt": 1090, "km": "40", "duree": "50min", "route": "D999 puis D986 et D269", "de_pt": "b_j4_9", "vers_pt": "p10", "de_lib": "Le Vigan", "vers_lib": "Saint-Sauveur-Camprieu", "de_alt": 245, "vers_alt": 1090}, {"type": "rando", "heure": "10h30", "icone": "i-hike", "titre": "Rando : Sentier de la vallée du Bonheur", "pt": "p10", "blocs": [{"t": "meta", "html": "7,5 km · +80 m · 3h · facile · balisage jaune · départ du parking du lac"}, {"t": "p", "html": "Le village est à plus de 1100 m, soit 6 à 7 °C de moins qu'au Vigan. On remonte la rivière du Bonheur — celle-là même qui s'engouffre sous le plateau et ressort en grondant à Bramabiau — en passant par les ruines de l'<strong>abbaye du Bonheur</strong> et la forêt reboisée du XIX<sup>e</sup>. Eau quasi permanente pour le chien."}, {"t": "access", "warn": true, "html": "<b>Deux points à connaître</b> — <strong>Il existe deux tracés officiels du même nom</strong> : celui de Gard Tourisme (7,5 km, +80 m, départ <em>parking au bord du lac</em>, GPS 44.115318, 3.490881) et celui du Parc national (9,3 km, +197 m, départ <em>parking du terrain de football</em>). Prenez le premier, et téléchargez son GPX avant de partir.<br><strong>Des patous sont présents de juin à octobre</strong> sur cet itinéraire, c'est écrit sur la fiche officielle : c'est le seul du séjour où le Parc le signale explicitement. Chien en laisse courte derrière vous, contournez large, ne courez pas, ne criez pas."}, {"t": "liens", "liens": [{"cls": "l-trk", "href": "https://static.apidae-tourisme.com/filestore/objets-touristiques/plans/17/192/19382289/la-vallee-du-bonheur.gpx", "txt": "Télécharger le GPX"}, {"cls": "l-web", "href": "https://www.tourismegard.com/fr/fiche/equipement/sentier-de-la-vallee-du-bonheur-saint-sauveur-camprieu_TFO6081885/", "txt": "Fiche officielle"}]}]}, {"type": "eau", "heure": "13h30", "icone": "i-swim", "titre": "Pique-nique et baignade au Lac du Bonheur", "pt": "p11", "blocs": [{"t": "meta", "html": "Non surveillé mais autorisé · gratuit · animaux acceptés · eau à 15-20 °C"}, {"t": "p", "html": "Vous êtes déjà sur place : le parking de la rando est celui du lac. Deux pontons de pêche PMR, des truites, et une eau franchement fraîche après trois heures de marche."}, {"t": "access", "warn": false, "html": "<b>Accès, stationnement, équipements</b> — D986 depuis Meyrueis ou Valleraugue jusqu'à Camprieu, le lac est à environ 2 km du centre. <strong>Parking gratuit au bord de l'eau</strong>, plage sur la rive sud, marche quasi nulle. <strong>Toilettes publiques confirmées</strong>, aires de pique-nique, deux pontons PMR. <strong>Camping sauvage et barbecues interdits.</strong><br>Le lieu porte trois noms selon les sources : <em>Lac du Bonheur</em>, <em>Lac de Camprieu</em> et <em>Lac du Devois</em> (nom officiel ARS). C'est le même plan d'eau."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Lac+du+Bonheur+Saint-Sauveur-Camprieu", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.115318%2C3.490881", "txt": "Itinéraire · 44.115318, 3.490881"}]}]}, {"type": "trajet", "heure": "", "html": "Lac de Camprieu → Abîme de Bramabiau · 5 km · <strong>8 min</strong>", "fin": "On se sèche", "vers": "Abîme de Bramabiau", "nav": "https://www.google.com/maps/dir/?api=1&amp;destination=44.120323%2C3.474413", "alt": 1029, "km": "5", "duree": "8min", "route": "", "de_pt": "p11", "vers_pt": "p12", "de_lib": "Lac de Camprieu", "vers_lib": "Abîme de Bramabiau", "de_alt": 1090, "vers_alt": 1029}, {"type": "visit", "heure": "15h00", "icone": "i-ticket", "titre": "Abîme de Bramabiau", "pt": "p12", "blocs": [{"t": "meta", "html": "10h-18h en août · adulte 14 € · visite guidée 1h · <strong>chien accepté en laisse</strong> · <a class=\"tel\" href=\"tel:+33466850328\">04 66 85 03 28</a>"}, {"t": "p", "html": "Le berceau de la spéléologie française. Vous descendez trente minutes dans une faille de 70 m, le long d'une rivière souterraine, avec des empreintes de dinosaures dans le tunnel de sortie. C'est le seul site souterrain du séjour où le chien entre avec vous."}, {"t": "access", "warn": true, "html": "<b>Deux choses impératives</b> — <strong>Espèces, chèques ou chèques-vacances uniquement</strong>, pas de carte bancaire. Et <strong>10 °C constants</strong> : polaire obligatoire, y compris pour vous. Parking gratuit, restaurant, bar, WC et aire de pique-nique sur place."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Ab%C3%AEme+de+Bramabiau", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.120323%2C3.474413", "txt": "Itinéraire · 44.120323, 3.474413"}, {"cls": "l-web", "href": "https://sites-touristiques-gard.fr/fiche-site/labime-de-bramabiau/", "txt": "Infos et tarifs"}]}]}, {"type": "trajet", "heure": "16h45", "html": "Bramabiau → Le Vigan · par le col de la Serreyrède · 43 km · <strong>55 min</strong>", "fin": "Fin de la visite", "vers": "au marché nocturne du Vigan", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Place+du+Quai+Le+Vigan+30120", "alt": null, "km": "43", "duree": "55min", "route": "par le col de la Serreyrède", "de_pt": "p12", "vers_pt": null, "de_lib": "Bramabiau", "vers_lib": "Le Vigan", "de_alt": 1029, "vers_alt": 245}, {"type": "marche", "heure": "19h45", "icone": "i-basket", "titre": "Dîner au marché nocturne du Vigan", "blocs": [{"t": "meta", "html": "Place du Quai · 18h-23h · artisans et créateurs locaux, animations · le seul de votre semaine"}, {"t": "p", "html": "Vous dînez sur place, sans cuisiner et sans réserver. C'est la soirée la plus simple des quatorze."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Place+du+Quai+Le+Vigan+30120", "txt": "Place du Quai"}]}]}, {"type": "trajet", "heure": "21h45", "html": "Centre du Vigan → le gîte · 2 km · <strong>5 min</strong>, ou 20 min à pied si la soirée est douce &nbsp;·&nbsp; <strong>Total du jour : 2h de conduite</strong>", "fin": "Fin du marché", "vers": "le gîte du Vigan · 357 route de Ganges", "nav": "https://www.google.com/maps/dir/?api=1&destination=357+Route+de+Ganges%2C+30120+Le+Vigan", "alt": null, "km": "2", "duree": "5min", "route": "ou 20 min à pied si la soirée est douce", "de_pt": null, "vers_pt": null, "de_lib": "centre du Vigan", "vers_lib": "Le Vigan, route de Ganges", "de_alt": 231, "vers_alt": 245}], "strip": [{"page": "https://commons.wikimedia.org/wiki/File:Panorama_du_Mont_Aigoual.JPG", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Panorama_du_Mont_Aigoual.JPG?width=800", "alt": "Massif de l'Aigoual", "cap": "Le massif de l'Aigoual, au-dessus de Camprieu"}, {"page": "https://commons.wikimedia.org/wiki/File:Entr%C3%A9e_de_l%27Ab%C3%AEme_de_Bramabiau.jpg", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Entr%C3%A9e_de_l%27Ab%C3%AEme_de_Bramabiau.jpg?width=800", "alt": "Sortie de la rivière souterraine", "cap": "Là où le Bonheur ressort du plateau"}], "notes": [{"cls": "note prep", "html": "<b>Ce soir, on prépare le lever tôt.</b> Demain, <strong>départ à 7h</strong> : c'est l'un des deux seuls du séjour, et il est non négociable. Le causse de Blandas est calcaire, sans un arbre, et il chauffe dès 10h. Préparez ce soir : petit-déjeuner à emporter (thermos de café, fruits, viennoiseries achetées au nocturne du Vigan), <strong>3 L d'eau plus 2 L pour le chien</strong>, et de la <strong>monnaie</strong> — le parking du fond du cirque coûte 4 €. Réglez le réveil sur 6h15."}, {"cls": "note plan", "html": "<b>C'est la journée refuge.</b> Si un jour est classé rouge dans le Gard, permutez et faites celle-ci : Bramabiau est souterrain, le lac et les villages sont hors massif, et à 1100 m l'Aigoual ferme bien moins souvent que les garrigues basses."}], "alt_max": 1090, "alt_min": 1029, "rando": ["7,5 km", "+80 m"], "volant": "2h", "chaud": {"texte": "Journée déjà en altitude, et Bramabiau est à 10 °C constants sous terre. C'est la meilleure journée possible par canicule.", "lieu": "Camprieu et Bramabiau", "alt": 1090}, "geo": {"lat": 44.115051, "lon": 3.491544, "lab": "Camprieu", "alt": 1090}, "base": {"lat": 43.9902, "lon": 3.6183, "lab": "Le Vigan"}, "bonus": [{"k": "village", "titre": "Meyrueis", "meta": "706 m · 25 min de Camprieu", "txt": "Au confluent de trois rivières, au pied des gorges de la Jonte : arcades, vieux pont, tour de l'Horloge, et une vraie vie de village même en août. Le plus joli détour possible depuis Camprieu, et il ne coûte que 25 minutes.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Meyrueis%2C+48150"}]}, {"k": "rando", "titre": "De Meyrueis à la cascade de Salvinsac", "meta": "7,2 km · +299 m · 2h55 · ombragé", "txt": "Sentier ombragé du début à la fin, et une baignade à la cascade au bout. La meilleure combinaison marche-et-eau du secteur nord, et une des rares randos du coin balisées sur Decathlon Outdoor.", "liens": [{"cls": "l-do", "txt": "Decathlon Outdoor", "href": "https://www.decathlon-outdoor.com/fr-fr/explore/france/de-meyrueis-a-la-cascade-de-salvinsac-64b84642f1307"}]}, {"k": "rando", "titre": "Le château de Roquedols", "meta": "6,9 km · +158 m · 2h25 · départ parking de la piscine, Meyrueis", "txt": "« Immersion complète en forêt », un château Renaissance au milieu, et presque pas de dénivelé. La rando de repli quand les jambes disent non.", "liens": [{"cls": "l-vis", "txt": "Visorando", "href": "https://www.visorando.com/randonnee-boucle-du-chateau-de-roquedols-et-du-col/"}]}]}, {"id": "j5", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Vue_a%C3%A9rienne_du_Cirque_de_Navacelles.jpg?width=1200", "alt": "Cirque de Navacelles", "cap": "Le cirque de Navacelles, méandre abandonné de la Vis · <a href=\"https://commons.wikimedia.org/wiki/File:Vue_a%C3%A9rienne_du_Cirque_de_Navacelles.jpg\">Wikimedia Commons</a>"}, "dt": "Jeudi 13 août · <strong style=\"color:var(--red)\">départ 7h00</strong>", "titre": "Le cirque de Navacelles au lever du jour, et la résurgence de la Vis", "pitch": "Le premier des deux réveils difficiles, et le mieux payé. À 7h40 vous êtes seuls sur le rebord du causse, la lumière rasante plonge dans un méandre abandonné par une rivière il y a des milliers d'années, et les 250 000 visiteurs annuels dorment encore. À 8h30 vous descendez trois cents mètres en lacets pour atterrir au fond, dans un hameau de quarante habitants coincé dans un amphithéâtre calcaire. Puis vous marchez trois heures et demie au bord de la Vis jusqu'à l'endroit où elle rejaillit du rocher, et vous vous baignez sous la cascade avant la crêperie.", "tags": [{"cls": "t-rando", "txt": "Rando 9,3 km · +242 m"}, {"cls": "t-visite", "txt": "Grand Site de France"}, {"cls": "t-eau", "txt": "Baignade"}, {"cls": "t-village", "txt": "Navacelles · Aulas"}, {"cls": "t-tot", "txt": "2h de volant"}], "etapes": [{"type": "trajet", "heure": "7h00", "html": "Le Vigan → Belvédères de Blandas · D999 puis D713 · 28 km · <strong>40 min</strong>", "fin": "Départ", "vers": "Belvédères du causse de Blandas", "nav": "https://www.google.com/maps/dir/?api=1&amp;destination=43.895355%2C3.511247", "alt": 615, "km": "28", "duree": "40min", "route": "D999 puis D713", "de_pt": "b_j5_7", "vers_pt": "p13", "de_lib": "Le Vigan", "vers_lib": "Belvédères de Blandas", "de_alt": 245, "vers_alt": 615}, {"type": "visit", "heure": "7h40", "icone": "i-ticket", "titre": "Belvédères du causse de Blandas", "pt": "p13", "blocs": [{"t": "meta", "html": "Gratuit · chiens explicitement acceptés · 45 min sur place"}, {"t": "p", "html": "Trois belvédères aménagés — du Chêne, de l'Aven, de la Cascade — reliés par un cheminement facile à 615 m, avec une vue plongeante dans le méandre. C'est le seul endroit du séjour où l'on comprend d'un coup d'œil ce qu'est un causse : un plateau sec, à moutons, brutalement entaillé. Sur le plateau, cherchez aussi les menhirs et les cromlechs."}, {"t": "access", "warn": false, "html": "<b>Accès et stationnement</b> — <strong>Parking gratuit</strong> sur terrain plat, accessible voitures, bus et camping-cars. Cheminements dégagés, très bien avec un chien. La <strong>Maison de Site</strong> (expositions sur l'agropastoralisme, boutique, restaurant, office de tourisme, accessible PMR) n'ouvre qu'à <strong>10h</strong> : vous la ferez au retour. <strong>Drones interdits</strong> (Natura 2000)."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Belv%C3%A9d%C3%A8res+de+Blandas+cirque+de+Navacelles", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=43.895355%2C3.511247", "txt": "Itinéraire · 43.895355, 3.511247"}]}]}, {"type": "trajet", "heure": "", "html": "Blandas → hameau de Navacelles · 7 km de <strong>lacets serrés</strong> · <strong>15 min</strong>", "fin": "Fin de la visite", "vers": "les Moulins de la Foux", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Navacelles+34520+Saint-Maurice-Navacelles", "alt": 325, "km": "7", "duree": "15min", "route": "", "de_pt": "p13", "vers_pt": "p14", "de_lib": "Blandas", "vers_lib": "hameau de Navacelles", "de_alt": 615, "vers_alt": 325}, {"type": "rando", "heure": "8h45", "icone": "i-hike", "titre": "Rando : les Moulins de la Foux, le long de la Vis", "pt": "p14", "blocs": [{"t": "meta", "html": "9,3 km · +242 m · 3h30 · départ du parking du hameau · agréée FFRandonnée"}, {"t": "p", "html": "On longe la Vis en fond de gorge : ruines des Poujols, forêt de cèdres, chemin des Vignes. Le clou du parcours est la <strong>résurgence de la Foux</strong>, où la rivière rejaillit du calcaire après avoir disparu sous le causse. Départ à 8h45 : vous faites la montée avant que le soleil ne passe le rebord."}, {"t": "access", "warn": true, "html": "<b>Aucun point d'eau sur l'itinéraire.</b> Le circuit fait demi-tour aux Moulins de la Foux ; l'eau, les WC et l'aire de pique-nique de Vissec sont 1,3 km plus haut dans la gorge, <strong>hors parcours</strong>. Emportez tout, y compris les 2 L du chien."}, {"t": "access", "warn": false, "html": "<b>Stationnement du hameau</b> — <strong>Parking payant, 4 € la journée</strong>, capacité réduite, payant d'avril à octobre. <strong>À 8h30 il sera vide ; à 11h il sera plein.</strong> La solution officielle en journée est la <strong>navette gratuite depuis le parking des belvédères de Blandas</strong>, mais ses horaires 2026 ne sont pas publiés : si vous arrivez tard, appelez la Maison du Grand Site avant de descendre. La route de descente est <strong>déconseillée aux caravanes, camping-cars et bus</strong>."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Navacelles+34520+Saint-Maurice-Navacelles", "txt": "Fiche et avis"}, {"cls": "l-trk", "href": "https://www.visorando.com/randonnee-les-moulins-de-la-foux/", "txt": "Trace Visorando"}, {"cls": "l-trk", "href": "https://www.decathlon-outdoor.com/fr-fr/explore/france/randonnee-aux-moulins-de-la-foux-64735c36d41cc", "txt": "Decathlon Outdoor"}]}]}, {"type": "eau", "heure": "12h15", "icone": "i-swim", "titre": "Trempette à la cascade de Navacelles", "pt": "p15", "blocs": [{"t": "meta", "html": "Site de baignade recensé « Vis — Navacelles la cascade » · non surveillé · à deux pas du parking"}, {"t": "p", "html": "La Vis tombe en gradins juste en bordure du hameau. Ce n'est pas une plage, c'est une vasque : on s'y rafraîchit vingt minutes après trois heures et demie de marche, et le chien adore."}]}, {"type": "eat", "heure": "13h00", "icone": "i-eat", "titre": "Déjeuner — Crêperie du Mas Guilhou, hameau de Navacelles", "pt": "p16", "blocs": [{"t": "meta", "html": "69 rue du Mas Guilhou, 34520 Saint-Maurice-Navacelles · tous les jours 12h-17h · <a class=\"tel\" href=\"tel:+33467815069\">04 67 81 50 69</a>"}, {"t": "note", "html": "TripAdvisor 4,4 / 5 · 198 avis · n° 1 du secteur &nbsp;|&nbsp; note Google non trouvée"}, {"t": "p", "html": "Galettes, crêpes, cidres fermiers, terrasse, prix très raisonnables. C'est la meilleure adresse du fond du cirque. <strong>Alternative</strong> à cinquante mètres : l'<strong>Auberge de la Cascade</strong> (Google 4,0 / 5 sur 192 avis, <a class=\"tel\" href=\"tel:+33467815095\">04 67 81 50 95</a>, 10h-19h) pour un aligot-saucisse ou une salade cévenole."}, {"t": "p", "html": "<em>Et si vous préférez remonter manger sur le causse après la baignade : <strong>L'Auberge de Blandas</strong>, 4,7 / 5 sur 410 avis Google, tenue par Osman et Sophie, cuisine cévenole, pélardon, oignon doux et côte de bœuf locale, terrasse ombragée, <strong>chiens acceptés</strong>, menus 20 à 28 €. Ouverte le jeudi midi, 04 67 81 51 55. C'est la meilleure note du secteur.</em>"}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Cr%C3%AAperie+du+Mas+Guilhou+Navacelles", "txt": "Mas Guilhou"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Auberge+de+la+Cascade+Navacelles", "txt": "Auberge de la Cascade"}]}]}, {"type": "trajet", "heure": "", "html": "Navacelles → Blandas, Maison de Site · 7 km de lacets · <strong>15 min</strong>", "fin": "Fin du repas", "vers": "Maison de Site des Belvédères", "nav": "https://www.google.com/maps/dir/?api=1&destination=43.895355,3.511247", "alt": 615, "km": "7", "duree": "15min", "route": "", "de_pt": "p16", "vers_pt": "p17", "de_lib": "Navacelles", "vers_lib": "Blandas, Maison de Site", "de_alt": 325, "vers_alt": 615}, {"type": "visit", "heure": "14h45", "icone": "i-ticket", "titre": "Maison de Site des Belvédères, Blandas", "pt": "p17", "blocs": [{"t": "meta", "html": "Tous les jours 10h-18h en juillet-août · expositions, boutique de produits locaux, restaurant, bureau d'information"}, {"t": "p", "html": "Le Haut-lieu de l'agropastoralisme : un film, des expositions, et l'explication de ce que vous venez de traverser. Une heure, climatisée, au bon moment de la journée."}]}, {"type": "trajet", "heure": "", "html": "Blandas → Le Vigan · 28 km · <strong>40 min</strong>", "fin": "Fin de la visite", "vers": "Sieste", "nav": "https://www.google.com/maps/search/?api=1&query=Sieste%20C%C3%A9vennes", "alt": null, "km": "28", "duree": "40min", "route": "", "de_pt": "p17", "vers_pt": null, "de_lib": "Blandas", "vers_lib": "Le Vigan", "de_alt": 615, "vers_alt": 245}, {"type": "home", "heure": "16h30", "icone": "i-home", "titre": "Sieste", "blocs": [{"t": "meta", "html": "Vous êtes debout depuis 6h15 et vous avez marché 9 km. Deux heures de rien."}]}, {"type": "trajet", "heure": "18h30", "html": "Le Vigan → Aulas · la D170 le long de la Coudoulous · 4 km · <strong>6 min</strong>", "fin": "On y va", "vers": "Aulas, le plus fleuri des villages du coin", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Aulas+30120", "alt": 300, "km": "4", "duree": "6min", "route": "la D170 le long de la Coudoulous", "de_pt": "b_j5_9", "vers_pt": "p18", "de_lib": "Le Vigan", "vers_lib": "Aulas", "de_alt": 245, "vers_alt": 320}, {"type": "village", "heure": "18h45", "icone": "i-village", "titre": "Flânerie à Aulas", "pt": "p18", "blocs": [{"t": "meta", "html": "45 min · 5 min du Vigan"}, {"t": "p", "html": "Ancienne <strong>cité drapière</strong> blottie au débouché du Coudoulous, « les pierres qui roulent ». On passe sous <strong>La Poterne</strong>, une porte fortifiée, puis on serpente dans les venelles et les passages voûtés jusqu'aux anciens moulins et aux lavoirs communaux, avec le château des barons d'Hierle qui domine. Très fleuri en été."}, {"t": "p", "html": "<em>Aucun commerce référencé à Aulas : c'est un village de promenade pure, ne comptez pas y trouver un café ouvert.</em>"}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Aulas+30120", "txt": "Fiche et avis"}]}]}, {"type": "trajet", "heure": "19h50", "html": "Aulas → Le Vigan · 4 km · <strong>6 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 2h de conduite</strong>", "fin": "Fin de la flânerie", "vers": "le gîte du Vigan · 357 route de Ganges", "nav": "https://www.google.com/maps/dir/?api=1&destination=357+Route+de+Ganges%2C+30120+Le+Vigan", "alt": 300, "km": "4", "duree": "6min", "route": "la D170 le long de la Coudoulous", "de_pt": "p18", "vers_pt": null, "de_lib": "Aulas", "vers_lib": "Le Vigan", "de_alt": 320, "vers_alt": 245}, {"type": "eat", "heure": "20h00", "icone": "i-eat", "titre": "Dîner à la maison, après un apéro chez Feloni", "blocs": [{"t": "meta", "html": "Brasserie Feloni, 2 rue de la Boucherie, Le Vigan · tous les jours 16h-22h · <a class=\"tel\" href=\"tel:+33634573054\">06 34 57 30 54</a>"}, {"t": "p", "html": "Brewpub où l'on brasse sur place, bar à six becs au milieu des cuves, médaille d'argent au Concours International de Lyon 2024 pour leur American IPA. <strong>Ce n'est pas un restaurant</strong> : on y boit et on repart avec des bouteilles."}, {"t": "shop", "html": "<b>Au menu ce soir</b> — Truite des Cévennes à la poêle, beurre et amandes, avec des pommes de terre sautées. Ou, plus simple après une journée à 7h : grande salade tiède aux oignons doux confits, lardons, pélardon et noix.<br><b>Il vous faut</b> : deux truites (poissonnerie ou rayon frais du Vigan), amandes effilées, pommes de terre. Le reste, vous l'avez."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Brasserie+Feloni+Le+Vigan", "txt": "Feloni · fiche et avis"}]}]}], "strip": [{"page": "https://commons.wikimedia.org/wiki/File:Causse_de_Blandas-Panorama-20110813.jpg", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Causse_de_Blandas-Panorama-20110813.jpg?width=800", "alt": "Causse de Blandas", "cap": "Le causse de Blandas"}, {"page": "https://commons.wikimedia.org/wiki/File:245_Gorges_de_la_Vis_vus_du_plateau_de_la_rive_sud_pr%C3%A8s_de_Saint-Maurice-Navacelles.JPG", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/245_Gorges_de_la_Vis_vus_du_plateau_de_la_rive_sud_pr%C3%A8s_de_Saint-Maurice-Navacelles.JPG?width=800", "alt": "Gorges de la Vis", "cap": "Les gorges de la Vis depuis le causse"}], "notes": [{"cls": "note plan", "html": "<b>Départ à 7h00, la seule vraie grasse matinée sacrifiée du séjour</b> — et c'est pour la meilleure raison : les belvédères de Blandas au lever du jour, avec le cirque de Navacelles encore dans l'ombre et personne sur le parking. Vous ferez la sieste en rentrant, elle est au programme à 16h30."}, {"cls": "note warn", "html": "<b>Si le thermomètre annonce plus de 34 °C :</b> gardez les belvédères au lever du jour, mais remplacez la rando par un simple aller-retour d'une heure au fond du cirque, et remontez déjeuner à l'<strong>Auberge de Blandas</strong> (TripAdvisor 4,6 / 5 sur 313 avis, menu dès 20 €, <strong>chiens acceptés</strong>, <a class=\"tel\" href=\"tel:+33467815155\">04 67 81 51 55</a>, fermée lundi et mardi). Sur un causse sans ombre, avec un chien, la fiche officielle dit noir sur blanc « éviter les périodes de forte chaleur » — ce n'est pas une formule de style."}], "alt_max": 615, "alt_min": 300, "rando": ["9,3 km", "+242 m"], "volant": "2h", "chaud": {"texte": "<strong>Journée à risque : le causse est calcaire, sans un arbre.</strong> Au-delà de 34 °C, gardez les belvédères au lever du jour puis <strong>remontez à l'Aigoual ou à Camprieu</strong> pour l'après-midi. Ne restez pas sur le plateau entre 12h et 17h.", "lieu": "Mont Aigoual ou lac du Bonheur", "alt": 1565}, "geo": {"lat": 43.895355, "lon": 3.511247, "lab": "Causse de Blandas", "alt": 615}, "base": {"lat": 43.9902, "lon": 3.6183, "lab": "Le Vigan"}, "bonus": [{"k": "rando", "titre": "La montagne de la Fage, Cézas", "meta": "10 km · +425 m · 4h · 20 min du Vigan", "txt": "Panorama jusqu'à l'étang de Thau par temps clair. Montée initiale raide, et surtout <strong>un parking de six places</strong> : c'est une rando qui se mérite à l'heure du départ, pas à l'effort.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=43.975111%2C3.778964"}, {"cls": "l-vis", "txt": "Visorando", "href": "https://www.visorando.com/randonnee-la-montagne-de-la-fage/"}]}, {"k": "village", "titre": "Le belvédère de la Baume Auriol", "meta": "côté Hérault · 15 min de Blandas", "txt": "L'autre rive du cirque, et beaucoup diront la plus belle vue : le méandre abandonné se lit d'un seul regard, avec le hameau au fond. Table d'orientation, buvette, parking payant. À faire au coucher du soleil plutôt qu'à midi.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Baume+Auriol%2C+34520+Saint-Maurice-Navacelles"}]}]}, {"id": "j6", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Pont_de_Saint-%C3%89tienne_d%27Issensac.JPG?width=1200", "alt": "Pont de Saint-Étienne d'Issensac", "cap": "Le pont roman de Saint-Étienne d'Issensac sur l'Hérault · <a href=\"https://commons.wikimedia.org/wiki/File:Pont_de_Saint-%C3%89tienne_d%27Issensac.JPG\">Wikimedia Commons</a>"}, "dt": "Vendredi 14 août", "titre": "Le marché de Ganges, un pont roman sur l'Hérault, et l'eau turquoise au crépuscule", "pitch": "Journée sans montre. Le matin, le grand marché du sud des Cévennes, celui où l'on achète pour la semaine suivante. L'après-midi, trois heures à ne rien faire au bord de l'Hérault, sous un pont de pierre du XI<sup>e</sup> siècle, avec une chapelle romane derrière les arbres. Et le soir, le coup de génie de la semaine : la cascade de la Vis à 18h30, quand les sept cents baigneurs du jour sont repartis et que la lumière dorée tombe sur une eau turquoise que vous croirez retouchée.", "tags": [{"cls": "t-marche", "txt": "Marché de Ganges"}, {"cls": "t-eau", "txt": "Deux baignades"}, {"cls": "t-village", "txt": "Sumène"}, {"cls": "t-tot", "txt": "2h de volant"}], "etapes": [{"type": "trajet", "heure": "9h30", "html": "Le Vigan → Ganges · D999 · 20 km · <strong>25 min</strong>", "fin": "Départ", "vers": "Marché de Ganges", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Les+Halles+de+Ganges+34190", "alt": 175, "km": "20", "duree": "25min", "route": "D999", "de_pt": "b_j6_9", "vers_pt": "p19", "de_lib": "Le Vigan", "vers_lib": "Ganges", "de_alt": 245, "vers_alt": 175}, {"type": "marche", "heure": "10h00", "icone": "i-basket", "titre": "Marché de Ganges", "pt": "p19", "blocs": [{"t": "meta", "html": "Vendredi matin jusqu'à 13h · avenue Pasteur, église, rue du Temple, rue du Jeu de Ballon, Plan de l'Ormeau"}, {"t": "p", "html": "Le grand marché du vendredi, plus large que celui du mardi : alimentaire, vêtements, quincaillerie. Ganges n'est pas un village mais une petite ville, avec des rues commerçantes vraiment vivantes et des <strong>halles couvertes</strong> au cœur."}, {"t": "p", "html": "Les adresses : la <strong>Brûler
