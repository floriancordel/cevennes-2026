 "href": "https://www.google.com/maps/search/?api=1&amp;query=Sainte-Croix-Vall%C3%A9e-Fran%C3%A7aise+48110", "txt": "Fiche et avis"}]}]}, {"type": "eau", "heure": "16h30", "icone": "i-swim", "titre": "Baignade — plan d'eau de Sainte-Croix", "pt": "p38", "blocs": [{"t": "meta", "html": "Sur le Gardon · site recensé par l'ARS · non surveillé · 1h30 sur place"}, {"t": "access", "warn": false, "html": "<b>Accès</b> — L'accès au Gardon est <strong>aménagé sous la petite passerelle métallique</strong> qui traverse le village, à deux pas du centre. Eau claire, très peu de monde. <strong>Le stationnement n'est documenté nulle part</strong> : garez-vous dans le village et descendez à pied.<br><em>Ne vous laissez pas tenter par la « cascade du Martinet » à Saint-Étienne-Vallée-Française, 15 km plus loin : c'est un spot à sauts de plusieurs mètres, non surveillé et sans balisage.</em>"}, {"t": "access", "warn": true, "html": "<b>Cyanobactéries</b> — Préférez systématiquement l'eau courante à l'eau stagnante, et <strong>empêchez le chien de boire dans une vasque tiède, verdâtre ou à écume</strong>, ni de lécher les galets couverts de dépôts : c'est toxique et souvent mortel."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Plan+d%27eau+de+Sainte-Croix-Vall%C3%A9e-Fran%C3%A7aise", "txt": "Fiche et avis"}]}]}, {"type": "trajet", "heure": "18h05", "html": "Sainte-Croix → Saint-Jean-du-Gard · D983 puis D907 par Saint-Étienne-Vallée-Française · 30 km · <strong>45 min</strong>", "fin": "On se sèche", "vers": "Saint-Jean-du-Gard, flânerie du soir puis la crêperie", "nav": "https://www.google.com/maps/dir/?api=1&destination=Auberge+du+P%C3%A9ras%2C+Saint-Jean-du-Gard", "alt": null, "km": "30", "duree": "45min", "route": "D983 puis D907 par Saint-Étienne-Vallée-Française", "de_pt": "p38", "vers_pt": null, "de_lib": "Sainte-Croix-Vallée-Française", "vers_lib": "Saint-Jean-du-Gard", "de_alt": 300, "vers_alt": 197}, {"type": "village", "heure": "18h50", "icone": "i-village", "titre": "Saint-Jean-du-Gard, une heure sans programme", "pt": null, "blocs": [{"t": "meta", "html": "197 m d'altitude · 50 min · le village de votre semaine, hors jour de marché"}, {"t": "p", "html": "Vous avez une heure avant la table. C'est le bon moment pour voir Saint-Jean-du-Gard sans la foule du mardi : la <strong>tour de l'Horloge</strong>, le vieux pont sur le Gardon, et la rue principale à l'ombre. Garez-vous <strong>place du Marché</strong>, tout est à moins de cinq minutes à pied."}, {"t": "shop", "html": "<strong>La Maison du Pélardon</strong>, place du Marché, pour rapporter un ou deux fromages · <strong>Cévennes Terroir</strong>, rue Pelet, châtaigne et miel de la vallée"}]}, {"type": "eat", "heure": "19h45", "icone": "i-eat", "titre": "Dîner — Lettres et Mets, Saint-Jean-du-Gard", "blocs": [{"t": "meta", "html": "1071 avenue René Boudon, Saint-Jean-du-Gard · 197 m · <strong>4,8 sur TripAdvisor, mais 17 avis seulement</strong> · galettes 8 à 17 € · <a class=\"tel\" href=\"tel:+33788742297\">07 88 74 22 97</a> · <strong>ouvert tous les jours en août</strong>"}, {"t": "p", "html": "Galettes et crêpes faites sur place à partir d'<strong>une vingtaine de petits producteurs de Saint-Jean et de la vallée</strong>. Quinze couverts seulement, terrasse ombragée, salle climatisée, options végétariennes et sans gluten. C'est la crêperie de village typique, pas la crêperie de bord de route."}, {"t": "access", "warn": true, "html": "<b>Changement</b> — L'Auberge du Péras était prévue ici : <strong>4,4 sur 229 avis Google</strong>, sous votre seuil. Le lundi soir est le pire soir de la semaine dans ce village, presque tout ferme. Lettres et Mets est ouvert tous les jours en août, mais <strong>quinze couverts</strong> : appelez le matin même. Si c'est complet, Le Péras reste ouvert au <a class=\"tel\" href=\"tel:+33466853594\">04 66 85 35 94</a>."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Fiche et avis", "href": "https://www.google.com/maps/search/?api=1&query=Lettres+et+Mets+Saint-Jean-du-Gard"}]}]}, {"type": "trajet", "heure": "21h30", "html": "Saint-Jean-du-Gard → col de Lamira · la petite route du col, à faire de jour si possible · 6 km · <strong>12 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 2h30 de conduite, plus longue traite 52 min</strong>", "fin": "Fin du repas", "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115%2C3.895", "alt": null, "km": "6", "duree": "12min", "route": "la petite route du col", "de_pt": null, "vers_pt": null, "de_lib": "Saint-Jean-du-Gard", "vers_lib": "col de Lamira", "de_alt": 197, "vers_alt": 400}], "strip": [{"page": "https://commons.wikimedia.org/wiki/File:028_Le_Pompidou_(_48110_).JPG", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/028_Le_Pompidou_(_48110_).JPG?width=800", "alt": "Le Pompidou", "cap": "Le Pompidou, sur la Corniche"}, {"page": "https://commons.wikimedia.org/wiki/File:Le_Gardon_%C3%A0_Sainte_Croix-Vall%C3%A9e_fran%C3%A7aise.JPG", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Le_Gardon_%C3%A0_Sainte_Croix-Vall%C3%A9e_fran%C3%A7aise.JPG?width=800", "alt": "Gardon à Sainte-Croix", "cap": "Le Gardon à Sainte-Croix-Vallée-Française"}], "notes": [{"cls": "note plan", "html": "<b>Plan B si les massifs sont fermés :</b> la Corniche reste praticable, c'est une route. Supprimez la rando, faites-la d'une traite jusqu'à Florac, visitez le château du Parc national, et rentrez par la Vallée Française avec un arrêt baignade à Sainte-Croix."}], "alt_max": 800, "alt_min": 300, "rando": ["8,4 km", "+387 m"], "volant": "2h30", "chaud": {"texte": "Vous êtes sur la Corniche entre 800 et 1000 m toute la journée. C'est la bonne journée à faire quand il fait chaud en bas.", "lieu": "Corniche des Cévennes", "alt": 800}, "geo": {"lat": 44.235, "lon": 3.732, "lab": "Corniche, D28", "alt": 800}, "base": {"lat": 44.115, "lon": 3.895, "lab": "Col de Lamira"}, "bonus": [{"k": "village", "titre": "Barre-des-Cévennes", "meta": "15 min du Pompidou · 930 m", "txt": "Un village-rue posé sur la crête, classé, avec ses maisons alignées face au sud et le sentier d'interprétation « Barre, place forte ». Si la matinée avance vite, c'est le prolongement naturel de l'arrêt du Pompidou, sur la même route.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Barre-des-C%C3%A9vennes%2C+48400"}]}, {"k": "village", "titre": "Saint-Germain-de-Calberte", "meta": "20 min de Sainte-Croix · 500 m", "txt": "L'autre village de la Vallée Française, avec son église romane et le château de Calberte en ruine au-dessus. Moins fréquenté que Sainte-Croix, et la route pour y aller est un enchaînement de terrasses de châtaigniers.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Saint-Germain-de-Calberte%2C+48370"}]}], "flex": {"ok": true, "why": "La seule journée déplaçable de la semaine 2. Ni marché, ni réservation ferme.", "frais": "Corniche des Cévennes entre 800 et 1 000 m toute la journée", "haut": 800, "pas": {}}}, {"id": "j10", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Pont_St_Jean_du_Gard_2007.jpg?width=1200", "alt": "Pont de Saint-Jean-du-Gard", "cap": "Le pont sur le Gardon de Saint-Jean · <a href=\"https://commons.wikimedia.org/wiki/File:Pont_St_Jean_du_Gard_2007.jpg\">Wikimedia Commons</a>"}, "dt": "Mardi 18 août", "titre": "Le grand marché du mardi, puis Alès et la fin de l'histoire camisarde", "pitch": "Le matin, le marché qui déborde de la halle jusqu'à la Grand Rue, et quatre cents mètres d'ateliers où travaillent une céramiste, un forgeron-coutelier, une tapissière et un pâtissier primé. L'après-midi, vous descendez à Alès : les Halles de l'Abbaye à la fin du marché, une terrasse sur la place, et le vieux centre où se lit la suite de ce que le Mas Soubeyran vous a raconté dimanche — la paix d'Alais de 1629, le fort bâti par Louis XIV pour surveiller les protestants, la cathédrale et le temple qui se font face. Puis on remonte, et on finit dans le Gardon.", "tags": [{"cls": "t-marche", "txt": "Le grand marché"}, {"cls": "t-village", "txt": "Artisans · vieil Alès"}, {"cls": "t-visite", "txt": "Fort Vauban · parc du Bosquet"}, {"cls": "t-eau", "txt": "Gardon de Saint-Jean"}, {"cls": "t-tot", "txt": "1h45 de volant · max 40 min d'affilée"}], "etapes": [{"type": "trajet", "heure": "9h30", "html": "Col de Lamira → centre de Saint-Jean-du-Gard · 6 km · <strong>12 min</strong>", "fin": "Départ", "vers": "Marché de Saint-Jean-du-Gard", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Halle+Saint-Jean-du-Gard+30270", "alt": 197, "km": "6", "duree": "12min", "route": "", "de_pt": "b_j10_9", "vers_pt": "p40", "de_lib": "Col de Lamira", "vers_lib": "centre de Saint-Jean-du-Gard", "de_alt": 400, "vers_alt": 197}, {"type": "marche", "heure": "9h45", "icone": "i-basket", "titre": "Marché de Saint-Jean-du-Gard", "pt": "p40", "blocs": [{"t": "meta", "html": "Mardi 8h-13h · sous la halle et dans le centre ; en été il déborde sur la Grand Rue et la rue Pelet de la Lozère"}, {"t": "p", "html": "C'est LE marché de la semaine ici. Beaucoup de guides le placent à tort le vendredi : le vendredi c'est la brocante, le samedi le marché de producteurs, et le dimanche soir les artisans."}, {"t": "access", "warn": true, "html": "<b>Stationnement : la commune verbalise réellement</b> — Arrêté municipal en vigueur : <strong>bandes jaunes 35 € d'amende, zone bleue 17 €</strong>, et le <strong>disque de stationnement est obligatoire</strong> en zone bleue. Des disques sont distribués gratuitement en mairie (<a class=\"tel\" href=\"tel:+33466562636\">04 66 56 26 36</a>) : passez-y le premier jour. Un mardi de marché, le stationnement du centre est modifié — garez-vous en périphérie et finissez à pied."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Halle+Saint-Jean-du-Gard+30270", "txt": "La halle · fiche et avis"}]}]}, {"type": "village", "heure": "11h00", "icone": "i-village", "titre": "La Grand Rue et ses artisans", "pt": "p41", "blocs": [{"t": "meta", "html": "1h · le plus bel alignement d'ateliers du séjour, sur 400 mètres"}, {"t": "p", "html": "<strong>Autour du Feu</strong>, place de la Révolution — Anaïs Leclere, céramiste (grès et porcelaine, émaux maison) et Matthias Pagnucco, forgeron-coutelier, créateur du couteau <em>le Magnan</em> déposé en 2014. Ouvert tous les jours ; ateliers visitables sur rendez-vous à 1 km."}, {"t": "p", "html": "<strong>L'Assise</strong>, 40 Grand Rue — Frédérique Delmas, tapissière-restauratrice de meubles, ateliers d'initiation sur demande. <strong>Piccolo Sole</strong>, 75 Grand Rue — épicerie fine : confitures de châtaigne, épices, brandade, chocolats Malakoff de Lozère. <strong>Au Petit Bonheur</strong>, 8 rue Pellet de la Lozère — pâtisserie primée, avec « La Modestine » (sablé miel-noisette) et un fondant à la châtaigne fait avec la farine de Saint-Étienne-Vallée-Française."}, {"t": "p", "html": "Terminez par le <strong>pont vieux</strong> et la <strong>tour de l'Horloge</strong>, qui calent le paysage du village."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Autour+du+Feu+Saint-Jean-du-Gard", "txt": "Autour du Feu"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Piccolo+Sole+Saint-Jean-du-Gard", "txt": "Piccolo Sole"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Au+Petit+Bonheur+p%C3%A2tisserie+Saint-Jean-du-Gard", "txt": "Au Petit Bonheur"}]}]}, {"type": "trajet", "heure": "12h05", "html": "Saint-Jean-du-Gard → Alès · D907 par Anduze, la route de la vallée · 30 km · <strong>35min</strong>", "fin": "Fin de la flânerie", "vers": "Alès, place de l'Abbaye et ses halles", "nav": "https://www.google.com/maps/dir/?api=1&destination=Place+de+l%27Abbaye%2C+30100+Al%C3%A8s", "alt": 136, "km": "30", "duree": "35min", "route": "D907 par Anduze, la route de la vallée", "de_pt": "p40", "vers_pt": "p10a", "de_lib": "Saint-Jean-du-Gard", "vers_lib": "Alès", "de_alt": 197, "vers_alt": 136}, {"type": "marche", "heure": "12h40", "icone": "i-marche", "pt": "p10a", "titre": "Les Halles de l'Abbaye, et le déjeuner sous les arcades", "blocs": [{"t": "meta", "html": "136 m d'altitude · 2 200 m², 25 étals · marché tous les matins jusqu'à 13h, puis les onze boutiques du pourtour rouvrent côté rue l'après-midi"}, {"t": "p", "html": "Vous arrivez à la toute fin du marché, et c'est le bon moment : les producteurs bradent, la halle se vide, et la place de l'Abbaye passe en mode terrasse. L'ancien hôpital des religieuses a été refait en halle contemporaine sans perdre sa charpente : <strong>fruits et légumes du pays, poissonnier, épicerie fine, traiteur, boulangerie</strong>. Faites un tour rapide avant de vous asseoir, c'est là que vous trouverez la châtaigne et le pélardon à rapporter."}, {"t": "note", "html": "<b>Le déjeuner est juste là</b> — <strong>Le Comptoir des Halles</strong>, 5 rue Jean Castagno, terrasse sur la place. <strong>4,8 / 5 sur 293 avis Google</strong>, tenu par Vincent et sa mère Véronique. Carte qui change tous les jours, produits frais et de saison, plancha et pierrade, options végétariennes. <strong>Service jusqu'à 14h seulement</strong>, donc on ne traîne pas en route. <a class=\"tel\" href=\"tel:+33634085606\">06 34 08 56 06</a>"}, {"t": "access", "html": "<b>Stationnement</b> — <strong>parking souterrain de l'Abbaye, 380 places, gratuit la première heure</strong> puis quelques euros pour l'après-midi. Vous ressortez directement sur la place. C'est de loin le plus simple : le centre d'Alès est en zone payante et la circulation y est filtrée."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Les Halles", "href": "https://www.google.com/maps/search/?api=1&query=Halles+de+l%27Abbaye+Al%C3%A8s"}, {"cls": "l-map", "txt": "Le Comptoir des Halles", "href": "https://www.google.com/maps/search/?api=1&query=Comptoir+des+Halles+Al%C3%A8s"}, {"cls": "l-web", "txt": "Parking de l'Abbaye", "href": "https://www.google.com/maps/search/?api=1&query=Parking+de+l%27Abbaye+Al%C3%A8s"}]}]}, {"type": "village", "heure": "14h15", "icone": "i-village", "pt": "p10b", "titre": "Le vieil Alès, ou la fin de l'histoire que vous avez commencée dimanche", "blocs": [{"t": "meta", "html": "145 m d'altitude · 1h15 à pied · ruelles étroites et ombragées, tout est à moins de dix minutes du parking"}, {"t": "p", "html": "Dimanche, au Mas Soubeyran, vous avez vu la révolte des Camisards racontée par les vaincus. Ici, vous voyez la machine d'en face, et elle est en pierre. <strong>La paix d'Alais est signée dans cette ville en 1629</strong> : les protestants gardent leur culte, mais perdent leurs places fortes et leurs murailles. Cinquante ans plus tard, Louis XIV révoque l'édit de Nantes et fait bâtir le fort. Tout le centre-ville raconte ce basculement."}, {"t": "p", "html": "<strong>Le Fort Vauban</strong>, sur la butte de la Roque — 350 mètres de courtines et quatre bastions, construits en 1688 non pas contre un envahisseur mais <strong>pour surveiller la population protestante de la ville</strong>. Prison jusqu'en 1990, aujourd'hui en cours de restauration : la visite se fait de l'extérieur, en faisant le tour des remparts."}, {"t": "p", "html": "<strong>La cathédrale Saint-Jean-Baptiste</strong>, place Saint-Jean — un site de culte depuis l'époque gallo-romaine, clocher carré médiéval restauré, façade et nef des XVII<sup>e</sup> et XVIII<sup>e</sup>, classée en 1914. Immenses peintures murales du XIX<sup>e</sup> à l'intérieur, et une fraîcheur bienvenue à 15h. À deux cents mètres, le <strong>temple protestant</strong> de 1868, sur une communauté vieille de 450 ans : les deux édifices se regardent, et c'est tout le sujet."}, {"t": "p", "html": "Entre les deux, la <strong>place de l'Hôtel de Ville</strong> et la salle des États du Languedoc, la <strong>rue d'Avéjan</strong> et ses façades du XVIII<sup>e</sup>, puis les <strong>quais du Gardon</strong> si vous voulez prolonger de dix minutes au bord de l'eau."}, {"t": "shop", "html": "<strong>Les Compagnons du Miel</strong> et les épiceries de la rue d'Avéjan pour le miel de châtaignier et les confitures · les onze boutiques du pourtour des Halles rouvrent côté rue à partir de 14h30"}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Fort Vauban", "href": "https://www.google.com/maps/search/?api=1&query=Fort+Vauban+Al%C3%A8s"}, {"cls": "l-map", "txt": "Cathédrale Saint-Jean-Baptiste", "href": "https://www.google.com/maps/search/?api=1&query=Cath%C3%A9drale+Saint-Jean-Baptiste+Al%C3%A8s"}, {"cls": "l-web", "txt": "Office de tourisme d'Alès", "href": "https://www.cevennes-tourisme.fr/"}]}]}, {"type": "visit", "heure": "15h30", "icone": "i-visit", "pt": "p10c", "titre": "Le parc du Bosquet, à l'ombre des arbres centenaires", "blocs": [{"t": "meta", "html": "150 m d'altitude · 45 min · entrée libre, ouvert toute l'année · rue d'Hombres Firmas, au pied du fort"}, {"t": "p", "html": "Le jardin public d'Alès, dessiné au pied du fort : <strong>roseraie, allées d'hortensias, fontaines, bancs sous des arbres centenaires</strong>, la statue de Pasteur — qui a passé quatre ans ici à sauver la sériciculture cévenole de la pébrine, ce qui explique la filature de Saint-Jean-du-Gard. Depuis peu, les <strong>Terrasses du Bosquet</strong> y ajoutent 3 000 m² de jardin ethnobotanique : jardin médiéval, jardins d'acclimatation, plantes du causse."}, {"t": "note", "html": "<b>C'est l'étape chien de la journée</b> — de l'ombre dense, de l'eau aux fontaines, de l'herbe, et personne ne vous regardera de travers. Après une heure de pavés, c'est exactement ce qu'il lui faut avant la voiture."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Parc du Bosquet", "href": "https://www.google.com/maps/search/?api=1&query=Parc+du+Bosquet+Al%C3%A8s"}]}]}, {"type": "trajet", "heure": "16h45", "html": "Alès → Falguière, Saint-Jean-du-Gard · D907 en remontant la vallée · 32 km · <strong>40min</strong>", "fin": "Fin de la visite", "vers": "la Falguière, pour se remettre dans le Gardon", "nav": "https://www.google.com/maps/dir/?api=1&destination=Falgui%C3%A8re%2C+Saint-Jean-du-Gard", "alt": 210, "km": "32", "duree": "40min", "route": "D907 en remontant la vallée", "de_pt": "p10c", "vers_pt": "p44", "de_lib": "Alès", "vers_lib": "Falguière, Saint-Jean-du-Gard", "de_alt": 150, "vers_alt": 210}, {"type": "eau", "heure": "17h30", "icone": "i-swim", "titre": "Baignade — Falguière, Gardon de Saint-Jean", "pt": "p44", "blocs": [{"t": "meta", "html": "Site officiel suivi par la commune, qualité de l'eau « excellente », analyses tous les 15 jours · 1h15 sur place"}, {"t": "access", "warn": true, "html": "<b>Honnêteté sur ce spot</b> — La qualité de l'eau est excellente et le site est officiellement reconnu par la mairie, mais <strong>le stationnement n'est documenté nulle part</strong> et il n'y a aucun équipement. Le hameau de Falguière est à environ 1 km au nord-est du village, par une route communale goudronnée. Attention : un <strong>camping et des gîtes portent le même nom</strong>, leurs places sont privées.<br><strong>Rappel important</strong> : à Saint-Jean-du-Gard, la baignade est <strong>interdite par arrêté municipal sur tous les sites non autorisés</strong> du Gardon. Tenez-vous aux sites reconnus.<br><strong>Repli fiable si ça coince</strong> : les Gorges de Capoue (parking gratuit confirmé, 25 min)."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Falgui%C3%A8re+Saint-Jean-du-Gard+baignade", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.128218%2C3.891582", "txt": "Itinéraire · 44.128218, 3.891582"}]}]}, {"type": "trajet", "heure": "19h00", "html": "Falguière → col de Lamira · la petite route du col · 8 km · <strong>18 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 1h45 de conduite, plus longue traite 40 min</strong>", "fin": "On se sèche", "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115%2C3.895", "alt": null, "km": "8", "duree": "18min", "route": "la petite route du col", "de_pt": "p44", "vers_pt": "p43", "de_lib": "Falguière", "vers_lib": "col de Lamira", "de_alt": 210, "vers_alt": 400}, {"type": "eat", "heure": "19h45", "icone": "i-eat", "titre": "Dîner à la maison", "blocs": [{"t": "shop", "html": "<b>Au menu</b> — Assiette du marché : charcuterie de pays, pélardons à différents affinages, tomates, melon, pain, et les confitures de châtaigne de Piccolo Sole pour le dessert. Après 2h45 de montée, personne n'a envie de cuisiner.<br><b>Vous avez tout acheté ce matin</b> au marché, plus la pâtisserie du Petit Bonheur."}, {"t": "p", "html": "<em>Si vous sautez la rando du soir : le <strong>marché nocturne d'Anduze</strong> se tient au Plan de Brie de 19h à 23h, à 30 min. Commerçants, artistes, artisans, producteurs — l'un des plus animés du secteur.</em>"}]}], "notes": [{"cls": "note prep", "html": "<b>Ce soir, on prépare demain.</b> Quatre heures de marche dans la châtaigneraie de la vallée Borgne, départ 10h15, déjeuner à 14h30. Préparez <strong>un en-cas solide</strong> et remplissez les gourdes. Et si vous voulez la <strong>Poterie Gauthier à Lasalle</strong>, appelez-la dans la journée au <a class=\"tel\" href=\"tel:+33466853155\">04 66 85 31 55</a> pour vérifier qu'elle sera ouverte vers 19h."}], "alt_max": 400, "alt_min": 136, "rando": [], "volant": "1h45", "chaud": {"texte": "<strong>Alès est à 136 m, c'est le point le plus bas du séjour.</strong> Au-delà de 34 °C, inversez la journée : marché de Saint-Jean à 9h, puis <strong>la Mine Témoin d'Alès</strong>, 700 m de galeries de charbon à <strong>13 °C constants</strong>, visite guidée d'1h15. Attention, <strong>les animaux n'y sont pas admis</strong> : l'un de vous reste avec le chien sur l'aire de pique-nique ombragée du site, et vous permutez. Le vieux centre et le parc du Bosquet passent ensuite très bien à 17h, et vous finissez dans le Gardon.", "lieu": "Mine Témoin d'Alès", "alt": 136}, "geo": {"lat": 44.1268, "lon": 4.0806, "lab": "Alès", "alt": 136}, "base": {"lat": 44.115, "lon": 3.895, "lab": "Col de Lamira"}, "strip": [{"page": "https://commons.wikimedia.org/wiki/File:Fort_vauban_ales.JPG", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Fort_vauban_ales.JPG?width=800", "alt": "Fort Vauban à Alès", "cap": "Le fort Vauban, bâti en 1688 pour surveiller la ville"}, {"page": "https://commons.wikimedia.org/wiki/File:Cath%C3%A9drale_d'al%C3%A8s.JPG", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Cath%C3%A9drale_d'al%C3%A8s.JPG?width=800", "alt": "Cathédrale Saint-Jean-Baptiste d'Alès", "cap": "La cathédrale Saint-Jean-Baptiste, place Saint-Jean"}], "_sorties": ["Rando du soir : le Pic d'Arbousse", "Option payante : Maison Rouge, musée des vallées cévenoles", "Sieste au frais"], "bonus": [{"k": "visit", "titre": "La Mine Témoin d'Alès", "meta": "700 m de galeries · <strong>13 °C constants</strong> · 1h15 · 12 € · fermé le lundi", "txt": "<strong>Le meilleur refuge de canicule de tout le séjour.</strong> On descend dans une vraie mine de charbon reconstituée, guidée, sur 700 mètres, avec les conditions de travail des mineurs de 1880 à la fermeture. Parking gratuit, aire de pique-nique ombragée sur place. Réservation conseillée au 04 66 30 45 15.", "warn": "Les animaux ne sont pas admis dans les galeries. Avec un chien, la seule façon de le faire est que l'un de vous reste sur l'aire de pique-nique ombragée pendant que l'autre visite, puis de permuter. Comptez 2h30 au total.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Mine+T%C3%A9moin+d%27Al%C3%A8s%2C+Chemin+de+la+cit%C3%A9+Sainte-Marie%2C+30100+Al%C3%A8s"}, {"cls": "l-web", "txt": "Site officiel", "href": "https://www.mine-temoin.fr/"}]}, {"k": "rando", "titre": "La promenade de l'Ermitage, Alès", "meta": "6,1 km · +270 m · 2h30 · <strong>ombragée et acceptant les chiens</strong>", "txt": "La colline qui domine Alès, un oppidum celte à l'origine, une chapelle au sommet, et le panorama sur toute la vallée du Gardon. 4,5 / 5 sur Decathlon Outdoor. <strong>À faire le matin plutôt que l'après-midi</strong>, et sachez que le dernier kilomètre longe une route passante en pleine saison.", "liens": [{"cls": "l-do", "txt": "Decathlon Outdoor", "href": "https://www.decathlon-outdoor.com/fr-fr/explore/france/promenade-de-l-ermitage-a-ales-67e957c99acb4"}]}, {"k": "rando", "titre": "Le Pic d'Arbousse, depuis Saint-Jean", "meta": "7,6 km · +380 m · 2h45 · départ place Rabaut Saint-Étienne", "txt": "La rando du soir de votre village : montée raide en forêt de châtaigniers, chênes et pins maritimes, bon couvert tout du long, panorama sur Saint-Jean et les vallées. <strong>Aucun point d'eau sur le parcours, prévoyez 2 L pour le chien.</strong> Version douce, même départ : Le Pont Vieux, 5,2 km, +148 m, 1h40.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Place+Rabaut+Saint-%C3%89tienne%2C+Saint-Jean-du-Gard"}]}, {"k": "visit", "titre": "Maison Rouge, musée des vallées cévenoles", "meta": "Saint-Jean-du-Gard · 9 € / 5 € réduit · 1h30 · <strong>fermé le lundi</strong>", "txt": "Une ancienne filature de soie monumentale, 10 000 objets, et le musée qui raconte la châtaigne, la soie et l'élevage. C'est le musée de référence des Cévennes, à cinq minutes de votre base.", "warn": "La formulation officielle « accueille les animaux d'assistance » laisse fortement penser que les chiens de compagnie ne sont pas admis. Appelez avant de vous déplacer.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Maison+Rouge+Saint-Jean-du-Gard"}]}], "flex": {"ok": false, "why": "Le grand marché de Saint-Jean est le mardi matin, et il n'y en a qu'un.", "frais": "Alès à 136 m, refuge possible à la Mine Témoin, 13 °C constants", "haut": 400, "pas": {}}}, {"id": "j11", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Cevennes_Florac_Mimente_depuis_Causse_Mejean.jpg?width=1200", "alt": "Vallées cévenoles", "cap": "Vallées cévenoles et châtaigneraies · <a href=\"https://commons.wikimedia.org/wiki/File:Cevennes_Florac_Mimente_depuis_Causse_Mejean.jpg\">Wikimedia Commons</a>"}, "dt": "Mercredi 19 août", "titre": "Une vallée douce le matin, Lasalle et sa dernière nocturne le soir", "pitch": "Journée volontairement calme. Trois heures de marche seulement deux cents mètres au-dessus du village, dans la haute vallée de la Salindrenque, avec un gué à traverser à mi-parcours — emportez une serviette, c'est le meilleur moment du parcours. Puis Lasalle : deux kilomètres d'une seule rue d'où descendent des dizaines d'escaliers vers la rivière, une potière qui peint ses décors à main levée sans dessin préalable, et la dernière nocturne de la saison avec ses concerts au chapeau dans la cour de la médiathèque.", "tags": [{"cls": "t-rando", "txt": "Rando 9,7 km · +200 m"}, {"cls": "t-village", "txt": "Lasalle"}, {"cls": "t-marche", "txt": "Dernière nocturne"}, {"cls": "t-tot", "txt": "1h35 de volant · max 45 min d'affilée"}], "etapes": [{"type": "trajet", "heure": "9h30", "html": "Col de Lamira → Soudorgues · par Saint-Jean-du-Gard et Lasalle · 30 km · <strong>45 min</strong>", "fin": "Départ", "vers": "Sentier La Salindre", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Soudorgues+30460", "alt": 400, "km": "30", "duree": "45min", "route": "par Saint-Jean-du-Gard et Lasalle", "de_pt": "b_j11_9", "vers_pt": "p46", "de_lib": "Col de Lamira", "vers_lib": "Soudorgues", "de_alt": 400, "vers_alt": 400}, {"type": "rando", "heure": "10h15", "icone": "i-hike", "titre": "Rando : Sentier La Salindre", "pt": "p46", "blocs": [{"t": "meta", "html": "9,7 km · <strong>+200 m seulement</strong> · 3h15 · boucle · balisage jaune · départ de Soudorgues, 400 m d'altitude"}, {"t": "p", "html": "La sortie la plus douce de la semaine, et c'est délibéré : vous avez enchaîné la crête de Castelviel lundi et le Pic d'Arbousse hier soir. Haute vallée de la Salindrenque, sous-bois, hameaux de schiste. <strong>Le parcours comporte un gué à traverser</strong> : emportez une serviette et laissez le chien s'y arrêter, c'est le point d'eau du parcours."}, {"t": "access", "warn": false, "html": "<b>Départ et stationnement</b> — Soudorgues est à 10 min de Lasalle par la D39. Stationnement au village, gratuit selon toute vraisemblance, capacité non documentée. <strong>Itinéraire déconseillé après de fortes pluies</strong> à cause du gué."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Soudorgues+30460", "txt": "Départ · fiche et avis"}, {"cls": "l-trk", "href": "https://static.apidae-tourisme.com/filestore/objets-touristiques/plans/221/174/37334749/la-salindre.gpx", "txt": "Télécharger le GPX"}, {"cls": "l-web", "href": "https://www.tourismegard.com/fr/fiche/equipement/sentier-la-salindre-soudorgues_TFO6082088/", "txt": "Fiche officielle"}]}]}, {"type": "trajet", "heure": "", "html": "Soudorgues → Lasalle · D39 · 6 km · <strong>10 min</strong>", "fin": "Fin de la rando", "vers": "Pique-nique au bord de la Salindrenque", "nav": "https://www.google.com/maps/search/?api=1&query=Pique-nique%20au%20bord%20de%20la%20Salindrenque%20C%C3%A9vennes", "alt": null, "km": "6", "duree": "10min", "route": "D39", "de_pt": "p46", "vers_pt": null, "de_lib": "Soudorgues", "vers_lib": "Lasalle", "de_alt": 400, "vers_alt": 280}, {"type": "eat", "heure": "13h45", "icone": "i-eat", "titre": "Pique-nique au bord de la Salindrenque", "blocs": [{"t": "meta", "html": "Sur le parcours, au gué, ou sur une place de Lasalle en arrivant"}, {"t": "access", "warn": true, "html": "<b>Pourquoi pas de restaurant ce jour-là</b> — La bonne adresse du secteur existe, c'est <strong>La Balade Gourmande</strong> à Soudorgues, à cinq minutes de votre départ de rando : 4,6 / 5 sur 171 avis Google, un projet de village porté par une centaine d'adhérents, produits bio et locaux, bâtisse en pierre, terrasse couverte, concerts et théâtre, chiens acceptés en terrasse. <strong>Mais elle est fermée le mercredi</strong> : ouverture vendredi soir, samedi midi et soir, dimanche midi. 04 66 85 43 94.<br>La seule table de Lasalle, L'Étape du Randonneur, plafonne à 4,2 sur 38 avis. Ce n'est pas à la hauteur du reste du séjour. Vous mangerez mieux avec ce que vous aurez préparé, et vous vous rattraperez le soir au marché nocturne."}, {"t": "shop", "html": "<b>À préparer mardi soir</b> — Sandwichs au pélardon et à la charcuterie du marché de Saint-Jean, tomates, fruits, et deux bières. Le gué du parcours est le point de fraîcheur, prévoyez une serviette."}]}, {"type": "village", "heure": "15h15", "icone": "i-village", "titre": "Flânerie à Lasalle, « la Perle des Vallons »", "pt": "p48", "blocs": [{"t": "meta", "html": "280 m d'altitude · 1h30 · le format idéal pour marcher avec un chien"}, {"t": "p", "html": "Une seule <strong>épine dorsale de 2 km</strong> d'où partent des dizaines de passages et d'escaliers qui descendent vers la Salindrenque : le chien peut se rafraîchir tous les cent mètres. Le <strong>vieux pont du XVI<sup>e</sup></strong>, le temple du XIX<sup>e</sup> en hémicycle, l'arche romane dite « La Mouthe », et les anciennes filatures en bord de rivière — Lasalle en comptait onze au XIX<sup>e</sup> et produisait le plus gros volume de soie de la région."}, {"t": "p", "html": "<strong>Poterie Gauthier</strong>, 88 rue de la Place — Corinne et Philippe Gauthier travaillent la faïence émaillée sur terre rouge, et Corinne peint les décors <strong>à main levée, sans dessin préalable</strong>, devant vous. Vaisselle utilitaire, jarres de jardin, grands plats. Ouvert toute l'année, <a class=\"tel\" href=\"tel:+33466853155\">04 66 85 31 55</a>. En arrivant à 15h15 vous êtes largement dans les heures d'ouverture, contrairement à ce que donnait la version précédente de ce programme."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Poterie+Gauthier+88+rue+de+la+Place+Lasalle", "txt": "Poterie Gauthier"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Lasalle+30460", "txt": "Lasalle"}]}]}, {"type": "eau", "heure": "17h00", "icone": "i-swim", "titre": "Trempette dans la Salindrenque, et temps mort", "pt": "p49", "blocs": [{"t": "meta", "html": "Accès libre par les escaliers du village · non surveillé, non contrôlé"}, {"t": "p", "html": "Deux heures à ne rien faire avant le marché : la rivière traverse le village et les accès sont multiples. Ce n'est pas un site officiellement suivi, donc <strong>eau courante uniquement</strong>, et ne laissez pas le chien boire dans une vasque stagnante."}]}, {"type": "marche", "heure": "19h00", "icone": "i-basket", "titre": "Dîner aux Nocturnes de Lasalle — dernière de la saison", "pt": "p50", "blocs": [{"t": "meta", "html": "Rue de la Place · marché dès 18h, concerts dès 20h30 dans la cour de la médiathèque, au chapeau"}, {"t": "p", "html": "Producteurs, artisans, food-trucks, spectacles. <strong>Parking à l'entrée du village, 5 min à pied.</strong> Vous dînez là, et vous repartez avec de la musique dans la tête."}]}, {"type": "trajet", "heure": "21h30", "html": "Lasalle → col de Lamira · 27 km · <strong>40 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 1h35 de conduite, plus longue traite 45 min</strong>", "fin": "On plie les courses", "km": "27", "duree": "40min", "route": "", "de_pt": "p50", "vers_pt": null, "de_lib": "Lasalle", "vers_lib": "col de Lamira", "de_alt": 280, "vers_alt": 400, "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115%2C3.895"}], "notes": [{"cls": "note plan", "html": "<b>Si vous voulez de la vraie montagne ce jour-là :</b> le <strong>Sentier de Soult</strong> au départ de L'Estréchure, 9,7 km, +436 m, 4h, est la plus belle marche « Cévennes profondes » du secteur — châtaigniers, chênes, pins et sapins jusqu'à 750 m, château de l'Hom, hameau de la Bécédelle. Mais il est à 35 min dans l'autre direction, ce qui porterait la journée à 2h40 de route avec Lasalle. À faire à la place d'une autre journée si le cœur vous en dit. <a href=\"https://www.tourismegard.com/fr/fiche/equipement/sentier-de-soult-l-estrechure_TFO6082090/\">Trace et GPX</a>"}, {"cls": "note prep", "html": "<b>Ce soir, on prépare demain.</b> Départ 8h30 pour Florac, et vous <strong>déjeunerez du marché</strong> : prévoyez juste la glacière, les couverts et une nappe. Emportez les maillots, le pique-nique se fait les pieds dans le Tarn."}], "alt_max": 400, "alt_min": 280, "rando": ["9,7 km", "+200 m"], "volant": "1h35", "chaud": {"texte": "Soudorgues est à 400 m et le parcours comporte un gué. Au-delà de 35 °C, partez à 8h ou remplacez par la <strong>Voie Verte de la Mimente</strong>, plate, ombragée et le long de l'eau.", "lieu": "Voie Verte de la Mimente", "alt": 545}, "geo": {"lat": 44.0169, "lon": 3.8299, "lab": "Soudorgues", "alt": 400}, "base": {"lat": 44.115, "lon": 3.895, "lab": "Col de Lamira"}, "bonus": [{"k": "rando", "titre": "Le sentier de l'Amous, Saint-Sébastien-d'Aigrefeuille", "meta": "3,4 km · 2h · <strong>très ombragé, au fil de l'eau</strong> · 30 min de Lasalle", "txt": "La rando la plus courte et la plus fraîche de la réserve : elle suit le ruisseau presque tout du long. Parfaite en fin de journée, ou pour un jour où on ne veut rien forcer.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=44.106354%2C3.995293"}, {"cls": "l-gpx", "txt": "Trace GPX", "href": "https://www.tourismegard.com/fr/fiche/equipement/sentier-du-patrimoine-autour-de-l-amous-saint-sebastien-d-aig"}]}, {"k": "village", "titre": "Le col du Rédarès et Saint-Roman-de-Codières", "meta": "15 min de Lasalle · 600 m", "txt": "La petite route de crête entre Lasalle et le Vigan, avec la vue sur les deux vallées. Un col, deux hameaux, personne. À prendre au retour si vous voulez rentrer par le haut plutôt que par la vallée.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Col+du+R%C3%A9dar%C3%A8s%2C+30440"}]}], "flex": {"ok": false, "why": "Dernière nocturne de la saison à Lasalle, un mercredi soir et pas un autre.", "frais": "Sentier de La Salindre avec un gué, Lasalle à 280 m", "haut": 400, "pas": {}}}, {"id": "j12", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Florac-panorama.jpg?width=1200", "alt": "Florac", "cap": "Florac, au confluent du Tarn, du Tarnon et de la Mimente · <a href=\"https://commons.wikimedia.org/wiki/File:Florac-panorama.jpg\">Wikimedia Commons</a>"}, "dt": "Jeudi 20 août", "titre": "Florac, la capitale du Parc national, par la plus belle route des Cévennes", "pitch": "Une heure dix de Corniche des Cévennes, cette route de crête qui était une voie gauloise avant de devenir route royale en 1690, avec un point haut à 1018 mètres au col des Faïsses. Au bout, Florac : une sous-préfecture de deux mille habitants coincée au confluent de trois rivières, où une source jaillit d'un éboulis en plein centre-ville et où le château abrite le siège du Parc national. C'est jour de marché. Vous achetez le déjeuner, vous le mangez sous les peupliers au bord du Tarn, et vous passez l'après-midi sur une ancienne voie ferrée qui longe la Mimente, plate et fraîche, avec la rivière à portée de museau.", "tags": [{"cls": "t-marche", "txt": "Marché du jeudi"}, {"cls": "t-village", "txt": "Florac · 549 m"}, {"cls": "t-rando", "txt": "Voie verte 2h15 · plat"}, {"cls": "t-eau", "txt": "Baignade dans le Tarn"}, {"cls": "t-tot", "txt": "2h30 de volant · max 1h10 d'affilée"}], "etapes": [{"type": "trajet", "heure": "8h30", "html": "Col de Lamira → Florac · D907 puis Corniche des Cévennes · 50 km · <strong>1h10</strong> · cols Saint-Pierre 597 m, de l'Exil 704 m, de la Solpérière 1010 m, <strong>des Faïsses 1018 m</strong>, du Rey 987 m", "fin": "Départ", "vers": "Arrivée et stationnement à Florac", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Maison+du+Tourisme+et+du+Parc+national+des+C%C3%A9vennes+Florac", "alt": 549, "km": "50", "duree": "1h10", "route": "D907 puis Corniche des Cévennes", "de_pt": "b_j12_8", "vers_pt": "p51", "de_lib": "Col de Lamira", "vers_lib": "Florac", "de_alt": 400, "vers_alt": 549}, {"type": "village", "heure": "9h45", "icone": "i-village", "titre": "Arrivée et stationnement à Florac", "pt": "p51", "blocs": [{"t": "meta", "html": "549 m · <strong>parking du Rond-Point de la Gare, 120 places, gratuit</strong>"}, {"t": "access", "warn": true, "html": "<b>Deux pièges de stationnement, ce jeudi précisément</b> — Un arrêté municipal ferme <strong>le côté impair de l'Esplanade et la place du Souvenir à la circulation et au stationnement tous les jeudis de 6h à 14h</strong> jusqu'au 27 août : ne visez surtout pas ces places. Allez directement au <strong>parking du Rond-Point de la Gare</strong>, 120 places et gratuit, qui est aussi la Maison du Tourisme et du Parc national, donc votre point de départ de l'après-midi. Florac compte plus de 700 places dont seulement 10 % payantes."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Maison+du+Tourisme+et+du+Parc+national+des+C%C3%A9vennes+Florac", "txt": "Fiche et avis"}, {"cls": "l-web", "href": "https://www.floractroisrivieres.fr/stationnement/", "txt": "Parkings de Florac"}]}]}, {"type": "marche", "heure": "9h50", "icone": "i-basket", "titre": "Marché du jeudi", "pt": "p52", "blocs": [{"t": "meta", "html": "8h-13h selon la mairie, 8h-12h selon l'office de tourisme : comptez que ça se démonte vers 12h30 · place de l'Esplanade, place de la Mairie jusqu'à l'entrée du château, et place Maury"}, {"t": "p", "html": "Producteurs et artisans du secteur, avec des animations musicales et théâtrales l'été. La mairie prévient que l'affluence estivale rend la circulation piétonne difficile : <strong>chien en laisse courte, et arrivez avant 10h30</strong>."}, {"t": "shop", "html": "<b>C'est ici que vous achetez le déjeuner</b> — pain, charcuterie de pays, pélardon, tomates, fruits, et de quoi grignoter sur la route du retour. Vous mangerez au bord du Tarn dans deux heures, donc prenez aussi de quoi boire."}, {"t": "liens", "liens": [{"cls": "l-web", "href": "https://www.floractroisrivieres.fr/marche-hebdomadaire/", "txt": "Fiche mairie"}]}]}, {"type": "village", "heure": "11h20", "icone": "i-village", "titre": "Flânerie : « Florac, une source dans la ville »", "pt": "p53", "blocs": [{"t": "meta", "html": "Circuit balisé officiel du Parc national · 2,4 km · +72 m · 1h · très facile · 13 points patrimoniaux"}, {"t": "p", "html": "Le <strong>château du Parc national</strong> : bâti sur un château féodal, racheté et restauré par l'État, il abrite le siège de l'établissement public. <strong>Il ne se visite pas</strong>, mais la cour est en accès libre toute l'année, animaux acceptés. C'est aussi là qu'on demande l'état des sentiers."}, {"t": "p", "html": "Puis la <strong>source du Pêcher</strong>, dans le parc Paul Arnal : une résurgence qui jaillit d'un éboulis rocheux après avoir traversé toute l'épaisseur du causse Méjean. La retenue du Vibron alimentait autrefois moulins et vivier, des cygnes y vivent aujourd'hui. Accès libre, gratuit, <strong>chiens admis</strong>, et c'est décrit officiellement comme « calme et ombragé »."}, {"t": "p", "html": "Sur le chemin, l'ancienne gare, l'église, le temple, les ruelles et les placettes. Et si l'artisanat vous tente, l'<strong>Atelier Tuffery</strong>, la plus ancienne manufacture de jeans de France, est ouvert <strong>9h-19h en continu du lundi au samedi</strong> jusqu'au 29 août, ZA Saint-Julien-du-Gourg, <a class=\"tel\" href=\"tel:+33466450094\">04 66 45 00 94</a>."}, {"t": "liens", "liens": [{"cls": "l-trk", "href": "https://destination.cevennes-parcnational.fr/trek/37884-Florac%2C-une-source-dans-la-ville", "txt": "Circuit et GPX"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Source+du+P%C3%AAcher+Florac", "txt": "Source du Pêcher"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Atelier+Tuffery+Florac", "txt": "Atelier Tuffery"}]}]}, {"type": "trajet", "heure": "", "html": "Florac centre → Pont du Tarn · chemin Azinières · 2,5 km · <strong>5 min</strong>", "fin": "Fin de la flânerie", "vers": "Pique-nique et baignade au Pont du Tarn", "nav": "https://www.google.com/maps/dir/?api=1&amp;destination=44.3366674%2C3.58773736", "alt": 530, "km": "2,5", "duree": "5min", "route": "", "de_pt": "p53", "vers_pt": "p54", "de_lib": "Florac centre", "vers_lib": "Pont du Tarn", "de_alt": 549, "vers_alt": 530}, {"type": "eau", "heure": "12h30", "icone": "i-swim", "titre": "Pique-nique et baignade au Pont du Tarn", "pt": "p54", "blocs": [{"t": "meta", "html": "Chemin Azinières, Florac Trois Rivières · site officiellement contrôlé, qualité de l'eau « bonne » au 21 juillet 2026 · non surveillé · 2h sur place"}, {"t": "p", "html": "Juste à la sortie de Florac vers Ispagnac, un peu en amont du confluent du Tarn et du Tarnon. Lozère Tourisme le décrit sous « l'ombre des peupliers » : <strong>c'est le seul spot du secteur dont l'ombre est explicitement documentée</strong>, ce qui en fait le bon choix pour un chien un 20 août."}, {"t": "access", "warn": false, "html": "<b>Stationnement</b> — Le long du chemin Azinières. Le <strong>camping Le Pont du Tarn est mitoyen : son parking est privé</strong>, réservé à sa clientèle. Aucun équipement public documenté sur le site.<br><em>Plan B s'il pleut : <strong>Au Pêcher Mignon</strong>, 13 place Louis Dides, crêperie participative où l'on compose sa galette et où les boissons sont en self-service. TripAdvisor 4,5 / 5 sur 194 avis, ouvert le jeudi de 9h à 22h, produits locaux, tout maison, options végétariennes et vegan. 04 66 45 14 28. Original et généreux.</em>"}, {"t": "access", "warn": true, "html": "<b>Cyanobactéries — le point le plus important de la journée</b><br>La mairie de Florac maintient un suivi actif : au <strong>28 juillet 2026</strong>, phase 1 « Surveillance » sur <strong>la Mimente, le Tarnon et le Tarn</strong>. Le risque n'est pas la baignade mais <strong>l'ingestion des amas verdâtres par le chien</strong>, qui peut être mortelle en quelques heures.<br><strong>Vérifiez la carte la veille au soir sur <a href=\"https://www.tarn-amont.fr/cyanobacteries/\">tarn-amont.fr/cyanobacteries</a></strong>, lisez les panneaux affichés sur place, tenez le chien en laisse au bord de l'eau, et ne le laissez ni boire la rivière, ni lécher les galets, ni mâchouiller ce qui flotte."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Le+Pont+du+Tarn+Florac", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.3366674%2C3.58773736", "txt": "Itinéraire · 44.3366674, 3.58773736"}]}]}, {"type": "trajet", "heure": "", "html": "Pont du Tarn → parking de la Gare, Florac · 2,5 km · <strong>5 min</strong>", "fin": "On se sèche", "vers": "la Voie Verte de la Mimente", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.327,3.596", "alt": 545, "km": "2,5", "duree": "5min", "route": "", "de_pt": "p54", "vers_pt": "p55", "de_lib": "Pont du Tarn", "vers_lib": "parking de la Gare, Florac", "de_alt": 530, "vers_alt": 545}, {"type": "rando", "heure": "14h50", "icone": "i-hike", "titre": "Rando : la Voie Verte de la Mimente", "pt": "p55", "blocs": [{"t": "meta", "html": "Aller-retour libre, comptez 2h15 · <strong>quasi plat, 541 à 634 m</strong> · départ Maison du Tourisme et du Parc, même parking · poteaux directionnels"}, {"t": "p", "html": "L'ancienne plateforme du chemin de fer départemental, large et régulière, qui <strong>longe la Mimente en permanence</strong>. C'est de très loin le meilleur terrain de la semaine pour un chien : aucun dénivelé, aucune pâture, aucune clôture, sol régulier qui préserve les coussinets, et de l'eau accessible en continu. Panneaux d'interprétation tout du long, passerelle sur la rivière au lieu-dit « Pont Manqué ». La section Florac – La Salle Prunet est revêtue et accessible aux poussettes."}, {"t": "p", "html": "Demi-tour quand vous voulez : le tracé intégral jusqu'à Saint-Julien-d'Arpaon fait 16 km aller-retour, vous n'en ferez que la moitié. Vous marchez au passage sur le <strong>GR70, le chemin de Stevenson</strong>, qui emprunte le même tracé."}, {"t": "p", "html": "<em>Alternative sportive au même départ : <strong>Gralhon</strong>, 8,3 km, +457 m, 2h30, hameaux de schiste et de calcaire, panoramas sur Florac et la vallée du Tarnon, source ferrugineuse de Salce, loutres et castors. Plus beau, mais plus raide et partiellement exposé sur le causse.</em>"}, {"t": "liens", "liens": [{"cls": "l-trk", "href": "https://geotrek-admin.cevennes-parcnational.net/api/fr/treks/95019/voie-verte-florac-a-saint-julien-darpaon.gpx", "txt": "Télécharger le GPX"}, {"cls": "l-web", "href": "https://destination.cevennes-parcnational.fr/trek/95019-Voie-verte---Florac-a-Saint-Julien-d-Arpaon", "txt": "Fiche officielle"}, {"cls": "l-trk", "href": "https://www.decathlon-outdoor.com/fr-fr/explore/france/balade-a-la-butte-de-gralhon-et-fil-du-tarn-6231d97060a00", "txt": "Decathlon Outdoor"}]}]}, {"type": "trajet", "heure": "17h10", "html": "Florac → col de Lamira · Corniche des Cévennes · 50 km · <strong>1h10</strong> &nbsp;·&nbsp; <strong>Total du jour : 2h30 de conduite, plus longue traite 1h10</strong>", "fin": "Fin de la rando", "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115%2C3.895", "alt": null, "km": "50", "duree": "1h10", "route": "Corniche des Cévennes", "de_pt": "p55", "vers_pt": null, "de_lib": "Florac", "vers_lib": "col de Lamira", "de_alt": 545, "vers_alt": 400}, {"type": "eat", "heure": "19h00", "icone": "i-eat", "titre": "Dîner à la maison", "blocs": [{"t": "shop", "html": "<b>Au menu</b> — Ce qui reste du marché de Florac : charcuterie, fromages de Lozère, tomates, pain. Et une omelette si vous avez pris des œufs.<br><em>Vous rentrez à 18h20, donc rien ne presse. C'est la dernière soirée avant le dernier jour complet.</em>"}]}], "notes": [{"cls": "note plan", "html": "<b>Départ à 8h30, l'une des trois exceptions du séjour</b> — le marché du jeudi de Florac se termine vers 13h, et la route en fait 1h15. Si vous préférez tenir le 9h30 : partez à 9h30, vous serez sur le marché à 10h45, vous aurez une heure pleine avant qu'il ne remballe, et tout le reste de la journée glisse d'une heure. La rando de la Voie Verte est plate et ombragée, elle passe très bien à 16h."}, {"cls": "note warn", "html": "<b>Pourquoi pas les gorges du Tarn.</b> Sainte-Enimie et Castelbouc sont à <strong>1h50 d'une seule traite</strong> depuis votre base, soit 3h40 aller-retour minimum : c'est au-delà de vos deux limites, et de loin. Le Mont Lozère et Le Pont-de-Montvert sont à 1h25, donc également hors budget. Florac à 1h10 est le point le plus lointain qui rentre dans le cadre, et c'est aussi le plus riche : marché, capitale du Parc, trois rivières et une source en ville."}, {"cls": "note plan", "html": "<b>Variante canicule</b> si le thermomètre dépasse 32 °C : la Voie Verte reste le bon choix, mais partez plutôt vers 16h et allongez la baignade du Pont du Tarn. Second spot officiel à 3 min du centre si le premier est pris : le <strong>Pont de Barre</strong> sur le Tarnon, plage de sable en rive droite et petite cascade sur un seuil, à 700 m du rond-point sur la route de Meyrueis. <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=44.3126975%2C3.59853059\">Itinéraire · 44.3126975, 3.59853059</a>"}], "alt_max": 549, "alt_min": 530, "rando": ["2h15", "plat"], "volant": "2h30", "chaud": {"texte": "La Voie Verte longe la rivière en permanence et Florac est à 549 m. Par forte chaleur, décalez la marche à 16h et allongez la baignade au Pont du Tarn.", "lieu": "Voie Verte de la Mimente", "alt": 545}, "geo": {"lat": 44.3263, "lon": 3.5958, "lab": "Florac", "alt": 549}, "base": {"lat": 44.115, "lon": 3.895, "lab": "Col de Lamira"}, "bonus": [{"k": "village", "titre": "Ispagnac et le pont de Quézac", "meta": "15 min de Florac · 520 m · l'entrée des gorges du Tarn", "txt": "<strong>C'est le seul moyen de voir les gorges du Tarn sans casser vos plafonds de route.</strong> Ispagnac, « le jardin de la Lozère », est le dernier village avant que le Tarn n'entre dans les gorges, et le pont de Quézac, bâti au XIV<sup>e</sup> pour les pèlerins, l'enjambe juste à côté. Sainte-Enimie est encore à 30 minutes de plus : à vous de voir, mais la journée y passerait.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Ispagnac%2C+48320"}, {"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Pont+de+Qu%C3%A9zac%2C+48320+Ispagnac"}]}, {"k": "eau", "titre": "Les Pierres Plates de Cocurès", "meta": "8 min de Florac · sur le Tarn", "txt": "Le spot de baignade des gens du coin, en amont de Florac : dalles plates au bord du Tarn, eau claire, peu de monde en semaine. Le repli si le Pont du Tarn est pris.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Cocur%C3%A8s%2C+48400"}]}], "flex": {"ok": false, "why": "Le marché de Florac est le jeudi matin.", "frais": "Voie Verte de la Mimente le long de la rivière, Florac à 549 m", "haut": 549, "pas": {}}}, {"id": "j13", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Bambouseraie_de_Prafrance_20100904_031.jpg?width=1200", "alt": "Bambouseraie de Prafrance", "cap": "La Bambouseraie de Prafrance, Générargues · <a href=\"https://commons.wikimedia.org/wiki/File:Bambouseraie_de_Prafrance_20100904_031.jpg\">Wikimedia Commons</a>"}, "dt": "Vendredi 21 août", "titre": "Une cathédrale de bambous, un train à vapeur, et les poteries d'Anduze", "pitch": "La journée la plus douce du séjour, et celle où le chien est le mieux traité. Douze hectares de bambous géants font de l'ombre sur la totalité du parc : on y marche dans une lumière verte qui tombe en rais, et il l'accompagne gratuitement, en laisse, partout. L'après-midi, quarante minutes de vraie locomotive à vapeur le long du Gardon, viaducs et tunnels compris, avec lui à bord pour 4,50 €. Et pour finir, Anduze en fin de journée : une fontaine coiffée de tuiles vernissées orientales de 1649, des halles qui tiennent marché depuis 1457, et neuf poteries qui fabriquent toujours le vase d'Anduze avec la forme qu'il a depuis le XVII<sup>e</sup> siècle.", "tags": [{"cls": "t-visite", "txt": "Bambouseraie 15,50 €"}, {"cls": "t-route", "txt": "Train à vapeur"}, {"cls": "t-village", "txt": "Anduze"}, {"cls": "t-eau", "txt": "Baignade"}, {"cls": "t-tot", "txt": "1h30 de volant · max 30 min d'affilée"}], "etapes": [{"type": "trajet", "heure": "9h30", "html": "Col de Lamira → Bambouseraie, Générargues · 20 km · <strong>30 min</strong>", "fin": "Départ", "vers": "Bambouseraie en Cévennes", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Bambouseraie+en+C%C3%A9vennes+G%C3%A9n%C3%A9rargues", "alt": 140, "km": "20", "duree": "30min", "route": "", "de_pt": "b_j13_9", "vers_pt": "p56", "de_lib": "Col de Lamira", "vers_lib": "Bambouseraie, Générargues", "de_alt": 400, "vers_alt": 140}, {"type": "visit", "heure": "10h00", "icone": "i-ticket", "titre": "Bambouseraie en Cévennes", "pt": "p56", "blocs": [{"t": "meta", "html": "552 rue de Montsauve, 30140 Générargues · <strong>9h-19h non-stop, 7j/7</strong> · adulte 15,50 € · <strong>parking gratuit</strong> · <a class=\"tel\" href=\"tel:+33466617047\">04 66 61 70 47</a>"}, {"t": "p", "html": "<strong>Chien accepté en laisse dans tout le jardin, sans supplément.</strong> C'est le meilleur site du séjour pour un chien sensible à la chaleur : les bambous géants ombragent la totalité du parc. Vallon du dragon, village laotien, serre Viala. 170<sup>e</sup> anniversaire en 2026. Comptez 2h30."}, {"t": "access", "warn": false, "html": "<b>Deux détails</b> — Les chiens sont <strong>interdits pendant les nocturnes « Arborescences »</strong>, mais vous y allez en journée. Et il y a <strong>peu de poubelles dans le parc</strong> : prenez vos sacs."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Bambouseraie+en+C%C3%A9vennes+G%C3%A9n%C3%A9rargues", "txt": "Fiche et avis"}, {"cls": "l-web", "href": "https://bambouseraie.fr/", "txt": "bambouseraie.fr"}]}]}, {"type": "trajet", "heure": "", "html": "Générargues → Anduze, gare du train à vapeur · 5 km · <strong>10 min</strong>", "fin": "Fin de la visite", "vers": "Tife Tafe", "nav": "https://www.google.com/maps/search/?api=1&query=Tife+Tafe+Anduze", "alt": null, "km": "5", "duree": "10min", "route": "", "de_pt": "p56", "vers_pt": null, "de_lib": "Générargues", "vers_lib": "Anduze, gare du train à vapeur", "de_alt": 140, "vers_alt": 130}, {"type": "eat", "heure": "12h45", "icone": "i-eat", "titre": "Déjeuner — Tife Tafe, Anduze", "blocs": [{"t": "meta", "html": "5 place Notre-Dame · <strong>vendredi 12h-13h30, créneau très court</strong> · 04 66 61 93 70 · <strong>chiens acceptés en salle ET en terrasse</strong>"}, {"t": "note", "html": "Google 4,8 / 5 · 461 avis &nbsp;|&nbsp; TripAdvisor 4,7 / 5 · 289 avis"}, {"t": "p", "html": "Un caviste doublé d'un restaurant et d'un bar à bières, sur la place Notre-Dame. Cuisine de produits frais de saison, savoureuse et un peu audacieuse, avec une vraie offre végétarienne, ce qui est rare dans le coin. C'est la meilleure adresse d'Anduze et elle accepte le chien à l'intérieur, ce qui n'arrive presque jamais."}, {"t": "access", "html": "<b>Réservez, et soyez à l'heure</b> — Le service ne dure qu'une heure et demie. Garez-vous près de la gare du train à vapeur, votre voiture y restera l'après-midi.<br><em>Alternative de même niveau :</em> <strong>L'Atelier de Pierre</strong>, 3 rue du Plan de Brie, 4,8 / 5 sur 690 avis Google, carte qui suit les marchés, belle cave. Réservation obligatoire."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&query=Tife+Tafe+Anduze", "txt": "Fiche et avis"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&query=L%27Atelier+de+Pierre+Anduze", "txt": "Fiche et avis"}]}]}, {"type": "train", "heure": "14h30", "icone": "i-train", "titre": "Train à Vapeur des Cévennes, aller-retour depuis Anduze", "blocs": [{"t": "meta", "html": "Départ Anduze <strong>14h30</strong> → Saint-Jean 15h10 · retour Saint-Jean <strong>15h30</strong> → Anduze 16h10 · arrivez 30 min avant"}, {"t": "p", "html": "Aller-retour adulte <strong>17,50 €</strong>, <strong>chien accepté en laisse pour 4,50 €</strong> — le même supplément couvre l'aller simple comme l'aller-retour. Quarante minutes le long du Gardon, viaducs et tunnels, tractées par une vraie locomotive à vapeur. <strong>Prenez un wagon ouvert</strong> : bien plus supportable pour le chien qu'un compartiment fermé, et bien plus beau."}, {"t": "p", "html": "<em>Autres départs si vous décalez : d'Anduze à 9h30, 11h30, 14h30 et 16h30 ; de Saint-Jean-du-Gard à 10h30, 13h30, 15h30 et 17h30.</em>"}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Gare+du+Train+%C3%A0+Vapeur+des+C%C3%A9vennes+Anduze", "txt": "Gare d'Anduze"}, {"cls": "l-web", "href": "https://www.trainavapeur.com/preparer-mon-voyage/", "txt": "Horaires et tarifs"}]}]}, {"type": "village", "heure": "16h30", "icone": "i-village", "titre": "Anduze, à la bonne heure", "pt": "p58", "blocs": [{"t": "meta", "html": "1h30 · <strong>jamais entre 11h et 17h en août</strong>, c'est saturé"}, {"t": "p", "html": "La <strong>Fontaine Pagode</strong> de 1649, coiffée de tuiles vernissées orientales, plantée au milieu du bourg : c'est la carte postale. Autour, les ruelles médiévales, la rue Droite, le Plan de Brie, la tour de l'Horloge, et la <strong>place couverte</strong> dont les halles accueillent un marché <strong>depuis 1457</strong>. Le <strong>parc des Cordeliers</strong> offre de l'ombre et un chêne des Canaries de 230 ans rapporté d'Amérique par La Fayette."}, {"t": "p", "html": "Et surtout les <strong>poteries</strong>. La Route du Vase d'Anduze fédère neuf ateliers ; le plus visitable est <strong>Poterie d'Anduze — Les Enfants de Boisset</strong>, qui ouvre son atelier. Le vase d'Anduze, avec ses guirlandes et ses macarons, est né ici au XVII<sup>e</sup> et n'a jamais changé de forme. Attention, plusieurs poteries sont sur les communes voisines de Tornac et Générargues, pas dans le bourg."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Fontaine+Pagode+Anduze", "txt": "Fontaine Pagode"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Poterie+d%27Anduze+Les+Enfants+de+Boisset", "txt": "Les Enfants de Boisset"}, {"cls": "l-web", "href": "https://www.vase-anduze.fr/", "txt": "Route du Vase d'Anduze"}]}]}, {"type": "trajet", "heure": "18h00", "html": "Anduze → Falguière · D907 par Générargues et Corbès · 14 km · <strong>25 min</strong>", "fin": "Fin de la flânerie", "vers": "la Falguière, dernière baignade dans le Gardon", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Falgui%C3%A8re+Saint-Jean-du-Gard+baignade", "alt": null, "km": "14", "duree": "25min", "route": "D907 par Générargues et Corbès", "de_pt": "p58", "vers_pt": null, "de_lib": "Anduze", "vers_lib": "Falguière, Saint-Jean-du-Gard", "de_alt": 130, "vers_alt": 210}, {"type": "eau", "heure": "18h15", "icone": "i-swim", "titre": "Dernière baignade", "blocs": [{"t": "access", "warn": true, "html": "<b>Évitez les « plages » d'Anduze</b> — Le Castel Rose et L'Arche sont d'abord les <strong>noms de deux campings</strong> : les points de prélèvement portent leur nom parce que l'analyse se fait à leur hauteur, mais votre GPS vous conduira à un accueil de camping dont le parking est privé. Le seul spot public de référence est <strong>Le Pont d'Anduze</strong>, décrit comme le lieu familial du secteur, eau peu profonde et plage de sable — mais son stationnement n'est pas mieux documenté, et Anduze est bondée en été.<br><strong>Le choix sûr</strong> : remontez vers Saint-Jean et finissez la semaine où vous l'avez commencée, à <strong>Falguière</strong> (10 min de la base), ou aux <strong>Gorges de Capoue</strong> si vous voulez du calme garanti et un parking confirmé."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Falgui%C3%A8re+Saint-Jean-du-Gard+baignade", "txt": "Falguière"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Baignade+les+Gorges+de+Capoue+Saint-Andr%C3%A9-de-Valborgne", "txt": "Gorges de Capoue"}]}]}, {"type": "trajet", "heure": "19h40", "html": "Falguière → Saint-Jean-du-Gard · la petite route de la rive gauche · 5 km · <strong>10 min</strong>", "fin": "On se sèche une dernière fois", "vers": "L'Oronge, place du marché à Saint-Jean-du-Gard", "nav": "https://www.google.com/maps/dir/?api=1&destination=L%27Oronge%2C+Saint-Jean-du-Gard", "alt": null, "km": "5", "duree": "10min", "route": "la petite route de la rive gauche", "de_pt": null, "vers_pt": null, "de_lib": "Falguière", "vers_lib": "Saint-Jean-du-Gard", "de_alt": 210, "vers_alt": 197}, {"type": "eat", "heure": "20h00", "icone": "i-eat", "titre": "Dernier dîner — L'Oronge, Saint-Jean-du-Gard", "blocs": [{"t": "meta", "html": "Place de la Révolution · ouvert du mercredi au dimanche · menu 3 services 38 €, menu Le Curieux 47 € · 04 66 85 30 34"}, {"t": "note", "html": "Google 4,9 / 5 · 98 avis &nbsp;|&nbsp; TripAdvisor 4,7 / 5 · 91 avis — la meilleure note de tout le séjour"}, {"t": "p", "html": "Un ancien relais de diligence du XVII<sup>e</sup> en plein cœur du village, avec des terrasses ouvertes sur la vallée du Gardon. Tenu par un jeune couple : <strong>Camille Delorme-Krempp</strong>, cheffe pâtissière formée à Ferrandi et passée par des étoilés, et <strong>Théodore Delorme</strong>, formé à Lyon chez Christian Têtedoie. Cuisine construite strictement sur le terroir et la saison. Les avis saluent unanimement les desserts, la carte des vins et l'accueil."}, {"t": "access", "warn": true, "html": "<b>Réservez maintenant, pas la semaine prochaine</b> — Un vendredi soir d'août, c'est complet. Appelez dès aujourd'hui et <strong>demandez pour le chien</strong> : la politique animaux n'est pas publiée, mais il y a plusieurs terrasses, ce qui joue en votre faveur.<br><em>Si c'est complet :</em> <strong>Lettres et Mets</strong>, crêperie, 1071 avenue René Boudon, TripAdvisor 4,8 / 5, terrasse végétalisée avec brumisateurs, chiens acceptés, 07 88 74 22 97."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&query=L%27Oronge+Saint-Jean-du-Gard", "txt": "Fiche et avis"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&query=Lettres+et+Mets+Saint-Jean-du-Gard", "txt": "Fiche et avis"}]}]}, {"type": "trajet", "heure": "22h15", "html": "Saint-Jean-du-Gard → col de Lamira · la petite route du col, phares et prudence · 6 km · <strong>12 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 1h30 de conduite</strong>", "fin": "Fin du dernier dîner", "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115%2C3.895", "alt": null, "km": "6", "duree": "12min", "route": "la petite route du col, phares et prudence", "de_pt": null, "vers_pt": null, "de_lib": "Saint-Jean-du-Gard", "vers_lib": "col de Lamira", "de_alt": 197, "vers_alt": 400}], "strip": [{"page": "https://commons.wikimedia.org/wiki/File:Chemin_de_fer_%C3%A0_vapeur_des_C%C3%A9vennes.jpg", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Chemin_de_fer_%C3%A0_vapeur_des_C%C3%A9vennes.jpg?width=800", "alt": "Train à vapeur des Cévennes", "cap": "Le train à vapeur Anduze — Saint-Jean"}, {"page": "https://commons.wikimedia.org/wiki/File:Anduze-Vase_Boisset-20130414.jpg", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Anduze-Vase_Boisset-20130414.jpg?width=800", "alt": "Vase d'Anduze", "cap": "Le vase d'Anduze, poterie Boisset"}], "notes": [{"cls": "note prep", "html": "<b>Ce soir, on boucle.</b> Valises faites, glacière prête pour les achats de demain matin au marché de producteurs. Et si vous voulez rapporter une poterie, achetez-la <strong>aujourd'hui</strong> : demain matin il n'y aura que des producteurs."}], "alt_max": 140, "alt_min": 130, "rando": null, "volant": "1h30", "chaud": {"texte": "<strong>Anduze est à 130 m</strong>, mais c'est précisément la journée à garder pour un jour de canicule : la Bambouseraie est <strong>intégralement à l'ombre de bambous de vingt mètres</strong> et il y fait plusieurs degrés de moins qu'à l'extérieur, le train à vapeur roule fenêtres ouvertes le long du Gardon, et vous finissez à la Falguière dans l'eau. Décalez simplement la flânerie dans Anduze à 17h30 plutôt qu'à 16h30.", "lieu": "Bambouseraie, ombre intégrale", "alt": 140}, "geo": {"lat": 44.0596, "lon": 3.9683, "lab": "Générargues", "alt": 140}, "base": {"lat": 44.115, "lon": 3.895, "lab": "Col de Lamira"}, "bonus": [{"k": "village", "titre": "Anduze, la poterie et le parc des Cordeliers", "meta": "sur place · gratuit", "txt": "Le vase d'Anduze naît ici au XVII<sup>e</sup> siècle, et deux ateliers historiques se visitent encore librement. Juste à côté, le parc des Cordeliers et sa fontaine-pagode couverte de tuiles vernissées : cinq minutes à pied depuis la place Notre-Dame.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Parc+des+Cordeliers%2C+Anduze"}, {"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Poterie+d%27Anduze"}]}, {"k": "visit", "titre": "La grotte de Trabuc, si vous l'avez ratée dimanche", "meta": "14 °C · 1h · 20 min d'Anduze", "txt": "Deuxième et dernière occasion du séjour : elle est à vingt minutes d'Anduze, sur la route du retour. Mêmes réserves qu'au jour 8 pour le chien.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Grotte+de+Trabuc%2C+30140+Mialet"}]}], "flex": {"ok": false, "why": "Tife Tafe ne sert qu'une heure et demie le vendredi midi, et L'Oronge est fermé lundi et mardi.", "frais": "Bambouseraie intégralement à l'ombre des bambous géants", "haut": 140, "pas": {}}}, {"id": "j14", "dt": "Samedi 22 août · départ", "titre": "On charge d'abord, puis un dernier café, un dernier marché, une dernière trempette", "pitch": "Le mas est vidé à 9h30 et la voiture est prête. Ensuite seulement : le petit-déjeuner au Café Rando, le marché de producteurs du samedi matin pour remplir la glacière du retour, et une dernière heure dans le Gardon à la Falguière. Vous en sortez, vous vous séchez, et vous prenez la route sans repasser par le col.", "tags": [{"cls": "t-marche", "txt": "Marché de producteurs"}, {"cls": "t-eau", "txt": "Dernière baignade"}, {"cls": "t-tot", "txt": "22 min de volant sur place"}], "etapes": [{"type": "home", "heure": "8h45", "icone": "i-home", "titre": "Check-out et chargement, avant tout le reste", "blocs": [{"t": "meta", "html": "400 m d'altitude · 45 min · check-out à 12h, mais on vide la maison maintenant"}, {"t": "p", "html": "<strong>On charge d'abord, on profite ensuite.</strong> Vous videz le mas, vous faites l'état des lieux, et vous partez avec la voiture prête. Comme ça, la dernière trempette à Falguière est vraiment la dernière chose de votre séjour : vous en sortez, vous vous séchez, et vous prenez la route sans repasser par le col."}, {"t": "note", "html": "<b>À garder à portée de main</b> — serviettes et maillots sur le siège arrière, pas au fond du coffre. Et une bouteille d'eau pour le chien : la route sera longue."}]}, {"type": "trajet", "heure": "9h00", "html": "Col de Lamira → centre de Saint-Jean-du-Gard · 6 km · <strong>12 min</strong>", "fin": "Départ", "vers": "Le Café Rando", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Le+Caf%C3%A9+Rando+Saint-Jean-du-Gard", "alt": 197, "km": "6", "duree": "12min", "route": "", "de_pt": "b_j14_9", "vers_pt": "p59", "de_lib": "Col de Lamira", "vers_lib": "centre de Saint-Jean-du-Gard", "de_alt": 400, "vers_alt": 197}, {"type": "eat", "heure": "9h15", "icone": "i-eat", "titre": "Petit-déjeuner — Le Café Rando", "pt": "p59", "blocs": [{"t": "meta", "html": "96 Grand Rue · ouvert 7h30-22h, fermé le jeudi · petit-déjeuner 8 € · <strong>chiens acceptés</strong> · <a class=\"tel\" href=\"tel:+33688494555\">06 88 49 45 55</a>"}, {"t": "p", "html": "Café de Pays et boutique officielle du Chemin de Stevenson, trois salles et une terrasse ombragée. Ils font aussi des <strong>paniers pique-nique à partir de 8 €</strong> : parfait pour la route du retour."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Le+Caf%C3%A9+Rando+Saint-Jean-du-Gard", "txt": "Fiche et avis"}]}]}, {"type": "marche", "heure": "10h00", "icone": "i-basket", "titre": "Marché de producteurs", "pt": "p60", "blocs": [{"t": "meta", "html": "Samedi matin, place du marché, de Pâques à la Toussaint · concerts certains samedis d'été"}, {"t": "shop", "html": "<b>Les derniers achats</b> — pélardons affinés (ils
