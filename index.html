<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cévennes — 9 au 22 août 2026</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#faf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --ink:#211f1c; --ink2:#4c453e; --mute:#7e746a;
  --paper:#faf7f2; --card:#fffdfa; --line:#e6dfd4;
  --chestnut:#8c4a2f; --moss:#4c6b40; --river:#2c6b8a; --stone:#6a6156;
  --amber:#a5711a; --red:#a33328; --plum:#7a4a86;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 80px}
svg.ic{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  vertical-align:-3px;margin-right:7px;flex:0 0 auto}

/* ---------- HERO ---------- */
header.hero{position:relative;color:#fff;overflow:hidden;background:#3d4a38}
header.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.52}
header.hero .veil{position:absolute;inset:0;background:linear-gradient(165deg,rgba(28,40,26,.84),rgba(58,42,28,.72) 52%,rgba(122,58,34,.8))}
header.hero .inner{position:relative;max-width:960px;margin:0 auto;padding:58px 20px 46px}
header.hero .kicker{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-bottom:10px}
header.hero h1{margin:0 0 14px;font-size:2.3rem;letter-spacing:-.025em;font-weight:700;line-height:1.12;text-shadow:0 2px 16px rgba(0,0,0,.4)}
header.hero .pitch{font-size:1.06rem;line-height:1.6;max-width:660px;margin:0 0 24px;text-shadow:0 1px 10px rgba(0,0,0,.35)}
header.hero .pitch em{font-style:normal;background:rgba(255,255,255,.16);padding:1px 6px;border-radius:4px}
.bases{display:flex;gap:14px;flex-wrap:wrap}
.base{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);border-radius:11px;padding:13px 17px;flex:1 1 270px;backdrop-filter:blur(4px)}
.base b{display:block;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;opacity:.8;margin-bottom:4px}
.base span{font-size:.94rem;line-height:1.45;display:block}

/* ---------- NAV ---------- */
nav.days{position:sticky;top:0;z-index:30;background:rgba(250,247,242,.97);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:32px}
nav.days .inner{max-width:960px;margin:0 auto;padding:0 20px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
nav.days a{flex:0 0 auto;text-decoration:none;color:var(--ink2);font-size:.79rem;font-weight:600;
  padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;white-space:nowrap}
nav.days a:hover{background:var(--chestnut);color:#fff;border-color:var(--chestnut)}
nav.days a.hot{border-color:#e0bfae;color:var(--chestnut)}

h2.sec{font-size:1.5rem;margin:48px 0 6px;letter-spacing:-.01em;padding-bottom:8px;border-bottom:2px solid var(--chestnut)}
h2.sec .wk{display:block;font-size:.73rem;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);font-weight:600;margin-bottom:4px}
p.lede{color:var(--ink2);margin:12px 0 26px}

/* ---------- DAY ---------- */
.day{background:var(--card);border:1px solid var(--line);border-radius:15px;margin:0 0 24px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 28px -20px rgba(0,0,0,.3)}
.cover{position:relative;height:215px;background:#ded6c8;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.nope{display:none}
.cover .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 22px 10px;color:#fff;font-size:.75rem;
  background:linear-gradient(transparent,rgba(0,0,0,.62));text-shadow:0 1px 4px rgba(0,0,0,.5)}
.cover .cap a{color:#fff;opacity:.72;text-decoration:none;border-bottom:1px dotted rgba(255,255,255,.5)}
.day > .head{padding:19px 22px 16px;border-bottom:1px solid var(--line);background:#fff}
.day > .head .dt{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--chestnut);font-weight:700}
.day > .head h3{margin:3px 0 10px;font-size:1.28rem;letter-spacing:-.015em;line-height:1.28}
.day > .head .pitch{margin:0 0 12px;font-size:.97rem;line-height:1.6;color:var(--ink2);
  border-left:3px solid #e6d5c6;padding-left:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.71rem;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid}
.t-rando{color:var(--moss);border-color:#c4d4bc;background:#f2f7ef}
.t-eau{color:var(--river);border-color:#b8d1de;background:#eff6fa}
.t-visite{color:var(--chestnut);border-color:#e4c7b9;background:#fbf2ee}
.t-marche{color:var(--amber);border-color:#e9d6ac;background:#fcf7ea}
.t-route{color:var(--stone);border-color:#d9d2c7;background:#f5f2ec}
.t-village{color:var(--plum);border-color:#dbc8e0;background:#f8f2fa}
.t-tot{color:#fff;border-color:var(--red);background:var(--red)}

/* ---------- TIMELINE ---------- */
table.tl{width:100%;border-collapse:collapse}
table.tl td{padding:14px 22px;vertical-align:top;border-bottom:1px solid #f1ece3}
table.tl tr:last-child td{border-bottom:0}
td.h{width:72px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--chestnut);font-size:.92rem;white-space:nowrap}
td.b strong.t{display:flex;align-items:flex-start;font-size:1.02rem;margin-bottom:3px;line-height:1.35}
td.b .meta{font-size:.855rem;color:var(--mute);margin-left:24px}
td.b p{margin:8px 0 0 24px;font-size:.94rem;color:var(--ink2)}
tr.r-rando strong.t svg{color:var(--moss)} tr.r-eau strong.t svg{color:var(--river)}
tr.r-eat strong.t svg{color:var(--chestnut)} tr.r-visit strong.t svg{color:var(--chestnut)}
tr.r-village strong.t svg{color:var(--plum)} tr.r-marche strong.t svg{color:var(--amber)}
tr.r-home strong.t svg{color:var(--stone)} tr.r-train strong.t svg{color:var(--stone)}
tr.leg td{background:#f8f5f0;padding-top:9px;padding-bottom:9px;font-size:.85rem;color:var(--stone);font-weight:600}
tr.leg svg{color:var(--stone);width:15px;height:15px}
.links{margin:10px 0 0 24px;display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:.755rem;font-weight:600;text-decoration:none;padding:4px 10px;border-radius:7px;border:1px solid;white-space:nowrap}
a.l-map{color:var(--river);border-color:#bcd4e0;background:#f0f7fa}
a.l-map:hover{background:var(--river);color:#fff}
a.l-nav{color:var(--stone);border-color:#d9d2c7;background:#f6f3ed}
a.l-nav:hover{background:var(--stone);color:#fff}
a.l-trk{color:var(--moss);border-color:#c6d6be;background:#f2f7ef}
a.l-trk:hover{background:var(--moss);color:#fff}
a.l-web{color:var(--chestnut);border-color:#e4c7b9;background:#fbf2ee}
a.l-web:hover{background:var(--chestnut);color:#fff}
.note-google{display:inline-flex;align-items:center;gap:4px;font-size:.79rem;font-weight:700;color:#8a6a1c;
  background:#fcf7ea;border:1px solid #e9d6ac;border-radius:6px;padding:2px 8px;margin-left:24px;margin-top:8px}
.note-google svg{width:13px;height:13px;color:#c99a24;fill:#c99a24;stroke:none;margin:0}
.access{margin:10px 0 0 24px;font-size:.865rem;background:#f4f7f9;border:1px solid #d9e6ed;border-left:3px solid var(--river);
  border-radius:8px;padding:10px 13px;color:#2f4d5c}
.access b{color:var(--river)}
.access.warn{background:#fdf4f2;border-color:#f0dbd6;border-left-color:var(--red);color:#7c3227}
.access.warn b{color:var(--red)}
.shop{margin:10px 0 0 24px;font-size:.875rem;background:#f7f5ef;border:1px dashed #ddd3c2;border-radius:8px;padding:10px 13px;color:#5d5445}
.shop b{color:var(--chestnut)}

/* ---------- STRIP ---------- */
.strip{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line)}
.strip figure{margin:0;position:relative;height:168px;overflow:hidden;background:#e2dacc}
.strip figure.nope{display:none}
.strip img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.strip figure:hover img{transform:scale(1.05)}
.strip figcaption{position:absolute;left:0;right:0;bottom:0;padding:20px 12px 8px;color:#fff;font-size:.74rem;
  background:linear-gradient(transparent,rgba(0,0,0,.62));text-shadow:0 1px 4px rgba(0,0,0,.5)}
.strip a{text-decoration:none}
@media(max-width:520px){.strip{grid-template-columns:1fr}}

/* ---------- NOTES ---------- */
.note{margin:0;padding:13px 22px;font-size:.88rem;background:#fbf7ee;border-top:1px solid #f1e7d3;color:#6a5930}
.note b{color:#8a6a1c}
.note.warn{background:#fdf2f0;border-top-color:#f3dcd7;color:#7c3227}
.note.warn b{color:var(--red)}
.note.plan{background:#f2f7ef;border-top-color:#dcead6;color:#3e5836}
.note.plan b{color:var(--moss)}
.note.prep{background:#f4f2fa;border-top-color:#ded6ec;color:#4e3f63}
.note.prep b{color:var(--plum)}

/* ---------- BOXES ---------- */
.box{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:22px 24px;margin:0 0 20px}
.box h4{margin:0 0 12px;font-size:1.06rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:18px}
ul.tight{margin:8px 0 0;padding-left:20px}
ul.tight li{margin:6px 0;font-size:.93rem}
table.ref{width:100%;border-collapse:collapse;font-size:.885rem;margin-top:8px}
table.ref th{text-align:left;font-size:.71rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);
  padding:6px 10px 6px 0;border-bottom:2px solid var(--line)}
table.ref td{padding:9px 10px 9px 0;border-bottom:1px solid #f1ece3;vertical-align:top}
table.ref tr:last-child td{border-bottom:0}
.big{font-size:1.02rem;font-weight:700;color:var(--red)}
a{color:var(--river)}
footer{margin-top:52px;padding-top:22px;border-top:1px solid var(--line);font-size:.83rem;color:var(--mute)}

/* ---------- ALTITUDE ET METEO ---------- */
.wx{display:inline-flex;align-items:center;flex-wrap:wrap;gap:8px;margin:8px 0 0 24px;padding:5px 11px;
  border-radius:8px;background:#f3f6f4;border:1px solid #d8e2da;font-size:.83rem;color:#3f5449;line-height:1.3}
.wx .alt{font-weight:700;color:var(--moss);white-space:nowrap}
.wx .sep{color:#b9c7bd}
.wx .t{font-weight:700;color:var(--chestnut);white-space:nowrap}
.wx .cond{color:#5c6a60;white-space:nowrap}
.wx .load{color:var(--mute);font-style:italic}
.wx.warm{background:#fdf5ee;border-color:#eeddc9}
.wx.warm .t{color:#b4531f}
.wx.hot{background:#fdf0ed;border-color:#f0d5cd}
.wx.hot .t{color:var(--red)}
.wx.cool{background:#eff5fa;border-color:#cfe0ec}
.wx.cool .t{color:var(--river)}
#wxbar{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--river);border-radius:13px;
  padding:15px 18px;margin:0 0 20px;font-size:.9rem;color:var(--ink2)}
#wxbar b{color:var(--river)}
#wxbar .st{font-size:.83rem;color:var(--mute);margin-top:7px;display:block}
@media(max-width:700px){.wx{margin-left:0;font-size:.8rem;padding:5px 9px;gap:6px}}

/* ---------- CARTES DE RÉSERVATION ---------- */
.resa{border:1px solid var(--line);border-left:3px solid #cfc6b7;border-radius:11px;padding:13px 15px;margin-bottom:11px;background:#fffdfa}
.resa.hot{border-left-color:var(--red);background:#fefaf9}
.rh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:5px}
.rd{font-size:.73rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--chestnut)}
.rb{font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid}
.rb-ok{color:var(--stone);border-color:#d9d2c7;background:#f6f3ed}
.rb-must{color:#fff;border-color:var(--red);background:var(--red)}
.rn{font-size:1.02rem;font-weight:700;line-height:1.32;margin-bottom:3px}
.rm{font-size:.855rem;color:var(--mute);line-height:1.45;margin-bottom:9px}
a.rt{display:inline-flex;align-items:center;gap:6px;font-size:.94rem;font-weight:700;font-variant-numeric:tabular-nums;
  text-decoration:none;color:var(--river);background:#f0f7fa;border:1px solid #bcd4e0;border-radius:8px;padding:7px 13px}
a.rt::before{content:"\260E";font-size:.95em;opacity:.75}
a.rt:hover{background:var(--river);color:#fff}
a.tel{color:var(--river);text-decoration:none;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;
  border-bottom:1px solid #bcd4e0}

/* ---------- BACK TO TOP ---------- */
#top{position:fixed;right:16px;bottom:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;
  width:46px;height:46px;border-radius:50%;background:var(--chestnut);color:#fff;border:0;
  box-shadow:0 4px 14px rgba(0,0,0,.28);display:none;align-items:center;justify-content:center;cursor:pointer;
  font-size:19px;line-height:1;padding:0}
#top.on{display:flex}
#top:active{transform:scale(.94)}

/* ══════════ MOBILE ══════════ */
@media(max-width:700px){
  body{font-size:15.5px}
  .wrap{padding:0 14px 90px}

  header.hero .inner{padding:38px 16px 34px}
  header.hero h1{font-size:1.62rem;line-height:1.18}
  header.hero .kicker{font-size:.68rem;letter-spacing:.14em}
  header.hero .pitch{font-size:.97rem;line-height:1.55}
  .base{flex:1 1 100%;padding:11px 14px}

  nav.days{padding:8px 0}
  nav.days .inner{padding:0 14px;gap:5px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  nav.days .inner::-webkit-scrollbar{display:none}
  nav.days a{scroll-snap-align:start;padding:8px 12px;font-size:.78rem}

  h2.sec{font-size:1.28rem;margin:36px 0 6px}
  p.lede{font-size:.95rem}

  .cover{height:168px}
  .cover .cap{padding:22px 14px 9px;font-size:.71rem}
  .day{border-radius:13px;margin-bottom:18px}
  .day > .head{padding:15px 15px 13px}
  .day > .head h3{font-size:1.14rem}
  .day > .head .pitch{font-size:.93rem;padding-left:11px}
  .tag{font-size:.685rem;padding:3px 8px}

  /* la timeline passe en blocs empilés */
  table.tl, table.tl tbody, table.tl tr, table.tl td{display:block;width:100%}
  table.tl tr{border-bottom:1px solid #f1ece3;padding:14px 15px}
  table.tl tr:last-child{border-bottom:0}
  table.tl td{border:0;padding:0}
  table.tl td.h{width:auto;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;margin:0 0 8px;
    color:#fff;background:var(--chestnut);border-radius:99px;padding:4px 11px;display:inline-block;
    box-shadow:0 1px 3px rgba(140,74,47,.25)}
  table.tl td.h:empty{display:none;margin:0}
  table.tl tr.leg{background:#f8f5f0;padding:11px 15px}
  table.tl tr.leg td.h{background:transparent;color:var(--stone);padding:0;margin-bottom:4px;
    display:block;box-shadow:none;font-size:.68rem}
  table.tl tr.leg td.b{font-size:.82rem;line-height:1.45}
  td.b strong.t{font-size:1rem}
  td.b .meta,td.b p,.links,.access,.shop,.note-google{margin-left:0}
  td.b .meta{font-size:.83rem}
  td.b p{font-size:.92rem}
  .links{gap:7px}
  .links a{padding:7px 11px;font-size:.75rem}
  .access,.shop{padding:11px 12px;font-size:.85rem}
  .note{padding:13px 15px;font-size:.86rem}

  .strip figure{height:150px}
  .box{padding:18px 16px;border-radius:13px}
  .grid2{gap:14px}


  /* tableaux récapitulatifs : empilés en blocs */
  .box table.ref{display:block;overflow:visible;white-space:normal}
  .box table.ref thead,.box table.ref tbody,.box table.ref tr,.box table.ref td{display:block;width:100%}
  .box table.ref th{display:none}
  .box table.ref tr{border-bottom:1px solid var(--line);padding:13px 0}
  .box table.ref tr:first-child:has(th){display:none;padding:0;border:0}
  .box table.ref tr:last-child{border-bottom:0;padding-bottom:0}
  .box table.ref td{border:0;padding:3px 0;min-width:0}
  .box table.ref td:first-child{font-weight:700;font-size:1rem;line-height:1.35;margin-bottom:4px}
  .box table.ref td[data-l]::before{content:attr(data-l);display:block;font-size:.68rem;letter-spacing:.09em;
    text-transform:uppercase;color:var(--mute);font-weight:700;margin-top:5px;margin-bottom:1px}
}
@media(min-width:701px){.scrollhint{display:none}}
@media(max-width:380px){
  header.hero h1{font-size:1.44rem}
  .day > .head h3{font-size:1.06rem}
  .links a{font-size:.72rem;padding:6px 9px}
}
@media print{nav.days,#top{display:none}.day{break-inside:avoid;box-shadow:none}.cover{height:150px}}

/* ══════════ APPLICATION ══════════ */
html,body{overflow-x:hidden;max-width:100%}
.wrap{max-width:1120px;padding-bottom:40px}
.topbar{position:sticky;top:0;z-index:50;background:rgba(250,247,242,.96);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:11px 18px}
.topbar .marque{font-weight:800;letter-spacing:-.03em;font-size:1.02rem;color:var(--chestnut);white-space:nowrap;text-decoration:none}
.topbar .marque i{font-style:normal;color:var(--ink);font-weight:600}
.topbar .spacer{flex:1}
.tabs{display:flex;gap:3px}
.tabs a{padding:8px 11px;border-radius:99px;font-size:.85rem;font-weight:650;color:var(--ink2);text-decoration:none}
.tabs a:hover{background:#f0eae1}
.tabs a.on{background:var(--ink);color:#fff}
.tabbar{display:none}
@media(max-width:860px){
  .tabs{display:none}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:rgba(255,253,250,.985);
    backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 7px;
    text-decoration:none;color:var(--mute);font-size:.6rem;font-weight:700;white-space:nowrap}
  .tabbar a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tabbar a.on{color:var(--chestnut)}
  body{padding-bottom:66px} #top,#maj{bottom:calc(76px + env(safe-area-inset-bottom))}
}

/* --- hero --- */
.hero2{position:relative;border-radius:20px;overflow:hidden;margin:18px 0 8px;min-height:400px;display:flex;align-items:flex-end;background:#3d4a38}
.hero2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero2 .v{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,26,18,.88) 0%,rgba(20,26,18,.35) 45%,rgba(20,26,18,.12) 100%)}
.hero2 .c{position:relative;padding:26px;color:#fff;width:100%}
.hero2 .k{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;opacity:.82;margin-bottom:9px}
.hero2 h1{margin:0 0 10px;font-size:2.5rem;letter-spacing:-.038em;line-height:1.06;max-width:22ch}
.hero2 p{margin:0;font-size:1rem;opacity:.93;max-width:56ch;line-height:1.6}
.hero2 .hgo{display:inline-flex;align-items:center;gap:6px;margin-top:15px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px);color:#fff;text-decoration:none;
  border-radius:99px;padding:9px 16px;font-size:.86rem;font-weight:700;transition:background .16s}
.hero2 .hgo:hover{background:rgba(255,255,255,.24)}
@media(max-width:700px){.hero2{min-height:370px;border-radius:16px}.hero2 h1{font-size:1.78rem;max-width:16ch}.hero2 .c{padding:20px}
  .rail{margin:0 -14px;padding:2px 14px 12px}
  .vig{flex-basis:186px}}

/* --- les temps forts --- */
.forts{margin:4px 0 4px}
.fh{margin-bottom:16px}
.fh b{display:block;font-size:1.42rem;letter-spacing:-.03em;line-height:1.15}
.fh p{margin:7px 0 0;font-size:.93rem;color:var(--ink2);line-height:1.6;max-width:62ch}
.fi{display:grid;grid-template-columns:230px 1fr;gap:0;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px;
  transition:transform .16s,box-shadow .16s,border-color .16s}
.fi:hover{transform:translateY(-2px);border-color:var(--chestnut);box-shadow:0 14px 30px -20px rgba(0,0,0,.4)}
.fim{position:relative;background:#ded6c8;min-height:158px}
.fim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fim.nope img{display:none}
.fim .fn{position:absolute;left:11px;top:11px;width:27px;height:27px;border-radius:50%;
  background:rgba(255,255,255,.95);color:var(--ink);font-size:.8rem;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.fc{padding:16px 18px}
.fc i{font-style:normal;font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;font-weight:800;color:var(--chestnut)}
.fc b{display:block;font-size:1.12rem;letter-spacing:-.025em;line-height:1.25;margin:4px 0 7px}
.fc p{margin:0;font-size:.91rem;color:var(--ink2);line-height:1.62}
.fgo{display:inline-block;margin-top:10px;font-size:.82rem;font-weight:750;color:var(--river)}
@media(max-width:700px){
  .fi{grid-template-columns:1fr}
  .fim{min-height:150px}
  .fc{padding:14px 15px}
  .fh b{font-size:1.26rem}
}

/* --- glossaire horizontal --- */
.gloss{margin:22px 0 6px}
.gloss .lab{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.gloss .lab b{font-size:.95rem;letter-spacing:-.01em}
.gloss .lab span{font-size:.78rem;color:var(--mute)}
.rail{display:flex;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;padding:2px 2px 12px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.vig{scroll-snap-align:start;flex:0 0 208px;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:15px;overflow:hidden;transition:transform .16s,box-shadow .16s}
.vig:hover{transform:translateY(-3px);box-shadow:0 12px 28px -16px rgba(0,0,0,.35)}
.vig .im{position:relative;height:112px;background:#ded6c8;overflow:hidden}
.vig .im img{width:100%;height:100%;object-fit:cover}
.vig .im .g{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 55%)}
.vig .im .d{position:absolute;left:9px;bottom:7px;color:#fff;font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.vig .im .n{position:absolute;right:8px;top:8px;width:23px;height:23px;border-radius:50%;background:rgba(255,255,255,.94);
  color:var(--ink);font-size:.7rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.vig .co{padding:11px 12px 12px}
.vig h5{margin:0 0 9px;font-size:.84rem;line-height:1.32;letter-spacing:-.01em;font-weight:700;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:flex;gap:5px}
.st{flex:1;text-align:center;background:#f6f3ee;border-radius:8px;padding:5px 2px;min-width:0}
.st b{display:block;font-size:.8rem;font-weight:800;letter-spacing:-.02em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st span{display:block;font-size:.56rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-top:1px}
.st.alt b{color:var(--moss)} .st.rd b{color:var(--stone)} .st.tp b{color:var(--mute)}
.st.tp.c1 b{color:var(--river)} .st.tp.c2 b{color:var(--amber)} .st.tp.c3 b{color:var(--red)}
.st.tp.c3{background:#fdeeea} .st.tp.c1{background:#eef5fa}
.vig.on{border-color:var(--chestnut);box-shadow:0 0 0 2px rgba(140,74,47,.18)}

/* --- fil des journees --- */
.sep{display:flex;align-items:center;gap:14px;margin:38px 0 18px}
.sep b{font-size:1.22rem;letter-spacing:-.02em;white-space:nowrap}
.sep span{font-size:.8rem;color:var(--mute);white-space:nowrap}
.sep i{flex:1;height:1px;background:var(--line)}
.day{scroll-margin-top:72px}
.dayfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 2px;
  font-size:.85rem;color:var(--stone)}
.dayfoot .p{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:5px 10px;font-weight:700}
.dayfoot .p b{color:var(--chestnut)}
@media(max-width:700px){.dayfoot{font-size:.8rem;gap:6px}}

/* --- panneau meteo de la semaine --- */
.mto{margin:0 0 20px;border:1px solid #f0d9cf;border-radius:15px;overflow:hidden;background:var(--card)}
.mth{padding:14px 16px;background:#fdf0ec;border-bottom:1px solid #f2d9d0}
.mth b{display:block;font-size:1rem;letter-spacing:-.015em;color:#7c3227}
.mth span{display:block;font-size:.83rem;color:#96594c;line-height:1.5;margin-top:3px}
.mtl{display:block}
.mtr{display:grid;grid-template-columns:54px 54px 54px 1fr auto;gap:10px;align-items:center;
  padding:10px 16px;border-bottom:1px solid #f2eee6;text-decoration:none;color:inherit}
.mtr:last-child{border-bottom:0}
.mtr:hover{background:#faf7f2}
.mtd{font-size:.8rem;font-weight:800;line-height:1.2}
.mtd i{display:block;font-style:normal;font-weight:600;font-size:.7rem;color:var(--mute)}
.mtt{font-size:.95rem;font-weight:800;font-variant-numeric:tabular-nums}
.mta{font-size:.82rem;font-weight:700;color:var(--moss)}
.mtn{font-size:.79rem;color:var(--mute);line-height:1.4;min-width:0}
.mtf{font-size:.63rem;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--mute);white-space:nowrap}
.mtr.warn .mtt{color:var(--amber)}
.mtr.bad{background:#fdf3f0}
.mtr.bad .mtt{color:var(--red)}
.mtr.bad .mta{color:var(--red)}
@media(max-width:700px){
  .mtr{grid-template-columns:46px 46px 46px 1fr;gap:8px;padding:10px 14px}
  .mtn{grid-column:1/-1;font-size:.77rem;margin-top:-4px}
  .mtf{grid-column:4;text-align:right}
}

/* --- echange de journees par forte chaleur --- */
.swap{margin:0;padding:15px 22px;background:#eef5fa;border-top:1px solid #d3e3ee;border-left:4px solid var(--river)}
.swap b{display:block;font-size:1rem;letter-spacing:-.015em;color:#1d4a68;margin-bottom:6px}
.swap p{margin:0 0 8px;font-size:.9rem;color:var(--ink2);line-height:1.6}
.swap p.okw{display:flex;gap:8px;font-size:.845rem;color:var(--stone);line-height:1.55}
.swap p.okw span{flex:0 0 auto;color:var(--moss);font-weight:800}
.swap p.adj{display:flex;gap:8px;font-size:.845rem;color:#7c3227;background:#fdf3f0;border-radius:8px;padding:9px 11px;line-height:1.55}
.swap p.adj span{flex:0 0 auto;font-weight:800}
.swap a{display:inline-block;font-size:.85rem;font-weight:750;color:var(--river);text-decoration:none}
.bloq{margin:0;padding:13px 22px;background:#faf7f2;border-top:1px solid var(--line);
  font-size:.87rem;color:var(--stone);line-height:1.55}
.bloq b{color:var(--ink2)}
@media(max-width:700px){.swap,.bloq{padding:13px 15px}}

/* --- bonus de la journee --- */
.bns{margin:16px 22px 4px;border:1px solid #e4dcc9;border-radius:15px;overflow:hidden;background:#fdfaf3}
.bnh{padding:14px 16px;background:#f8f1de;border-bottom:1px solid #ecdfc2;display:grid;
  grid-template-columns:22px 1fr;gap:4px 10px;align-items:center}
.bnh .ic{grid-row:1;width:19px;height:19px;fill:none;stroke:#a37c1f;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnh b{grid-column:2;font-size:.98rem;letter-spacing:-.015em;color:#6d5210}
.bnh span{grid-column:2;font-size:.82rem;color:#8a7440;line-height:1.5}
.bni{padding:14px 16px;border-bottom:1px solid #f1e9d8}
.bni:last-child{border-bottom:0}
.bni .bt{display:flex;gap:10px;align-items:flex-start}
.bni .bt .ic{flex:0 0 auto;width:19px;height:19px;margin-top:2px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.b-rando .bt .ic{stroke:var(--moss)} .b-eau .bt .ic{stroke:var(--river)}
.b-village .bt .ic{stroke:var(--chestnut)} .b-visit .bt .ic{stroke:var(--plum)}
.bni .bt i{display:block;font-style:normal;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--mute)}
.bni .bt b{display:block;font-size:.98rem;letter-spacing:-.015em;line-height:1.3;margin:1px 0 2px}
.bni .bt em{display:block;font-style:normal;font-size:.79rem;color:var(--stone);font-weight:600}
.bni p{margin:9px 0 0;font-size:.9rem;color:var(--ink2);line-height:1.6}
.bni .bw{margin-top:9px;background:#fdf3f0;border-left:3px solid var(--red);border-radius:8px;
  padding:9px 11px;font-size:.845rem;color:#7c3227;line-height:1.55}
.bni .links{margin:10px 0 0}
.bni .links a.l-do{background:#eef5fa;border-color:#cfe0ea;color:var(--river)}
.bni .links a.l-vis{background:#f3f7ef;border-color:#d6e2d1;color:var(--moss)}
.bni .links a.l-gpx{background:#f6f4ee;border-color:#ddd5c6;color:var(--stone)}
@media(max-width:700px){.bns{margin:14px 15px 4px}}

/* --- alerte chaleur --- */
.chaud{display:none;margin:0;padding:14px 22px;background:#fdf0ec;border-top:1px solid #f2d9d0;
  border-left:4px solid var(--red);font-size:.89rem;color:#7c3227;line-height:1.55}
.chaud.on{display:block}
.chaud b{color:var(--red)}
.chaud .t{display:inline-flex;align-items:center;gap:6px;font-weight:800;margin-bottom:5px}
@media(max-width:700px){.chaud{padding:13px 15px}}

/* --- transitions --- */
tr.leg td{background:#f6f2ec}
.tr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tr .ico{flex:0 0 auto;color:var(--stone)}
.tr .tx{flex:1;min-width:200px}
.tr .l0{font-size:.93rem;font-weight:600;color:var(--ink);line-height:1.45;margin-bottom:4px}
.tr .l0 em{font-style:normal;color:var(--chestnut);font-weight:800}
.tr .l0 strong{font-weight:800}
.tr .l1{font-size:.83rem;font-weight:600;color:var(--mute);line-height:1.4}
.tr .l1 strong{color:var(--ink2);font-weight:700}
.tr .al{color:var(--moss);font-weight:700}
.tr .ar{color:var(--mute);margin:0 3px}
.tr .tt{font-weight:800;font-variant-numeric:tabular-nums}
.tr .tt.c1{color:var(--river)} .tr .tt.c2{color:var(--amber)} .tr .tt.c3{color:var(--red)} .tr .tt.c0{color:var(--mute)}
.tr .l2{font-size:.8rem;color:var(--mute);margin-top:3px;font-weight:500}
.tr .go{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;background:var(--river);color:#fff;
  border-radius:9px;padding:8px 13px;font-size:.79rem;font-weight:700;text-decoration:none;white-space:nowrap}
@media(max-width:700px){.tr .go{width:100%;justify-content:center;margin-top:4px}}


/* --- affordance du carrousel --- */
.gloss{position:relative}
.gloss .lab .hint{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;color:var(--chestnut);font-weight:700}
.gloss .lab .hint svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;animation:sl 1.9s ease-in-out infinite}
@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
.railwrap{position:relative}
.fadeR,.fadeL{position:absolute;top:0;bottom:12px;width:42px;pointer-events:none;z-index:2;transition:opacity .2s}
.fadeR{right:-1px;background:linear-gradient(to left,var(--paper),transparent)}
.fadeL{left:-1px;background:linear-gradient(to right,var(--paper),transparent);opacity:0}
.arw{position:absolute;top:52px;z-index:3;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);
  box-shadow:0 3px 12px rgba(0,0,0,.16);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:15px;color:var(--ink);transition:opacity .2s}
.arw.l{left:-6px} .arw.r{right:-6px}
.arw:hover{border-color:var(--chestnut);color:var(--chestnut)}
.arw[hidden]{opacity:0;pointer-events:none}
@media(max-width:860px){.arw{display:none}}
.dots{display:flex;gap:5px;justify-content:center;margin-top:2px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line);transition:background .2s,width .2s}
.dots i.on{background:var(--chestnut);width:16px;border-radius:99px}

/* --- onglet Tables --- */
.tbl{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;margin-bottom:14px}
.tbl .hd{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid var(--line)}
.tbl .cat{flex:0 0 auto;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px}
.tbl .hh{flex:1;min-width:0}
.tbl .hh .q{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--chestnut)}
.tbl .hh h4{margin:2px 0 0;font-size:1.06rem;letter-spacing:-.015em;line-height:1.25}
.tbl .hh .lu{font-size:.82rem;color:var(--mute);margin-top:2px}
.tbl .nt{flex:0 0 auto;text-align:center;background:#fcf7ea;border:1px solid #e9d6ac;border-radius:10px;padding:5px 9px}
.tbl .nt b{display:block;font-size:1.02rem;font-weight:800;color:#8a6a1c;line-height:1}
.tbl .nt span{display:block;font-size:.56rem;letter-spacing:.06em;text-transform:uppercase;color:#a58c48;font-weight:700;margin-top:2px}
.tbl .bd{padding:14px 16px}
.tbl .bd p{margin:0 0 11px;font-size:.93rem;color:var(--ink2);line-height:1.6}
.tbl .inf{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px}
.tbl .inf span{font-size:.77rem;background:#f5f2ec;border:1px solid var(--line);border-radius:7px;padding:4px 9px;color:var(--stone);font-weight:600}
.tbl .inf span b{color:var(--ink)}
.tbl .al{background:#fdf3f0;border-left:3px solid var(--red);border-radius:8px;padding:10px 12px;font-size:.855rem;color:#7c3227;margin-bottom:11px;line-height:1.55}
.tbl .plus{background:#f6f4ee;border:1px dashed #ddd5c6;border-radius:10px;padding:11px 13px;font-size:.87rem;color:var(--ink2);line-height:1.55;margin-top:12px}
.tbl .plus b.t{display:block;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.tbl .pa{padding:9px 0;border-top:1px solid #e6dfd0}
.tbl .pa:first-of-type{border-top:0;padding-top:0}
.tbl .ph1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tbl .ph1 b{font-size:.94rem;letter-spacing:-.015em}
.tbl .pn{flex:0 0 auto;font-size:.72rem;font-weight:800;background:#fcf7ea;border:1px solid #e9d6ac;color:#8a6a1c;border-radius:6px;padding:2px 7px}
.tbl .pn.no{background:#f2efe9;border-color:var(--line);color:var(--mute)}
.tbl .ph2{font-size:.77rem;color:var(--mute);margin-top:2px}
.tbl .pa p{margin:5px 0 0;font-size:.86rem;line-height:1.55}
/* photos des tables */
.tph{position:relative;height:186px;background:#e5ded1;overflow:hidden}
.tph img{width:100%;height:100%;object-fit:cover;display:block}
.tph img[hidden]{display:none}
.tbl.nph .tph{display:none}
.tpa{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.92);border:0;color:var(--ink);font-size:1.1rem;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.tpa.l{left:9px} .tpa.r{right:9px}
.tpd{position:absolute;left:0;right:0;bottom:9px;display:flex;gap:5px;justify-content:center}
.tpd i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.55)}
.tpd i.on{background:#fff;width:15px;border-radius:99px}
.tbl .resa{background:#faf6ee;border-top:1px solid var(--line);color:var(--ink2);font-size:.83rem;
  font-weight:600;padding:11px 16px;display:flex;align-items:flex-start;gap:9px;line-height:1.5}
.tbl .resa .ckb{margin-top:1px}
.cat-guinguette{background:#f3f7ef;color:var(--moss)} .cat-gastro{background:#fbf1ec;color:var(--chestnut)}
.cat-bistrot{background:#f0f6fa;color:var(--river)} .cat-creperie{background:#fcf6e8;color:var(--amber)}
.cat-picnic{background:#f4f2fa;color:var(--plum)} .cat-marche{background:#fcf7ea;color:var(--amber)}
.cat-auberge{background:#f6f3ed;color:var(--stone)} .cat-maison{background:#f5f2ec;color:var(--stone)}
.ckl{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;margin:0 0 20px}
.ckh{padding:14px 16px;border-bottom:1px solid var(--line);background:#fcf7ea}
.ckh b{display:block;font-size:1rem;letter-spacing:-.01em}
.ckh span{display:block;font-size:.83rem;color:var(--stone);margin-top:3px;line-height:1.5}
.ckr{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid #f0ece4;flex-wrap:wrap}
.ckr:last-child{border-bottom:0}
.ckd{flex:0 0 62px;font-size:.78rem;font-weight:800;color:var(--ink2);line-height:1.25}
.ckd i{display:block;font-style:normal;font-weight:600;color:var(--mute);font-size:.72rem}
.ckn{flex:1 1 130px;min-width:0}
.ckn b{display:block;font-size:.9rem;line-height:1.3}
.ckn i{display:block;font-style:normal;font-size:.75rem;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ckb{flex:0 0 auto;font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  border-radius:99px;padding:4px 10px;white-space:nowrap}
.niv-indispensable .ckb{background:var(--red);color:#fff}
.niv-conseillee .ckb{background:#fcf0dc;color:#8a5a12;border:1px solid #ecd6ab}
.niv-presenter .ckb{background:#f0f5ef;color:var(--moss);border:1px solid #d6e2d1}
.niv-reserve .ckb{background:var(--moss);color:#fff}
.ckt{flex:0 0 auto;font-size:.82rem;font-weight:800;color:var(--river);text-decoration:none;
  border:1px solid #cfe0ea;border-radius:8px;padding:5px 10px;white-space:nowrap}
.ckt.off{color:var(--mute);border-color:var(--line);font-weight:600}
.filtres{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;scrollbar-width:none}
.filtres::-webkit-scrollbar{display:none}
.filtres button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;
  font-size:.82rem;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap}
.filtres button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* --- onglet Courses --- */
.crs{background:var(--card);border:1px solid var(--line);border-radius:15px;margin-bottom:13px;overflow:hidden}
.crs.prep{border-left:4px solid var(--plum)} .crs.achat{border-left:4px solid var(--amber)}
.crs .hd{padding:13px 16px;border-bottom:1px solid var(--line)}
.crs .hd .q{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.crs.achat .hd .q{color:var(--amber)} .crs.prep .hd .q{color:var(--plum)}
.crs .hd h4{margin:3px 0 0;font-size:1.04rem;letter-spacing:-.015em}
.crs .hd .lu{font-size:.82rem;color:var(--mute);margin-top:3px}
.crs .bd{padding:13px 16px}
.crs ul{margin:0 0 10px;padding-left:0;list-style:none}
.crs li{position:relative;padding-left:26px;margin:7px 0;font-size:.92rem;color:var(--ink2);line-height:1.5}
.crs li:before{content:"";position:absolute;left:0;top:3px;width:15px;height:15px;border:1.6px solid var(--line);border-radius:4px;background:#fff}
.crs .pq{font-size:.865rem;color:var(--mute);font-style:italic;border-top:1px solid #f1ece3;padding-top:9px;margin:0}

/* --- carte enrichie --- */
#carte{height:62vh;min-height:380px}
.leaflet-popup-content{margin:11px 13px;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.leaflet-popup-content b{font-size:14px}
.pop .ph{width:100%;height:88px;object-fit:cover;border-radius:7px;margin-bottom:7px;display:block}
.pop .m{color:#7e746a;font-size:12px}
.pop .lk{display:inline-block;margin-top:7px;background:#2c6b8a;color:#fff;padding:5px 10px;border-radius:6px;
  font-size:11.5px;font-weight:700;text-decoration:none}
.mkr.dot{width:13px;height:13px;background:var(--river);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mkr.bonus{background:var(--plum);width:24px;height:24px;font-size:.7rem}
.leg2{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 4px;font-size:.8rem;color:var(--mute)}
.leg2 i{display:inline-flex;align-items:center;gap:6px;font-style:normal}

/* --- carte --- */
#carte{height:66vh;min-height:400px;border-radius:15px;overflow:hidden;border:1px solid var(--line);background:#e8e4dc}
.mapbar{display:flex;gap:6px;margin:0 0 14px}
.mapbar button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 15px;
  font-size:.85rem;font-weight:700;color:var(--ink2);cursor:pointer}
.mapbar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mkr{background:var(--chestnut);color:#fff;border-radius:50%;width:27px;height:27px;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:.78rem;box-shadow:0 2px 8px rgba(0,0,0,.35);border:2px solid #fff}
.mkr.base{background:var(--moss);width:31px;height:31px}
.maplist{margin-top:16px}
.maplist a{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;
  margin-bottom:8px;text-decoration:none;color:inherit;background:var(--card)}
.maplist a:hover{border-color:var(--chestnut)}
.maplist .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--chestnut);color:#fff;font-weight:800;
  font-size:.75rem;display:flex;align-items:center;justify-content:center}
.maplist .t{flex:1;min-width:0}
.maplist .t b{display:block;font-size:.9rem}
.maplist .t span{font-size:.79rem;color:var(--mute)}
</style>

<script>window.__DATA={"version": 1, "jours": [{"id": "j1", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/159_Le_Vigan_L%27h%C3%B4tel_de_ville.JPG?width=1200", "alt": "Le Vigan", "cap": "Le Vigan · <a href=\"https://commons.wikimedia.org/wiki/File:159_Le_Vigan_L%27h%C3%B4tel_de_ville.JPG\">Wikimedia Commons</a>"}, "dt": "Dimanche 9 août · arrivée", "titre": "Poser les valises, traverser le vieux pont, et se tremper dans l'Arre", "pitch": "Première soirée : rien d'ambitieux. Le Vigan se traverse en une heure et demie, du vieux pont en dos d'âne au quartier des tanneurs, avec ce moment où la ruelle s'ouvre d'un coup sur une place à platanes. Puis l'Arre, quinze minutes plus loin, pour laver la route de vos jambes et de celles du chien.", "tags": [{"cls": "t-village", "txt": "Flânerie"}, {"cls": "t-eau", "txt": "Baignade"}, {"cls": "t-route", "txt": "Installation"}, {"cls": "t-tot", "txt": "15 min de volant"}], "etapes": [{"type": "home", "heure": "Avant", "icone": "i-basket", "titre": "Faites vos courses AVANT d'arriver", "blocs": [{"t": "meta", "html": "Le dimanche après-midi, Le Vigan est mort : commerces fermés, supermarchés ouverts le matin seulement pour certains"}, {"t": "shop", "html": "<b>À prendre en route</b> (dernier gros supermarché sur votre trajet, ou à Ganges) : pain, tomates, melon, jambon cru, huile d'olive, œufs, café, eau. Et deux indispensables pour la semaine : une <strong>gamelle pliable</strong> et deux bouteilles d'eau qui resteront dans le sac du chien."}]}, {"type": "home", "heure": "16h00", "icone": "i-home", "titre": "Installation", "pt": "p0", "blocs": [{"t": "meta", "html": "357 Route de Ganges, 30120 Le Vigan"}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=357+Route+de+Ganges%2C+30120+Le+Vigan", "txt": "Fiche et avis"}]}]}, {"type": "trajet", "heure": "17h20", "html": "Le gîte, route de Ganges → Centre du Vigan · 2 km · <strong>5min</strong> · ou 20 min à pied par la route de Ganges", "fin": "Installé", "vers": "Centre du Vigan", "nav": "https://www.google.com/maps/search/?api=1&query=Place+du+Quai+Le+Vigan", "alt": 231, "km": "2", "duree": "5min", "route": "ou 20 min à pied par la route de Ganges", "de_pt": "p0", "vers_pt": "p1", "de_lib": "Le gîte, route de Ganges", "vers_lib": "Centre du Vigan", "de_alt": 245, "vers_alt": 231}, {"type": "village", "heure": "17h30", "icone": "i-village", "titre": "Le Vigan à pied", "pt": "p1", "blocs": [{"t": "meta", "html": "1h30 · à pied depuis le gîte ou stationnement place du Quai · le seul bourg de la semaine avec une vraie densité de commerces"}, {"t": "p", "html": "Le <strong>vieux pont médiéval en dos d'âne</strong> sur l'Arre, dont le tablier de galets mène droit au <strong>quartier du Buscailhou</strong>, l'ancien faubourg des tanneurs et des fileurs : ruelles étroites, maisons hautes serrées. Le <strong>Musée cévenol</strong> occupe une ancienne filature, le <strong>château d'Assas</strong> (XVIII<sup>e</sup>, classé) ferme la promenade au nord."}, {"t": "p", "html": "Ce qui est ouvert et vaut le détour : <strong>Librairie Le Pouzadou</strong> (la vraie librairie indépendante du secteur), <strong>Monkawa</strong> (torréfacteur artisanal), <strong>Aura des Champs</strong> (boutique paysanne), <strong>Ô Gourmandises</strong> (salon de thé, thés en vrac), <strong>Tatatatin</strong> (tarterie, pain d'épeautre)."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Vieux+Pont+Le+Vigan+30120", "txt": "Vieux pont"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Librairie+Le+Pouzadou+Le+Vigan", "txt": "Le Pouzadou"}, {"cls": "l-web", "href": "https://www.levigan.fr/vivre-au-vigan/economie/annuaire-commercants-artisans-entreprises/", "txt": "Annuaire des commerçants"}]}]}, {"type": "trajet", "heure": "", "html": "Le Vigan → Avèze, Pont Vieux · 4 km · <strong>6 min</strong>", "fin": "Fin de la flânerie", "vers": "le Pont Vieux d'Avèze, pour la baignade du soir", "nav": "https://www.google.com/maps/dir/?api=1&amp;destination=43.975307%2C3.599236", "alt": 250, "km": "4", "duree": "6min", "route": "", "de_pt": "p1", "vers_pt": "p2", "de_lib": "Le Vigan", "vers_lib": "Avèze, Pont Vieux", "de_alt": 231, "vers_alt": 250}, {"type": "eau", "heure": "19h00", "icone": "i-swim", "titre": "Baignade — Aire du Pont Vieux, Avèze", "pt": "p2", "blocs": [{"t": "meta", "html": "L'Arre · gratuit · site officiellement suivi par l'ARS · non surveillé"}, {"t": "p", "html": "Le site de baignade contrôlé le plus proche du gîte. Berges à l'ombre, eau peu profonde, parfait pour une première trempette sans enjeu."}, {"t": "access", "warn": false, "html": "<b>Accès et stationnement</b> — Depuis Le Vigan, D999 puis direction Avèze ; le Pont Vieux est en contrebas du village, route goudronnée sans difficulté. <strong>Le stationnement n'est pas balisé</strong> : garez-vous le long de l'accès, et surtout <strong>pas sur les emplacements du camping « Le Pont Vieux »</strong> qui est mitoyen. La fiche officielle prévient que c'est « un endroit très prisé en période estivale ». Un dimanche à 19h, ce sera calme."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Aire+de+pique-nique+du+Pont+Vieux+Av%C3%A8ze", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=43.975307%2C3.599236", "txt": "Itinéraire · 43.975307, 3.599236"}]}]}, {"type": "trajet", "heure": "19h40", "html": "Avèze → Le Vigan · 4 km · <strong>6 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 15 min de conduite</strong>", "fin": "On se sèche", "vers": "le gîte du Vigan · 357 route de Ganges", "nav": "https://www.google.com/maps/dir/?api=1&destination=357+Route+de+Ganges%2C+30120+Le+Vigan", "alt": null, "km": "4", "duree": "6min", "route": "la D999, deux virages et vous y êtes", "de_pt": "p2", "vers_pt": null, "de_lib": "Avèze", "vers_lib": "Le Vigan", "de_alt": 250, "vers_alt": 245}, {"type": "eat", "heure": "20h00", "icone": "i-eat", "titre": "Premier dîner à l'appartement", "blocs": [{"t": "meta", "html": "245 m d'altitude · chez vous, 357 route de Ganges · vous êtes arrivés il y a quatre heures"}, {"t": "p", "html": "Vous avez posé les valises, traversé le vieux pont et trempé dans l'Arre. Le premier soir, on ne repart pas en voiture : on ouvre ce qu'on a acheté en route et on regarde la nuit tomber sur les Cévennes."}, {"t": "shop", "html": "<b>Au menu</b> — Melon et jambon cru, salade de tomates à l'huile d'olive, omelette aux oignons doux des Cévennes, pélardon et pain de campagne. Tout est dans la liste de courses de cet après-midi, faite avant d'arriver.<br><strong>Demain est une journée douce</strong> : départ à 10h, pas de rando. Préparez quand même les sandwichs ce soir, vous les mangerez au bord de l'Arre à midi et rien n'est ouvert le lundi matin au Vigan."}], "pt": null}], "notes": [{"cls": "note", "html": "<b>Ce soir, prenez le réflexe qui structure toute la semaine :</b> ouvrez <a href=\"https://www.risque-prevention-incendie.fr/gard/\">risque-prevention-incendie.fr/gard</a>. La carte du lendemain est publiée entre 17h et 18h. Regardez <strong>votre zone</strong>, pas la couleur globale du département. En rouge, les massifs sont totalement interdits et il faut basculer sur le plan B de la journée."}], "alt_max": 250, "alt_min": 231, "rando": null, "volant": "15 min", "chaud": {"texte": "Vous arrivez en fin de journée, le plus dur est passé. Décalez simplement la flânerie au Vigan à 18h30 et allongez la baignade au Pont Vieux d'Avèze : la guinguette sert jusqu'à 1h du matin, rien ne presse.", "lieu": "Baignade de l'Arre", "alt": 250}, "geo": {"lat": 43.975307, "lon": 3.599236, "lab": "Avèze", "alt": 250}, "base": {"lat": 43.9902, "lon": 3.6183, "lab": "Le Vigan"}, "bonus": [{"k": "eau", "titre": "L'Arre à Molières-Cavaillac", "meta": "7 min du Vigan · 220 m · gratuit", "txt": "Si le Pont Vieux d'Avèze est bondé un dimanche d'août, voilà le repli immédiat : des berges sous les peupliers, animaux acceptés. Ce n'est pas un site de baignade contrôlé, plutôt une aire de pique-nique au bord de l'eau, et l'accès est un cul-de-sac étroit.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=43.969666%2C3.584494"}]}, {"k": "village", "titre": "Le vieux Vigan et son pont du XII<sup>e</sup>", "meta": "à pied depuis le gîte · 20 min", "txt": "Si vous arrivez tôt et que la chaleur retombe, le pont vieux sur l'Arre et la place du Quai valent le détour à pied, sans reprendre la voiture. C'est aussi le meilleur moyen de repérer les commerces avant les courses de demain.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Pont+Vieux+Le+Vigan+30120"}]}], "flex": {"ok": false, "why": "Jour d'arrivée, vous récupérez les clés à 16h.", "frais": "Baignade dans l'Arre dès l'arrivée", "haut": 250, "pas": {}}, "_lab": "Dim 9", "_iso": "2026-08-09"}, {"id": "j2", "dt": "Lundi 10 août · <strong style=\"color:var(--red)\">journée douce</strong>", "titre": "Deux villages, une rivière à l'ombre, et rien d'autre", "pitch": "Le chien n'est pas en état, alors on ne monte nulle part. Aulas le matin, le village le plus fleuri de la vallée, tout à plat. Puis l'aire de pique-nique de Molières-Cavaillac, sur les berges de l'Arre sous les peupliers, huit minutes de route, avec le pique-nique préparé hier soir. Deux heures de sieste volets fermés pendant le pic de chaleur. Sumène en fin d'après-midi, quand les ruelles passent à l'ombre. Et la guinguette d'Avèze à 20h, réservée, à trente mètres de l'eau. Une heure quinze de voiture dans la journée, aucun dénivelé, et le cirque de Navacelles vous attend demain.", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Arphy_depuis_D48.jpg?width=1200", "alt": "Vallée d'Arphy", "cap": "La vallée d'Arphy depuis la D48 · <a href=\"https://commons.wikimedia.org/wiki/File:Arphy_depuis_D48.jpg\">Wikimedia Commons</a>"}, "tags": [{"cls": "t-village", "txt": "Aulas · Sumène"}, {"cls": "t-eau", "txt": "Baignade dans l'Arre"}, {"cls": "t-visite", "txt": "Zéro dénivelé"}, {"cls": "t-tot", "txt": "1h14 de volant · max 20 min d'affilée"}], "etapes": [{"type": "trajet", "heure": "10h00", "html": "Le Vigan → Aulas · la D170 le long de la Coudoulous · 4 km · <strong>6min</strong>", "fin": "On y va", "vers": "Aulas, le plus fleuri des villages du coin", "nav": "https://www.google.com/maps/dir/?api=1&destination=Aulas%2C+30120", "alt": 300, "km": "4", "duree": "6min", "route": "la D170 le long de la Coudoulous", "de_pt": null, "vers_pt": "p18", "de_lib": "Le Vigan", "vers_lib": "Aulas", "de_alt": 245, "vers_alt": 300}, {"type": "village", "heure": "10h10", "icone": "i-village", "titre": "Flânerie à Aulas", "pt": "p18", "blocs": [{"t": "meta", "html": "300 m d'altitude · 1h15 · ruelles à plat, fontaines, terrasse à l'ombre"}, {"t": "note", "html": "<b>Journée pensée pour le chien</b> — pas de dénivelé, pas de caillou, de l'ombre partout et une fontaine sur la place. Il marche s'il en a envie, il se pose sinon."}, {"t": "p", "html": "Ancienne <strong>cité drapière</strong> blottie au débouché du Coudoulous, « les pierres qui roulent ». On passe sous <strong>La Poterne</strong>, une porte fortifiée, puis on serpente dans les venelles et les passages voûtés jusqu'aux anciens moulins et aux lavoirs communaux, avec le château des barons d'Hierle qui domine. Très fleuri en été."}, {"t": "p", "html": "<em>Aucun commerce référencé à Aulas : c'est un village de promenade pure, ne comptez pas y trouver un café ouvert.</em>"}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Aulas+30120", "txt": "Fiche et avis"}]}]}, {"type": "trajet", "heure": "11h30", "html": "Aulas → Molières-Cavaillac · par Le Vigan puis la D999 · 9 km · <strong>14 min</strong>", "fin": "Fin de la flânerie", "vers": "l'aire de pique-nique de Molières-Cavaillac, au bord de l'Arre", "nav": "https://www.google.com/maps/dir/?api=1&destination=43.969666%2C3.584494", "alt": 230, "km": "9", "duree": "14min", "route": "par Le Vigan puis la D999", "de_pt": "p18", "vers_pt": "p10m", "de_lib": "Aulas", "vers_lib": "Molières-Cavaillac", "de_alt": 300, "vers_alt": 230}, {"type": "eau", "heure": "11h50", "icone": "i-swim", "pt": "p10m", "titre": "Pique-nique au bord de l'Arre, sous les peupliers", "blocs": [{"t": "meta", "html": "230 m d'altitude · 2h30 sur place · <strong>aire de pique-nique officielle, accès libre toute l'année</strong> · animaux acceptés · route de Laparot, Molières-Cavaillac"}, {"t": "p", "html": "Une aire de pique-nique aménagée le long des berges de l'Arre, <strong>sous les peupliers</strong>, à huit minutes du gîte. C'est le meilleur endroit du secteur pour un chien qui ne va pas bien : de l'ombre dense, de l'herbe, une rivière peu profonde à trois mètres, et personne. Les sandwichs sont prêts d'hier soir. Étalez une nappe et ne faites rien pendant deux heures et demie."}, {"t": "access", "html": "<b>Comment y aller précisément</b> — Depuis le rond-point de La Tourette sur la D999, prenez à gauche en direction de la <strong>Voie Verte</strong>, puis encore à gauche au niveau du <strong>parc de BMX</strong>. L'aire est au bout, route de Laparot. Coordonnées exactes : <strong>43.969666, 3.584494</strong>."}, {"t": "access", "warn": true, "html": "<b>Ce n'est pas un site de baignade</b> — la fiche officielle le décrit comme une aire de pique-nique au bord de l'eau, pas comme une baignade contrôlée, et la profondeur y est faible. Pour se rafraîchir c'est parfait, pour nager il faut aller au Pont Vieux d'Avèze, où vous passez de toute façon en fin de journée. Ni toilettes ni buvette sur place."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Itinéraire · 43.969666, 3.584494", "href": "https://www.google.com/maps/dir/?api=1&destination=43.969666%2C3.584494"}, {"cls": "l-web", "txt": "Fiche Gard Tourisme", "href": "https://www.tourismegard.com/fr/fiche/equipement/aire-de-pique-nique-de-molieres-cavaillac-molieres-cavaillac_TFO7244135/"}]}]}, {"type": "trajet", "heure": "14h30", "html": "Molières-Cavaillac → Le Vigan · la D999 · 5 km · <strong>8 min</strong>", "fin": "On plie la nappe", "vers": "le gîte, pour laisser le chien dormir au frais", "nav": "https://www.google.com/maps/dir/?api=1&destination=357+Route+de+Ganges%2C+30120+Le+Vigan", "alt": 245, "km": "5", "duree": "8min", "route": "la D999", "de_pt": "p10m", "vers_pt": "p0_j2", "de_lib": "Molières-Cavaillac", "vers_lib": "Le Vigan", "de_alt": 230, "vers_alt": 245}, {"type": "home", "heure": "14h45", "icone": "i-home", "pt": "p0_j2", "titre": "Deux heures de rien, volets fermés", "blocs": [{"t": "meta", "html": "245 m d'altitude · 2h15 · c'est le cœur de la journée, pas un remplissage"}, {"t": "p", "html": "Le meilleur soin qu'on puisse lui donner : du carrelage frais, de l'eau à volonté et le silence, pendant les heures les plus chaudes. Vous en profitez pour faire une sieste et pour regarder comment il va. <strong>S'il est vraiment mal en fin d'après-midi, annulez Sumène</strong> : la guinguette est à six minutes et vous pouvez y aller directement à 20h."}, {"t": "note", "html": "<b>Vétérinaire le plus proche</b> — Clinique vétérinaire du Vigan, à cinq minutes. Les coordonnées et les urgences de nuit sont dans l'onglet Pratique."}]}, {"type": "trajet", "heure": "17h00", "html": "Le Vigan → Sumène · la D999 puis la D11 · 14 km · <strong>20min</strong>", "fin": "Fin de la sieste", "vers": "Sumène, un village à plat et à l'ombre", "nav": "https://www.google.com/maps/dir/?api=1&destination=Sum%C3%A8ne%2C+30440", "alt": 200, "km": "14", "duree": "20min", "route": "la D999 puis la D11", "de_pt": "p0_j2", "vers_pt": "p10s", "de_lib": "Le Vigan", "vers_lib": "Sumène", "de_alt": 245, "vers_alt": 200}, {"type": "village", "heure": "17h25", "icone": "i-village", "titre": "Flânerie à Sumène", "pt": "p10s", "blocs": [{"t": "meta", "html": "200 m d'altitude · 1h15 · ruelles étroites, fontaines, tout est plat et à l'ombre en fin de journée"}, {"t": "p", "html": "Les maisons s'alignent au bord du <strong>Rieutord</strong> et le pont fait le point de vue. Le passé industriel est très lisible : anciennes <strong>magnaneries</strong> où l'on élevait les vers à soie, bergeries, moulins à eau, tours médiévales. C'est le terroir du pélardon et de l'oignon doux."}, {"t": "p", "html": "<b>La Corconne, à retenir pour un autre soir</b> — la guinguette sous la tonnelle, sur la D986 à Sumène : 5 à 20 € l'assiette, 50 couverts, pétanque, échecs, aire de jeux et la rivière juste à côté pour le chien, <a class=\"tel\" href=\"tel:+33467824682\">04 67 82 46 82</a>. <strong>Elle est fermée le lundi</strong>, donc pas ce soir, et de toute façon votre table est réservée à Avèze. Mais elle ouvre tous les autres soirs jusqu'au 30 août."}, {"t": "p", "html": "<em>Deux artisans sont référencés par l'office de tourisme, l'Atelier du Méjanet et Claire Degans, mais sans description de leur activité. Sumène n'a pas de marché hebdomadaire.</em>"}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Sum%C3%A8ne+30440", "txt": "Fiche et avis"}]}]}, {"type": "trajet", "heure": "18h45", "html": "Sumène → Avèze · la D11 puis la D999 · 17 km · <strong>20min</strong>", "fin": "Fin de la flânerie", "vers": "le Pont Vieux d'Avèze, avant la guinguette", "nav": "https://www.google.com/maps/dir/?api=1&destination=Pont+Vieux%2C+30120+Av%C3%A8ze", "alt": 250, "km": "17", "duree": "20min", "route": "la D11 puis la D999", "de_pt": "p10s", "vers_pt": "p10a2", "de_lib": "Sumène", "vers_lib": "Avèze", "de_alt": 200, "vers_alt": 250}, {"type": "eau", "heure": "19h05", "icone": "i-swim", "pt": "p10a2", "titre": "Trempette douce au Pont Vieux, à trente mètres de la table", "blocs": [{"t": "meta", "html": "250 m d'altitude · 45 min · l'aire de baignade est collée à la guinguette"}, {"t": "p", "html": "Vous connaissez déjà l'endroit, vous vous y êtes baignés hier soir. À 19h l'eau est à sa température la plus douce de la journée et les berges se vident. Laissez-le patauger vingt minutes, séchez-vous, et vous êtes à table."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Pont+Vieux%2C+30120+Av%C3%A8ze"}]}]}, {"type": "eat", "heure": "20h00", "icone": "i-eat", "titre": "Dîner — La Guinguette d'Avèze", "blocs": [{"t": "meta", "html": "Le Pont Vieux, Avèze · 240 m · <strong>4,6 sur 288 avis Google</strong> · plein air intégral · <strong>réservé à 20h</strong>"}, {"t": "p", "html": "Sixième saison pour cette guinguette posée au bord de l'Arre, au pied du vieux pont. Terrasse au fil de l'eau, produits locaux et de saison, service tard le soir. Vous arrivez de Sumène, vous venez de faire tremper le chien à trente mètres de la table, et vous n'avez pas monté un mètre de dénivelé de la journée. <strong>C'était exactement le programme.</strong>"}, {"t": "note", "html": "<b>C'est réservé</b> — table à 20h. Vous pouvez vous baigner au Pont Vieux avant de vous asseoir, l'aire de baignade est à trente mètres de la terrasse."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Fiche et avis", "href": "https://www.google.com/maps/search/?api=1&query=La+Guinguette+d%27Av%C3%A8ze+Pont+Vieux"}]}], "pt": "p10a2"}, {"type": "trajet", "heure": "22h30", "html": "Avèze → Le Vigan · deux virages et vous y êtes · 4 km · <strong>6min</strong> &nbsp;·&nbsp; <strong>Total du jour : 1h14 de conduite, plus longue traite 20 min</strong>", "fin": "Fin du repas", "vers": "le gîte du Vigan · 357 route de Ganges", "nav": "https://www.google.com/maps/dir/?api=1&destination=357+Route+de+Ganges%2C+30120+Le+Vigan", "alt": 245, "km": "4", "duree": "6min", "route": "deux virages et vous y êtes", "de_pt": "p10a2", "vers_pt": null, "de_lib": "Avèze", "vers_lib": "Le Vigan", "de_alt": 250, "vers_alt": 245}], "strip": [], "notes": [{"cls": "note plan", "html": "<b>Si le chien va franchement mieux en milieu d'après-midi</b> — le <strong>pont du Hasard à Sumène</strong> est à dix minutes du village : une vasque profonde sous un vieux pont en dos d'âne, à l'ombre l'après-midi, beaucoup plus discrète que les sites connus. Chaussures fermées, les rochers sont glissants."}, {"cls": "note warn", "html": "<b>Ce qui a bougé, et pourquoi</b> — Cette journée devait être celle du cirque de Navacelles, avec un lever à 6h15 et 9,3 km de marche sur un causse sans ombre. Le chien n'est pas en état, donc <strong>Navacelles passe à demain mardi</strong> : il aura eu quarante-huit heures. Aujourd'hui, départ à 10h, aucun dénivelé, de l'ombre et de l'eau. En échange, la randonnée des cascades d'Orgon sort du programme : elle est en bonus de la journée de demain, avec sa trace, si vous voulez la reprendre plus tard dans la semaine."}], "alt_max": 300, "alt_min": 200, "rando": null, "volant": "1h14", "chaud": {"texte": "<strong>Journée basse, mais c'est voulu et c'est organisé autour de l'eau et de l'ombre.</strong> Vous êtes au bord de l'Arre de 11h50 à 14h30, puis volets fermés jusqu'à 17h, puis dans des ruelles à l'ombre. Si le thermomètre s'emballe quand même, restez simplement plus longtemps à l'Arre et supprimez Sumène : la guinguette est à six minutes du gîte.", "lieu": "Berges de l'Arre, à l'ombre", "alt": 230}, "flex": {"ok": false, "why": "La Guinguette d'Avèze est réservée ce soir à 20h, et le chien a besoin d'une journée sans effort.", "frais": "Berges de l'Arre sous les peupliers, sieste volets fermés, ruelles à l'ombre", "haut": 300, "pas": {}}, "geo": {"lat": 43.969666, "lon": 3.584494, "lab": "Vallée de l'Arre", "alt": 230}, "base": {"lat": 43.9902, "lon": 3.6183, "lab": "Le Vigan"}, "bonus": [{"k": "eau", "titre": "Le pont du Hasard, Sumène", "meta": "10 min de Sumène · 200 m · à l'ombre l'après-midi", "txt": "Vasque profonde sur le Rieutord, sous un vieux pont en dos d'âne. Ni surveillé ni aménagé : chaussures fermées et prudence sur les rochers. À faire seulement si le chien a retrouvé la forme.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Pont+du+Hasard%2C+Sum%C3%A8ne+30440"}]}, {"k": "village", "titre": "Le vieux Vigan et son pont du XII<sup>e</sup>", "meta": "à pied depuis le gîte · 20 min aller", "txt": "Si vous préférez ne pas prendre la voiture du tout, le pont vieux sur l'Arre et la place du Quai se font à pied. C'est la version encore plus douce de la journée.", "liens": [{"cls": "l-map", "txt": "Pont Vieux du Vigan", "href": "https://www.google.com/maps/dir/?api=1&destination=Pont+Vieux+Le+Vigan+30120"}]}]}, {"id": "j3", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Vue_a%C3%A9rienne_du_Cirque_de_Navacelles.jpg?width=1200", "alt": "Cirque de Navacelles", "cap": "Le cirque de Navacelles, méandre abandonné de la Vis · <a href=\"https://commons.wikimedia.org/wiki/File:Vue_a%C3%A9rienne_du_Cirque_de_Navacelles.jpg\">Wikimedia Commons</a>"}, "dt": "Mardi 11 août · <strong style=\"color:var(--red)\">départ 7h00</strong>", "titre": "Le cirque de Navacelles au lever du jour, et la résurgence de la Vis", "pitch": "Le seul vrai réveil difficile du séjour, et le mieux payé. À 7h40 vous êtes seuls sur le rebord du causse, la lumière rasante plonge dans un méandre abandonné par une rivière il y a des milliers d'années, et les 250 000 visiteurs annuels dorment encore. À 8h30 vous descendez trois cents mètres en lacets pour atterrir au fond, dans un hameau de quarante habitants coincé dans un amphithéâtre calcaire. Puis vous marchez trois heures et demie au bord de la Vis jusqu'à l'endroit où elle rejaillit du rocher, et vous vous baignez sous la cascade avant de pique-niquer les pieds dans l'eau.", "tags": [{"cls": "t-rando", "txt": "Rando 9,3 km · +242 m"}, {"cls": "t-visite", "txt": "Grand Site de France"}, {"cls": "t-eau", "txt": "Baignade"}, {"cls": "t-tot", "txt": "2h de volant · max 40 min d'affilée"}, {"cls": "t-village", "txt": "Navacelles"}], "etapes": [{"type": "trajet", "heure": "7h00", "html": "Le Vigan → Belvédères de Blandas · D999 puis D713 · 28 km · <strong>40 min</strong>", "fin": "Départ", "vers": "Belvédères du causse de Blandas", "nav": "https://www.google.com/maps/dir/?api=1&amp;destination=43.895355%2C3.511247", "alt": 615, "km": "28", "duree": "40min", "route": "D999 puis D713", "de_pt": "b_j5_7", "vers_pt": "p13", "de_lib": "Le Vigan", "vers_lib": "Belvédères de Blandas", "de_alt": 245, "vers_alt": 615}, {"type": "visit", "heure": "7h40", "icone": "i-ticket", "titre": "Belvédères du causse de Blandas", "pt": "p13", "blocs": [{"t": "meta", "html": "Gratuit · chiens explicitement acceptés · 45 min sur place"}, {"t": "p", "html": "Trois belvédères aménagés — du Chêne, de l'Aven, de la Cascade — reliés par un cheminement facile à 615 m, avec une vue plongeante dans le méandre. C'est le seul endroit du séjour où l'on comprend d'un coup d'œil ce qu'est un causse : un plateau sec, à moutons, brutalement entaillé. Sur le plateau, cherchez aussi les menhirs et les cromlechs."}, {"t": "access", "warn": false, "html": "<b>Accès et stationnement</b> — <strong>Parking gratuit</strong> sur terrain plat, accessible voitures, bus et camping-cars. Cheminements dégagés, très bien avec un chien. La <strong>Maison de Site</strong> (expositions sur l'agropastoralisme, boutique, restaurant, office de tourisme, accessible PMR) n'ouvre qu'à <strong>10h</strong> : vous la ferez au retour. <strong>Drones interdits</strong> (Natura 2000)."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Belv%C3%A9d%C3%A8res+de+Blandas+cirque+de+Navacelles", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=43.895355%2C3.511247", "txt": "Itinéraire · 43.895355, 3.511247"}]}]}, {"type": "trajet", "heure": "", "html": "Blandas → hameau de Navacelles · 7 km de <strong>lacets serrés</strong> · <strong>15 min</strong>", "fin": "Fin de la visite", "vers": "les Moulins de la Foux", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Navacelles+34520+Saint-Maurice-Navacelles", "alt": 325, "km": "7", "duree": "15min", "route": "", "de_pt": "p13", "vers_pt": "p14", "de_lib": "Blandas", "vers_lib": "hameau de Navacelles", "de_alt": 615, "vers_alt": 325}, {"type": "rando", "heure": "8h45", "icone": "i-hike", "titre": "Rando : les Moulins de la Foux, le long de la Vis", "pt": "p14", "blocs": [{"t": "meta", "html": "9,3 km · +242 m · 3h30 · départ du parking du hameau · agréée FFRandonnée"}, {"t": "p", "html": "On longe la Vis en fond de gorge : ruines des Poujols, forêt de cèdres, chemin des Vignes. Le clou du parcours est la <strong>résurgence de la Foux</strong>, où la rivière rejaillit du calcaire après avoir disparu sous le causse. Départ à 8h45 : vous faites la montée avant que le soleil ne passe le rebord."}, {"t": "access", "warn": true, "html": "<b>Aucun point d'eau sur l'itinéraire.</b> Le circuit fait demi-tour aux Moulins de la Foux ; l'eau, les WC et l'aire de pique-nique de Vissec sont 1,3 km plus haut dans la gorge, <strong>hors parcours</strong>. Emportez tout, y compris les 2 L du chien."}, {"t": "access", "warn": false, "html": "<b>Stationnement du hameau</b> — <strong>Parking payant, 4 € la journée</strong>, capacité réduite, payant d'avril à octobre. <strong>À 8h30 il sera vide ; à 11h il sera plein.</strong> La solution officielle en journée est la <strong>navette gratuite depuis le parking des belvédères de Blandas</strong>, mais ses horaires 2026 ne sont pas publiés : si vous arrivez tard, appelez la Maison du Grand Site avant de descendre. La route de descente est <strong>déconseillée aux caravanes, camping-cars et bus</strong>."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Navacelles+34520+Saint-Maurice-Navacelles", "txt": "Fiche et avis"}, {"cls": "l-trk", "href": "https://www.visorando.com/randonnee-les-moulins-de-la-foux/", "txt": "Trace Visorando"}, {"cls": "l-trk", "href": "https://www.decathlon-outdoor.com/fr-fr/explore/france/randonnee-aux-moulins-de-la-foux-64735c36d41cc", "txt": "Decathlon Outdoor"}]}]}, {"type": "eau", "heure": "12h15", "icone": "i-swim", "titre": "Trempette à la cascade de Navacelles", "pt": "p15", "blocs": [{"t": "meta", "html": "Site de baignade recensé « Vis — Navacelles la cascade » · non surveillé · à deux pas du parking"}, {"t": "p", "html": "La Vis tombe en gradins juste en bordure du hameau. Ce n'est pas une plage, c'est une vasque : on s'y rafraîchit vingt minutes après trois heures et demie de marche, et le chien adore."}]}, {"type": "eat", "heure": "12h45", "icone": "i-eat", "titre": "Pique-nique au bord de la Vis, sous la cascade", "pt": "p16", "blocs": [{"t": "meta", "html": "300 m d'altitude · au pied de la cascade de Navacelles, à l'ombre du rocher"}, {"t": "p", "html": "Vous sortez de 3h30 de marche le long de la Vis et d'une trempette sous la cascade. Les sandwichs sont préparés d'hier soir. Vous mangez les pieds dans l'eau, dans le seul endroit ombragé du cirque à cette heure-là."}, {"t": "access", "warn": true, "html": "<b>Pourquoi pas de restaurant</b> — L'Auberge de Blandas, 4,7 sur 410 avis, est <strong>fermée le lundi</strong>. La Crêperie du Mas Guilhou, au fond du cirque, est ouverte tous les jours de 12h à 17h mais plafonne à 4,4, sous votre seuil : <a class=\"tel\" href=\"tel:+33467815069\">04 67 81 50 69</a> si vous préférez une table. Sinon le pique-nique est meilleur, et il est déjà dans le sac."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Cascade de Navacelles", "href": "https://www.google.com/maps/search/?api=1&query=Cascade+de+Navacelles"}]}]}, {"type": "trajet", "heure": "14h30", "html": "Navacelles → Blandas, Maison de Site · 7 km de lacets · <strong>15 min</strong>", "fin": "Fin du pique-nique", "vers": "la Maison de Site des Belvédères, à Blandas", "nav": "https://www.google.com/maps/dir/?api=1&destination=Auberge+de+Blandas%2C+30770+Blandas", "alt": 615, "km": "7", "duree": "15min", "route": "", "de_pt": "p16", "vers_pt": "p17", "de_lib": "Navacelles", "vers_lib": "Blandas, Maison de Site", "de_alt": 325, "vers_alt": 615}, {"type": "visit", "heure": "14h45", "icone": "i-ticket", "titre": "Maison de Site des Belvédères, Blandas", "pt": "p17", "blocs": [{"t": "meta", "html": "Tous les jours 10h-18h en juillet-août · expositions, boutique de produits locaux, restaurant, bureau d'information"}, {"t": "p", "html": "Le Haut-lieu de l'agropastoralisme : un film, des expositions, et l'explication de ce que vous venez de traverser. Une heure, climatisée, au bon moment de la journée."}]}, {"type": "trajet", "heure": "", "html": "Blandas → Le Vigan · 28 km · <strong>40 min</strong>", "fin": "Fin de la visite", "vers": "Sieste", "nav": "https://www.google.com/maps/search/?api=1&query=Sieste%20C%C3%A9vennes", "alt": null, "km": "28", "duree": "40min", "route": "", "de_pt": "p17", "vers_pt": null, "de_lib": "Blandas", "vers_lib": "Le Vigan", "de_alt": 615, "vers_alt": 245}, {"type": "home", "heure": "16h30", "icone": "i-home", "titre": "Sieste", "blocs": [{"t": "meta", "html": "Vous êtes debout depuis 6h15 et vous avez marché 9,3 km sur le causse. Deux heures de rien."}]}, {"type": "trajet", "heure": "19h15", "html": "Le Vigan, route de Ganges → centre du Vigan · ou dix minutes à pied · 2 km · <strong>5min</strong>", "fin": "Fin de la sieste", "vers": "Le Qu'es Aquo, au centre du Vigan", "nav": "https://www.google.com/maps/search/?api=1&query=Restaurant+le+qu%27Es+Aquo+Le+Vigan", "alt": 231, "km": "2", "duree": "5min", "route": "ou dix minutes à pied", "de_pt": "p0_j3", "vers_pt": "p1_j3", "de_lib": "Le Vigan, route de Ganges", "vers_lib": "centre du Vigan", "de_alt": 245, "vers_alt": 231}, {"type": "eat", "heure": "19h30", "icone": "i-eat", "titre": "Dîner — Le Qu'es Aquo, Le Vigan", "blocs": [{"t": "meta", "html": "27 boulevard du Plan d'Auvergne, Le Vigan · 245 m · <strong>ouvert tous les jours</strong> · véranda et terrasse · 4,5 sur 92 avis TripAdvisor"}, {"t": "p", "html": "Salle claire, grande véranda, terrasse sur le boulevard, cuisine traditionnelle et menus du jour à prix doux. C'est le seul du Vigan ouvert tous les jours. Vous êtes debout depuis 6h15, vous avez marché 9,3 km sur le causse et fait la sieste : ce soir, on ne cuisine pas."}, {"t": "access", "warn": true, "html": "<b>Changement</b> — Le Jardin Hors du Temps, à Valleraugue, était prévu à ce repas. Le lieu est charmant mais il n'a <strong>aucune note publiée</strong>, ni Google ni TripAdvisor : impossible de le faire passer votre seuil de 4,5."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Fiche et avis", "href": "https://www.google.com/maps/search/?api=1&query=Restaurant+le+qu%27Es+Aquo+Le+Vigan"}]}], "pt": null}, {"type": "trajet", "heure": "21h30", "html": "centre du Vigan → Le Vigan, route de Ganges · ou dix minutes à pied si la nuit est douce · 2 km · <strong>5min</strong> &nbsp;·&nbsp; <strong>Total du jour : 2h de conduite, plus longue traite 40 min</strong>", "fin": "Fin du repas", "vers": "le gîte du Vigan · 357 route de Ganges", "nav": "https://www.google.com/maps/dir/?api=1&destination=357+Route+de+Ganges%2C+30120+Le+Vigan", "alt": 245, "km": "2", "duree": "5min", "route": "ou dix minutes à pied si la nuit est douce", "de_pt": "p1_j3", "vers_pt": null, "de_lib": "centre du Vigan", "vers_lib": "Le Vigan, route de Ganges", "de_alt": 231, "vers_alt": 245}], "strip": [{"page": "https://commons.wikimedia.org/wiki/File:Causse_de_Blandas-Panorama-20110813.jpg", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Causse_de_Blandas-Panorama-20110813.jpg?width=800", "alt": "Causse de Blandas", "cap": "Le causse de Blandas"}, {"page": "https://commons.wikimedia.org/wiki/File:245_Gorges_de_la_Vis_vus_du_plateau_de_la_rive_sud_pr%C3%A8s_de_Saint-Maurice-Navacelles.JPG", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/245_Gorges_de_la_Vis_vus_du_plateau_de_la_rive_sud_pr%C3%A8s_de_Saint-Maurice-Navacelles.JPG?width=800", "alt": "Gorges de la Vis", "cap": "Les gorges de la Vis depuis le causse"}], "notes": [{"cls": "note plan", "html": "<b>Départ à 7h00, le seul réveil difficile du séjour</b> — et c'est pour la meilleure raison : les belvédères de Blandas au lever du jour, avec le cirque de Navacelles encore dans l'ombre et personne sur le parking. Cette journée était prévue lundi ; elle a été décalée d'un jour parce que le chien n'était pas en état. Vous ferez la sieste en rentrant, elle est au programme à 16h30."}, {"cls": "note warn", "html": "<b>Si le thermomètre annonce plus de 34 °C</b> : gardez les belvédères au lever du jour, mais remplacez la randonnée par un simple aller-retour d'une heure au fond du cirque. Sur un causse sans ombre, avec un chien, la fiche officielle dit noir sur blanc « éviter les périodes de forte chaleur », et ce n'est pas une formule de style.<br><strong>Pour déjeuner ce jour-là</strong>, l'Auberge de Blandas est à quinze minutes de remontée, <a class=\"tel\" href=\"tel:+33467815155\">04 67 81 51 55</a>, menu dès 20 €, chiens acceptés. <strong>Attention, mes sources divergent sur son jour de fermeture</strong> : la fiche de Gard Tourisme la donne ouverte tous les jours sauf le lundi en juillet-août, une source plus ancienne la donnait fermée lundi et mardi. Appelez avant de monter."}], "alt_max": 615, "alt_min": 300, "rando": ["9,3 km", "+242 m"], "volant": "2h", "chaud": {"texte": "<strong>Journée à risque : le causse est calcaire, sans un arbre.</strong> Au-delà de 34 °C, gardez les belvédères au lever du jour puis <strong>remontez à l'Aigoual ou à Camprieu</strong> pour l'après-midi. Ne restez pas sur le plateau entre 12h et 17h.", "lieu": "Mont Aigoual ou lac du Bonheur", "alt": 1565}, "geo": {"lat": 43.895355, "lon": 3.511247, "lab": "Causse de Blandas", "alt": 615}, "base": {"lat": 43.9902, "lon": 3.6183, "lab": "Le Vigan"}, "bonus": [{"k": "rando", "titre": "Les cascades d'Orgon, la journée sortie du programme", "meta": "9,9 km · +401 m · 4h · 1 045 m · 30 min du gîte", "txt": "<strong>C'était la journée de mardi avant que le chien ne tombe malade.</strong> Quatre heures en forêt de hêtres et de châtaigniers, des cascades tout du long, le monument André Chamson au sommet, et un couvert d'arbres du départ à l'arrivée. Si le chien récupère bien, c'est la première chose à reprendre : elle tient dans n'importe quelle journée de la semaine à la place d'une autre.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=44.059139%2C3.604682"}, {"cls": "l-vis", "txt": "Visorando", "href": "https://www.visorando.com/randonnee-les-cascades-d-orgon-2/"}]}, {"k": "village", "titre": "Valleraugue, au pied du Mont Aigoual", "meta": "30 min du gîte · 350 m", "txt": "Le village de schiste au départ des 4 000 marches, avec ses ponts sur l'Hérault et ses ruelles étroites. Il allait avec la journée d'Orgon : gardez-le pour un soir où vous n'avez pas envie de cuisiner.", "liens": [{"cls": "l-map", "txt": "Valleraugue", "href": "https://www.google.com/maps/dir/?api=1&destination=Valleraugue%2C+30570"}]}, {"k": "eau", "titre": "La montagne de la Fage, Cézas", "meta": "10 km · +425 m · 4h · 20 min du Vigan", "txt": "Panorama jusqu'à l'étang de Thau. Montée initiale raide, et un parking de six places : cette rando se mérite à l'heure du départ, pas à l'effort.", "liens": [{"cls": "l-vis", "txt": "Visorando", "href": "https://www.visorando.com/randonnee-la-montagne-de-la-fage/"}]}], "flex": {"ok": true, "why": "Aucune contrainte, mais l'Auberge de Blandas ferme le lundi et le causse impose un départ à 7h.", "frais": "Causse nu et calcaire : départ à 7h, cascade de Navacelles à midi", "haut": 615, "pas": {"lundi": "L'Auberge de Blandas est fermée le lundi."}}, "_lab": "Lun 10", "_iso": "2026-08-10"}, {"id": "j4", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Observatoire_du_mont_aigoual.JPG?width=1200", "alt": "Observatoire du Mont Aigoual", "cap": "L'observatoire du Mont Aigoual, 1565 m · <a href=\"https://commons.wikimedia.org/wiki/File:Observatoire_du_mont_aigoual.JPG\">Wikimedia Commons</a>"}, "dt": "Mercredi 12 août · anniversaire", "titre": "L'Aigoual, le sentier du mouflon, et l'anniversaire au lac des Pises", "pitch": "La Maison de l'Aigoual et le pique-nique au col de la Serreyrède à 1 299 m, puis le sommet à 1 565 m, la dernière station météo de montagne habitée de France. On redescend ensuite d'un seul tenant : le sentier du mouflon à 16h, quand les hardes redescendent, puis le col du Minier et cinq kilomètres de piste forestière jusqu'au lac des Pises. <strong>C'est là qu'on fête l'anniversaire</strong> : treize hectares d'eau à 1 250 m, des hêtres centenaires, dix degrés de moins qu'en bas, et l'un des ciels les plus noirs d'Europe quand la nuit tombe.", "tags": [{"cls": "t-visite", "txt": "Sommet 1565 m"}, {"cls": "t-rando", "txt": "Sentier du mouflon 2,4 km"}, {"cls": "t-eau", "txt": "Lac des Pises 1 250 m"}, {"cls": "t-village", "txt": "Anniversaire sous les étoiles"}, {"cls": "t-tot", "txt": "2h47 de volant · max 50 min d'affilée"}], "etapes": [{"type": "trajet", "heure": "9h30", "html": "Le Vigan → col de la Serreyrède · D999 puis D986 par Valleraugue · 34 km · <strong>50min</strong>", "fin": "On y va", "vers": "le col de la Serreyrède et la Maison de l'Aigoual", "nav": "https://www.google.com/maps/dir/?api=1&destination=Col+de+la+Serreyr%C3%A8de%2C+30570", "alt": 1299, "km": "34", "duree": "50min", "route": "D999 puis D986 par Valleraugue", "de_pt": null, "vers_pt": "p3", "de_lib": "Le Vigan", "vers_lib": "col de la Serreyrède", "de_alt": 245, "vers_alt": 1299}, {"type": "visit", "heure": "10h20", "icone": "i-ticket", "titre": "
