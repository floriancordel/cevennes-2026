ie des Cévennes</strong> (torréfacteur), la <strong>Savonnerie de la Buèges</strong>, la <strong>boulangerie Garonne</strong>, la <strong>boucherie Copleux</strong>, <strong>Genthon — La Maison des Délices</strong>, et l'émailleuse-bijoutière <strong>Emmeline Rigal</strong>."}, {"t": "shop", "html": "<b>Ce qu'on achète ici</b> — le pique-nique de ce soir, qui se mangera au bord de la cascade : pain de campagne, terrine ou charcuterie, pélardons, tomates, melon, fruits. Plus deux bières de la Blacstar de Ganges. Et le petit-déjeuner de demain, jour de marché au Vigan."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Les+Halles+de+Ganges+34190", "txt": "Les Halles · fiche et avis"}]}]}, {"type": "trajet", "heure": "12h05", "html": "Ganges → Saint-Étienne d'Issensac, Brissac · D4 par Cazilhac · 11 km · <strong>15 min</strong>", "fin": "On plie les courses", "vers": "le pont d'Issensac, pour le pique-nique du marché", "nav": "https://www.google.com/maps/dir/?api=1&amp;destination=43.8441%2C3.70103", "alt": 90, "km": "11", "duree": "15min", "route": "D4 par Cazilhac", "de_pt": "p20", "vers_pt": "p21", "de_lib": "Ganges", "vers_lib": "Saint-Étienne d'Issensac, Brissac", "de_alt": 175, "vers_alt": 90}, {"type": "eat", "heure": "12h30", "icone": "i-eat", "titre": "Pique-nique du marché, au pont d'Issensac", "blocs": [{"t": "meta", "html": "Sur les berges de l'Hérault, sous le pont roman du XI<sup>e</sup> · à l'ombre · vous venez de faire le marché"}, {"t": "p", "html": "Vous sortez du plus beau marché du sud des Cévennes avec du pain, de la charcuterie, des pélardons et des tomates. Vous les mangez une demi-heure plus tard au bord de l'eau, sous un pont médiéval, avant trois heures de baignade. C'est mieux que n'importe quelle table du secteur."}, {"t": "access", "warn": true, "html": "<b>Ce que j'ai retiré</b> — Une version précédente vous envoyait manger un burger avenue du Mont Aigoual, dans la zone commerciale de Ganges. C'était une erreur de casting.<br><em>Si vous voulez vraiment vous asseoir :</em> <strong>La Cantine Bio Ensemble</strong> à Laroque, 945 avenue de l'Europe, cantine associative 100 % bio et végétarienne, menu qui change tous les jours à 15 €, chiens acceptés, ouverte le vendredi midi. 04 99 53 11 02. C'est militant, sincère, et à dix minutes."}, {"t": "shop", "html": "<b>À acheter au marché, une heure plus tôt</b> — Pain de campagne, terrine ou charcuterie de pays, deux pélardons, tomates, melon, fruits, et deux bières de la Blacstar de Ganges. Prenez le double : le dîner de ce soir se mange aussi dehors, au bord de la cascade."}]}, {"type": "eau", "heure": "14h15", "icone": "i-swim", "titre": "Aire de baignade de Saint-Étienne d'Issensac", "pt": "p21", "blocs": [{"t": "meta", "html": "Sur l'Hérault · gratuit · surveillée l'été · zones ombragées · 3h sur place"}, {"t": "p", "html": "Un vieux pont de pierre médiéval, une chapelle romane du XI<sup>e</sup>, des berges sauvages et des eaux calmes : le profil le plus rassurant du séjour, et l'endroit rêvé pour un long après-midi. Des <strong>éco-gardes</strong> sont présents tout l'été pour informer et accueillir."}, {"t": "access", "warn": true, "html": "<b>Stationnement : le point à ne pas rater</b> — Une <strong>aire de stationnement dédiée existe près du site, suivez les panneaux</strong>. Le <strong>stationnement en bord de route sur la D4 est interdit et verbalisé</strong>, c'est explicitement signalé par l'office de tourisme. Site Natura 2000. La surveillance est annoncée « en été » sans dates ni horaires publiés : ne comptez pas dessus, considérez la baignade comme non surveillée.<br>Ne confondez pas avec <em>Hérault-Anglas</em>, l'autre site de baignade de la commune de Brissac."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Pont+de+Saint-%C3%89tienne+d%27Issensac+Brissac", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=43.8441%2C3.70103", "txt": "Itinéraire · 43.8441, 3.70103"}]}]}, {"type": "trajet", "heure": "", "html": "Issensac → Sumène · par Ganges · 28 km · <strong>35 min</strong>", "fin": "On se sèche", "vers": "Sumène", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Sum%C3%A8ne+30440", "alt": 200, "km": "28", "duree": "35min", "route": "par Ganges", "de_pt": "p21", "vers_pt": "p22", "de_lib": "Issensac", "vers_lib": "Sumène", "de_alt": 90, "vers_alt": 200}, {"type": "village", "heure": "17h30", "icone": "i-village", "titre": "Flânerie à Sumène", "pt": "p22", "blocs": [{"t": "meta", "html": "45 min à 1h"}, {"t": "p", "html": "Les maisons s'alignent au bord du <strong>Rieutord</strong> et le pont fait le point de vue. Le passé industriel est très lisible : anciennes <strong>magnaneries</strong> où l'on élevait les vers à soie, bergeries, moulins à eau, tours médiévales. C'est le terroir du pélardon et de l'oignon doux."}, {"t": "p", "html": "<strong>Et surtout, l'arrêt du jour :</strong> <em>La Corconne, la guinguette sous la tonnelle</em>, sur la D986 à Sumène. Ouverte tous les soirs sauf le lundi jusqu'au 30 août, 5 à 20 € l'assiette, 50 couverts. Pétanque, échecs, aire de jeux, et la rivière juste à côté pour le chien. 04 67 82 46 82."}, {"t": "p", "html": "<em>Deux artisans sont référencés par l'office de tourisme, l'Atelier du Méjanet et Claire Degans, mais sans description de leur activité. Sumène n'a pas de marché hebdomadaire.</em>"}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Sum%C3%A8ne+30440", "txt": "Fiche et avis"}]}]}, {"type": "trajet", "heure": "", "html": "Sumène → Cascade de la Vis, Saint-Laurent-le-Minier · 14 km · <strong>20 min</strong>", "fin": "Fin de la flânerie", "vers": "Cascade de la Vis", "nav": "https://www.google.com/maps/dir/?api=1&amp;destination=43.924925%2C3.662367", "alt": 190, "km": "14", "duree": "20min", "route": "", "de_pt": "p22", "vers_pt": "p23", "de_lib": "Sumène", "vers_lib": "Cascade de la Vis, Saint-Laurent-le-Minier", "de_alt": 200, "vers_alt": 190}, {"type": "eau", "heure": "18h45", "icone": "i-swim", "titre": "Cascade de la Vis, et pique-nique au coucher du soleil", "pt": "p23", "blocs": [{"t": "meta", "html": "Nom officiel : <em>cascade de la Meuse</em> · eau turquoise, vasques profondes, 16-20 °C · chien toléré en laisse"}, {"t": "p", "html": "<strong>C'est l'heure qui rend ce site fréquentable.</strong> Le lieu encaisse 42 000 personnes sur la saison, jusqu'à 700 le dimanche. À 14h un vendredi d'août c'est ingérable avec un chien ; à 18h45 les familles repartent, le parking se vide et la lumière devient dorée sur l'eau. Vous dînez du pique-nique de Ganges, les pieds dans la Vis."}, {"t": "access", "warn": true, "html": "<b>Tout ce qu'il faut savoir avant d'arriver</b><br>• <strong>Parking payant : 10 € la journée</strong>, 150 places, CB ou espèces, situé <strong>à 600 m du site</strong>. Le parking du glacier est réservé à ses clients.<br>• <strong>Le stationnement hors zone aménagée est strictement interdit et réellement verbalisé</strong> : 48 véhicules en infraction relevés sur 10 jours de comptage.<br>• <strong>Accès interdit de 22h à 6h</strong> — vous avez donc jusqu'à 22h.<br>• Baignade autorisée mais <strong>non surveillée</strong>. <strong>Interdiction d'approcher la cascade</strong>, en haut comme en bas. <strong>Sauts et plongeons interdits</strong>, depuis la cascade comme depuis le pont. Chutes de pierres près de l'aqueduc.<br>• Toilettes publiques sur le chemin d'accès, un glacier sur place.<br>• Saint-Laurent-le-Minier est un ancien site minier plombo-zincifère. L'eau est suivie par l'ARS, mais par précaution <strong>ne pique-niquez pas à même les sédiments et les terres</strong> : installez-vous sur les rochers ou une nappe.<br>• Ne confondez pas avec la « cascade de la Vis » de Navacelles, 25 km plus loin, que vous avez vue hier."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Cascade+de+la+Vis+Saint-Laurent-le-Minier", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=43.924925%2C3.662367", "txt": "Itinéraire · 43.924925, 3.662367"}, {"cls": "l-web", "href": "https://www.sudcevennes.com/vacances-cevennes/cascade-vis/", "txt": "Fiche office de tourisme"}]}]}, {"type": "trajet", "heure": "21h00", "html": "Saint-Laurent-le-Minier → Le Vigan · 20 km · <strong>25 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 2h de conduite</strong>", "fin": "On se sèche", "km": "20", "duree": "25min", "route": "&nbsp; Total du jour : 2h de conduite", "de_pt": "p23", "vers_pt": null, "de_lib": "Saint-Laurent-le-Minier", "vers_lib": "Le Vigan", "de_alt": 190, "vers_alt": 245, "vers": "le gîte du Vigan · 357 route de Ganges", "nav": "https://www.google.com/maps/dir/?api=1&destination=357+Route+de+Ganges%2C+30120+Le+Vigan"}], "notes": [{"cls": "note prep", "html": "<b>Ce soir, on fait les valises.</b> Vous changez de base demain à 11h30, et vous attaquez le marché du Vigan à 9h30. Bouclez les sacs ce soir. Videz le frigo dans une glacière : la route vers Saint-Jean-du-Gard prend 2h avec les arrêts, et vous ne trouverez pas de supermarché ouvert en arrivant. <strong>Prévoyez aussi une glacière pour les achats du marché de demain</strong> : fromages et charcuterie ne supporteront pas quatre heures de voiture en août."}, {"cls": "note", "html": "<b>Feux d'artifice du 15 août :</b> aucun programme officiel n'est publié pour Le Vigan, Ganges ou Anduze, et la Lozère a déjà pris un arrêté suspendant les tirs pour risque incendie. Demandez à l'office de tourisme du Vigan en début de semaine."}], "alt_max": 200, "alt_min": 90, "rando": null, "volant": "2h", "chaud": {"texte": "<strong>Journée la plus basse du séjour : Issensac est à 90 m.</strong> Au-delà de 34 °C, faites le marché de Ganges le matin puis filez au <strong>lac du Bonheur</strong> ou au plan d'eau du Mouretou plutôt que dans les gorges de l'Hérault. Gardez la cascade de la Vis pour 18h30, elle reste le bon plan.", "lieu": "Lac du Bonheur, Camprieu", "alt": 1090}, "geo": {"lat": 43.9787, "lon": 3.7169, "lab": "Sumène", "alt": 200}, "base": {"lat": 43.9902, "lon": 3.6183, "lab": "Le Vigan"}, "bonus": [{"k": "rando", "titre": "Le sentier de Valescure, Peyrolles", "meta": "11,3 km · +344 m · 4h · 25 min de Ganges", "txt": "Une petite vallée sauvage, des terrasses de pierre sèche, et les chiens en laisse explicitement mentionnés sur la fiche officielle. Départ au hameau de La Planque.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=44.106709%2C3.827795"}, {"cls": "l-gpx", "txt": "Trace GPX", "href": "https://www.tourismegard.com/fr/fiche/equipement/sentier-de-valescure-peyrolles_TFO6081707/"}]}, {"k": "eau", "titre": "Le pont du Hasard, Sumène", "meta": "10 min de Sumène · 200 m", "txt": "Vasque profonde sur le Rieutord, sous un vieux pont en dos d'âne. Beaucoup plus discret que Saint-Étienne d'Issensac, et à l'ombre l'après-midi. Ni surveillé ni aménagé : chaussures fermées et prudence sur les rochers.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Pont+du+Hasard%2C+Sum%C3%A8ne+30440"}]}]}, {"id": "j7", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Saint-Jean-du-Gard_-_Vue_de_Saint-Roman.jpg?width=1200", "alt": "Saint-Jean-du-Gard", "cap": "Saint-Jean-du-Gard vu de Saint-Roman · <a href=\"https://commons.wikimedia.org/wiki/File:Saint-Jean-du-Gard_-_Vue_de_Saint-Roman.jpg\">Wikimedia Commons</a>"}, "dt": "Samedi 15 août · changement de base", "titre": "Le plus beau marché du séjour, puis la vallée Borgne jusqu'à Saint-Jean", "pitch": "Quatre-vingts étals sur le Quai, sous les halles et jusqu'au parvis de la mairie : le marché du Vigan est classé parmi les plus vivants du Languedoc, et c'est là que vous faites les courses de toute la semaine suivante. Ensuite, la route la plus belle du séjour, celle qui remonte la vallée Borgne en pleine châtaigneraie, avec un pont du XI<sup>e</sup> siècle, des toits de lauze, et un pique-nique au bord d'une eau que la fiche officielle décrit comme « claire et fraîche, berges ombragées ».", "tags": [{"cls": "t-marche", "txt": "Marché du Vigan"}, {"cls": "t-village", "txt": "Saint-André-de-Valborgne"}, {"cls": "t-eau", "txt": "Deux baignades"}, {"cls": "t-route", "txt": "Transfert"}, {"cls": "t-tot", "txt": "2h de volant"}], "etapes": [{"type": "marche", "heure": "9h30", "icone": "i-basket", "titre": "Marché du Vigan", "pt": "p24", "blocs": [{"t": "meta", "html": "8h-12h30 · Place du Marché, le Quai, les halles, le parvis de la mairie · plus de 80 étals · à pied depuis le gîte"}, {"t": "p", "html": "Le marché « complet » de la vallée. Maraîchers, <strong>pélardons AOP</strong>, <strong>oignons doux des Cévennes AOP</strong>, châtaignes transformées, miels de châtaignier et de bruyère, <strong>Reinette du Vigan</strong>, et la <strong>brasserie d'Avèze</strong> qui y tient un stand."}, {"t": "shop", "html": "<b>La grosse course de la semaine 2</b> — pélardons (frais et affinés), oignons doux, charcuterie de pays, miel de châtaignier, farine de châtaigne, confiture, fruits et légumes pour trois jours, pain, bières d'Avèze. Plus <strong>de quoi pique-niquer ce midi</strong> : pain, terrine, tomates, melon, fromage. <strong>Glacière obligatoire.</strong>"}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Place+du+March%C3%A9+30120+Le+Vigan", "txt": "Fiche et avis"}]}]}, {"type": "home", "heure": "11h00", "icone": "i-home", "titre": "Check-out et chargement", "blocs": []}, {"type": "trajet", "heure": "11h30", "html": "Le Vigan → L'Estréchure · D999 jusqu'à Pont-d'Hérault, puis D907 dans la vallée Borgne · 33 km · <strong>45 min</strong> de route sinueuse", "fin": "On y va", "vers": "L'Estréchure", "nav": "https://www.google.com/maps/search/?api=1&amp;query=L%27Estr%C3%A9chure+30124", "alt": 250, "km": "33", "duree": "45min", "route": "D999 jusqu'à Pont-d'Hérault, puis D907 dans la vallée Borgne", "de_pt": "b_j7_11", "vers_pt": "p25", "de_lib": "Le Vigan", "vers_lib": "L'Estréchure", "de_alt": 245, "vers_alt": 250}, {"type": "village", "heure": "12h15", "icone": "i-village", "titre": "Arrêt à L'Estréchure", "pt": "p25", "blocs": [{"t": "meta", "html": "20 min · le village-rue typique de la vallée Borgne"}, {"t": "p", "html": "Les maisons s'alignent des deux côtés d'une seule voie, sans place ni détour. Une <strong>source de montagne</strong> alimente la fontaine publique, et <strong>deux anciennes filatures</strong> rappellent le passé séricicole. Vingt minutes suffisent : c'est une étape, pas une destination."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=L%27Estr%C3%A9chure+30124", "txt": "Fiche et avis"}]}]}, {"type": "trajet", "heure": "", "html": "L'Estréchure → Saint-André-de-Valborgne · D907 · 18 km · <strong>25 min</strong>", "fin": "Fin de la flânerie", "vers": "Saint-André-de-Valborgne", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Saint-Andr%C3%A9-de-Valborgne+30940", "alt": 450, "km": "18", "duree": "25min", "route": "D907", "de_pt": "p25", "vers_pt": "p26", "de_lib": "L'Estréchure", "vers_lib": "Saint-André-de-Valborgne", "de_alt": 250, "vers_alt": 450}, {"type": "village", "heure": "13h00", "icone": "i-village", "titre": "Saint-André-de-Valborgne", "pt": "p26", "blocs": [{"t": "meta", "html": "1h · l'un des plus authentiques du séjour, et pas un car de touristes"}, {"t": "p", "html": "Le <strong>Pont Vieux du XI<sup>e</sup> siècle</strong> franchit le Gardon ; le temple de 1826 et l'église romane du XII<sup>e</sup> se répondent d'une rive à l'autre. Toits de <strong>lauze</strong>, maisons bourgeoises, anciennes filatures. Les deux arrêts obligés sont la <strong>fontaine du Griffon</strong> et le <strong>quartier de la Calquière</strong>. Haut lieu camisard."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Saint-Andr%C3%A9-de-Valborgne+30940", "txt": "Fiche et avis"}]}]}, {"type": "trajet", "heure": "13h55", "html": "Saint-André-de-Valborgne → Rocher des Fées · 2 km · <strong>5min</strong> · D10 route du Pompidou, ou 15 min à pied depuis le village", "fin": "Fin de la flânerie", "vers": "Rocher des Fées", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.16251,3.671703", "alt": 470, "km": "2", "duree": "5min", "route": "D10 route du Pompidou, ou 15 min à pied depuis le village", "de_pt": null, "vers_pt": null, "de_lib": "Saint-André-de-Valborgne", "vers_lib": "Rocher des Fées", "de_alt": 450, "vers_alt": 470}, {"type": "eau", "heure": "14h00", "icone": "i-swim", "titre": "Pique-nique et baignade — Rocher des Fées / Les Chutes", "pt": "p27", "blocs": [{"t": "meta", "html": "D10, route du Pompidou, 30940 Saint-André-de-Valborgne · 2h sur place"}, {"t": "p", "html": "« Eau claire et fraîche, berges ombragées » selon la fiche officielle. <strong>C'est le spot le mieux documenté et le plus sûr de tout le séjour</strong>, et vous y déjeunez du marché du Vigan sur des tables de pique-nique, à l'ombre."}, {"t": "access", "warn": false, "html": "<b>Accès, stationnement, équipements — tout est confirmé</b> — Depuis le centre de Saint-André-de-Valborgne, prendre la <strong>D10 route du Pompidou</strong>. <strong>Parking gratuit</strong> sur place ; vous pouvez aussi vous garer au village et faire les <strong>15 minutes à pied</strong>. <strong>Toilettes publiques et tables de pique-nique confirmées</strong>, berges ombragées, chiens acceptés. Baignade <strong>non surveillée</strong>. Zone Natura 2000 : remportez vos déchets. Mairie : <a class=\"tel\" href=\"tel:+33466603008\">04 66 60 30 08</a>."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Baignade+Rocher+des+F%C3%A9es+Les+Chutes+Saint-Andr%C3%A9-de-Valborgne", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.16251%2C3.671703", "txt": "Itinéraire · 44.16251, 3.671703"}]}]}, {"type": "trajet", "heure": "", "html": "Saint-André-de-Valborgne → Gorges de Capoue · D907 · 10 km · <strong>15 min</strong>", "fin": "On se sèche", "vers": "Gorges de Capoue", "nav": "https://www.google.com/maps/dir/?api=1&amp;destination=44.135998%2C3.753274", "alt": 300, "km": "10", "duree": "15min", "route": "D907", "de_pt": "p27", "vers_pt": "p28", "de_lib": "Saint-André-de-Valborgne", "vers_lib": "Gorges de Capoue", "de_alt": 470, "vers_alt": 300}, {"type": "eau", "heure": "16h30", "icone": "i-swim", "titre": "Arrêt aux Gorges de Capoue", "pt": "p28", "blocs": [{"t": "meta", "html": "30 min · petites vasques naturelles creusées dans la roche · parking gratuit · animaux acceptés"}, {"t": "access", "warn": true, "html": "<b>Attention à la commune</b> — Beaucoup de guides situent les Gorges de Capoue à Saumane. C'est faux : l'adresse officielle est <strong>D907, 30940 Saint-André-de-Valborgne</strong>, entre les deux villages. Si vous tapez « Capoue Saumane » vous atterrirez dans le village de Saumane, où se trouve un <em>autre</em> site de baignade.<br>Baignade non surveillée, aucun équipement, zone Natura 2000."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Baignade+les+Gorges+de+Capoue+Saint-Andr%C3%A9-de-Valborgne", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.135998%2C3.753274", "txt": "Itinéraire · 44.135998, 3.753274"}]}]}, {"type": "trajet", "heure": "", "html": "Capoue → Saint-Jean-du-Gard, puis montée au col de Lamira · 22 km · <strong>35 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 2h de conduite</strong>", "fin": "On se sèche", "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115%2C3.895", "alt": 400, "km": "22", "duree": "35min", "route": "&nbsp; Total du jour : 2h de conduite", "de_pt": "p28", "vers_pt": "p29", "de_lib": "Capoue", "vers_lib": "Saint-Jean-du-Gard, puis montée au col de Lamira", "de_alt": 300, "vers_alt": 400}, {"type": "home", "heure": "17h45", "icone": "i-home", "titre": "Installation au col de Lamira", "pt": "p29", "blocs": [{"t": "meta", "html": "Mas de Cros Viel, au-dessus de Saint-Jean-du-Gard"}, {"t": "p", "html": "Route d'accès étroite et sinueuse : comptez systématiquement <strong>10 à 15 minutes</strong> pour redescendre en ville, et intégrez-les à tous les horaires de la semaine."}]}, {"type": "eat", "heure": "20h00", "icone": "i-eat", "titre": "Dîner à la maison", "blocs": [{"t": "shop", "html": "<b>Au menu</b> — Tartines de pélardon frais aux oignons doux crus et au miel de châtaignier, passées deux minutes sous le gril, avec une grande salade et le melon du marché. Tout vient du marché du Vigan de ce matin.<br><em>Si vous préférez sortir</em> : le <strong>marché nocturne « Les Dimanches Artisans »</strong> est demain soir, pas ce soir. Les tables de Saint-Jean-du-Gard sont prises un 15 août — restez à la maison, vous avez de quoi."}]}], "notes": [{"cls": "note plan", "html": "<b>Option soirée pour les courageux :</b> les <strong>Festa's de Florac</strong> (14, 15 et 16 août, parc Maury) sont la grande fête du 15 août dans votre rayon — orchestre, olympiades, taureaux-piscine, repas, manouls. Mais c'est <strong>1h10 de route à l'aller et autant au retour</strong>, un jour de déménagement. Gardez-la éventuellement pour dimanche."}, {"cls": "note prep", "html": "<b>Ce soir, on prépare demain.</b> Rien de lourd : départ 9h30, visite du Musée du Désert, déjeuner au restaurant. Mais la <strong>rando du soir part à 17h15</strong> : préparez un en-cas et remplissez les gourdes, vous ne repasserez pas par la maison entre la baignade et la marche."}], "alt_max": 470, "alt_min": 197, "rando": null, "volant": "2h", "chaud": {"texte": "Jour de transfert. Le Rocher des Fées est à 470 m avec des berges ombragées, ça passe. Si c'est écrasant, allongez la pause baignade et raccourcissez les villages.", "lieu": "Rocher des Fées", "alt": 470}, "geo": {"lat": 44.16251, "lon": 3.671703, "lab": "St-André-de-Valborgne", "alt": 470}, "base": {"lat": 43.9902, "lon": 3.6183, "lab": "Le Vigan"}, "bonus": [{"k": "eau", "titre": "Baignade « Le Village », Saumane", "meta": "20 min de la base · <strong>surveillée 13h30-18h30</strong> du 20 juillet au 24 août", "txt": "<strong>Le meilleur repli de toute la semaine 2, et le seul site surveillé du secteur.</strong> Parking gratuit, aire de pique-nique. À garder en tête tous les jours de canicule, pas seulement aujourd'hui. Mairie : 04 66 83 91 42.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=44.118462%2C3.763789"}]}, {"k": "rando", "titre": "Le sentier de l'Exil, Saumane", "meta": "12,9 km · +428 m · 4h30", "txt": "L'ancienne route royale vers la Lozère, avec les ornières de charrettes encore creusées dans la roche. Topo à 5 € à l'office de Saint-André-de-Valborgne. La plus chargée d'histoire des randos de réserve.", "liens": [{"cls": "l-gpx", "txt": "Trace GPX", "href": "https://www.tourismegard.com/fr/fiche/equipement/sentier-de-l-exil-saumane_TFO6082080/"}]}]}, {"id": "j8", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Mialet-Pont_des_Camisards-20120901.jpg?width=1200", "alt": "Pont des Camisards, Mialet", "cap": "Le pont des Camisards sur le Gardon de Mialet · <a href=\"https://commons.wikimedia.org/wiki/File:Mialet-Pont_des_Camisards-20120901.jpg\">Wikimedia Commons</a>"}, "dt": "Dimanche 16 août", "titre": "Les Camisards le matin, le Gardon l'après-midi, une rando au soleil couchant", "pitch": "Le Mas Soubeyran est le hameau natal de Roland, chef camisard, et son musée raconte cent ans de résistance protestante clandestine dans ces vallées. Vous en ressortirez avec la clé de tout ce que vous verrez ensuite : les temples octogonaux, les chemins de traverse, les crêtes. L'après-midi appartient au Gardon de Mialet, une eau classée « excellente » entre des plages de galets. Et à 17h15, quand la chaleur retombe, six kilomètres qui longent la rivière presque en permanence, avec le pont des Camisards de 1714 au milieu.", "tags": [{"cls": "t-visite", "txt": "Musée du Désert 7 €"}, {"cls": "t-eau", "txt": "Baignade"}, {"cls": "t-rando", "txt": "Rando du soir 6,4 km"}, {"cls": "t-marche", "txt": "Nocturne artisans"}, {"cls": "t-tot", "txt": "1h20 de volant"}], "etapes": [{"type": "trajet", "heure": "9h30", "html": "Col de Lamira → Mas Soubeyran, Mialet · 15 km · <strong>25 min</strong>", "fin": "Départ", "vers": "Musée du Désert", "nav": "https://www.google.com/maps/dir/?api=1&amp;destination=44.095654%2C3.957169", "alt": 180, "km": "15", "duree": "25min", "route": "", "de_pt": "b_j8_9", "vers_pt": "p31", "de_lib": "Col de Lamira", "vers_lib": "Mas Soubeyran, Mialet", "de_alt": 400, "vers_alt": 180}, {"type": "visit", "heure": "9h55", "icone": "i-ticket", "titre": "Musée du Désert, Mas Soubeyran", "pt": "p31", "blocs": [{"t": "meta", "html": "Tous les jours 9h30-18h30 jusqu'au 15 septembre · adulte 7 €, senior 6 € · visite guidée sans supplément · <a class=\"tel\" href=\"tel:+33466850272\">04 66 85 02 72</a>"}, {"t": "p", "html": "Une vingtaine de salles et 3 000 objets sur les Huguenots, les Camisards et la période du Désert (1685-1787), dans une maison cévenole authentique. C'est l'un des lieux de mémoire les plus forts de la région."}, {"t": "access", "warn": true, "html": "<b>Le créneau est contraint</b> — <strong>Aucune visite guidée ne part entre 11h et 14h30 en période estivale.</strong> D'où l'arrivée à 9h55 : vous attrapez le dernier départ du matin, et la visite dure 1h15. <strong>La politique chien n'est publiée nulle part : appelez avant de partir.</strong> Si c'est non, le hameau et ses ruelles se visitent librement et vous vous relayez."}, {"t": "access", "warn": false, "html": "<b>Stationnement</b> — C'est le point le plus fiable de tout le séjour : <strong>parking gratuit, dimensionné pour voitures, autocars et camping-cars</strong>, aires de pique-nique confirmées, salle climatisée. Aucune marche."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Mus%C3%A9e+du+D%C3%A9sert+Mas+Soubeyran+Mialet", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.095654%2C3.957169", "txt": "Itinéraire · 44.095654, 3.957169"}, {"cls": "l-web", "href": "https://www.museedudesert.com/", "txt": "museedudesert.com"}]}]}, {"type": "trajet", "heure": "11h10", "html": "Mas Soubeyran → Village de Mialet · 3 km · <strong>6min</strong> · route du Mas Soubeyran", "fin": "Fin de la visite", "vers": "Village de Mialet", "nav": "https://www.google.com/maps/search/?api=1&query=Pont+des+Camisards+Mialet", "alt": 150, "km": "3", "duree": "6min", "route": "route du Mas Soubeyran", "de_pt": null, "vers_pt": null, "de_lib": "Mas Soubeyran", "vers_lib": "Village de Mialet", "de_alt": 180, "vers_alt": 150}, {"type": "village", "heure": "11h15", "icone": "i-village", "titre": "Le hameau, puis le village de Mialet", "pt": "p32", "blocs": [{"t": "meta", "html": "1h"}, {"t": "p", "html": "Le <strong>pont des Camisards</strong>, classé Monument Historique, enjambe le Gardon d'un seul jet : c'est l'image du village. L'<strong>église Saint-André</strong> du XVII<sup>e</sup> et le <strong>temple</strong> reconstruit au XIX<sup>e</sup> avec son intérieur octogonal se font face — toute l'histoire protestante des Cévennes tient en deux cents mètres. Vallée classée Natura 2000, avec castors et loutres."}, {"t": "p", "html": "<em>Aucun commerce de village référencé à Mialet : ne prévoyez pas de courses ici.</em>"}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Pont+des+Camisards+Mialet+30140", "txt": "Fiche et avis"}]}]}, {"type": "trajet", "heure": "", "html": "Mialet → Le Pradinas · 3 km · <strong>6 min</strong>", "fin": "Fin de la flânerie", "vers": "Le Pradinas", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Le+Pradinas+Mialet", "alt": 180, "km": "3", "duree": "6min", "route": "", "de_pt": "p32", "vers_pt": "p33", "de_lib": "Mialet", "vers_lib": "Le Pradinas", "de_alt": 150, "vers_alt": 180}, {"type": "eat", "heure": "12h30", "icone": "i-eat", "titre": "Déjeuner — Le Pradinas, Mialet", "pt": "p33", "blocs": [{"t": "meta", "html": "Le Pradinas, 30140 Mialet · <strong>dimanche 12h-13h30</strong> (les autres jours, le soir uniquement) · terrasse sous les micocouliers, parking · <a class=\"tel\" href=\"tel:+33466850134\">04 66 85 01 34</a>"}, {"t": "note", "html": "TripAdvisor 4,2 / 5 · 85 avis · n° 2 sur 7 &nbsp;|&nbsp; note Google non trouvée"}, {"t": "p", "html": "Logis 3 étoiles, cuisine soignée, belles viandes, desserts remarqués. <strong>Le créneau du dimanche midi ne dure qu'une heure et demie : réservez impérativement</strong>, dès votre arrivée à Saint-Jean si possible."}, {"t": "p", "html": "<em>Alternative sans réservation : le <strong>Restaurant Les Plans</strong>, au bord du spot de baignade (<a class=\"tel\" href=\"tel:+33466850404\">04 66 85 04 04</a>, ouvert tous les jours 9h-minuit). Sa note TripAdvisor de 3,4 / 5 sur 139 avis est plombée par 2024-2025 ; une nouvelle équipe est en place depuis 2026 et les avis récents sont bons.</em>"}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Le+Pradinas+Mialet", "txt": "Le Pradinas"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Restaurant+Les+Plans+Mialet", "txt": "Les Plans"}]}]}, {"type": "trajet", "heure": "", "html": "Le Pradinas → baignade Les Plans · 3 km · <strong>6 min</strong>", "fin": "Fin du repas", "vers": "Les Plans", "nav": "https://www.google.com/maps/dir/?api=1&amp;destination=44.120764%2C3.918979", "alt": 160, "km": "3", "duree": "6min", "route": "", "de_pt": "p33", "vers_pt": "p34", "de_lib": "Le Pradinas", "vers_lib": "baignade Les Plans", "de_alt": 180, "vers_alt": 160}, {"type": "eau", "heure": "14h15", "icone": "i-swim", "titre": "Baignade — Les Plans, Gardon de Mialet", "pt": "p34", "blocs": [{"t": "meta", "html": "Eau classée « excellente » · non surveillé · 2h30 sur place"}, {"t": "access", "warn": false, "html": "<b>Accès et stationnement, précisément</b> — Sur la <strong>D50</strong>, traversez le village de Mialet et continuez <strong>environ 100 m après le restaurant Les Plans</strong> : un <strong>petit chemin sur la gauche descend vers la berge</strong>, et le stationnement se fait <strong>sur la gauche, juste avant ce chemin</strong>. Gratuit, quelques dizaines de mètres de descente.<br><strong>Le vrai conseil</strong> : le site s'étale sur plusieurs centaines de mètres, et <strong>les berges d'entrée sont bondées</strong>. Marchez cinq minutes vers l'amont ou l'aval et vous aurez un coin à vous. Le restaurant Les Plans est sur place ; pas de toilettes publiques documentées."}, {"t": "access", "warn": true, "html": "<b>Si c'est plein</b> — Repli à 3 km : le <strong>Pont des Abarines</strong> (44.125952, 3.90343), une arche de 30 m de 1900, avec des vasques et des plages de sable. Mais <strong>une douzaine de places de stationnement seulement</strong> de part et d'autre du pont, un sentier de moins de 10 min décrit comme « un peu raide et chaotique », et une proximité de propriété privée : restez sur le chemin. Un dimanche d'août à 14h, ce sera plein aussi. Dernier repli : la plage de <strong>Falguière</strong>, à 10 min de votre base."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Baignade+Les+Plans+Mialet", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.120764%2C3.918979", "txt": "Itinéraire · 44.120764, 3.918979"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Le+Pont+des+Abarines+Mialet", "txt": "Abarines · fiche et avis"}]}]}, {"type": "trajet", "heure": "", "html": "Les Plans → cimetière de Mialet · 3 km · <strong>6 min</strong>", "fin": "On se sèche", "vers": "du soir : Les berges du Gardon", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Cimeti%C3%A8re+de+Mialet+30140", "alt": 150, "km": "3", "duree": "6min", "route": "", "de_pt": "p34", "vers_pt": "p35", "de_lib": "Les Plans", "vers_lib": "cimetière de Mialet", "de_alt": 160, "vers_alt": 150}, {"type": "rando", "heure": "17h15", "icone": "i-hike", "titre": "Rando du soir : Les berges du Gardon", "pt": "p35", "blocs": [{"t": "meta", "html": "6,4 km · +151 m · 2h · facile · balisage jaune · départ du parking près du cimetière de Mialet"}, {"t": "p", "html": "La sortie parfaite en fin de journée : elle <strong>longe le Gardon presque en permanence</strong>, donc accès à l'eau constant pour le chien, avec la lumière rasante sur les galets. Elle repasse par le pont des Camisards, où « il y a des coins de baignade agréables de part et d'autre ». Traces de castors et de loutres."}, {"t": "access", "warn": false, "html": "<b>Stationnement</b> — Le parking près du cimetière de Mialet est confirmé mot pour mot par la fiche du Parc national. Départ immédiat, balisage jaune plus poteaux directionnels. Gratuit selon toute vraisemblance, capacité non documentée."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Cimeti%C3%A8re+de+Mialet+30140", "txt": "Fiche et avis"}, {"cls": "l-trk", "href": "https://geotrek-admin.cevennes-parcnational.net/api/fr/treks/98912/les-berges-du-gardon.gpx", "txt": "Télécharger le GPX"}, {"cls": "l-web", "href": "https://destination.cevennes-parcnational.fr/trek/98912-Les-berges-du-Gardon", "txt": "Fiche officielle"}]}]}, {"type": "trajet", "heure": "", "html": "Mialet → avenue Boudon, Saint-Jean-du-Gard · 14 km · <strong>25 min</strong>", "fin": "Fin de la rando", "vers": "aux « Dimanches Artisans »", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Avenue+Ren%C3%A9+Boudon+Saint-Jean-du-Gard", "alt": null, "km": "14", "duree": "25min", "route": "", "de_pt": "p35", "vers_pt": null, "de_lib": "Mialet", "vers_lib": "avenue Boudon, Saint-Jean-du-Gard", "de_alt": 150, "vers_alt": 197}, {"type": "marche", "heure": "19h45", "icone": "i-basket", "titre": "Dîner aux « Dimanches Artisans »", "blocs": [{"t": "meta", "html": "Avenue Boudon, Saint-Jean-du-Gard · 19h-23h30 · une vingtaine de stands d'artisans et créateurs, producteurs, arts de rue"}, {"t": "p", "html": "Vous dînez sur place. C'est aussi le bon moment pour repérer les artisans que vous irez voir mardi en Grand Rue."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Avenue+Ren%C3%A9+Boudon+Saint-Jean-du-Gard", "txt": "Avenue Boudon"}]}]}, {"type": "trajet", "heure": "21h30", "html": "Saint-Jean-du-Gard → col de Lamira · 6 km · <strong>12 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 1h20 de conduite</strong>", "fin": "On plie les courses", "km": "6", "duree": "12min", "route": "&nbsp; Total du jour : 1h20 de conduite", "de_pt": "b_j8_21", "vers_pt": null, "de_lib": "Saint-Jean-du-Gard", "vers_lib": "col de Lamira", "de_alt": 197, "vers_alt": 400, "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115%2C3.895"}], "strip": [{"page": "https://commons.wikimedia.org/wiki/File:Le_gardon_de_Mialet.jpg", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Le_gardon_de_Mialet.jpg?width=800", "alt": "Gardon de Mialet", "cap": "Le Gardon de Mialet et ses vasques"}, {"page": "https://commons.wikimedia.org/wiki/File:Les_100_000_soldats_-_Grotte_de_Trabuc_-_Gard_-_France.jpg", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Les_100_000_soldats_-_Grotte_de_Trabuc_-_Gard_-_France.jpg?width=800", "alt": "Grotte de Trabuc", "cap": "Les 100 000 soldats, grotte de Trabuc"}], "notes": [{"cls": "note", "html": "<b>La grotte de Trabuc</b>, à 5 min du Mas Soubeyran, a des concrétions spectaculaires appelées « les 100 000 soldats ». Mais <strong>seuls les animaux portés dans les bras sont admis</strong> ; les grands chiens attendent dehors, attachés, avec une gamelle fournie sur demande — sauf que <strong>le parking n'est ombragé que jusqu'à 13h</strong>. Si vous y tenez, ce sera à l'ouverture (9h45) et en visite alternée. Sinon, sautez."}, {"cls": "note prep", "html": "<b>Ce soir, on prépare demain.</b> Grosse journée sur la Corniche : 3h30 de marche sur une crête, sans aucun point d'eau, et un déjeuner à 14h15. Préparez <strong>un en-cas costaud</strong> (fruits secs, barres, un sandwich à partager), <strong>3 L d'eau plus 2 L pour le chien</strong>, et les <strong>chaussures montantes</strong> : la fiche officielle parle de passages vertigineux sur crête schisteuse. Et préparez <strong>un vrai pique-nique</strong> : vous mangerez sur la crête, il n'y a rien au col et rien de fiable en redescendant."}], "alt_max": 180, "alt_min": 150, "rando": ["6,4 km", "+151 m"], "volant": "1h20", "chaud": {"texte": "<strong>Mialet est à 150 m.</strong> Au-delà de 34 °C, inversez : baignade au Gardon toute l'après-midi, musée à l'ouverture, et repoussez la rando du soir à 18h30. Ou basculez sur la <strong>Corniche des Cévennes</strong>, 800 m, qui est à 45 min.", "lieu": "Corniche des Cévennes", "alt": 800}, "geo": {"lat": 44.095654, "lon": 3.957169, "lab": "Mas Soubeyran", "alt": 180}, "base": {"lat": 44.115, "lon": 3.895, "lab": "Col de Lamira"}, "bonus": [{"k": "visit", "titre": "La grotte de Trabuc", "meta": "14 °C constants · 1h de visite · 10 min de Mialet", "txt": "Les « 100 000 soldats », une armée de concrétions minuscules dont personne n'explique vraiment la formation, et le lac de Minuit. <strong>C'est le refuge frais du secteur.</strong> Grand parking gratuit devant l'accueil.", "warn": "Pour le chien : seuls les petits animaux portés en sac sont admis. Un chien de taille moyenne attend dehors, en laisse, avec de l'eau fournie sur demande. À ne faire que si l'un de vous reste avec lui.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Grotte+de+Trabuc%2C+30140+Mialet"}, {"cls": "l-web", "txt": "Site officiel", "href": "https://grotte-de-trabuc.com/"}]}, {"k": "rando", "titre": "Le sentier de Roquefeuille, Mialet", "meta": "13 km · +632 m · 5h · la plus exigeante", "txt": "Anciens chemins camisards, audioguide disponible, et un vrai dénivelé. <strong>Uniquement un jour frais et en partant tôt</strong>, ce n'est pas une rando d'après-midi d'août avec un chien.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=44.111382%2C3.942653"}, {"cls": "l-gpx", "txt": "Trace GPX", "href": "https://www.tourismegard.com/fr/fiche/equipement/randonnee-sentier-de-roquefeuille-mialet_TFO7012331/"}]}]}, {"id": "j9", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/271_Corniche_des_C%C3%A9vennes_Panorama_entre_Saint-Jean-du-Gard_et_Florac.JPG?width=1200", "alt": "Corniche des Cévennes", "cap": "La Corniche des Cévennes entre Saint-Jean-du-Gard et Florac · <a href=\"https://commons.wikimedia.org/wiki/File:271_Corniche_des_C%C3%A9vennes_Panorama_entre_Saint-Jean-du-Gard_et_Florac.JPG\">Wikimedia Commons</a>"}, "dt": "Lundi 17 août", "titre": "La Corniche au matin, Castelviel, et la Vallée Française", "pitch": "La plus belle route des Cévennes part de votre porte. Elle suit la ligne de crête entre deux vallées, sur une frontière géologique où les murs deviennent calcaires et les toits restent en lauze de schiste. Vous la prenez au matin, arrêt au Pompidou quand l'air est encore frais. Au milieu, une boucle de trois heures et demie sur une arête d'où l'on voit d'un seul regard la vallée de Trabassac, la Corniche et le Mont Aigoual. Puis le Gardon cristallin de la Vallée Française pour se remettre, un village qui raconte ses commerces d'autrefois sur un sentier balisé, et un retour par le bas de la vallée, avec une heure à flâner dans Saint-Jean-du-Gard avant la table.", "tags": [{"cls": "t-rando", "txt": "Rando 8,4 km · +390 m"}, {"cls": "t-route", "txt": "Route de crête"}, {"cls": "t-eau", "txt": "Gardon de Sainte-Croix"}, {"cls": "t-village", "txt": "Le Pompidou · Sainte-Croix · Saint-Jean"}, {"cls": "t-tot", "txt": "2h30 de volant · max 52 min d'affilée"}], "etapes": [{"type": "trajet", "heure": "9h30", "html": "Col de Lamira → Le Pompidou · Saint-Jean-du-Gard, col Saint-Pierre, puis la Corniche des Cévennes · 34 km · <strong>52 min</strong>, et la route est déjà le spectacle", "fin": "Départ", "vers": "Le Pompidou, par la Corniche des Cévennes", "nav": "https://www.google.com/maps/dir/?api=1&destination=Le+Pompidou%2C+48110", "alt": 800, "km": "34", "duree": "52min", "route": "Saint-Jean-du-Gard, col Saint-Pierre, puis la Corniche des Cévennes", "de_pt": "b_j9_9", "vers_pt": "p39", "de_lib": "Col de Lamira", "vers_lib": "Le Pompidou", "de_alt": 400, "vers_alt": 800}, {"type": "village", "heure": "10h25", "icone": "i-village", "titre": "Le Pompidou, au point haut de la Corniche", "pt": "p39", "blocs": [{"t": "meta", "html": "800 m d'altitude · 30 min"}, {"t": "p", "html": "Posé sur un col, exactement à la <strong>frontière géologique</strong> entre les vallées schisteuses et le plateau calcaire — et ça se lit dans le bâti : <strong>murs de calcaire, toits de lauze de schiste</strong>. À 1 km, l'église romane Saint-Flour, classée, réputée pour son acoustique. Le <strong>Champ de l'Aultre</strong> offre l'un des plus remarquables panoramas de toute la Corniche."}, {"t": "p", "html": "Épicerie et dépôt de pain <strong>Au Comptoir de la Corniche</strong>, restaurant Le Cuisinier, point d'information du Parc national."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Le+Pompidou+48110", "txt": "Fiche et avis"}]}]}, {"type": "trajet", "heure": "10h50", "html": "Le Pompidou → col de Castelviel · D983 en descente, Sainte-Croix, puis la petite D28 · 16 km · <strong>28 min</strong>", "fin": "Fin de la pause au Pompidou", "vers": "le col de Castelviel, départ de la rando", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Saint-Martin-de-Lansuscle+48110", "alt": 800, "km": "16", "duree": "28min", "route": "D983 en descente, Sainte-Croix, puis la petite D28", "de_pt": "p39", "vers_pt": "p36", "de_lib": "Le Pompidou", "vers_lib": "col de Castelviel", "de_alt": 800, "vers_alt": 800}, {"type": "rando", "heure": "11h20", "icone": "i-hike", "titre": "Rando : Castelviel", "pt": "p36", "blocs": [{"t": "meta", "html": "8,4 km · +387 m · 3h30 · boucle · balisage jaune · difficulté moyenne · 800 m d'altitude"}, {"t": "p", "html": "Une ligne de crête avec des panoramas sur la vallée de Trabassac, la Corniche et le Mont Aigoual. Versant nord en forêt de feuillus et de conifères, versant sud-ouest en chênes verts plus exposé : <strong>faites la boucle dans le sens qui vous met le versant nord au retour</strong>, quand il fera chaud. Vestiges d'un poste de guet du réseau Anduze-Florac."}, {"t": "p", "html": "<strong>Pique-nique en route</strong>, préparé hier soir : il n'y a rien au col, et la seule table de la vallée n'ouvre pas à l'heure où vous redescendrez."}, {"t": "access", "warn": true, "html": "<b>Trois avertissements réels</b><br>• <strong>Passages vertigineux sur crête schisteuse</strong> et sections raides : chaussures montantes obligatoires, déconseillé si l'un de vous a le vertige. Le chien passera, mais tenez-le court.<br>• <strong>Aucun équipement au col</strong> : ni toilettes, ni eau, ni commerce. Emportez 3 L plus 2 L pour le chien.<br>• <strong>Le départ n'a pas de point Google Maps fiable.</strong> C'est un col sans nom sur la D28, à environ 5 km de Sainte-Croix-Vallée-Française en direction de Saint-Martin-de-Lansuscle, avec un <strong>parking sur la droite au col</strong>, quelques places. <strong>Téléchargez le GPX</strong>, ne comptez pas sur une adresse. Attention aussi à l'homonymie : « Castelviel » est aussi un site de baignade sur la commune de Rousses, dans une autre vallée."}, {"t": "p", "html": "<em>Alternative sans vertige, à 25 min de la base : le <strong>Sentier de Valescure</strong> à Peyrolles, 11,3 km, +344 m, 4h, « petite vallée sauvage où l'on apprécie le calme », terrasses de pierre, chiens en laisse mentionnés sur la fiche. Parking à La Planque, 44.106709, 3.827795.</em>"}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Saint-Martin-de-Lansuscle+48110", "txt": "Secteur du départ"}, {"cls": "l-trk", "href": "https://geotrek-admin.cevennes-parcnational.net/api/fr/treks/43205/castelviel.gpx", "txt": "Télécharger le GPX"}, {"cls": "l-web", "href": "https://destination.cevennes-parcnational.fr/trek/43205-Castelviel", "txt": "Fiche officielle"}]}]}, {"type": "trajet", "heure": "15h00", "html": "Col de Castelviel → Sainte-Croix-Vallée-Française · D28 · 5 km · <strong>12 min</strong>", "fin": "Fin de la rando", "vers": "Sainte-Croix-Vallée-Française et son chemin des mémoires", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Sainte-Croix-Vall%C3%A9e-Fran%C3%A7aise+48110", "alt": 300, "km": "5", "duree": "12min", "route": "D28", "de_pt": "p36", "vers_pt": "p37", "de_lib": "Col de Castelviel", "vers_lib": "Sainte-Croix-Vallée-Française", "de_alt": 800, "vers_alt": 300}, {"type": "village", "heure": "15h20", "icone": "i-village", "titre": "Sainte-Croix-Vallée-Française et son chemin des mémoires", "pt": "p37", "blocs": [{"t": "meta", "html": "300 m d'altitude · parcours d'interprétation au départ de l'office de tourisme · 1h"}, {"t": "p", "html": "Un sentier balisé traverse le vieux village en racontant l'histoire locale et <strong>les commerces d'autrefois</strong> : c'est un dispositif fait exprès pour la flânerie, et il tombe bien après trois heures et demie de crête. L'église abrite une <em>Sainte Famille</em> de Paul Chevandier de Valdrôme, restaurée."}, {"t": "p", "html": "Une pause fraîche au passage : <strong>La Baraka</strong>, au village, fait bar et restaurant, chiens acceptés, <a class=\"tel\" href=\"tel:+33749605068\">07 49 60 50 68</a>. Ses horaires ne sont pas publiés, donc ne comptez pas sur un service à 15h, mais une boisson en terrasse ne se refuse pas."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Sainte-Croix-Vall%C3%A9e-Fran%C3%A7aise+48110", "txt": "Fiche et avis"}]}]}, {"type": "eau", "heure": "16h30", "icone": "i-swim", "titre": "Baignade — plan d'eau de Sainte-Croix", "pt": "p38", "blocs": [{"t": "meta", "html": "Sur le Gardon · site recensé par l'ARS · non surveillé · 1h30 sur place"}, {"t": "access", "warn": false, "html": "<b>Accès</b> — L'accès au Gardon est <strong>aménagé sous la petite passerelle métallique</strong> qui traverse le village, à deux pas du centre. Eau claire, très peu de monde. <strong>Le stationnement n'est documenté nulle part</strong> : garez-vous dans le village et descendez à pied.<br><em>Ne vous laissez pas tenter par la « cascade du Martinet » à Saint-Étienne-Vallée-Française, 15 km plus loin : c'est un spot à sauts de plusieurs mètres, non surveillé et sans balisage.</em>"}, {"t": "access", "warn": true, "html": "<b>Cyanobactéries</b> — Préférez systématiquement l'eau courante à l'eau stagnante, et <strong>empêchez le chien de boire dans une vasque tiède, verdâtre ou à écume</strong>, ni de lécher les galets couverts de dépôts : c'est toxique et souvent mortel."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Plan+d%27eau+de+Sainte-Croix-Vall%C3%A9e-Fran%C3%A7aise", "txt": "Fiche et avis"}]}]}, {"type": "trajet", "heure": "18h05", "html": "Sainte-Croix → Saint-Jean-du-Gard · D983 puis D907 par Saint-Étienne-Vallée-Française · 30 km · <strong>45 min</strong>", "fin": "On se sèche", "vers": "Saint-Jean-du-Gard, flânerie du soir puis dîner", "nav": "https://www.google.com/maps/dir/?api=1&destination=Auberge+du+P%C3%A9ras%2C+Saint-Jean-du-Gard", "alt": null, "km": "30", "duree": "45min", "route": "D983 puis D907 par Saint-Étienne-Vallée-Française", "de_pt": "p38", "vers_pt": null, "de_lib": "Sainte-Croix-Vallée-Française", "vers_lib": "Saint-Jean-du-Gard", "de_alt": 300, "vers_alt": 197}, {"type": "village", "heure": "18h50", "icone": "i-village", "titre": "Saint-Jean-du-Gard, une heure sans programme", "pt": null, "blocs": [{"t": "meta", "html": "197 m d'altitude · 50 min · le village de votre semaine, hors jour de marché"}, {"t": "p", "html": "Vous avez une heure avant la table. C'est le bon moment pour voir Saint-Jean-du-Gard sans la foule du mardi : la <strong>tour de l'Horloge</strong>, le vieux pont sur le Gardon, et la rue principale à l'ombre. Garez-vous <strong>place du Marché</strong>, tout est à moins de cinq minutes à pied."}, {"t": "shop", "html": "<strong>La Maison du Pélardon</strong>, place du Marché, pour rapporter un ou deux fromages · <strong>Cévennes Terroir</strong>, rue Pelet, châtaigne et miel de la vallée"}]}, {"type": "eat", "heure": "19h45", "icone": "i-eat", "titre": "Dîner — Auberge du Péras, Saint-Jean-du-Gard", "blocs": [{"t": "meta", "html": "Route de Nîmes, 30270 Saint-Jean-du-Gard · ancien relais de poste du XVII<sup>e</sup>, Logis · <a class=\"tel\" href=\"tel:+33466853594\">04 66 85 35 94</a>"}, {"t": "note", "html": "Google 4,4 / 5 · 229 avis &nbsp;|&nbsp; TripAdvisor 4,0 / 5 · 61 avis"}, {"t": "p", "html": "Cuisine maison et produits du terroir : huile d'olive, farine de châtaigne, pélardon. <strong>Animaux acceptés avec supplément</strong>, c'est écrit sur la fiche officielle. Le restaurant est nettement mieux noté que l'hôtel. <strong>Réservez pour 19h45 en précisant le chien.</strong>"}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Auberge+du+P%C3%A9ras+Saint-Jean-du-Gard", "txt": "Fiche et avis"}]}]}, {"type": "trajet", "heure": "21h30", "html": "Saint-Jean-du-Gard → col de Lamira · la petite route du col, à faire de jour si possible · 6 km · <strong>12 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 2h30 de conduite, plus longue traite 52 min</strong>", "fin": "Fin du repas", "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115%2C3.895", "alt": null, "km": "6", "duree": "12min", "route": "la petite route du col", "de_pt": null, "vers_pt": null, "de_lib": "Saint-Jean-du-Gard", "vers_lib": "col de Lamira", "de_alt": 197, "vers_alt": 400}], "strip": [{"page": "https://commons.wikimedia.org/wiki/File:028_Le_Pompidou_(_48110_).JPG", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/028_Le_Pompidou_(_48110_).JPG?width=800", "alt": "Le Pompidou", "cap": "Le Pompidou, sur la Corniche"}, {"page": "https://commons.wikimedia.org/wiki/File:Le_Gardon_%C3%A0_Sainte_Croix-Vall%C3%A9e_fran%C3%A7aise.JPG", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Le_Gardon_%C3%A0_Sainte_Croix-Vall%C3%A9e_fran%C3%A7aise.JPG?width=800", "alt": "Gardon à Sainte-Croix", "cap": "Le Gardon à Sainte-Croix-Vallée-Française"}], "notes": [{"cls": "note plan", "html": "<b>Plan B si les massifs sont fermés :</b> la Corniche reste praticable, c'est une route. Supprimez la rando, faites-la d'une traite jusqu'à Florac, visitez le château du Parc national, et rentrez par la Vallée Française avec un arrêt baignade à Sainte-Croix."}], "alt_max": 800, "alt_min": 300, "rando": ["8,4 km", "+387 m"], "volant": "2h30", "chaud": {"texte": "Vous êtes sur la Corniche entre 800 et 1000 m toute la journée. C'est la bonne journée à faire quand il fait chaud en bas.", "lieu": "Corniche des Cévennes", "alt": 800}, "geo": {"lat": 44.235, "lon": 3.732, "lab": "Corniche, D28", "alt": 800}, "base": {"lat": 44.115, "lon": 3.895, "lab": "Col de Lamira"}, "bonus": [{"k": "village", "titre": "Barre-des-Cévennes", "meta": "15 min du Pompidou · 930 m", "txt": "Un village-rue posé sur la crête, classé, avec ses maisons alignées face au sud et le sentier d'interprétation « Barre, place forte ». Si la matinée avance vite, c'est le prolongement naturel de l'arrêt du Pompidou, sur la même route.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Barre-des-C%C3%A9vennes%2C+48400"}]}, {"k": "village", "titre": "Saint-Germain-de-Calberte", "meta": "20 min de Sainte-Croix · 500 m", "txt": "L'autre village de la Vallée Française, avec son église romane et le château de Calberte en ruine au-dessus. Moins fréquenté que Sainte-Croix, et la route pour y aller est un enchaînement de terrasses de châtaigniers.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Saint-Germain-de-Calberte%2C+48370"}]}]}, {"id": "j10", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Pont_St_Jean_du_Gard_2007.jpg?width=1200", "alt": "Pont de Saint-Jean-du-Gard", "cap": "Le pont sur le Gardon de Saint-Jean · <a href=\"https://commons.wikimedia.org/wiki/File:Pont_St_Jean_du_Gard_2007.jpg\">Wikimedia Commons</a>"}, "dt": "Mardi 18 août", "titre": "Le grand marché du mardi, puis Alès et la fin de l'histoire camisarde", "pitch": "Le matin, le marché qui déborde de la halle jusqu'à la Grand Rue, et quatre cents mètres d'ateliers où travaillent une céramiste, un forgeron-coutelier, une tapissière et un pâtissier primé. L'après-midi, vous descendez à Alès : les Halles de l'Abbaye à la fin du marché, une terrasse sur la place, et le vieux centre où se lit la suite de ce que le Mas Soubeyran vous a raconté dimanche — la paix d'Alais de 1629, le fort bâti par Louis XIV pour surveiller les protestants, la cathédrale et le temple qui se font face. Puis on remonte, et on finit dans le Gardon.", "tags": [{"cls": "t-marche", "txt": "Le grand marché"}, {"cls": "t-village", "txt": "Artisans · vieil Alès"}, {"cls": "t-visite", "txt": "Fort Vauban · parc du Bosquet"}, {"cls": "t-eau", "txt": "Gardon de Saint-Jean"}, {"cls": "t-tot", "txt": "1h45 de volant · max 40 min d'affilée"}], "etapes": [{"type": "trajet", "heure": "9h30", "html": "Col de Lamira → centre de Saint-Jean-du-Gard · 6 km · <strong>12 min</strong>", "fin": "Départ", "vers": "Marché de Saint-Jean-du-Gard", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Halle+Saint-Jean-du-Gard+30270", "alt": 197, "km": "6", "duree": "12min", "route": "", "de_pt": "b_j10_9", "vers_pt": "p40", "de_lib": "Col de Lamira", "vers_lib": "centre de Saint-Jean-du-Gard", "de_alt": 400, "vers_alt": 197}, {"type": "marche", "heure": "9h45", "icone": "i-basket", "titre": "Marché de Saint-Jean-du-Gard", "pt": "p40", "blocs": [{"t": "meta", "html": "Mardi 8h-13h · sous la halle et dans le centre ; en été il déborde sur la Grand Rue et la rue Pelet de la Lozère"}, {"t": "p", "html": "C'est LE marché de la semaine ici. Beaucoup de guides le placent à tort le vendredi : le vendredi c'est la brocante, le samedi le marché de producteurs, et le dimanche soir les artisans."}, {"t": "access", "warn": true, "html": "<b>Stationnement : la commune verbalise réellement</b> — Arrêté municipal en vigueur : <strong>bandes jaunes 35 € d'amende, zone bleue 17 €</strong>, et le <strong>disque de stationnement est obligatoire</strong> en zone bleue. Des disques sont distribués gratuitement en mairie (<a class=\"tel\" href=\"tel:+33466562636\">04 66 56 26 36</a>) : passez-y le premier jour. Un mardi de marché, le stationnement du centre est modifié — garez-vous en périphérie et finissez à pied."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Halle+Saint-Jean-du-Gard+30270", "txt": "La halle · fiche et avis"}]}]}, {"type": "village", "heure": "11h00", "icone": "i-village", "titre": "La Grand Rue et ses artisans", "pt": "p41", "blocs": [{"t": "meta", "html": "1h · le plus bel alignement d'ateliers du séjour, sur 400 mètres"}, {"t": "p", "html": "<strong>Autour du Feu</strong>, place de la Révolution — Anaïs Leclere, céramiste (grès et porcelaine, émaux maison) et Matthias Pagnucco, forgeron-coutelier, créateur du couteau <em>le Magnan</em> déposé en 2014. Ouvert tous les jours ; ateliers visitables sur rendez-vous à 1 km."}, {"t": "p", "html": "<strong>L'Assise</strong>, 40 Grand Rue — Frédérique Delmas, tapissière-restauratrice de meubles, ateliers d'initiation sur demande. <strong>Piccolo Sole</strong>, 75 Grand Rue — épicerie fine : confitures de châtaigne, épices, brandade, chocolats Malakoff de Lozère. <strong>Au Petit Bonheur</strong>, 8 rue Pellet de la Lozère — pâtisserie primée, avec « La Modestine » (sablé miel-noisette) et un fondant à la châtaigne fait avec la farine de Saint-Étienne-Vallée-Française."}, {"t": "p", "html": "Terminez par le <strong>pont vieux</strong> et la <strong>tour de l'Horloge</strong>, qui calent le paysage du village."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Autour+du+Feu+Saint-Jean-du-Gard", "txt": "Autour du Feu"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Piccolo+Sole+Saint-Jean-du-Gard", "txt": "Piccolo Sole"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Au+Petit+Bonheur+p%C3%A2tisserie+Saint-Jean-du-Gard", "txt": "Au Petit Bonheur"}]}]}, {"type": "trajet", "heure": "12h05", "html": "Saint-Jean-du-Gard → Alès · D907 par Anduze, la route de la vallée · 30 km · <strong>35min</strong>", "fin": "Fin de la flânerie", "vers": "Alès, place de l'Abbaye et ses halles", "nav": "https://www.google.com/maps/dir/?api=1&destination=Place+de+l%27Abbaye%2C+30100+Al%C3%A8s", "alt": 136, "km": "30", "duree": "35min", "route": "D907 par Anduze, la route de la vallée", "de_pt": "p40", "vers_pt": "p10a", "de_lib": "Saint-Jean-du-Gard", "vers_lib": "Alès", "de_alt": 197, "vers_alt": 136}, {"type": "marche", "heure": "12h40", "icone": "i-marche", "pt": "p10a", "titre": "Les Halles de l'Abbaye, et le déjeuner sous les arcades", "blocs": [{"t": "meta", "html": "136 m d'altitude · 2 200 m², 25 étals · marché tous les matins jusqu'à 13h, puis les onze boutiques du pourtour rouvrent côté rue l'après-midi"}, {"t": "p", "html": "Vous arrivez à la toute fin du marché, et c'est le bon moment : les producteurs bradent, la halle se vide, et la place de l'Abbaye passe en mode terrasse. L'ancien hôpital des religieuses a été refait en halle contemporaine sans perdre sa charpente : <strong>fruits et légumes du pays, poissonnier, épicerie fine, traiteur, boulangerie</strong>. Faites un tour rapide avant de vous asseoir, c'est là que vous trouverez la châtaigne et le pélardon à rapporter."}, {"t": "note", "html": "<b>Le déjeuner est juste là</b> — <strong>Le Comptoir des Halles</strong>, 5 rue Jean Castagno, terrasse sur la place. <strong>4,8 / 5 sur 293 avis Google</strong>, tenu par Vincent et sa mère Véronique. Carte qui change tous les jours, produits frais et de saison, plancha et pierrade, options végétariennes. <strong>Service jusqu'à 14h seulement</strong>, donc on ne traîne pas en route. <a class=\"tel\" href=\"tel:+33634085606\">06 34 08 56 06</a>"}, {"t": "access", "html": "<b>Stationnement</b> — <strong>parking souterrain de l'Abbaye, 380 places, gratuit la première heure</strong> puis quelques euros pour l'après-midi. Vous ressortez directement sur la place. C'est de loin le plus simple : le centre d'Alès est en zone payante et la circulation y est filtrée."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Les Halles", "href": "https://www.google.com/maps/search/?api=1&query=Halles+de+l%27Abbaye+Al%C3%A8s"}, {"cls": "l-map", "txt": "Le Comptoir des Halles", "href": "https://www.google.com/maps/search/?api=1&query=Comptoir+des+Halles+Al%C3%A8s"}, {"cls": "l-web", "txt": "Parking de l'Abbaye", "href": "https://www.google.com/maps/search/?api=1&query=Parking+de+l%27Abbaye+Al%C3%A8s"}]}]}, {"type": "village", "heure": "14h15", "icone": "i-village", "pt": "p10b", "titre": "Le vieil Alès, ou la fin de l'histoire que vous avez commencée dimanche", "blocs": [{"t": "meta", "html": "145 m d'altitude · 1h15 à pied · ruelles étroites et ombragées, tout est à moins de dix minutes du parking"}, {"t": "p", "html": "Dimanche, au Mas Soubeyran, vous avez vu la révolte des Camisards racontée par les vaincus. Ici, vous voyez la machine d'en face, et elle est en pierre. <strong>La paix d'Alais est signée dans cette ville en 1629</strong> : les protestants gardent leur culte, mais perdent leurs places fortes et leurs murailles. Cinquante ans plus tard, Louis XIV révoque l'édit de Nantes et fait bâtir le fort. Tout le centre-ville raconte ce basculement."}, {"t": "p", "html": "<strong>Le Fort Vauban</strong>, sur la butte de la Roque — 350 mètres de courtines et quatre bastions, construits en 1688 non pas contre un envahisseur mais <strong>pour surveiller la population protestante de la ville</strong>. Prison jusqu'en 1990, aujourd'hui en cours de restauration : la visite se fait de l'extérieur, en faisant le tour des remparts."}, {"t": "p", "html": "<strong>La cathédrale Saint-Jean-Baptiste</strong>, place Saint-Jean — un site de culte depuis l'époque gallo-romaine, clocher carré médiéval restauré, façade et nef des XVII<sup>e</sup> et XVIII<sup>e</sup>, classée en 1914. Immenses peintures murales du XIX<sup>e</sup> à l'intérieur, et une fraîcheur bienvenue à 15h. À deux cents mètres, le <strong>temple protestant</strong> de 1868, sur une communauté vieille de 450 ans : les deux édifices se regardent, et c'est tout le sujet."}, {"t": "p", "html": "Entre les deux, la <strong>place de l'Hôtel de Ville</strong> et la salle des États du Languedoc, la <strong>rue d'Avéjan</strong> et ses façades du XVIII<sup>e</sup>, puis les <strong>quais du Gardon</strong> si vous voulez prolonger de dix minutes au bord de l'eau."}, {"t": "shop", "html": "<strong>Les Compagnons du Miel</strong> et les épiceries de la rue d'Avéjan pour le miel de châtaignier et les confitures · les onze boutiques du pourtour des Halles rouvrent côté rue à partir de 14h30"}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Fort Vauban", "href": "https://www.google.com/maps/search/?api=1&query=Fort+Vauban+Al%C3%A8s"}, {"cls": "l-map", "txt": "Cathédrale Saint-Jean-Baptiste", "href": "https://www.google.com/maps/search/?api=1&query=Cath%C3%A9drale+Saint-Jean-Baptiste+Al%C3%A8s"}, {"cls": "l-web", "txt": "Office de tourisme d'Alès", "href": "https://www.cevennes-tourisme.fr/"}]}]}, {"type": "visit", "heure": "15h30", "icone": "i-visit", "pt": "p10c", "titre": "Le parc du Bosquet, à l'ombre des arbres centenaires", "blocs": [{"t": "meta", "html": "150 m d'altitude · 45 min · entrée libre, ouvert toute l'année · rue d'Hombres Firmas, au pied du fort"}, {"t": "p", "html": "Le jardin public d'Alès, dessiné au pied du fort : <strong>roseraie, allées d'hortensias, fontaines, bancs sous des arbres centenaires</strong>, la statue de Pasteur — qui a passé quatre ans ici à sauver la sériciculture cévenole de la pébrine, ce qui explique la filature de Saint-Jean-du-Gard. Depuis peu, les <strong>Terrasses du Bosquet</strong> y ajoutent 3 000 m² de jardin ethnobotanique : jardin médiéval, jardins d'acclimatation, plantes du causse."}, {"t": "note", "html": "<b>C'est l'étape chien de la journée</b> — de l'ombre dense, de l'eau aux fontaines, de l'herbe, et personne ne vous regardera de travers. Après une heure de pavés, c'est exactement ce qu'il lui faut avant la voiture."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Parc du Bosquet", "href": "https://www.google.com/maps/search/?api=1&query=Parc+du+Bosquet+Al%C3%A8s"}]}]}, {"type": "trajet", "heure": "16h45", "html": "Alès → Falguière, Saint-Jean-du-Gard · D907 en remontant la vallée · 32 km · <strong>40min</strong>", "fin": "Fin de la visite", "vers": "la Falguière, pour se remettre dans le Gardon", "nav": "https://www.google.com/maps/dir/?api=1&destination=Falgui%C3%A8re%2C+Saint-Jean-du-Gard", "alt": 210, "km": "32", "duree": "40min", "route": "D907 en remontant la vallée", "de_pt": "p10c", "vers_pt": "p44", "de_lib": "Alès", "vers_lib": "Falguière, Saint-Jean-du-Gard", "de_alt": 150, "vers_alt": 210}, {"type": "eau", "heure": "17h30", "icone": "i-swim", "titre": "Baignade — Falguière, Gardon de Saint-Jean", "pt": "p44", "blocs": [{"t": "meta", "html": "Site officiel suivi par la commune, qualité de l'eau « excellente », analyses tous les 15 jours · 1h15 sur place"}, {"t": "access", "warn": true, "html": "<b>Honnêteté sur ce spot</b> — La qualité de l'eau est excellente et le site est officiellement reconnu par la mairie, mais <strong>le stationnement n'est documenté nulle part</strong> et il n'y a aucun équipement. Le hameau de Falguière est à environ 1 km au nord-est du village, par une route communale goudronnée. Attention : un <strong>camping et des gîtes portent le même nom</strong>, leurs places sont privées.<br><strong>Rappel important</strong> : à Saint-Jean-du-Gard, la baignade est <strong>interdite par arrêté municipal sur tous les sites non autorisés</strong> du Gardon. Tenez-vous aux sites reconnus.<br><strong>Repli fiable si ça coince</strong> : les Gorges de Capoue (parking gratuit confirmé, 25 min)."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Falgui%C3%A8re+Saint-Jean-du-Gard+baignade", "txt": "Fiche et avis"}, {"cls": "l-nav", "href": "https://www.google.com/maps/dir/?api=1&amp;destination=44.128218%2C3.891582", "txt": "Itinéraire · 44.128218, 3.891582"}]}]}, {"type": "trajet", "heure": "19h00", "html": "Falguière → col de Lamira · la petite route du col · 8 km · <strong>18 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 1h45 de conduite, plus longue traite 40 min</strong>", "fin": "On se sèche", "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115%2C3.895", "alt": null, "km": "8", "duree": "18min", "route": "la petite route du col", "de_pt": "p44", "vers_pt": "p43", "de_lib": "Falguière", "vers_lib": "col de Lamira", "de_alt": 210, "vers_alt": 400}, {"type": "eat", "heure": "19h45", "icone": "i-eat", "titre": "Dîner à la maison", "blocs": [{"t": "shop", "html": "<b>Au menu</b> — Assiette du marché : charcuterie de pays, pélardons à différents affinages, tomates, melon, pain, et les confitures de châtaigne de Piccolo Sole pour le dessert. Après 2h45 de montée, personne n'a envie de cuisiner.<br><b>Vous avez tout acheté ce matin</b> au marché, plus la pâtisserie du Petit Bonheur."}, {"t": "p", "html": "<em>Si vous sautez la rando du soir : le <strong>marché nocturne d'Anduze</strong> se tient au Plan de Brie de 19h à 23h, à 30 min. Commerçants, artistes, artisans, producteurs — l'un des plus animés du secteur.</em>"}]}], "notes": [{"cls": "note prep", "html": "<b>Ce soir, on prépare demain.</b> Quatre heures de marche dans la châtaigneraie de la vallée Borgne, départ 10h15, déjeuner à 14h30. Préparez <strong>un en-cas solide</strong> et remplissez les gourdes. Et si vous voulez la <strong>Poterie Gauthier à Lasalle</strong>, appelez-la dans la journée au <a class=\"tel\" href=\"tel:+33466853155\">04 66 85 31 55</a> pour vérifier qu'elle sera ouverte vers 19h."}], "alt_max": 400, "alt_min": 136, "rando": [], "volant": "1h45", "chaud": {"texte": "<strong>Alès est à 136 m, c'est le point le plus bas du séjour.</strong> Au-delà de 34 °C, inversez la journée : marché de Saint-Jean à 9h, puis <strong>la Mine Témoin d'Alès</strong>, 700 m de galeries de charbon à <strong>13 °C constants</strong>, visite guidée d'1h15. Attention, <strong>les animaux n'y sont pas admis</strong> : l'un de vous reste avec le chien sur l'aire de pique-nique ombragée du site, et vous permutez. Le vieux centre et le parc du Bosquet passent ensuite très bien à 17h, et vous finissez dans le Gardon.", "lieu": "Mine Témoin d'Alès", "alt": 136}, "geo": {"lat": 44.1268, "lon": 4.0806, "lab": "Alès", "alt": 136}, "base": {"lat": 44.115, "lon": 3.895, "lab": "Col de Lamira"}, "strip": [{"page": "https://commons.wikimedia.org/wiki/File:Fort_vauban_ales.JPG", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Fort_vauban_ales.JPG?width=800", "alt": "Fort Vauban à Alès", "cap": "Le fort Vauban, bâti en 1688 pour surveiller la ville"}, {"page": "https://commons.wikimedia.org/wiki/File:Cath%C3%A9drale_d'al%C3%A8s.JPG", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Cath%C3%A9drale_d'al%C3%A8s.JPG?width=800", "alt": "Cathédrale Saint-Jean-Baptiste d'Alès", "cap": "La cathédrale Saint-Jean-Baptiste, place Saint-Jean"}], "_sorties": ["Rando du soir : le Pic d'Arbousse", "Option payante : Maison Rouge, musée des vallées cévenoles", "Sieste au frais"], "bonus": [{"k": "visit", "titre": "La Mine Témoin d'Alès", "meta": "700 m de galeries · <strong>13 °C constants</strong> · 1h15 · 12 € · fermé le lundi", "txt": "<strong>Le meilleur refuge de canicule de tout le séjour.</strong> On descend dans une vraie mine de charbon reconstituée, guidée, sur 700 mètres, avec les conditions de travail des mineurs de 1880 à la fermeture. Parking gratuit, aire de pique-nique ombragée sur place. Réservation conseillée au 04 66 30 45 15.", "warn": "Les animaux ne sont pas admis dans les galeries. Avec un chien, la seule façon de le faire est que l'un de vous reste sur l'aire de pique-nique ombragée pendant que l'autre visite, puis de permuter. Comptez 2h30 au total.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Mine+T%C3%A9moin+d%27Al%C3%A8s%2C+Chemin+de+la+cit%C3%A9+Sainte-Marie%2C+30100+Al%C3%A8s"}, {"cls": "l-web", "txt": "Site officiel", "href": "https://www.mine-temoin.fr/"}]}, {"k": "rando", "titre": "La promenade de l'Ermitage, Alès", "meta": "6,1 km · +270 m · 2h30 · <strong>ombragée et acceptant les chiens</strong>", "txt": "La colline qui domine Alès, un oppidum celte à l'origine, une chapelle au sommet, et le panorama sur toute la vallée du Gardon. 4,5 / 5 sur Decathlon Outdoor. <strong>À faire le matin plutôt que l'après-midi</strong>, et sachez que le dernier kilomètre longe une route passante en pleine saison.", "liens": [{"cls": "l-do", "txt": "Decathlon Outdoor", "href": "https://www.decathlon-outdoor.com/fr-fr/explore/france/promenade-de-l-ermitage-a-ales-67e957c99acb4"}]}, {"k": "rando", "titre": "Le Pic d'Arbousse, depuis Saint-Jean", "meta": "7,6 km · +380 m · 2h45 · départ place Rabaut Saint-Étienne", "txt": "La rando du soir de votre village : montée raide en forêt de châtaigniers, chênes et pins maritimes, bon couvert tout du long, panorama sur Saint-Jean et les vallées. <strong>Aucun point d'eau sur le parcours, prévoyez 2 L pour le chien.</strong> Version douce, même départ : Le Pont Vieux, 5,2 km, +148 m, 1h40.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Place+Rabaut+Saint-%C3%89tienne%2C+Saint-Jean-du-Gard"}]}, {"k": "visit", "titre": "Maison Rouge, musée des vallées cévenoles", "meta": "Saint-Jean-du-Gard · 9 € / 5 € réduit · 1h30 · <strong>fermé le lundi</strong>", "txt": "Une ancienne filature de soie monumentale, 10 000 objets, et le musée qui raconte la châtaigne, la soie et l'élevage. C'est le musée de référence des Cévennes, à cinq minutes de votre base.", "warn": "La formulation officielle « accueille les animaux d'assistance » laisse fortement penser que les chiens de compagnie ne sont pas admis. Appelez avant de vous déplacer.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Maison+Rouge+Saint-Jean-du-Gard"}]}]}, {"id": "j11", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Cevennes_Florac_Mimente_depuis_Causse_Mejean.jpg?width=1200", "alt": "Vallées cévenoles", "cap": "Vallées cévenoles et châtaigneraies · <a href=\"https://commons.wikimedia.org/wiki/File:Cevennes_Florac_Mimente_depuis_Causse_Mejean.jpg\">Wikimedia Commons</a>"}, "dt": "Mercredi 19 août", "titre": "Une vallée douce le matin, Lasalle et sa dernière nocturne le soir", "pitch": "Journée volontairement calme. Trois heures de marche seulement deux cents mètres au-dessus du village, dans la haute vallée de la Salindrenque, avec un gué à traverser à mi-parcours — emportez une serviette, c'est le meilleur moment du parcours. Puis Lasalle : deux kilomètres d'une seule rue d'où descendent des dizaines d'escaliers vers la rivière, une potière qui peint ses décors à main levée sans dessin préalable, et la dernière nocturne de la saison avec ses concerts au chapeau dans la cour de la médiathèque.", "tags": [{"cls": "t-rando", "txt": "Rando 9,7 km · +200 m"}, {"cls": "t-village", "txt": "Lasalle"}, {"cls": "t-marche", "txt": "Dernière nocturne"}, {"cls": "t-tot", "txt": "1h35 de volant · max 45 min d'affilée"}], "etapes": [{"type": "trajet", "heure": "9h30", "html": "Col de Lamira → Soudorgues · par Saint-Jean-du-Gard et Lasalle · 30 km · <strong>45 min</strong>", "fin": "Départ", "vers": "Sentier La Salindre", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Soudorgues+30460", "alt": 400, "km": "30", "duree": "45min", "route": "par Saint-Jean-du-Gard et Lasalle", "de_pt": "b_j11_9", "vers_pt": "p46", "de_lib": "Col de Lamira", "vers_lib": "Soudorgues", "de_alt": 400, "vers_alt": 400}, {"type": "rando", "heure": "10h15", "icone": "i-hike", "titre": "Rando : Sentier La Salindre", "pt": "p46", "blocs": [{"t": "meta", "html": "9,7 km · <strong>+200 m seulement</strong> · 3h15 · boucle · balisage jaune · départ de Soudorgues, 400 m d'altitude"}, {"t": "p", "html": "La sortie la plus douce de la semaine, et c'est délibéré : vous avez enchaîné la crête de Castelviel lundi et le Pic d'Arbousse hier soir. Haute vallée de la Salindrenque, sous-bois, hameaux de schiste. <strong>Le parcours comporte un gué à traverser</strong> : emportez une serviette et laissez le chien s'y arrêter, c'est le point d'eau du parcours."}, {"t": "access", "warn": false, "html": "<b>Départ et stationnement</b> — Soudorgues est à 10 min de Lasalle par la D39. Stationnement au village, gratuit selon toute vraisemblance, capacité non documentée. <strong>Itinéraire déconseillé après de fortes pluies</strong> à cause du gué."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Soudorgues+30460", "txt": "Départ · fiche et avis"}, {"cls": "l-trk", "href": "https://static.apidae-tourisme.com/filestore/objets-touristiques/plans/221/174/37334749/la-salindre.gpx", "txt": "Télécharger le GPX"}, {"cls": "l-web", "href": "https://www.tourismegard.com/fr/fiche/equipement/sentier-la-salindre-soudorgues_TFO6082088/", "txt": "Fiche officielle"}]}]}, {"type": "trajet", "heure": "", "html": "Soudorgues → Lasalle · D39 · 6 km · <strong>10 min</strong>", "fin": "Fin de la rando", "vers": "Pique-nique au bord de la Salindrenque", "nav": "https://www.google.com/maps/search/?api=1&query=Pique-nique%20au%20bord%20de%20la%20Salindrenque%20C%C3%A9vennes", "alt": null, "km": "6", "duree": "10min", "route": "D39", "de_pt": "p46", "vers_pt": null, "de_lib": "Soudorgues", "vers_lib": "Lasalle", "de_alt": 400, "vers_alt": 280}, {"type": "eat", "heure": "13h45", "icone": "i-eat", "titre": "Pique-nique au bord de la Salindrenque", "blocs": [{"t": "meta", "html": "Sur le parcours, au gué, ou sur une place de Lasalle en arrivant"}, {"t": "access", "warn": true, "html": "<b>Pourquoi pas de restaurant ce jour-là</b> — La bonne adresse du secteur existe, c'est <strong>La Balade Gourmande</strong> à Soudorgues, à cinq minutes de votre départ de rando : 4,6 / 5 sur 171 avis Google, un projet de village porté par une centaine d'adhérents, produits bio et locaux, bâtisse en pierre, terrasse couverte, concerts et théâtre, chiens acceptés en terrasse. <strong>Mais elle est fermée le mercredi</strong> : ouverture vendredi soir, samedi midi et soir, dimanche midi. 04 66 85 43 94.<br>La seule table de Lasalle, L'Étape du Randonneur, plafonne à 4,2 sur 38 avis. Ce n'est pas à la hauteur du reste du séjour. Vous mangerez mieux avec ce que vous aurez préparé, et vous vous rattraperez le soir au marché nocturne."}, {"t": "shop", "html": "<b>À préparer mardi soir</b> — Sandwichs au pélardon et à la charcuterie du marché de Saint-Jean, tomates, fruits, et deux bières. Le gué du parcours est le point de fraîcheur, prévoyez une serviette."}]}, {"type": "village", "heure": "15h15", "icone": "i-village", "titre": "Flânerie à Lasalle, « la Perle des Vallons »", "pt": "p48", "blocs": [{"t": "meta", "html": "280 m d'altitude · 1h30 · le format idéal pour marcher avec un chien"}, {"t": "p", "html": "Une seule <strong>épine dorsale de 2 km</strong> d'où partent des dizaines de passages et d'escaliers qui descendent vers la Salindrenque : le chien peut se rafraîchir tous les cent mètres. Le <strong>vieux pont du XVI<sup>e</sup></strong>, le temple du XIX<sup>e</sup> en hémicycle, l'arche romane dite « La Mouthe », et les anciennes filatures en bord de rivière — Lasalle en comptait onze au XIX<sup>e</sup> et produisait le plus gros volume de soie de la région."}, {"t": "p", "html": "<strong>Poterie Gauthier</strong>, 88 rue de la Place — Corinne et Philippe Gauthier travaillent la faïence émaillée sur terre rouge, et Corinne peint les décors <strong>à main levée, sans dessin préalable</strong>, devant vous. Vaisselle utilitaire, jarres de jardin, grands plats. Ouvert toute l'année, <a class=\"tel\" href=\"tel:+33466853155\">04 66 85 31 55</a>. En arrivant à 15h15 vous êtes largement dans les heures d'ouverture, contrairement à ce que donnait la version précédente de ce programme."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Poterie+Gauthier+88+rue+de+la+Place+Lasalle", "txt": "Poterie Gauthier"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Lasalle+30460", "txt": "Lasalle"}]}]}, {"type": "eau", "heure": "17h00", "icone": "i-swim", "titre": "Trempette dans la Salindrenque, et temps mort", "pt": "p49", "blocs": [{"t": "meta", "html": "Accès libre par les escaliers du village · non surveillé, non contrôlé"}, {"t": "p", "html": "Deux heures à ne rien faire avant le marché : la rivière traverse le village et les accès sont multiples. Ce n'est pas un site officiellement suivi, donc <strong>eau courante uniquement</strong>, et ne laissez pas le chien boire dans une vasque stagnante."}]}, {"type": "marche", "heure": "19h00", "icone": "i-basket", "titre": "Dîner aux Nocturnes de Lasalle — dernière de la saison", "pt": "p50", "blocs": [{"t": "meta", "html": "Rue de la Place · marché dès 18h, concerts dès 20h30 dans la cour de la médiathèque, au chapeau"}, {"t": "p", "html": "Producteurs, artisans, food-trucks, spectacles. <strong>Parking à l'entrée du village, 5 min à pied.</strong> Vous dînez là, et vous repartez avec de la musique dans la tête."}]}, {"type": "trajet", "heure": "21h30", "html": "Lasalle → col de Lamira · 27 km · <strong>40 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 1h35 de conduite, plus longue traite 45 min</strong>", "fin": "On plie les courses", "km": "27", "duree": "40min", "route": "", "de_pt": "p50", "vers_pt": null, "de_lib": "Lasalle", "vers_lib": "col de Lamira", "de_alt": 280, "vers_alt": 400, "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115%2C3.895"}], "notes": [{"cls": "note plan", "ht
