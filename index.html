te panoramique", "meta": "8,4 km · +387 m · 3h30 · moyen · départ du col sur la D28", "txt": "La version panoramique de la vallée Française : un sentier de crête avec des vues que la fiche officielle qualifie d'« exceptionnelles » sur la vallée du Trabassac, la Corniche et le mont Aigoual. <strong>Aucun point d'eau, majoritairement à découvert, et des passages de rocher schisteux vertigineux</strong> : à réserver à une matinée fraîche, avec le chien en laisse courte. Départ au col sur la D28, à 5 km de Sainte-Croix-Vallée-Française.", "liens": [{"cls": "l-web", "txt": "Fiche du Parc national", "href": "https://destination.cevennes-parcnational.fr/fr/trek/43205-Castelviel"}]}, {"k": "rando", "titre": "Gabriac et ses quatre hameaux", "meta": "8,8 km · +571 m · 3h30 · moyen · départ au chalet près de l'école de Gabriac", "txt": "Banquet, Soulatges, l'Adrech, la Clède, Toureille : une enfilade de hameaux authentiques avec leurs <strong>anciennes magnaneries</strong>, leurs maisons de lauze de schiste et leurs châtaigneraies. <strong>Plusieurs traversées de ruisseaux et passages à gué.</strong> Accès par la Corniche, C1 depuis Sainte-Croix. Refermez les clédes, et restez à distance des ruches signalées sur le parcours.", "liens": [{"cls": "l-web", "txt": "Fiche du Parc national", "href": "https://destination.cevennes-parcnational.fr/fr/trek/96960-Gabriac-et-ses-4-hameaux"}]}, {"k": "visit", "titre": "Le belvédère du Serre de la Can, si vous restez le soir", "meta": "au-dessus de Saint-Germain-de-Calberte · gratuit · accès libre", "txt": "Un belvédère d'observation des étoiles installé au Serre de la Can, au cœur de la <strong>plus vaste Réserve internationale de ciel étoilé d'Europe</strong>. C'est sur la route même du Cros. Si vous acceptez de dîner tard et de rentrer de nuit par la Corniche, montez-y à la tombée du jour : il n'y a pas une lumière à trente kilomètres.", "liens": [{"cls": "l-map", "txt": "Serre de la Can", "href": "https://www.google.com/maps/search/?api=1&query=Serre+de+la+Can+48370"}]}], "flex": {"ok": true, "why": "La seule journée déplaçable de la semaine : ni marché, ni réservation ferme.", "frais": "Vallon boisé à 700 m, gours du Gardon à midi, village de schiste l'après-midi", "haut": 900, "pas": {}}}, {"id": "j10", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Place_aux_Herbes_in_Uzes.jpg?width=1200", "alt": "La place aux Herbes à Uzès", "cap": "La place aux Herbes et ses arcades, à Uzès · <a href=\"https://commons.wikimedia.org/wiki/File:Place_aux_Herbes_in_Uzes.jpg\">Wikimedia Commons</a>"}, "dt": "Mardi 18 août", "titre": "Le grand marché du mardi, puis Uzès et sa nocturne sur la place du Duché", "pitch": "Le matin, le marché qui déborde de la halle jusqu'à la Grand Rue de Saint-Jean, et quatre cents mètres d'ateliers d'artisans. À midi on descend sur <strong>Uzès, premier duché de France</strong> : un déjeuner long et climatisé pendant les heures brûlantes, les caves et le donjon du Duché de Crussol, la place aux Herbes sous ses arcades, la cathédrale et la tour Fenestrelle, seul clocher rond de France. Puis, à 17h30, <strong>la place du Duché se remplit pour le Mardi Nocturne</strong> : soixante-dix exposants, des concerts, et du tango dans la cour de la mairie. On dîne sur la place aux Herbes et on rentre à la nuit.", "tags": [{"cls": "t-marche", "txt": "Marché de Saint-Jean"}, {"cls": "t-visit", "txt": "Parc et place du Duché"}, {"cls": "t-marche", "txt": "Nocturne place du Duché"}, {"cls": "t-tot", "txt": "2h34 de volant · max 1h17 d'affilée"}], "etapes": [{"type": "trajet", "heure": "9h30", "html": "Col de Lamira → centre de Saint-Jean-du-Gard · 6 km · <strong>12 min</strong>", "fin": "Départ", "vers": "Marché de Saint-Jean-du-Gard", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Halle+Saint-Jean-du-Gard+30270", "alt": 197, "km": "6", "duree": "12min", "route": "", "de_pt": "b_j10_9", "vers_pt": "p40", "de_lib": "Col de Lamira", "vers_lib": "centre de Saint-Jean-du-Gard", "de_alt": 400, "vers_alt": 197}, {"type": "marche", "heure": "9h45", "icone": "i-basket", "titre": "Marché de Saint-Jean-du-Gard", "pt": "p40", "blocs": [{"t": "meta", "html": "Mardi 8h-13h · sous la halle et dans le centre ; en été il déborde sur la Grand Rue et la rue Pelet de la Lozère"}, {"t": "p", "html": "C'est LE marché de la semaine ici. Beaucoup de guides le placent à tort le vendredi : le vendredi c'est la brocante, le samedi le marché de producteurs, et le dimanche soir les artisans."}, {"t": "access", "warn": true, "html": "<b>Stationnement : la commune verbalise réellement</b> — Arrêté municipal en vigueur : <strong>bandes jaunes 35 € d'amende, zone bleue 17 €</strong>, et le <strong>disque de stationnement est obligatoire</strong> en zone bleue. Des disques sont distribués gratuitement en mairie (<a class=\"tel\" href=\"tel:+33466562636\">04 66 56 26 36</a>) : passez-y le premier jour. Un mardi de marché, le stationnement du centre est modifié — garez-vous en périphérie et finissez à pied."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Halle+Saint-Jean-du-Gard+30270", "txt": "La halle · fiche et avis"}]}]}, {"type": "village", "heure": "11h00", "icone": "i-village", "titre": "La Grand Rue et ses artisans", "pt": "p41", "blocs": [{"t": "meta", "html": "1h · le plus bel alignement d'ateliers du séjour, sur 400 mètres"}, {"t": "p", "html": "<strong>Autour du Feu</strong>, place de la Révolution — Anaïs Leclere, céramiste (grès et porcelaine, émaux maison) et Matthias Pagnucco, forgeron-coutelier, créateur du couteau <em>le Magnan</em> déposé en 2014. Ouvert tous les jours ; ateliers visitables sur rendez-vous à 1 km."}, {"t": "p", "html": "<strong>L'Assise</strong>, 40 Grand Rue — Frédérique Delmas, tapissière-restauratrice de meubles, ateliers d'initiation sur demande. <strong>Piccolo Sole</strong>, 75 Grand Rue — épicerie fine : confitures de châtaigne, épices, brandade, chocolats Malakoff de Lozère. <strong>Au Petit Bonheur</strong>, 8 rue Pellet de la Lozère — pâtisserie primée, avec « La Modestine » (sablé miel-noisette) et un fondant à la châtaigne fait avec la farine de Saint-Étienne-Vallée-Française."}, {"t": "p", "html": "Terminez par le <strong>pont vieux</strong> et la <strong>tour de l'Horloge</strong>, qui calent le paysage du village."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Autour+du+Feu+Saint-Jean-du-Gard", "txt": "Autour du Feu"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Piccolo+Sole+Saint-Jean-du-Gard", "txt": "Piccolo Sole"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Au+Petit+Bonheur+p%C3%A2tisserie+Saint-Jean-du-Gard", "txt": "Au Petit Bonheur"}]}]}, {"type": "trajet", "heure": "11h30", "fin": "Fin du marché", "vers": "Uzès, premier duché de France", "nav": "https://www.google.com/maps/dir/?api=1&destination=Parking+du+Refuge%2C+route+de+N%C3%AEmes%2C+30700+Uz%C3%A8s", "html": "Saint-Jean-du-Gard → Uzès · la D907 par Anduze, le contournement d'Alès par la D910a, puis la D981 par Saint-Chaptes · 57 km · <strong>1h05</strong>, et vous descendez de 350 à 138 m", "alt": 138, "km": "57", "duree": "1h05", "route": "la D907 par Anduze, le contournement d'Alès par la D910a, puis la D981 par Saint-Chaptes", "de_pt": "p40", "vers_pt": "puz1", "de_lib": "Saint-Jean-du-Gard", "vers_lib": "Uzès", "de_alt": 350, "vers_alt": 138}, {"type": "eat", "heure": "13h00", "icone": "i-eat", "pt": "puz1", "titre": "Déjeuner à Uzès — Bistro du Chai", "blocs": [{"t": "meta", "html": "<strong>4,9 sur Google</strong>, 97 avis · 4 boulevard Gambetta · <strong>climatisé</strong> · <strong>chiens acceptés, tenus en laisse</strong> · plat du jour 14,90 € · service 12h – 14h"}, {"t": "p", "html": "Le déjeuner est long et c'est voulu : <strong>il couvre les deux heures les plus chaudes de la journée</strong>. Bistrot de caractère, produits locaux, carte courte. C'est la seule adresse d'Uzès à cumuler les trois choses dont vous avez besoin aujourd'hui : une note au-dessus de 4,8, la climatisation, et le chien accepté en salle — la fiche de Gard Tourisme le dit noir sur blanc."}, {"t": "note", "html": "<b>Appelez en arrivant à Uzès</b> — <a class=\"tel\" href=\"tel:+33466571047\">04 66 57 10 47</a>. Le service s'arrête à 14h : soyez attablés à 13h30 au plus tard. Fermé le dimanche et le lundi, donc ouvert votre mardi."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Bistro du Chai, bd Gambetta", "href": "https://www.google.com/maps/search/?api=1&query=Bistro+du+Chai+Uz%C3%A8s"}, {"cls": "l-tel", "txt": "04 66 57 10 47", "href": "tel:+33466571047"}, {"cls": "l-web", "txt": "Fiche Gard Tourisme", "href": "https://www.tourismegard.com/fr/fiche/restauration/bistro-du-chai-uzes_TFO7365213/"}]}]}, {"type": "visit", "heure": "15h30", "icone": "i-village", "pt": "puz2", "titre": "Le parc du Duché et la place du Duché", "blocs": [{"t": "meta", "html": "<strong>Accès libre, gratuit, toute l'année</strong> · <strong>animaux acceptés</strong> · ancien domaine des ducs, racheté par la ville en 1966 · sentiers, aires de pique-nique, ponton de pêche"}, {"t": "p", "html": "Uzès est le <strong>premier duché de France</strong> et le château est habité par la même famille depuis plus de mille ans. Vous en verrez la façade Renaissance, la place et la <strong>tour Bermonde</strong>, le donjon du XI<sup>e</sup>, depuis l'extérieur — gratuitement, et c'est déjà beaucoup. Puis vous descendez au <strong>parc du Duché</strong>, l'ancien domaine ducal devenu parc public : c'est le seul espace vert d'Uzès où les animaux sont explicitement admis, à dix minutes à pied de la place aux Herbes."}, {"t": "access", "warn": true, "html": "<b>Pourquoi on n'entre pas dans le château</b> — Le Duché <strong>ne publie aucune règle sur les animaux</strong>, ni sur son site ni sur sa fiche touristique, et entre le donjon, les escaliers et les appartements meublés, la réponse est probablement non. Vous ne laissez pas le chien, donc on n'y va pas. Si vous voulez vérifier : <a class=\"tel\" href=\"tel:+33466221896\">04 66 22 18 96</a>. La visite dure 1h et coûte 24 € — ou 15 € pour la tour seule."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Place du Duché", "href": "https://www.google.com/maps/dir/?api=1&destination=Duch%C3%A9+d%27Uz%C3%A8s%2C+place+du+Duch%C3%A9%2C+30700+Uz%C3%A8s"}, {"cls": "l-map", "txt": "Parc du Duché", "href": "https://www.google.com/maps/search/?api=1&query=Parc+du+Duch%C3%A9+Uz%C3%A8s"}, {"cls": "l-web", "txt": "Fiche officielle du parc", "href": "https://www.tourismegard.com/fr/fiche/equipement/parc-du-duche-uzes_TFO5610587/"}]}]}, {"type": "village", "heure": "17h00", "icone": "i-village", "pt": "puz1", "titre": "Le vieil Uzès à l'ombre, avant que la ville ne se remplisse", "blocs": [{"t": "meta", "html": "45 min · <strong>gratuit</strong> · centre entièrement piéton · tout est à moins de cinq minutes à pied"}, {"t": "p", "html": "La <strong>place aux Herbes</strong> et ses arcades du XVII<sup>e</sup>, plantée de platanes : c'est la plus belle place du Gard et surtout <strong>la meilleure ombre gratuite de la ville</strong>. De là, la <strong>cathédrale Saint-Théodorit</strong>, ouverte tous les jours et gratuite, fraîche à l'intérieur, avec ses orgues du XVII<sup>e</sup> et leurs volets peints d'origine, une rareté en France. Juste à côté, la <strong>tour Fenestrelle</strong>, 42 m, <strong>le seul clocher rond de France</strong>, inspirée des campaniles italiens."}, {"t": "note", "html": "<b>Deux précisions utiles</b> — La tour Fenestrelle <strong>ne se visite pas</strong>, l'accès intérieur est fermé pour raisons de sécurité : on la regarde d'en bas, et elle vaut le détour quand même. Et le <strong>musée Georges Borias est fermé le mardi</strong>, donc fermé aujourd'hui. Prolongez plutôt par la <strong>promenade Jean Racine</strong>, publique et gratuite, plantée de cyprès centenaires et de platanes, avec la vue sur la vallée de l'Eure."}, {"t": "access", "warn": true, "html": "<b>Le Jardin Médiéval, c'est non</b> — Il est très joli, au pied de la tour du Roi, ouvert 10h – 19h et à 8 €, mais <strong>les chiens y sont interdits</strong> sauf s'ils tiennent dans un sac. Avec le vôtre, inutile de faire le détour."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Place aux Herbes", "href": "https://www.google.com/maps/dir/?api=1&destination=Place+aux+Herbes%2C+30700+Uz%C3%A8s"}, {"cls": "l-map", "txt": "Cathédrale et tour Fenestrelle", "href": "https://www.google.com/maps/dir/?api=1&destination=Cath%C3%A9drale+Saint-Th%C3%A9odorit%2C+place+de+l%27%C3%89v%C3%AAch%C3%A9%2C+30700+Uz%C3%A8s"}, {"cls": "l-web", "txt": "Office de tourisme Uzès Pont du Gard", "href": "https://www.uzes-pontdugard.com/"}]}]}, {"type": "marche", "heure": "17h45", "icone": "i-market", "pt": "puz3", "titre": "Le Mardi Nocturne d'Uzès, place du Duché", "blocs": [{"t": "meta", "html": "<strong>17h30 – 23h30</strong> · place du Duché · <strong>gratuit</strong> · environ 70 exposants · artisanat et produits régionaux · musique live"}, {"t": "p", "html": "<strong>C'est le coup de chance de la semaine.</strong> Uzès n'a pas de marché le mardi matin, mais tous les mardis d'été, du 7 juillet au 25 août, la place du Duché se remplit à 17h30 pour la nocturne : soixante-dix exposants, artisans et producteurs, des concerts, et du tango dans la cour de la mairie. La Ville d'Uzès l'annonce explicitement pour <strong>le mardi 18 août</strong>. Vous arrivez à l'ouverture, quand la chaleur retombe et que la place est encore respirable."}, {"t": "note", "html": "<b>Ce qu'on y achète</b> — Huile d'olive de la vallée des Baux, olives picholines, tapenade, fromages de chèvre du pays d'Uzès, nougat, vins du Duché d'Uzès (l'AOC existe depuis 2012), et de la poterie. C'est aussi votre dernier gros achat de terroir du séjour : prenez la glacière et des espèces."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Place du Duché", "href": "https://www.google.com/maps/dir/?api=1&destination=Duch%C3%A9+d%27Uz%C3%A8s%2C+place+du+Duch%C3%A9%2C+30700+Uz%C3%A8s"}, {"cls": "l-web", "txt": "Les Mardis Nocturnes · office de tourisme", "href": "https://www.uzes-pontdugard.com/en/fete-manifestation/les-mardis-nocturnes-duzes/"}, {"cls": "l-web", "txt": "Animations 2026 · Ville d'Uzès", "href": "https://www.uzes.fr/loisirs-et-sorties/animations-et-festivites/animations-et-festivites-2026"}]}]}, {"type": "eat", "heure": "19h45", "icone": "i-eat", "pt": "puz1", "titre": "Dîner — La Voûte, sur la place aux Herbes", "blocs": [{"t": "meta", "html": "<strong>4,5 sur Google</strong>, plus de 600 avis · 20 place aux Herbes · bistronomique locavore · <strong>service jusqu'à 22h30</strong> · fermé le lundi"}, {"t": "p", "html": "Salle sous voûtes de pierre, terrasse directement sur la place aux Herbes, cuisine locavore et vins du Duché d'Uzès. <strong>C'est la seule bonne table de la place qui tienne votre critère de 4,5</strong>, et surtout la seule qui serve encore à 21h : les autres bonnes adresses de la ville ferment leur service à 21h, ce qui est trop juste quand on a une nocturne à traverser."}, {"t": "note", "html": "<b>Réservez en arrivant en ville</b> — <a class=\"tel\" href=\"tel:+33434320970\">04 34 32 09 70</a>. Un mardi de nocturne en août, la place se remplit. Si c'est complet, la nocturne elle-même a de quoi dîner sur les stands, et c'est une option parfaitement honorable."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "La Voûte, 20 place aux Herbes", "href": "https://www.google.com/maps/search/?api=1&query=La+Vo%C3%BBte+place+aux+Herbes+Uz%C3%A8s"}, {"cls": "l-tel", "txt": "04 34 32 09 70", "href": "tel:+33434320970"}]}]}, {"type": "trajet", "heure": "21h15", "fin": "Fin de la soirée", "vers": "le gîte, au col de Lamira", "nav": "https://www.google.com/maps/dir/?api=1&destination=Col+de+Lamira%2C+30270+Saint-Jean-du-Gard", "html": "Uzès → col de Lamira · la D981, le contournement d'Alès, la D907 par Anduze et Saint-Jean, puis la petite route du col · 63 km · <strong>1h17</strong> &nbsp;·&nbsp; <strong>Total du jour : 2h34 de conduite, plus longue traite 1h17</strong>", "alt": 400, "km": "63", "duree": "1h17", "route": "la D981, le contournement d'Alès, la D907 par Anduze et Saint-Jean, puis la petite route du col", "de_pt": "puz3", "vers_pt": "p43", "de_lib": "Uzès", "vers_lib": "col de Lamira", "de_alt": 138, "vers_alt": 400}], "notes": [{"cls": "note plan", "html": "<b>Ce qui a changé, et ce que ça coûte</b> — Alès sort du programme, <strong>Uzès le remplace</strong>. Le prix est réel : la journée passe de <strong>1h45 à 2h34 de conduite</strong>, et la plus longue traite monte à <strong>1h17</strong>, deux minutes au-dessus de votre plafond d'une traite. Vous l'aviez accepté d'avance. Ce que vous achetez avec : le premier duché de France, la plus belle place du Gard, et une nocturne de soixante-dix exposants qui n'existe que le mardi. Alès était à trente-cinq minutes, mais c'était Alès."}, {"cls": "note warn", "html": "<b>Le stationnement, à ne pas rater</b> — Le centre d'Uzès est <strong>entièrement piéton</strong> et les parkings de ceinture sont payants. Il y a trois grands <strong>parkings gratuits</strong> en périphérie, à cinq ou dix minutes à pied du centre : <strong>Le Refuge</strong>, route de Nîmes, 350 places ; <strong>Pompidou</strong>, avenue Georges Pompidou, 212 places ; <strong>Le Serrebonnet</strong>, chemin du Serre Bonnet, 200 places. Visez Le Refuge. Un mardi de nocturne en août, ne comptez pas vous garer près de la place du Duché."}, {"cls": "note prep", "html": "<b>Le retour se fait de nuit</b> — Départ 21h15, arrivée au col vers 22h35. La dernière portion, la petite route qui monte de Saint-Jean au col de Lamira, se fait aux phares : roulez doucement, il y a des sangliers. Si vous préférez rentrer plus tôt, <strong>dînez sur les stands de la nocturne vers 19h et partez à 20h30</strong> : vous êtes couchés une heure plus tôt et vous n'avez rien raté."}], "alt_max": 400, "alt_min": 138, "rando": [], "volant": "2h34", "chaud": {"texte": "<strong>Uzès est à 138 m, en pleine garrigue : c'est le point le plus bas et le plus chaud du séjour.</strong> La journée est donc construite sur l'horaire, pas sur l'altitude. Le marché de Saint-Jean se fait à 350 m avant 11h30, la route se fait en voiture pendant le pic, le déjeuner est long et climatisé, l'après-midi se passe dans les caves du Duché et sous les arcades de la place aux Herbes, et la ville ne se vit dehors qu'à partir de 17h30, pour la nocturne. <strong>Vous n'êtes jamais dehors au soleil entre 12h et 17h.</strong>", "lieu": "Caves du Duché et arcades de la place aux Herbes", "alt": 138}, "geo": {"lat": 44.0122, "lon": 4.4194, "lab": "Uzès", "alt": 138}, "base": {"lat": 44.115, "lon": 3.895, "lab": "Col de Lamira"}, "strip": [{"page": "https://commons.wikimedia.org/wiki/File:Place_aux_Herbes_in_Uzes.jpg", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Place_aux_Herbes_in_Uzes.jpg?width=800", "alt": "La place aux Herbes", "cap": "Les arcades de la place aux Herbes, la meilleure ombre d'Uzès"}, {"page": "https://commons.wikimedia.org/wiki/File:Cath%C3%A9drale_Saint_Th%C3%A9odorit_(Uz%C3%A8s)_-Tour_fenestrelle_(architecture).jpg", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Cath%C3%A9drale_Saint_Th%C3%A9odorit_(Uz%C3%A8s)_-Tour_fenestrelle_(architecture).jpg?width=800", "alt": "La tour Fenestrelle", "cap": "La tour Fenestrelle, seul clocher rond de France"}], "_sorties": ["Le parc du Duché, à l'ombre", "La vallée de l'Eure, le long de l'Alzon", "Un verre sous les arcades de la place aux Herbes"], "bonus": [{"k": "village", "titre": "Vézénobres, Village de Caractère, sur la route d'Uzès", "meta": "10 min de détour à l'aller · gratuit · accès libre · verger conservatoire de 2 ha", "txt": "Il est presque sur votre route et il ne coûte que dix minutes de plus. <strong>Village de Caractère du Gard</strong>, perché sur son piton : la <strong>porte de Sabran</strong> et sa tour de l'Horloge du XIII<sup>e</sup>, et surtout une <strong>rue entière de maisons romanes des XI<sup>e</sup> et XII<sup>e</sup> siècles, unique en France</strong>. Au-dessus, les ruines du château Fay-Peraut et le panorama sur toute la plaine. En contrebas, un <strong>verger conservatoire de deux hectares, mille arbres et une centaine de variétés de figuiers</strong>, en plein air, où le chien est admis en laisse. Bien moins couru qu'Uzès en août.", "liens": [{"cls": "l-map", "txt": "Vézénobres, place du Village", "href": "https://www.google.com/maps/search/?api=1&query=V%C3%A9z%C3%A9nobres+30360"}, {"cls": "l-web", "txt": "Village de Caractère · office de tourisme", "href": "https://www.cevennes-tourisme.fr/en/i-discover/strolls-and-visits/cities-and-villages-of-the-cevennes/vezenobres-village-of-character/"}]}, {"k": "visit", "titre": "La vallée de l'Eure, à pied depuis la ville", "meta": "gratuit · accès libre · au pied d'Uzès, le long de l'Alzon", "txt": "Un vallon boisé au pied de la ville, le long de l'Alzon, avec les vestiges de l'aqueduc romain qui alimentait Nîmes — celui-là même qui franchit le Gardon au pont du Gard, à vingt kilomètres. Sentiers, ombre, et le bassin de régulation antique. C'est gratuit, en accès libre, et le chien y est chez lui. À faire vers 17h plutôt qu'à 15h.", "liens": [{"cls": "l-map", "txt": "Vallée de l'Eure, Uzès", "href": "https://www.google.com/maps/search/?api=1&query=Vall%C3%A9e+de+l%27Eure+Uz%C3%A8s"}, {"cls": "l-web", "txt": "Ville d'Uzès", "href": "https://www.uzes.fr/decouvrir-uzes/a-voir-a-faire/parcs-et-jardins/la-vallee-de-leure"}]}, {"k": "eau", "titre": "Le Gardon à Collias, si vous voulez vous baigner", "meta": "20 min à l'est d'Uzès · gratuit · <strong>non surveillé</strong>", "txt": "Plages de galets sur la rive gauche du Gardon, le spot le plus fréquenté du secteur, ouvert du 1<sup>er</sup> avril au 30 septembre. La fiche officielle du département écrit noir sur blanc que <strong>cette plage n'est pas surveillée</strong>. Évitez les zones de mise à l'eau des canoës. <strong>Réserve</strong> : c'est vingt minutes de plus dans la mauvaise direction, donc à faire seulement si vous renoncez au Duché.", "liens": [{"cls": "l-map", "txt": "Baignade rive gauche, Collias", "href": "https://www.google.com/maps/dir/?api=1&destination=43.951817%2C4.479832"}, {"cls": "l-web", "txt": "Fiche officielle Gard Tourisme", "href": "https://www.tourismegard.com/fr/fiche/equipement/baignade-sur-la-rive-gauche-du-gardon-a-collias-collias_TFO5740184/"}]}], "flex": {"ok": false, "why": "Double contrainte : le grand marché de Saint-Jean est le mardi matin, et la nocturne d'Uzès n'a lieu que le mardi soir, jusqu'au 25 août.", "frais": "Marché à 350 m le matin, caves du Duché et arcades l'après-midi, nocturne à la fraîche", "haut": 400, "pas": {}}}, {"id": "j11", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Cevennes_Florac_Mimente_depuis_Causse_Mejean.jpg?width=1200", "alt": "Vallées cévenoles", "cap": "Vallées cévenoles et châtaigneraies · <a href=\"https://commons.wikimedia.org/wiki/File:Cevennes_Florac_Mimente_depuis_Causse_Mejean.jpg\">Wikimedia Commons</a>"}, "dt": "Mercredi 19 août", "titre": "Les béals et les gourgues de la Salindrenque, et la dernière Nocturne de Lasalle", "pitch": "Une journée courte en voiture et longue en plaisir. Le matin, <strong>La Salindrenque</strong> au départ de Soudorgues : trois heures et quart le long des béals, ces canaux taillés à flanc qui alimentent les <strong>gourgues</strong>, des bassins de pierre où l'on déjeune les pieds dans l'eau. L'après-midi, <strong>Lasalle</strong>, son Pont Vieux du XVI<sup>e</sup>, sa filature de 1854 aux onze baies et son temple à péristyle. Et le soir, <strong>la dernière Nocturne de la saison</strong> : marché d'artisans, trois concerts et des food trucks, de 18h à deux heures du matin.", "tags": [{"cls": "t-rando", "txt": "La Salindrenque 9,5 km · 3h15"}, {"cls": "t-eau", "txt": "Béals et gourgues"}, {"cls": "t-village", "txt": "Lasalle"}, {"cls": "t-marche", "txt": "Dernière Nocturne, 3 concerts"}, {"cls": "t-tot", "txt": "1h35 de volant · max 45 min d'affilée"}], "etapes": [{"type": "trajet", "heure": "9h30", "html": "Col de Lamira → Soudorgues · par Saint-Jean-du-Gard et Lasalle · 30 km · <strong>45 min</strong>", "fin": "Départ", "vers": "Sentier La Salindre", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Soudorgues+30460", "alt": 400, "km": "30", "duree": "45min", "route": "par Saint-Jean-du-Gard et Lasalle", "de_pt": "b_j11_9", "vers_pt": "p46", "de_lib": "Col de Lamira", "vers_lib": "Soudorgues", "de_alt": 400, "vers_alt": 400}, {"type": "rando", "heure": "10h15", "icone": "i-hike", "titre": "Rando : La Salindrenque, ses béals et ses gourgues", "pt": "p46", "blocs": [{"t": "meta", "html": "9,5 km · <strong>+351 m</strong> · <strong>3h15</strong> · boucle · balisage jaune et mobilier signalétique · <strong>facile</strong> · départ 50 m avant la mairie de Soudorgues"}, {"t": "p", "html": "C'est la randonnée « eau et pierre » du secteur, et elle est faite pour vous. Tout le parcours suit des <strong>béals</strong> — les canaux d'irrigation taillés à flanc — qui alimentent des <strong>gourgues</strong>, des bassins de pierre construits pour retenir l'eau des jardins en terrasses. On traverse l'architecture traditionnelle de la vallée de la Salindrenque, les faïsses cultivées, les murets."}, {"t": "note", "html": "<b>Les gourgues, c'est exactement ce que vous cherchiez</b> — Des bassins de pierre, à l'ombre, alimentés en continu par les béals. On s'y assoit, on y met les pieds, et ce n'est ni une plage ni une baignade. La fiche signale aussi <strong>un passage de rivière</strong>, à éviter en période de crue — donc parfaitement praticable un 19 août."}, {"t": "access", "html": "<b>Accès</b> — Depuis Lasalle, la <strong>D39</strong> direction L'Estréchure sur quatre kilomètres, puis <strong>à gauche la D271</strong> vers Soudorgues. Parking sur la droite, 50 m avant la mairie. Balisage jaune plus panneaux directionnels."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Mairie de Soudorgues, départ", "href": "https://www.google.com/maps/search/?api=1&query=Mairie+de+Soudorgues+30460"}, {"cls": "l-gpx", "txt": "Trace GPX officielle", "href": "https://geotrek-aggr.gard.fr/api/fr/treks/346826/la-salindrenque.gpx"}, {"cls": "l-web", "txt": "Fiche Rando Gard", "href": "https://rando.gard.fr/trek/346826-La-Salindrenque"}]}]}, {"type": "eat", "heure": "13h00", "icone": "i-eat", "titre": "Pique-nique aux gourgues, sur la boucle", "blocs": [{"t": "p", "html": "À mi-parcours, une <strong>gourgue</strong> : un bassin de pierre à l'ombre, alimenté par le béal, construit il y a des générations pour arroser les terrasses. On s'assoit sur la margelle, on y met les pieds, et on déjeune. C'est le meilleur endroit de la vallée pour ça."}], "pt": "p46"}, {"type": "trajet", "heure": "14h30", "html": "Soudorgues → Lasalle · D39 · 6 km · <strong>10 min</strong>", "fin": "Fin de la randonnée", "vers": "Pique-nique au bord de la Salindrenque", "nav": "https://www.google.com/maps/search/?api=1&query=Pique-nique%20au%20bord%20de%20la%20Salindrenque%20C%C3%A9vennes", "alt": null, "km": "6", "duree": "10min", "route": "D39", "de_pt": "p46", "vers_pt": null, "de_lib": "Soudorgues", "vers_lib": "Lasalle", "de_alt": 400, "vers_alt": 280}, {"type": "village", "heure": "15h00", "icone": "i-village", "titre": "Lasalle, la Perle des Vallons", "pt": "p48", "blocs": [{"t": "meta", "html": "1h15 · <strong>gratuit</strong> · le village s'étire sur 1,8 km le long de la Salindrenque · label Station Verte"}, {"t": "p", "html": "Le <strong>Pont Vieux du XVI<sup>e</sup></strong>, le plus ancien du village, et juste à côté la <strong>Filature Roux, bâtie en 1854</strong>, dont la façade est percée de <strong>onze baies en plein cintre</strong> : c'est le plus bel alignement industriel de la vallée et le meilleur point de vue du bourg. Puis le <strong>temple du XIX<sup>e</sup></strong>, à la silhouette inhabituelle — une forme extérieure semi-circulaire coupée par un péristyle néoclassique, peu de temples cévenols ressemblent à ça."}, {"t": "p", "html": "Lasalle a vécu de la soie et ça se lit partout : filatures disséminées, certaines désaffectées, d'autres reconverties, châteaux et gentilhommières au-dessus de la vallée, et le <strong>monastère de La Mouthe</strong>, fondé au XI<sup>e</sup> siècle par des bénédictins sur un promontoire — son porche roman subsiste, mais c'est un détour à part, hors du bourg."}, {"t": "note", "html": "<b>La Filature du pont de fer</b> — Construite en 1873, c'est aujourd'hui le lieu culturel du village. <strong>Elle ne se visite pas librement</strong> : on n'y entre que pour un spectacle. Vous la verrez de l'extérieur, place Jean Gazaix. Le <strong>Sentier des Fileuses</strong>, qui suit l'ancien chemin emprunté par les jeunes filles allant travailler aux filatures, fait 8,5 km et 3h — c'est une journée entière, pas une flânerie."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Lasalle, place de la Mairie", "href": "https://www.google.com/maps/search/?api=1&query=Lasalle+30460"}, {"cls": "l-web", "txt": "Histoire et patrimoine · mairie de Lasalle", "href": "https://www.lasalle.fr/histoire-et-patrimoine"}]}]}, {"type": "marche", "heure": "18h00", "icone": "i-basket", "titre": "La dernière Nocturne de Lasalle, avec ses trois concerts", "pt": "p50", "blocs": [{"t": "meta", "html": "<strong>Mercredi 19 août, 18h → 2h du matin</strong> · cour du Foyer et place de la Mairie · <strong>marché gratuit, concerts au chapeau</strong> · aucune réservation"}, {"t": "p", "html": "<strong>C'est la dernière de la saison, et c'est probablement la meilleure soirée de la semaine.</strong> L'agenda de la mairie l'annonce noir sur blanc : artisanat, marché, <strong>trois concerts — Deadwood, Charles Pecox et Maryline Morose</strong>, food truck et buvette, de 18h jusqu'à deux heures du matin. Organisé par l'association Mandragora. Le marché s'installe dès 18h, les spectacles suivent en soirée."}, {"t": "note", "html": "<b>On dîne sur place, et ce n'est pas un pis-aller</b> — Le mercredi soir, la restauration assise de Lasalle est quasi nulle : <strong>l'Étape du Randonneur ne sert que le midi ce jour-là</strong>, CVN Pizza est fermé le mercredi, la Balade Gourmande de Soudorgues aussi. <strong>Le Café de la Place, lui, est ouvert tous les jours de l'année.</strong> Mais l'usage local, un soir de nocturne, c'est de manger aux stands et aux food trucks."}, {"t": "access", "html": "<b>Stationnement</b> — Parking à l'entrée du village, cinq minutes à pied jusqu'à la rue principale. C'est la dernière de la saison : <strong>arrivez tôt</strong>, dès 18h, vous vous garerez et vous verrez le marché s'installer."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Place de la Mairie, Lasalle", "href": "https://www.google.com/maps/search/?api=1&query=Place+de+la+Mairie+Lasalle+30460"}, {"cls": "l-web", "txt": "Agenda officiel de la mairie", "href": "https://www.lasalle.fr/agendas"}, {"cls": "l-web", "txt": "Fiche Gard Tourisme", "href": "https://www.tourismegard.com/fr/fiche/fete-et-manifestation/les-nocturnes-de-lasalle-lasalle_TFO7725474/"}]}]}, {"type": "trajet", "heure": "21h30", "html": "Lasalle → col de Lamira · 27 km · <strong>40 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 1h35 de conduite, plus longue traite 45 min</strong>", "fin": "On plie les courses", "km": "27", "duree": "40min", "route": "", "de_pt": "p50", "vers_pt": null, "de_lib": "Lasalle", "vers_lib": "col de Lamira", "de_alt": 280, "vers_alt": 400, "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115%2C3.895"}], "notes": [{"cls": "note plan", "html": "<b>Si vous voulez de la vraie montagne ce jour-là :</b> le <strong>Sentier de Soult</strong> au départ de L'Estréchure, 9,7 km, +436 m, 4h, est la plus belle marche « Cévennes profondes » du secteur — châtaigniers, chênes, pins et sapins jusqu'à 750 m, château de l'Hom, hameau de la Bécédelle. Mais il est à 35 min dans l'autre direction, ce qui porterait la journée à 2h40 de route avec Lasalle. À faire à la place d'une autre journée si le cœur vous en dit. <a href=\"https://www.tourismegard.com/fr/fiche/equipement/sentier-de-soult-l-estrechure_TFO6082090/\">Trace et GPX</a>"}, {"cls": "note prep", "html": "<b>Ce soir, on prépare demain.</b> <strong>Départ 8h00 pour Florac</strong> — c'est tôt, et c'est pour arriver au marché avant la cohue. Vous <strong>déjeunerez du marché</strong> : glacière, couverts, une nappe. Et vous marcherez dans la foulée, la boucle de Gralhon part du parking même : chaussures montantes et 3 L d'eau prêts dans l'entrée. Vous rentrez tard de Lasalle ce soir, alors préparez tout avant de partir à la nocturne."}], "alt_max": 550, "alt_min": 230, "rando": ["9,5 km", "+351 m"], "volant": "1h35", "chaud": {"texte": "<strong>La vallée de la Salindrenque est encaissée et le parcours suit l'eau du début à la fin.</strong> Béals à l'ombre, gourgues de pierre pour le déjeuner, un passage de rivière. Au-delà de 35 °C, partez à 8h30 plutôt que 9h30 et allongez la halte aux gourgues : le reste de la journée se passe dans les ruelles de Lasalle, puis dehors à la nocturne quand la chaleur retombe.", "lieu": "Gourgues de la Salindrenque", "alt": 550}, "geo": {"lat": 44.0169, "lon": 3.8299, "lab": "Soudorgues", "alt": 400}, "base": {"lat": 44.115, "lon": 3.895, "lab": "Col de Lamira"}, "bonus": [{"k": "rando", "titre": "Le sentier de l'Amous, Saint-Sébastien-d'Aigrefeuille", "meta": "3,4 km · 2h · <strong>très ombragé, au fil de l'eau</strong> · 30 min de Lasalle", "txt": "La rando la plus courte et la plus fraîche de la réserve : elle suit le ruisseau presque tout du long. Parfaite en fin de journée, ou pour un jour où on ne veut rien forcer.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=44.106354%2C3.995293"}, {"cls": "l-gpx", "txt": "Trace GPX", "href": "https://www.tourismegard.com/fr/fiche/equipement/sentier-du-patrimoine-autour-de-l-amous-saint-sebastien-d-aig"}]}, {"k": "village", "titre": "Le col du Rédarès et Saint-Roman-de-Codières", "meta": "15 min de Lasalle · 600 m", "txt": "La petite route de crête entre Lasalle et le Vigan, avec la vue sur les deux vallées. Un col, deux hameaux, personne. À prendre au retour si vous voulez rentrer par le haut plutôt que par la vallée.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Col+du+R%C3%A9dar%C3%A8s%2C+30440"}]}], "flex": {"ok": false, "why": "La dernière Nocturne de la saison à Lasalle a lieu le mercredi 19 et pas un autre soir.", "frais": "Vallée encaissée, béals et gourgues à l'ombre, soirée dehors à Lasalle", "haut": 550, "pas": {}}}, {"id": "j12", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Florac-panorama.jpg?width=1200", "alt": "Florac", "cap": "Florac, au confluent du Tarn, du Tarnon et de la Mimente · <a href=\"https://commons.wikimedia.org/wiki/File:Florac-panorama.jpg\">Wikimedia Commons</a>"}, "dt": "Jeudi 20 août · <strong style=\"color:var(--red)\">départ 8h00</strong>", "titre": "Florac, capitale du Parc, par la Corniche des Cévennes", "pitch": "La plus belle route des Cévennes, et au bout la capitale du Parc national. On part à 8h pour prendre <strong>la Corniche des Cévennes</strong> à la fraîche et arriver au marché de Florac avant la cohue : il occupe toute une enfilade de rues, de l'Esplanade jusqu'au château. Ensuite, <strong>Gralhon</strong>, une boucle de 2h30 qui part à pied du parking même du marché, avec le panorama sur la vallée du Tarnon, des hameaux de lauze et une <strong>source ferrugineuse</strong>. Déjeuner au bord du Tarnon, et l'après-midi le sentier de la <strong>source du Pêcher</strong>, qui jaillit d'un éboulis en plein cœur de ville.", "tags": [{"cls": "t-marche", "txt": "Marché de Florac"}, {"cls": "t-rando", "txt": "Gralhon 8,3 km · 2h30"}, {"cls": "t-eau", "txt": "Source du Pêcher"}, {"cls": "t-tot", "txt": "2h20 de volant · max 1h10 d'affilée"}], "etapes": [{"type": "trajet", "heure": "8h00", "html": "Col de Lamira → Florac · la D907, le col Saint-Pierre et la <strong>Corniche des Cévennes</strong> · 50 km · <strong>1h10</strong>, et vous montez de 280 à 545 m en passant par 800 m au Pompidou", "fin": "Départ", "vers": "Arrivée et stationnement à Florac", "nav": "https://www.google.com/maps/dir/?api=1&destination=Maison+du+Tourisme+et+du+Parc%2C+N106%2C+48400+Florac", "alt": 549, "km": "50", "duree": "1h10", "route": "D907 puis Corniche des Cévennes", "de_pt": "b_j12_8", "vers_pt": "p51", "de_lib": "Col de Lamira", "vers_lib": "Florac", "de_alt": 400, "vers_alt": 549}, {"type": "village", "heure": "9h10", "icone": "i-village", "titre": "Arrivée et stationnement à Florac", "pt": "w2gral", "blocs": [{"t": "meta", "html": "549 m · <strong>parking du Rond-Point de la Gare, 120 places, gratuit</strong>"}, {"t": "access", "warn": true, "html": "<b>Deux pièges de stationnement, ce jeudi précisément</b> — Un arrêté municipal ferme <strong>le côté impair de l'Esplanade et la place du Souvenir à la circulation et au stationnement tous les jeudis de 6h à 14h</strong> jusqu'au 27 août : ne visez surtout pas ces places. Allez directement au <strong>parking du Rond-Point de la Gare</strong>, 120 places et gratuit, qui est aussi la Maison du Tourisme et du Parc national, donc votre point de départ de l'après-midi. Florac compte plus de 700 places dont seulement 10 % payantes."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Maison+du+Tourisme+et+du+Parc+national+des+C%C3%A9vennes+Florac", "txt": "Fiche et avis"}, {"cls": "l-web", "href": "https://www.floractroisrivieres.fr/stationnement/", "txt": "Parkings de Florac"}]}]}, {"type": "marche", "heure": "9h15", "icone": "i-basket", "titre": "Le grand marché du jeudi, avant la cohue", "pt": "p52", "blocs": [{"t": "meta", "html": "<strong>8h – 13h</strong> · de la place de l'Esplanade à la place de la Mairie et jusqu'aux portes du château du Parc national, plus le square Maury · paysans et artisans · animations musicales et théâtrales"}, {"t": "p", "html": "C'est le marché de la capitale du Parc national, et l'un des plus vivants des Cévennes. Il n'occupe pas une place mais <strong>toute une enfilade de rues</strong>, de l'Esplanade jusqu'au château. Producteurs paysans, artisans, et de la musique entre les étals."}, {"t": "note", "html": "<b>Pourquoi on part à 8h</b> — La mairie de Florac écrit elle-même qu'en été <strong>« le marché est si fréquenté qu'il est difficile de circuler »</strong>. Avec un chien en laisse dans des ruelles bondées, passé 10h30 c'est franchement pénible. En partant à 8h vous êtes sur place à 9h15, vous faites le marché tranquillement pendant une heure et quart, et vous en sortez avant le pic. <strong>C'est la seule exception matinale de la semaine</strong>, et elle est justifiée."}, {"t": "access", "html": "<b>Stationnement</b> — Parking de la <strong>Maison du Tourisme et du Parc national</strong>, l'ancienne gare, sur la N106. C'est aussi le départ de la randonnée du jour : vous ne rebougez pas la voiture de la journée."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Maison du Tourisme et du Parc, Florac", "href": "https://www.google.com/maps/dir/?api=1&destination=Maison+du+Tourisme+et+du+Parc%2C+N106%2C+48400+Florac"}, {"cls": "l-web", "txt": "Le marché · mairie de Florac", "href": "https://www.floractroisrivieres.fr/marche-hebdomadaire/"}]}]}, {"type": "rando", "heure": "10h45", "icone": "i-hike", "pt": "w2gral", "titre": "Rando : Gralhon, au départ du parking du marché", "blocs": [{"t": "meta", "html": "8,3 km · <strong>+457 m</strong> · <strong>2h30</strong> · boucle · balisage peinture jaune · <strong>facile</strong> · <strong>départ à pied du parking du marché</strong>, zéro voiture"}, {"t": "p", "html": "L'argument décisif : <strong>elle part du parking où vous êtes déjà garés</strong>. On traverse la N106, on prend la passerelle en fer, on remonte jusqu'à l'Esplanade, puis la rue du Thérond et le quartier des Grèzes, et on monte à Gralhon. Là-haut, le <strong>panorama sur Florac et toute la vallée du Tarnon</strong>, des châtaigneraies pour l'ombre, et une enfilade de hameaux de lauze et de calcaire : Gralhon, Monteils, Salièges."}, {"t": "note", "html": "<b>L'eau, deux fois</b> — Le parcours franchit le <strong>Tarnon</strong>, et la fiche du Parc signale une <strong>source ferrugineuse à Salce</strong>. Une source qui sort rouille de la roche, c'est exactement le genre de point d'arrivée qu'on cherche : on s'arrête, on y trempe les mains, et on repart."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Parking de la Maison du Parc", "href": "https://www.google.com/maps/dir/?api=1&destination=Maison+du+Tourisme+et+du+Parc%2C+N106%2C+48400+Florac"}, {"cls": "l-gpx", "txt": "Trace GPX du Parc national", "href": "https://geotrek-admin.cevennes-parcnational.net/api/fr/treks/39410/gralhon.gpx"}, {"cls": "l-web", "txt": "Fiche du Parc national", "href": "https://destination.cevennes-parcnational.fr/fr/trek/39410-Gralhon"}]}]}, {"type": "eat", "heure": "13h30", "icone": "i-eat", "titre": "Déjeuner du marché, au bord du Tarnon", "pt": "w2gral", "blocs": [{"t": "p", "html": "Vous redescendez sur Florac vers 13h15 avec ce que vous avez acheté le matin. Le <strong>Tarnon</strong> traverse la ville, ses berges sont protégées au titre de Natura 2000 et bordées d'arbres : c'est là qu'on s'installe. Florac est bâtie au confluent de <strong>quatre cours d'eau</strong> — le Tarn, le Tarnon, la Mimente et le Vibron — et ça se sent."}]}, {"type": "village", "heure": "15h00", "icone": "i-village", "titre": "Florac, une source dans la ville", "pt": "w2gral", "blocs": [{"t": "meta", "html": "2,4 km · +72 m · <strong>1h30</strong> · sentier d'interprétation du Parc national · très facile · <strong>gratuit</strong> · départ parking de la Maison du Tourisme"}, {"t": "p", "html": "Ce n'est pas une randonnée, c'est une flânerie balisée dans les ruelles et les placettes du vieux Florac, qui mène à la <strong>source du Pêcher</strong>. Elle <strong>jaillit d'un gros éboulis rocheux</strong> en plein cœur de ville, dans le parc Paul Arnal : c'est la résurgence des eaux du causse Méjean, qui ont traversé le calcaire pour ressortir là. Le <strong>Vibron</strong> est la retenue construite sur la source — elle a fourni l'eau potable, actionné des moulins, alimenté un vivier, d'où son nom. La fiche officielle précise que <strong>les animaux sont acceptés</strong>."}, {"t": "note", "html": "<b>Et le château</b> — Le château de Florac abrite le siège du <strong>Parc national des Cévennes</strong>. La cour et les abords se parcourent librement, et l'esplanade plantée de platanes est le meilleur endroit de la ville pour s'asseoir en fin d'après-midi."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Source du Pêcher, parc Paul Arnal", "href": "https://www.google.com/maps/dir/?api=1&destination=44.3222653%2C3.59170631"}, {"cls": "l-web", "txt": "Sentier officiel du Parc national", "href": "https://destination.cevennes-parcnational.fr/fr/trek/37884-Florac,-une-source-dans-la-ville"}]}]}, {"type": "trajet", "heure": "16h45", "html": "Florac → col de Lamira · la Corniche des Cévennes et le col Saint-Pierre · 50 km · <strong>1h10</strong> &nbsp;·&nbsp; <strong>Total du jour : 2h20 de conduite, plus longue traite 1h10</strong>", "fin": "Fin de la journée", "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115%2C3.895", "alt": null, "km": "50", "duree": "1h10", "route": "Corniche des Cévennes", "de_pt": "w2gral", "vers_pt": null, "de_lib": "Florac", "vers_lib": "col de Lamira", "de_alt": 545, "vers_alt": 400}, {"type": "eat", "heure": "19h00", "icone": "i-eat", "titre": "Dîner à la maison", "blocs": [{"t": "shop", "html": "<b>Au menu</b> — Ce qui reste du marché de Florac : charcuterie, fromages de Lozère, tomates, pain. Et une omelette si vous avez pris des œufs.<br><em>Vous rentrez à 18h20, donc rien ne presse. C'est la dernière soirée avant le dernier jour complet.</em>"}]}], "notes": [{"cls": "note plan", "html": "<b>Départ à 8h00, l'une des trois exceptions du séjour</b> — La mairie de Florac écrit elle-même qu'en été <strong>« le marché est si fréquenté qu'il est difficile de circuler »</strong>. En partant à 8h vous êtes sur place à 9h15, vous faites le marché pendant une heure et quart et vous en sortez avant le pic de 10h30 — avec un chien en laisse dans ces ruelles, ça change tout. <strong>Si vous préférez tenir le 9h30</strong> : vous serez sur le marché à 10h45, en pleine cohue, et la randonnée de Gralhon démarrera à midi en plein soleil. Je vous le déconseille franchement."}, {"cls": "note warn", "html": "<b>Pourquoi pas les gorges du Tarn.</b> Sainte-Enimie et Castelbouc sont à <strong>1h50 d'une seule traite</strong> depuis votre base, soit 3h40 aller-retour minimum : c'est au-delà de vos deux limites, et de loin. Le Mont Lozère et Le Pont-de-Montvert sont à 1h25, donc également hors budget. Florac à 1h10 est le point le plus lointain qui rentre dans le cadre, et c'est aussi le plus riche : marché, capitale du Parc, trois rivières et une source en ville."}, {"cls": "note plan", "html": "<b>Variante canicule</b> — Si le thermomètre dépasse 32 °C, <strong>inversez l'ordre</strong> : marché, puis le sentier urbain de la source du Pêcher à l'ombre des ruelles, déjeuner long au bord du Tarnon, et <strong>Gralhon en fin d'après-midi</strong>, à partir de 16h30, quand les châtaigneraies passent à l'ombre. Vous rentrez alors vers 20h30 : la Corniche se fait encore de jour, le soleil se couche vers 20h50."}], "alt_max": 800, "alt_min": 280, "rando": ["8,3 km", "+457 m"], "volant": "2h20", "chaud": {"texte": "<strong>Le départ à 8h est la vraie réponse à la chaleur ce jour-là.</strong> Vous prenez la Corniche à la fraîche, vous passez par 800 m au Pompidou, le marché se fait avant 10h30 et la boucle de Gralhon monte dans les châtaigneraies. Florac est à 545 m au confluent de quatre rivières, et la source du Pêcher jaillit d'un éboulis en plein centre : c'est le point frais de la ville. Si le thermomètre s'affole, décalez Gralhon à 16h30 et allongez le déjeuner au bord du Tarnon.", "lieu": "Source du Pêcher, en plein centre", "alt": 800}, "geo": {"lat": 44.3263, "lon": 3.5958, "lab": "Florac", "alt": 549}, "base": {"lat": 44.115, "lon": 3.895, "lab": "Col de Lamira"}, "bonus": [{"k": "village", "titre": "Ispagnac et le pont de Quézac", "meta": "15 min de Florac · 520 m · l'entrée des gorges du Tarn", "txt": "<strong>C'est le seul moyen de voir les gorges du Tarn sans casser vos plafonds de route.</strong> Ispagnac, « le jardin de la Lozère », est le dernier village avant que le Tarn n'entre dans les gorges, et le pont de Quézac, bâti au XIV<sup>e</sup> pour les pèlerins, l'enjambe juste à côté. Sainte-Enimie est encore à 30 minutes de plus : à vous de voir, mais la journée y passerait.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Ispagnac%2C+48320"}, {"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Pont+de+Qu%C3%A9zac%2C+48320+Ispagnac"}]}, {"k": "eau", "titre": "Le Pont du Tarn, en amont de Florac", "meta": "5 min du centre · dalles plates au bord du Tarn · gratuit · non surveillé", "txt": "Le coin d'eau des gens du coin : des dalles plates au bord du Tarn, une eau claire, peu de monde en semaine. <strong>Ce n'est pas une plage aménagée</strong> et personne ne surveille — c'est exactement l'endroit où l'on s'assoit dix minutes les pieds dans l'eau en fin de journée avant de reprendre la Corniche. Chemin Azinières, à deux kilomètres et demi du centre.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Cocur%C3%A8s%2C+48400"}]}], "flex": {"ok": false, "why": "Le marché de Florac est le jeudi matin.", "frais": "Corniche à 800 m au petit matin, châtaigneraies de Gralhon, source du Pêcher en ville", "haut": 800, "pas": {}}}, {"id": "j13", "cover": {"src": "https://commons.wikimedia.org/wiki/Special:FilePath/Bambouseraie_de_Prafrance_20100904_031.jpg?width=1200", "alt": "Bambouseraie de Prafrance", "cap": "La Bambouseraie de Prafrance, Générargues · <a href=\"https://commons.wikimedia.org/wiki/File:Bambouseraie_de_Prafrance_20100904_031.jpg\">Wikimedia Commons</a>"}, "dt": "Vendredi 21 août", "titre": "Une cathédrale de bambous, un train à vapeur, et tout Anduze jusqu'au soir", "pitch": "La dernière grande journée, et elle est entièrement dans la vallée. Le matin, la Bambouseraie de Générargues, seule forêt de bambous d'Europe. À midi, Anduze. L'après-midi, le <strong>train à vapeur des Cévennes</strong>, aller-retour depuis la gare. Et ensuite on reste : la poterie des Cordeliers à la descente du train, la Fontaine Pagode de 1649 sous les halles de 1457, la tour de l'Horloge que Richelieu a épargnée, le Grand Temple, le parc des Cordeliers et ses quatre hectares d'ombre. <strong>La dernière baignade se fait dans le Gardon d'Anduze</strong>, et on remonte à Saint-Jean pour le dernier dîner.", "tags": [{"cls": "t-marche", "txt": "Marché de Générargues"}, {"cls": "t-visit", "txt": "Bambouseraie 15,50 €"}, {"cls": "t-train", "txt": "Train à vapeur"}, {"cls": "t-village", "txt": "Anduze et ses poteries"}, {"cls": "t-eau", "txt": "Berges du Gardon"}, {"cls": "t-tot", "txt": "1h12 de volant · max 30 min d'affilée"}], "etapes": [{"type": "trajet", "heure": "9h20", "html": "Col de Lamira → Bambouseraie, Générargues · 20 km · <strong>30 min</strong>", "fin": "Départ", "vers": "Bambouseraie en Cévennes", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Bambouseraie+en+C%C3%A9vennes+G%C3%A9n%C3%A9rargues", "alt": 140, "km": "20", "duree": "30min", "route": "", "de_pt": "b_j13_9", "vers_pt": "p56", "de_lib": "Col de Lamira", "vers_lib": "Bambouseraie, Générargues", "de_alt": 400, "vers_alt": 140}, {"type": "marche", "heure": "9h50", "icone": "i-market", "pt": "w2gen", "titre": "Marché de Générargues, place du Foyer", "blocs": [{"t": "meta", "html": "<strong>8h – 13h</strong>, tous les vendredis · place du Foyer · marché labellisé <strong>Esprit parc national</strong> · gratuit"}, {"t": "p", "html": "Vous passez devant en allant à la Bambouseraie, alors autant s'arrêter vingt minutes. C'est un petit marché de village labellisé <strong>Esprit parc national</strong> : le label garantit que ce qui s'y vend vient de producteurs et d'artisans du territoire du Parc. De quoi composer le pique-nique et emporter les derniers pélardons du séjour. Mairie : <a class=\"tel\" href=\"tel:+33466617204\">04 66 61 72 04</a>."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Place du Foyer, Générargues", "href": "https://www.google.com/maps/search/?api=1&query=Place+du+Foyer+G%C3%A9n%C3%A9rargues"}, {"cls": "l-web", "txt": "Fiche Esprit parc national", "href": "https://www.espritparcnational.com/consommer-local/marches-points-vente/marche-generargues"}]}]}, {"type": "visit", "heure": "10h20", "icone": "i-ticket", "titre": "Bambouseraie en Cévennes", "pt": "p56", "blocs": [{"t": "meta", "html": "552 rue de Montsauve, 30140 Générargues · <strong>9h-19h non-stop, 7j/7</strong> · adulte 15,50 € · <strong>parking gratuit</strong> · <a class=\"tel\" href=\"tel:+33466617047\">04 66 61 70 47</a>"}, {"t": "p", "html": "<strong>Chien accepté en laisse dans tout le jardin, sans supplément.</strong> C'est le meilleur site du séjour pour un chien sensible à la chaleur : les bambous géants ombragent la totalité du parc. Vallon du dragon, village laotien, serre Viala. 170<sup>e</sup> anniversaire en 2026. Comptez 2h30."}, {"t": "access", "warn": false, "html": "<b>Deux détails</b> — Les chiens sont <strong>interdits pendant les nocturnes « Arborescences »</strong>, mais vous y allez en journée. Et il y a <strong>peu de poubelles dans le parc</strong> : prenez vos sacs."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Bambouseraie+en+C%C3%A9vennes+G%C3%A9n%C3%A9rargues", "txt": "Fiche et avis"}, {"cls": "l-web", "href": "https://bambouseraie.fr/", "txt": "bambouseraie.fr"}]}]}, {"type": "trajet", "heure": "", "html": "Générargues → Anduze, gare du train à vapeur · 5 km · <strong>10 min</strong>", "fin": "Fin de la visite", "vers": "Tife Tafe", "nav": "https://www.google.com/maps/search/?api=1&query=Tife+Tafe+Anduze", "alt": null, "km": "5", "duree": "10min", "route": "", "de_pt": "p56", "vers_pt": null, "de_lib": "Générargues", "vers_lib": "Anduze, gare du train à vapeur", "de_alt": 140, "vers_alt": 130}, {"type": "eat", "heure": "12h45", "icone": "i-eat", "titre": "Déjeuner — Tife Tafe, Anduze", "blocs": [{"t": "meta", "html": "5 place Notre-Dame · <strong>vendredi 12h-13h30, créneau très court</strong> · 04 66 61 93 70 · <strong>chiens acceptés en salle ET en terrasse</strong>"}, {"t": "note", "html": "Google 4,8 / 5 · 461 avis &nbsp;|&nbsp; TripAdvisor 4,7 / 5 · 289 avis"}, {"t": "p", "html": "Un caviste doublé d'un restaurant et d'un bar à bières, sur la place Notre-Dame. Cuisine de produits frais de saison, savoureuse et un peu audacieuse, avec une vraie offre végétarienne, ce qui est rare dans le coin. C'est la meilleure adresse d'Anduze et elle accepte le chien à l'intérieur, ce qui n'arrive presque jamais."}, {"t": "access", "html": "<b>Réservez, et soyez à l'heure</b> — Le service ne dure qu'une heure et demie. Garez-vous près de la gare du train à vapeur, votre voiture y restera l'après-midi.<br><em>Alternative de même niveau :</em> <strong>L'Atelier de Pierre</strong>, 3 rue du Plan de Brie, 4,8 / 5 sur 690 avis Google, carte qui suit les marchés, belle cave. Réservation obligatoire."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&query=Tife+Tafe+Anduze", "txt": "Fiche et avis"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&query=L%27Atelier+de+Pierre+Anduze", "txt": "Fiche et avis"}]}]}, {"type": "train", "heure": "14h30", "icone": "i-train", "titre": "Train à Vapeur des Cévennes, aller-retour depuis Anduze", "blocs": [{"t": "meta", "html": "Départ Anduze <strong>14h30</strong> → Saint-Jean 15h10 · retour Saint-Jean <strong>15h30</strong> → Anduze 16h10 · arrivez 30 min avant"}, {"t": "p", "html": "Aller-retour adulte <strong>17,50 €</strong>, <strong>chien accepté en laisse pour 4,50 €</strong> — le même supplément couvre l'aller simple comme l'aller-retour. Quarante minutes le long du Gardon, viaducs et tunnels, tractées par une vraie locomotive à vapeur. <strong>Prenez un wagon ouvert</strong> : bien plus supportable pour le chien qu'un compartiment fermé, et bien plus beau."}, {"t": "p", "html": "<em>Autres départs si vous décalez : d'Anduze à 9h30, 11h30, 14h30 et 16h30 ; de Saint-Jean-du-Gard à 10h30, 13h30, 15h30 et 17h30.</em>"}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Gare+du+Train+%C3%A0+Vapeur+des+C%C3%A9vennes+Anduze", "txt": "Gare d'Anduze"}, {"cls": "l-web", "href": "https://www.trainavapeur.com/preparer-mon-voyage/", "txt": "Horaires et tarifs"}]}]}, {"type": "visit", "heure": "16h30", "icone": "i-craft", "pt": "p58", "titre": "La poterie des Cordeliers, à la descente du train", "blocs": [{"t": "meta", "html": "Place de la Gare, <strong>à cinquante mètres du quai</strong> · lundi au vendredi <strong>8h – 12h et 14h30 – 19h</strong> · parking privé · gratuit"}, {"t": "p", "html": "Vous descendez du train à vapeur et la poterie est là, sur la place de la gare. Le <strong>vase d'Anduze</strong> est né ici au XVII<sup>e</sup> siècle, avec ses guirlandes, ses macarons et son émail flammé, et il n'a jamais changé de forme depuis. La Route du Vase d'Anduze fédère neuf ateliers ; celui-ci est le seul qui tombe pile sur votre chemin et qui soit ouvert un vendredi jusqu'à 19h."}, {"t": "note", "html": "<b>Si vous voulez voir tourner un potier</b> — Les deux ateliers qui ouvrent vraiment leurs portes, <strong>Les Enfants de Boisset</strong> et <strong>Le Chêne Vert</strong>, ne le font <strong>pas le vendredi</strong> (lundi à mercredi seulement). Le seul atelier visitable sans rendez-vous aujourd'hui est la <strong>Poterie du Château, à Tornac</strong>, route de Nîmes, ouverte tous les jours 9h30 – 12h30 et 14h – 19h : l'atelier est visible depuis la boutique, il y a des démonstrations de tournage, et <strong>les animaux sont acceptés</strong>. C'est à dix minutes d'Anduze, sur la route de Nîmes."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Poterie des Cordeliers, place de la Gare", "href": "https://www.google.com/maps/search/?api=1&query=Poterie+des+Cordeliers+Anduze"}, {"cls": "l-tel", "txt": "04 66 60 79 84", "href": "tel:+33466607984"}, {"cls": "l-map", "txt": "Poterie du Château, Tornac", "href": "https://www.google.com/maps/search/?api=1&query=Poterie+du+Ch%C3%A2teau+Tornac"}, {"cls": "l-web", "txt": "Route du Vase d'Anduze", "href": "https://www.vase-anduze.fr/"}]}]}, {"type": "village", "heure": "17h00", "icone": "i-village", "titre": "Anduze, la Porte des Cévennes, à la bonne heure", "pt": "p58", "blocs": [{"t": "meta", "html": "1h15 · <strong>gratuit</strong> · centre ancien piéton · <strong>jamais entre 11h et 17h en août</strong>, c'est saturé"}, {"t": "p", "html": "Anduze est appelée la <strong>Porte des Cévennes</strong> parce que c'est exactement ça : le Gardon s'échappe de la montagne entre les rochers de Saint-Julien et de Peyremale, et la plaine commence. La <strong>Fontaine Pagode</strong>, offerte en 1649 par un consul négociant en soie revenu d'Orient, coiffée de tuiles vernissées et <strong>classée monument historique depuis 1914</strong>, est plantée sous la place couverte — des halles de <strong>1457</strong>, ancien marché aux grains et aux châtaignes, toujours en service."}, {"t": "p", "html": "Autour, les ruelles médiévales, le Plan de Brie, la rue Notarié, et la <strong>tour de l'Horloge</strong> du XIV<sup>e</sup> siècle, 22 mètres, des murs d'un mètre soixante et une cloche de 1701 : Richelieu a fait raser les remparts d'Anduze en 1629 mais a épargné cette tour parce qu'elle portait l'horloge de la ville. Un peu plus loin, le <strong>Grand Temple</strong> de 1823, l'un des plus grands temples réformés de France, neuf cents mètres carrés, rouvert en 2024 après cinq ans de travaux."}, {"t": "note", "html": "<b>Deux horaires que je n'ai pas pu vérifier</b> — La montée de la tour de l'Horloge et la visite du Grand Temple : ni la mairie ni l'office de tourisme ne publient leurs horaires d'août 2026. Demandez à l'office de tourisme, 2 Plan de Brie, <a class=\"tel\" href=\"tel:+33466619817\">04 66 61 98 17</a>, vous passez devant. Les deux se voient de l'extérieur de toute façon."}, {"t": "access", "html": "<b>Le parc des Cordeliers, pour souffler</b> — Avenue Rollin, quatre hectares de l'ancien jardin des Franciscains, ouvert <strong>7h – 22h en été</strong>, <strong>gratuit, parking gratuit, animaux acceptés</strong>. Sentier botanique, tables de pique-nique à l'ombre, point d'eau, sanitaires, et un chêne des Canaries de deux cent trente ans. Il borde le Gardon."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Fontaine Pagode, place couverte", "href": "https://www.google.com/maps/dir/?api=1&destination=44.054562%2C3.985724"}, {"cls": "l-map", "txt": "Parc des Cordeliers", "href": "https://www.google.com/maps/search/?api=1&query=Parc+des+Cordeliers+Anduze"}, {"cls": "l-web", "txt": "Anduze · office de tourisme des Cévennes", "href": "https://www.cevennes-tourisme.fr/visites-decouvertes/anduze/que-faire/"}]}]}, {"type": "eau", "heure": "18h15", "icone": "i-water", "pt": "p58", "titre": "Les berges du Gardon, au parc des Cordeliers", "blocs": [{"t": "meta", "html": "Avenue Rollin, Anduze · <strong>ouvert 7h – 22h en été</strong> · <strong>gratuit, parking gratuit, animaux acceptés</strong> · quatre hectares"}, {"t": "p", "html": "Pas une séance de plage : une dernière heure au bord de l'eau, à l'ombre. L'ancien jardin des Franciscains fait <strong>quatre hectares</strong> d'essences régionales, avec un sentier botanique, des tables de pique-nique sous les arbres, un point d'eau et un <strong>chêne des Canaries de deux cent trente ans</strong>. Il borde le Gardon : on descend sur les galets, on met les pieds dans l'eau, et on regarde la Porte des Cévennes se fermer."}, {"t": "note", "html": "<b>Sur la qualité de l'eau</b> — La mairie d'Anduze suit trois sites sur la commune, le pont d'Anduze, La Madeleine et le Castel Rose : l'eau y est classée <strong>de bonne à excellente qualité</strong> en suivi pluriannuel. Le suivi porte sur la qualité, pas sur la sécurité : <strong>aucun de ces sites n'est surveillé</strong>. Galets glissants, chaussures d'eau utiles."}, {"t": "liens", "liens": [{"cls": "l-map", "txt": "Parc des Cordeliers, Anduze", "href": "https://www.google.com/maps/search/?api=1&query=Parc+des+Cordeliers+Anduze"}, {"cls": "l-web", "txt": "Qualité des eaux · mairie d'Anduze", "href": "https://mairie-anduze.fr/point-sur-la-qualite-des-eaux-de-baignade/"}]}]}, {"type": "trajet", "heure": "19h30", "fin": "Fin de la baignade", "vers": "Saint-Jean-du-Gard, pour le dernier dîner", "nav": "https://www.google.com/maps/dir/?api=1&destination=L%27Oronge%2C+Saint-Jean-du-Gard", "html": "Anduze → Saint-Jean-du-Gard · la D907 en remontant la vallée du Gardon · 13 km · <strong>20 min</strong>", "alt": 350, "km": "13", "duree": "20min", "route": "la D907 en remontant la vallée du Gardon", "de_pt": "p58", "vers_pt": "p40_j13", "de_lib": "Anduze", "vers_lib": "Saint-Jean-du-Gard", "de_alt": 140, "vers_alt": 350}, {"type": "eat", "heure": "20h00", "icone": "i-eat", "titre": "Dernier dîner — L'Oronge, Saint-Jean-du-Gard", "blocs": [{"t": "meta", "html": "Place de la Révolution · ouvert du mercredi au dimanche · menu 3 services 38 €, menu Le Curieux 47 € · 04 66 85 30 34"}, {"t": "note", "html": "Google 4,9 / 5 · 98 avis &nbsp;|&nbsp; TripAdvisor 4,7 / 5 · 91 avis — la meilleure note de tout le séjour"}, {"t": "p", "html": "Un ancien relais de diligence du XVII<sup>e</sup> en plein cœur du village, avec des terrasses ouvertes sur la vallée du Gardon. Tenu par un jeune couple : <strong>Camille Delorme-Krempp</strong>, cheffe pâtissière formée à Ferrandi et passée par des étoilés, et <strong>Théodore Delorme</strong>, formé à Lyon chez Christian Têtedoie. Cuisine construite strictement sur le terroir et la saison. Les avis saluent unanimement les desserts, la carte des vins et l'accueil."}, {"t": "access", "warn": true, "html": "<b>Réservez maintenant, pas la semaine prochaine</b> — Un vendredi soir d'août, c'est complet. Appelez dès aujourd'hui et <strong>demandez pour le chien</strong> : la politique animaux n'est pas publiée, mais il y a plusieurs terrasses, ce qui joue en votre faveur.<br><em>Si c'est complet :</em> <strong>Lettres et Mets</strong>, crêperie, 1071 avenue René Boudon, TripAdvisor 4,8 / 5, terrasse végétalisée avec brumisateurs, chiens acceptés, 07 88 74 22 97."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&query=L%27Oronge+Saint-Jean-du-Gard", "txt": "Fiche et avis"}, {"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&query=Lettres+et+Mets+Saint-Jean-du-Gard", "txt": "Fiche et avis"}]}]}, {"type": "trajet", "heure": "22h15", "html": "Saint-Jean-du-Gard → col de Lamira · la petite route du col, phares et prudence · 6 km · <strong>12 min</strong> &nbsp;·&nbsp; <strong>Total du jour : 1h12 de conduite, plus longue traite 30 min</strong>", "fin": "Fin du dernier dîner", "vers": "le mas au col de Lamira · Mas de Cros Viel", "nav": "https://www.google.com/maps/dir/?api=1&destination=44.115%2C3.895", "alt": null, "km": "6", "duree": "12min", "route": "la petite route du col, phares et prudence", "de_pt": null, "vers_pt": null, "de_lib": "Saint-Jean-du-Gard", "vers_lib": "col de Lamira", "de_alt": 197, "vers_alt": 400}], "strip": [{"page": "https://commons.wikimedia.org/wiki/File:Chemin_de_fer_%C3%A0_vapeur_des_C%C3%A9vennes.jpg", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Chemin_de_fer_%C3%A0_vapeur_des_C%C3%A9vennes.jpg?width=800", "alt": "Train à vapeur des Cévennes", "cap": "Le train à vapeur Anduze — Saint-Jean"}, {"page": "https://commons.wikimedia.org/wiki/File:Anduze-Vase_Boisset-20130414.jpg", "src": "https://commons.wikimedia.org/wiki/Special:FilePath/Anduze-Vase_Boisset-20130414.jpg?width=800", "alt": "Vase d'Anduze", "cap": "Le vase d'Anduze, poterie Boisset"}], "notes": [{"cls": "note prep", "html": "<b>Ce soir, on boucle.</b> Valises faites, glacière prête pour les achats de demain matin au marché de producteurs. Et si vous voulez rapporter une poterie, achetez-la <strong>aujourd'hui</strong> : demain matin il n'y aura que des producteurs."}], "alt_max": 140, "alt_min": 130, "rando": null, "volant": "1h12", "chaud": {"texte": "<strong>Anduze est à 130 m</strong>, mais c'est précisément la journée à garder pour un jour de canicule : la Bambouseraie est <strong>intégralement à l'ombre de bambous de vingt mètres</strong> et il y fait plusieurs degrés de moins qu'à l'extérieur, le train à vapeur roule fenêtres ouvertes le long du Gardon, et vous finissez à la Falguière dans l'eau. Décalez simplement la flânerie dans Anduze à 17h30 plutôt qu'à 16h30.", "lieu": "Bambouseraie, ombre intégrale", "alt": 140}, "geo": {"lat": 44.0596, "lon": 3.9683, "lab": "Générargues", "alt": 140}, "base": {"lat": 44.115, "lon": 3.895, "lab": "Col de Lamira"}, "bonus": [{"k": "village", "titre": "Anduze, la poterie et le parc des Cordeliers", "meta": "sur place · gratuit", "txt": "Le vase d'Anduze naît ici au XVII<sup>e</sup> siècle, et deux ateliers historiques se visitent encore librement. Juste à côté, le parc des Cordeliers et sa fontaine-pagode couverte de tuiles vernissées : cinq minutes à pied depuis la place Notre-Dame.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Parc+des+Cordeliers%2C+Anduze"}, {"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Poterie+d%27Anduze"}]}, {"k": "rando", "titre": "Le rocher de Peyremale, au départ de la mairie d'Anduze", "meta": "7 km aller-retour · +245 m · 2h · balisage jaune · départ mairie d'Anduze", "txt": "Si le train vous laisse de l'énergie : le <strong>rocher de Peyremale</strong> est l'un des deux verrous rocheux entre lesquels le Gardon sort de la montagne — c'est lui qui forme la <strong>Porte des Cévennes</strong>. Le sentier part de la mairie d'Anduze et monte y chercher le point de vue. Fiche officielle du département avec GPX, référencée au carto-guide « Vallées des Gardons ». <strong>Deux heures</strong>, à faire plutôt le matin ou en fin de journée.", "liens": [{"cls": "l-map", "txt": "Mairie d'Anduze, départ", "href": "https://www.google.com/maps/search/?api=1&query=Mairie+d%27Anduze+30140"}, {"cls": "l-web", "txt": "Fiche officielle et GPX", "href": "https://www.tourismegard.com/fr/fiche/equipement/randonnee-le-rocher-de-peyremale-anduze_TFO6286686/"}]}], "flex": {"ok": false, "why": "Tife Tafe ne sert qu'une heure et demie le vendredi midi, et L'Oronge est fermé lundi et mardi.", "frais": "Bambouseraie sous les bambous le matin, Anduze à l'ombre des halles et du parc des Cordeliers, baignade dans le Gardon à 18h", "haut": 140, "pas": {}}}, {"id": "j14", "dt": "Samedi 22 août · départ", "titre": "On charge d'abord, puis un dernier café, un dernier marché, un dernier passage au Gardon", "pitch": "Le mas est vidé à 9h30 et la voiture est prête. Ensuite seulement : le petit-déjeuner au Café Rando, le marché de producteurs du samedi matin pour remplir la glacière du retour, et une dernière heure dans le Gardon à la Falguière. Vous en sortez, vous vous séchez, et vous prenez la route sans repasser par le col.", "tags": [{"cls": "t-marche", "txt": "Marché de producteurs"}, {"cls": "t-eau", "txt": "Dernier passage au Gardon"}, {"cls": "t-tot", "txt": "22 min de volant sur place"}], "etapes": [{"type": "home", "heure": "8h45", "icone": "i-home", "titre": "Check-out et chargement, avant tout le reste", "blocs": [{"t": "meta", "html": "400 m d'altitude · 45 min · check-out à 12h, mais on vide la maison maintenant"}, {"t": "p", "html": "<strong>On charge d'abord, on profite ensuite.</strong> Vous videz le mas, vous faites l'état des lieux, et vous partez avec la voiture prête. Comme ça, la dernière trempette à Falguière est vraiment la dernière chose de votre séjour : vous en sortez, vous vous séchez, et vous prenez la route sans repasser par le col."}, {"t": "note", "html": "<b>À garder à portée de main</b> — serviettes et maillots sur le siège arrière, pas au fond du coffre. Et une bouteille d'eau pour le chien : la route sera longue."}]}, {"type": "trajet", "heure": "9h00", "html": "Col de Lamira → centre de Saint-Jean-du-Gard · 6 km · <strong>12 min</strong>", "fin": "Départ", "vers": "Le Café Rando", "nav": "https://www.google.com/maps/search/?api=1&amp;query=Le+Caf%C3%A9+Rando+Saint-Jean-du-Gard", "alt": 197, "km": "6", "duree": "12min", "route": "", "de_pt": "b_j14_9", "vers_pt": "p59", "de_lib": "Col de Lamira", "vers_lib": "centre de Saint-Jean-du-Gard", "de_alt": 400, "vers_alt": 197}, {"type": "eat", "heure": "9h15", "icone": "i-eat", "titre": "Petit-déjeuner — Le Café Rando", "pt": "p59", "blocs": [{"t": "meta", "html": "96 Grand Rue · ouvert 7h30-22h, fermé le jeudi · petit-déjeuner 8 € · <strong>chiens acceptés</strong> · <a class=\"tel\" href=\"tel:+33688494555\">06 88 49 45 55</a>"}, {"t": "p", "html": "Café de Pays et boutique officielle du Chemin de Stevenson, trois salles et une terrasse ombragée. Ils font aussi des <strong>paniers pique-nique à partir de 8 €</strong> : parfait pour la route du retour."}, {"t": "liens", "liens": [{"cls": "l-map", "href": "https://www.google.com/maps/search/?api=1&amp;query=Le+Caf%C3%A9+Rando+Saint-Jean-du-Gard", "txt": "Fiche et avis"}]}]}, {"type": "marche", "heure": "10h00", "icone": "i-basket", "titre": "Marché de producteurs", "pt": "p60", "blocs": [{"t": "meta", "html": "Samedi matin, place du marché, de Pâques à la Toussaint · concerts certains samedis d'été"}, {"t": "shop", "html": "<b>Les derniers achats</b> — pélardons affinés (ils voyagent mieux que les frais), miel de châtaignier, farine de châtaigne, confiture, oignons doux. Glacière obligatoire."}]}, {"type": "trajet", "heure": "", "html": "Saint-Jean-du-Gard → Falguière · 5 km · <strong>10 min</strong>", "fin": "On plie les courses", "vers": "Falguière, pour un dernier passage au Gardon", "nav": "https://www.google.com/maps/dir/?api=1&amp;destination=44.128218%2C3.891582", "alt": 210, "km": "5", "duree": "10min", "route": "", "de_pt": "p60", "vers_pt": "p61", "de_lib": "Saint-Jean-du-Gard", "vers_lib": "Falguière", "de_alt": 197, "vers_alt": 210}, {"type": "eau", "heure": "11h00", "icone": "i-swim", "titre": "Un dernier quart d'heure au bord du Gardon, à Falguière", "pt": "p61", "blocs": [{"t": "p", "html": "Pas de grande baignade le jour du départ, la voiture est chargée et la route est longue. Mais on s'arrête cinq minutes sur les galets, on met les pieds dans l'eau une dernière fois, et on regarde le Gardon partir vers Anduze. C'est la bonne façon de refermer quinze jours."}]}, {"type": "trajet", "heure": "12h30", "html": "Falguière → la route du retour · vous partez directement de la rivière · &nbsp;·&nbsp; <strong>Total du jour : 22 min de conduite avant la route</strong>", "fin": "On se sèche une dernière fois", "vers": "la route du retour, directement depuis la rivière", "nav": "https://www.google.com/maps/dir/?api=1&destination=Falgui%C3%A8re%2C+Saint-Jean-du-Gard", "alt": null, "km": "0", "duree": "0min", "route": "la voiture est déjà chargée", "de_pt": "p61", "vers_pt": null, "de_lib": "Falguière", "vers_lib": "la route", "de_alt": 210, "vers_alt": 210}], "notes": [{"cls": "note plan", "html": "<b>Check-out et chargement à 8h45</b> — on vide le mas et on charge la voiture avant tout le reste. Le petit-déjeuner au Café Rando est à douze minutes, et le marché de producteurs « Les Samedis Paysans » bat son plein entre 9h et 11h — <strong>appelez la mairie au 04 66 56 26 36 la veille</strong>, les sources se contredisent sur sa saison. Le check-out contractuel est à midi, mais vous partirez directement de la rivière sans repasser par le col."}], "alt_max": 210, "alt_min": 197, "rando": null, "volant": "22 min", "chaud": {"texte": "Jour de départ.", "lieu": null, "alt": null}, "geo": {"lat": 44.128218, "lon": 3.891582, "lab": "Saint-Jean-du-Gard", "alt": 210}, "base": {"lat": 44.115, "lon": 3.895, "lab": "Col de Lamira"}, "bonus": [{"k": "eau", "titre": "Un dernier plongeon plutôt qu'un dernier café", "meta": "Falguière · 10 min du mas", "txt": "Le check-out est à midi et la route sera longue. Une demi-heure dans le Gardon avant de charger la voiture vaut mieux qu'une demi-heure de plus sur l'autoroute. Serviettes accessibles, pas au fond du coffre.", "liens": [{"cls": "l-map", "txt": "Itinéraire", "href": "https://www.google.com/maps/dir/?api=1&destination=Falgui%C3%A8re%2C+Saint-Jean-du-Gard"}]}], "flex": {"ok": false, "why": "Jour de départ, check-out à midi.", "frais": "Marché de producteurs le matin, dernier passage au Gardon", "haut": 400, "pas": {}}}], "points": [{"id": "p0", "lat": 43.9902, "lon": 3.6183, "alt": 245, "lab": "Le Vigan", "date": "2026-08-09", "h": 16}, {"id": "p1", "lat": 43.9958, "lon": 3
